s=\"ql-size-16px\">一． 什么是保证金欺诈<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">保证金欺诈是一种主要针对卖家的欺诈方式，买家声称自己下单成功后，由于卖家未开通“假一赔三”、“承诺售后”等服务，致使交易资金被冻结，要求卖家扫码其发送的二维码，联系“闲鱼客服”缴纳保证金，以便正常交易。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">二．常见的欺诈方式<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 最开始，骗子在闲鱼聊天记录中发送相关“保证金截图”，要求卖家按规定步骤完成；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 随后发展成为，在淘宝等平台聊天中，以买家身份找到闲鱼卖家，聊天发送截图或二维码，甚至于引导至其他社交平台；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 现在升级为，直接发送邮箱信息、通过转账添加支付宝好友进行欺诈。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">骗子会以连哄带骗的方式跟卖家沟通，再加上所做的欺诈页面十分逼真，导致卖家无法分辨，上当受骗。<\/span><\/p><p><img src=\"https://file.goofish.pro/cms/image/20231229/113206-1088thna.png\"><img src=\"https://file.goofish.pro/cms/image/20231229/113212-7828gxkg.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">三．注意，欺诈骗局常见的套路<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1．私聊发来二维码让您去联系客服；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2．发来链接，让您点击链接联系客服；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3．以低价、返利等形式引导您去其他平台进行交易；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">4．通过其他平台购买您在闲鱼发布的商品；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">5．通过非官方短信、邮件给你发送闲鱼订单信息或客服信息；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">6．给您支付宝转账，添加好友，要求在支付宝上购买您的闲鱼商品。<\/span><\/p>","text":"一． 什么是保证金欺诈 保证金欺诈是一种主要针对卖家的欺诈方式，买家声称自己下单成功后，由于卖家未开通“假一赔三”、“承诺售后”等服务，致使交易资金被冻结，要求卖家扫码其发送的二维码，联系“闲鱼客服”缴纳保证金，以便正常交易。 二．常见的欺诈方式 ● 最开始，骗子在闲鱼聊天记录中发送相关“保证金截图”，要求卖家按规定步骤完成； ● 随后发展成为，在淘宝等平台聊天中，以买家身份找到闲鱼卖家，聊天发送截图或二维码，甚至于引导至其他社交平台； ● 现在升级为，直接发送邮箱信息、通过转账添加支付宝好友进行欺诈。 骗子会以连哄带骗的方式跟卖家沟通，再加上所做的欺诈页面十分逼真，导致卖家无法分辨，上当受骗。 三．注意，欺诈骗局常见的套路 1．私聊发来二维码让您去联系客服； 2．发来链接，让您点击链接联系客服； 3．以低价、返利等形式引导您去其他平台进行交易； 4．通过其他平台购买您在闲鱼发布的商品； 5．通过非官方短信、邮件给你发送闲鱼订单信息或客服信息； 6．给您支付宝转账，添加好友，要求在支付宝上购买您的闲鱼商品。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":2,"words":460,"sections":0,"subs":0,"version":""},"related":["sec-62","sec-57","a498491379729797","a498418596873605"]},{"id":"a498411888551301","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"风控与账号安全","title":"发送付款码后为何被骗？","title_raw":"发送付款码后为何被骗？","html":"<p><img src=\"assets/img/110255-7695zect-ed2149.png\"><img src=\"assets/img/110258-2836sslu-fef316.png\"><\/p>","text":"","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":2,"words":0,"sections":0,"subs":0,"version":""},"related":[]},{"id":"a498412499355013","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"风控与账号安全","title":"闲鱼卖家安全交易指南","title_raw":"闲鱼卖家安全交易指南","html":"<p><img src=\"assets/img/110529-9268efrd-004a12.png\"><img src=\"assets/img/110531-4272wmuh-50a4b2.png\"><img src=\"assets/img/110533-2712herq-3d9f58.png\"><\/p>","text":"","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":3,"words":0,"sections":0,"subs":0,"version":""},"related":[]}]},{"module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"保证金与履约时效","color":"blue","count":4,"items":[{"id":"a498491379729797","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"保证金与履约时效","title":"闲鱼社区保证金管理规范","title_raw":"闲鱼社区保证金管理规范","html":"<p class=\"ql-align-center\"><strong class=\"ql-size-16px\">闲鱼社区保证金管理规范<\/strong><\/p><p class=\"ql-align-center\"><br><\/p><p><strong>第一章 概述 <\/strong><\/p><p><strong>第一条【目的背景】<\/strong><\/p><p>为明确闲鱼社区保证金额度、缴存、划扣、补缴、追缴及退回等事项，规范平台管理秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则，制定本规范。<\/p><p><strong>第二条【适用范围】<\/strong><\/p><p>本规范适用于闲鱼社区从事商业经营活动的经营性卖家及主动开通相关买家保障服务承诺（以下简称“保障服务”）的二手闲置卖家（以下统称“卖家”）。<\/p><p><strong>第三条【定义】<\/strong><\/p><p>保证金是指卖家缴存的用以保证其闲置物品、商品和服务质量，担保对买家保障服务以及闲鱼社区相关协议、规则的履行和遵守的资金。<\/p><p><strong>第二章 保证金管理 <\/strong><\/p><p><strong>第四条【额度】<\/strong><\/p><p>保证金额度是指卖家需要缴存的保证金总额度，卖家开通的保障服务及闲置物品、商品和服务对应的类目不同需要缴存的保证金额度可能不同，具体额度金额以相关保障服务开通页面提示为准。<\/p><p><strong>第五条【缴存】<\/strong><\/p><p>卖家须按照保证金额度要求在开通保障服务时足额缴存，具体缴存方式以相应保障服务开通页面提示为准。卖家未足额缴存保证金的，闲鱼社区视情节严重程度可采取下架商品、延长交易账期、限制参加营销活动、限制个人主页展示、监管账户、支付宝账户管控措施等。<\/p><p><strong>第六条【划扣】<\/strong><\/p><p>卖家发生交易争议、存在违规情形或被第三方投诉的，闲鱼社区有权根据相关规则及协议划扣部分或全部保证金，用于退款或赔付买家、支付平台违约金或其他应由卖家支付的违约款项或费用。<\/p><p><strong>第七条【补缴】<\/strong><\/p><p>闲鱼社区调整保证金额度或划扣保证金，导致卖家保证金当前余额低于其应缴存保证金额度的，闲鱼社区可指示支付宝公司从卖家绑定的支付宝账户中自动扣除相应余额予以补足。若卖家支付宝余额不足以补足，且在72小时内未主动补足保证金的，闲鱼社区视情节严重程度可采取取消商品服务标识、下架商品、延长交易账期、限制参加营销活动、限制个人主页展示、监管账户、支付宝账户管控措施等。<\/p><p><strong>第八条【追缴】<\/strong><\/p><p>闲鱼社区处理卖家与买家间的争议或投诉时，判定属于卖家责任的，可划扣卖家保证金用于买家退款或赔付。若卖家保证金不足以划扣的，则闲鱼社区可视情形使用自有资金向买家退款赔付，同时向卖家进行追缴。卖家未在规定期限内补足闲鱼社区垫付资金，或者卖家支付宝余额不足以补足的，闲鱼社区视情节严重程度可采取取消商品服务标识、下架商品、延长交易账期、限制参加营销活动、限制个人主页展示、监管账户、支付宝账户管控措施等。<\/p><p><strong>第九条【退回】<\/strong><\/p><p>卖家符合以下所有条件的，保证金额度将调整为0且保证金将自动退回至可提现余额，卖家登录保证金管理页面操作提现后，保证金即可退回至卖家绑定的支付宝账户。<\/p><p>（一）没有已开启的服务保障；<\/p><p>（二）没有进行中的交易； （三）没有进行中的退款； （四）没有进行中的投诉； （五）没有仍在履约期内的服务订单； （六）没有正在处理中的欠费记录； （七）没有未完结的因违反闲鱼社区相关规则所导致的限制解冻记录。<\/p><p><strong>第三章 附则 <\/strong><\/p><p><strong>第十条【生效时间】<\/strong><\/p><p>本规范于2022年10月8日首次生效。<\/p>","text":"闲鱼社区保证金管理规范 第一章 概述 第一条【目的背景】 为明确闲鱼社区保证金额度、缴存、划扣、补缴、追缴及退回等事项，规范平台管理秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则，制定本规范。 第二条【适用范围】 本规范适用于闲鱼社区从事商业经营活动的经营性卖家及主动开通相关买家保障服务承诺（以下简称“保障服务”）的二手闲置卖家（以下统称“卖家”）。 第三条【定义】 保证金是指卖家缴存的用以保证其闲置物品、商品和服务质量，担保对买家保障服务以及闲鱼社区相关协议、规则的履行和遵守的资金。 第二章 保证金管理 第四条【额度】 保证金额度是指卖家需要缴存的保证金总额度，卖家开通的保障服务及闲置物品、商品和服务对应的类目不同需要缴存的保证金额度可能不同，具体额度金额以相关保障服务开通页面提示为准。 第五条【缴存】 卖家须按照保证金额度要求在开通保障服务时足额缴存，具体缴存方式以相应保障服务开通页面提示为准。卖家未足额缴存保证金的，闲鱼社区视情节严重程度可采取下架商品、延长交易账期、限制参加营销活动、限制个人主页展示、监管账户、支付宝账户管控措施等。 第六条【划扣】 卖家发生交易争议、存在违规情形或被第三方投诉的，闲鱼社区有权根据相关规则及协议划扣部分或全部保证金，用于退款或赔付买家、支付平台违约金或其他应由卖家支付的违约款项或费用。 第七条【补缴】 闲鱼社区调整保证金额度或划扣保证金，导致卖家保证金当前余额低于其应缴存保证金额度的，闲鱼社区可指示支付宝公司从卖家绑定的支付宝账户中自动扣除相应余额予以补足。若卖家支付宝余额不足以补足，且在72小时内未主动补足保证金的，闲鱼社区视情节严重程度可采取取消商品服务标识、下架商品、延长交易账期、限制参加营销活动、限制个人主页展示、监管账户、支付宝账户管控措施等。 第八条【追缴】 闲鱼社区处理卖家与买家间的争议或投诉时，判定属于卖家责任的，可划扣卖家保证金用于买家退款或赔付。若卖家保证金不足以划扣的，则闲鱼社区可视情形使用自有资金向买家退款赔付，同时向卖家进行追缴。卖家未在规定期限内补足闲鱼社区垫付资金，或者卖家支付宝余额不足以补足的，闲鱼社区视情节严重程度可采取取消商品服务标识、下架商品、延长交易账期、限制参加营销活动、限制个人主页展示、监管账户、支付宝账户管控措施等。 第九条【退回】 卖家符合以下所有条件的，保证金额度将调整为0且保证金将自动退回至可提现余额，卖家登录保证金管理页面操作提现后，保证金即可退回至卖家绑定的支付宝账户。 （一）没有已开启的服务保障； （二）没有进行中的交易； （三）没有进行中的退款； （四）没有进行中的投诉； （五）没有仍在履约期内的服务订单； （六）没有正在处理中的欠费记录； （七）没有未完结的因违反闲鱼社区相关规则所导致的限制解冻记录。 第三章 附则 第十条【生效时间】 本规范于2022年10月8日首次生效。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":1236,"sections":0,"subs":0,"version":""},"related":["sec-67","a498492590744965","a498767719605573","a498495935731077"]},{"id":"a498495935731077","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"保证金与履约时效","title":"闲鱼社区发货时效承诺服务规范","title_raw":"闲鱼社区发货时效承诺服务规范","html":"<p class=\"ql-align-center\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">闲鱼社区发货时效承诺服务规范<\/strong><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第一章 概述 <\/strong><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第一条【目的背景】<\/strong><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">为维护闲鱼社区健康的市场秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据国家相关法律法规及规范性文件，《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则等，制定本规范。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第二条【定义】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">发货时效承诺服务是指当买家在闲鱼社区上购买带有“24小时发货”或“10分钟发货”服务标识的商品，如卖家未在承诺时间内发货，买家可发起服务申请，满足条件时可得到相应赔付。<\/span><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第二章 卖家要求 <\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第三条【准入及退出】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">卖家须同时符合以下准入条件时，卖家可选择就其发布的实物类商品开通“24小时发货”服务；卖家可选择就其发布的电子卡券类商品开通“10分钟发货”服务；开通服务商品后因故退出服务的，卖家就服务存续期间产生的订单仍须履行相应服务承诺。<\/span><\/p><p><img src=\"assets/img/164108-6615bcqe-06ffd2.jpg\"><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第四条【发货时间要求】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">开通发货时效承诺服务（“24小时发货”或“10分钟发货”）的卖家，须按照以下要求进行发货：<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（一）一般发货时效承诺<\/span><\/p><p>1.<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">实物类商品：卖家须在买家付款后24小时内发货，并确保物流单号48小时内有揽收记录；<\/span><\/p><p>2.<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">电子卡券类商品：卖家须在买家付款后10分钟内发货（特殊时间段内的订单，即买家付款时间为每日22点到次日8点的订单，卖家须在次日10点前完成发货）。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（二）例外情形处理<\/span><\/p><p>1.<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">如遇法定年节假日、疫情影响等不可抗力、闲鱼社区官方发起活动等特殊情形，发货时间以闲鱼社区的公告或通知为准；卖家如遇不可抗力等特殊情形，可通过客服热线或在线客服提前向闲鱼社区申请报备，是否构成不可抗力等以闲鱼社区判定为准，同时卖家应及时与买家沟通；<\/span><\/p><p>2.<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">卖家与买家通过闲鱼商品留言、私聊等闲鱼提供的官方沟通渠道中协商成功的，卖家应在协商成功的时间内发货。其中，如卖家与买家约定发货时间短于本条第（一）项约定的，卖家超过本条第（一）项承诺时效发货的行为方可视为本规范约定保障范围内的延迟发货；如卖家与买家约定发货时间长于本条第（一）项约定的，卖家超过与买家另行约定时效发货的行为方可视为本规范约定保障范围内的延迟发货。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第五条【发货时间认定标准】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（一）物流公司有回传信息的订单，以物流公司系统内揽件记录（如物流详情为“已揽收/揽件”等状态）的时间为准。其中由菜鸟及其合作伙伴提供物流服务的订单，其物流详情在“包裹已出库”状态后显示“正在发往分拨中心”、“已进入分拨中心”、“已完成分拨集包”、“已从分拨中心发出”四种状态的时间为准；<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（二）通过尚无物流节点信息回传的物流公司发货的订单，以物流公司底单展示的发货时间为准； <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（三）电子卡券类订单，根据交易形式，以卖家实际提供充值链接或卡密等有效发货凭证的时间为准。&nbsp;<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"><\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第六条【发货方式】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">卖家可以选择“裹裹寄件”、“已邮寄填单”、“无需寄件”方式进行发货，具体以产品页面提示为准。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第七条【违背发货承诺-延迟发货】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">卖家未按照第四条“发货时间要求”完成发货的行为，视为延迟发货。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第八条【赔付标准】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">卖家如有延迟发货行为的，须向买家赔付<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">该商品<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">实际成交金额（指卖家支付宝等账户实际收款金额，如有邮费、第三方服务费等则不包含）的5%，且赔付金额最高不超过50元，最低不少于3元。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第三章 买家保障<\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> 第九条【服务展示】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">成功开通该服务的商品将在商品详情等页面展示“24小时发货”或“10分钟发货”的服务标识。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第十条【服务申请】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">同时满足以下条件，买家方可申请“24小时发货”或“10分钟发货”服务赔付： <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（一）买家购买的商品展示有“24小时发货”或“10分钟发货”服务标识；&nbsp;<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（二）买家签收后、确认收货前发现存在延迟发货情形； <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（三）买家应在订单详情页-服务保障-选择“24小时发货”或“10分钟发货”发起服务申请<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">；<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">提交申请后，如发现买家提供信息有误或存在滥用本规则发起服务申请的（包括但不限于恶意套现、机器作弊、提供虚假信息等，以闲鱼判定为准），将无法支持赔付。<\/span><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第十一条【举证要求】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">买家应提供物流记录、闲鱼社区聊天记录等截图、录音、视频信息等以证明延迟发货情况属实。<\/span><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"><\/span><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第四章 附则 <\/strong><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第十二条【上位规范】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">本规范为《闲鱼社区公约》、《闲鱼社区交易争议处理规范》、《闲鱼社区管理规范》等相关规则的下位规范。本规范有特殊约定的，以本规范约定为准；本规范未约定事宜，仍需执行前述规范。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第十三条【生效时间】<\/strong><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">本规范于2023年3月1日首次生效。 【温馨提示】 原则上闲鱼社区以造成的客观事实作为判定违背发货承诺的依据，由于卖家错放类目、未准确填写发货方式等行为，将可能导致判定偏差或买家投诉，建议如下： <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（一）商品发布到正确类目 由于类目特性不同，商品可设置发货时间和可选的发货方式会有不同； 电子卡券类商品尤其要注意选择正确的类目发布； <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（二）建议实物订单选择闲鱼社区可获取物流回传信息的物流公司进行发货； <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（三）准确填写发货方式、快递公司、物流单号。<\/span><\/p>","text":"闲鱼社区发货时效承诺服务规范 第一章 概述 第一条【目的背景】 为维护闲鱼社区健康的市场秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据国家相关法律法规及规范性文件，《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则等，制定本规范。 第二条【定义】 发货时效承诺服务是指当买家在闲鱼社区上购买带有“24小时发货”或“10分钟发货”服务标识的商品，如卖家未在承诺时间内发货，买家可发起服务申请，满足条件时可得到相应赔付。 第二章 卖家要求 第三条【准入及退出】 卖家须同时符合以下准入条件时，卖家可选择就其发布的实物类商品开通“24小时发货”服务；卖家可选择就其发布的电子卡券类商品开通“10分钟发货”服务；开通服务商品后因故退出服务的，卖家就服务存续期间产生的订单仍须履行相应服务承诺。 第四条【发货时间要求】 开通发货时效承诺服务（“24小时发货”或“10分钟发货”）的卖家，须按照以下要求进行发货： （一）一般发货时效承诺 1. 实物类商品：卖家须在买家付款后24小时内发货，并确保物流单号48小时内有揽收记录； 2. 电子卡券类商品：卖家须在买家付款后10分钟内发货（特殊时间段内的订单，即买家付款时间为每日22点到次日8点的订单，卖家须在次日10点前完成发货）。 （二）例外情形处理 1. 如遇法定年节假日、疫情影响等不可抗力、闲鱼社区官方发起活动等特殊情形，发货时间以闲鱼社区的公告或通知为准；卖家如遇不可抗力等特殊情形，可通过客服热线或在线客服提前向闲鱼社区申请报备，是否构成不可抗力等以闲鱼社区判定为准，同时卖家应及时与买家沟通； 2. 卖家与买家通过闲鱼商品留言、私聊等闲鱼提供的官方沟通渠道中协商成功的，卖家应在协商成功的时间内发货。其中，如卖家与买家约定发货时间短于本条第（一）项约定的，卖家超过本条第（一）项承诺时效发货的行为方可视为本规范约定保障范围内的延迟发货；如卖家与买家约定发货时间长于本条第（一）项约定的，卖家超过与买家另行约定时效发货的行为方可视为本规范约定保障范围内的延迟发货。 第五条【发货时间认定标准】 （一）物流公司有回传信息的订单，以物流公司系统内揽件记录（如物流详情为“已揽收/揽件”等状态）的时间为准。其中由菜鸟及其合作伙伴提供物流服务的订单，其物流详情在“包裹已出库”状态后显示“正在发往分拨中心”、“已进入分拨中心”、“已完成分拨集包”、“已从分拨中心发出”四种状态的时间为准； （二）通过尚无物流节点信息回传的物流公司发货的订单，以物流公司底单展示的发货时间为准； （三）电子卡券类订单，根据交易形式，以卖家实际提供充值链接或卡密等有效发货凭证的时间为准。 第六条【发货方式】 卖家可以选择“裹裹寄件”、“已邮寄填单”、“无需寄件”方式进行发货，具体以产品页面提示为准。 第七条【违背发货承诺-延迟发货】 卖家未按照第四条“发货时间要求”完成发货的行为，视为延迟发货。 第八条【赔付标准】 卖家如有延迟发货行为的，须向买家赔付 该商品 实际成交金额（指卖家支付宝等账户实际收款金额，如有邮费、第三方服务费等则不包含）的5%，且赔付金额最高不超过50元，最低不少于3元。 第三章 买家保障 第九条【服务展示】 成功开通该服务的商品将在商品详情等页面展示“24小时发货”或“10分钟发货”的服务标识。 第十条【服务申请】 同时满足以下条件，买家方可申请“24小时发货”或“10分钟发货”服务赔付： （一）买家购买的商品展示有“24小时发货”或“10分钟发货”服务标识； （二）买家签收后、确认收货前发现存在延迟发货情形； （三）买家应在订单详情页-服务保障-选择“24小时发货”或“10分钟发货”发起服务申请 ； 提交申请后，如发现买家提供信息有误或存在滥用本规则发起服务申请的（包括但不限于恶意套现、机器作弊、提供虚假信息等，以闲鱼判定为准），将无法支持赔付。 第十一条【举证要求】 买家应提供物流记录、闲鱼社区聊天记录等截图、录音、视频信息等以证明延迟发货情况属实。 第四章 附则 第十二条【上位规范】 本规范为《闲鱼社区公约》、《闲鱼社区交易争议处理规范》、《闲鱼社区管理规范》等相关规则的下位规范。本规范有特殊约定的，以本规范约定为准；本规范未约定事宜，仍需执行前述规范。 第十三条【生效时间】 本规范于2023年3月1日首次生效。 【温馨提示】 原则上闲鱼社区以造成的客观事实作为判定违背发货承诺的依据，由于卖家错放类目、未准确填写发货方式等行为，将可能导致判定偏差或买家投诉，建议如下： （一）商品发布到正确类目 由于类目特性不同，商品可设置发货时间和可选的发货方式会有不同； 电子卡券类商品尤其要注意选择正确的类目发布； （二）建议实物订单选择闲鱼社区可获取物流回传信息的物流公司进行发货； （三）准确填写发货方式、快递公司、物流单号。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":1,"words":2002,"sections":0,"subs":0,"version":""},"related":["sec-67","a498767719605573","a498492590744965","a498491379729797"]},{"id":"a498774171583877","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"保证金与履约时效","title":"闲鱼交易超时说明","title_raw":"闲鱼交易超时说明","html":"<h1 class=\"ql-align-center\">闲鱼交易超时说明<\/h1><p>闲鱼交易超时说明包括闲鱼通用交易及通用退款超时说明，详情如下。<\/p><h2>一、闲鱼通用交易超时说明：<\/h2><p>（一）交易状态为“等待买家付款”时，买方自拍下商品之时起1天内未付款的，交易自动关闭。<\/p><p>（二）交易状态为“卖家已发货,等待买家确认收货”时，自卖方操作“发货”之时起，如买方未在以下时限内确认收货且未申请退款的，默认买方已收到货且货物质量符合交易双方的约定，交易成功：快递、EMS及不需要物流的商品10天内。<\/p><p>（三）买卖双方选择在线付款后见面交易的，自卖方操作“发货”之时起，如买方未在10天内确认收货且未申请退款的，交易状态自动变更为交易成功。<\/p><p>（四）买卖双方选择“见一见”见面交易的，如买方未在发起“见一见”见面交易预约的15天内付款的，交易自动关闭。如买方付款后卖方完成“扫码收款”的，交易状态自动变更为交易成功。<\/p><h2>二、闲鱼通用退款超时说明：<\/h2><p><span style=\"color: rgb(51, 51, 51);\">（一）交易状态为“买家已付款,等待卖家发货”时，买方选择退款类型为“卖家未发货，全额退款 (未收到货)”，如当前退款状态为“退款申请等待卖家处理中”的，卖方自买方申请退款之时起1天内未点击发货的，闲鱼通知支付宝退款给买方；若卖方在1天内点击发货，则退款流程关闭，交易正常进行。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）交易状态为“卖家已发货,等待买家确认”时，结合买方选择的退款类型及当前的退款状态，超时说明如下：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1、买方选择退款类型为以下任一类型（①卖家已发货，买家未收到货，全额退款(未收到货) ②买家已收到货，不退货仅退款(已收到货不退货)），根据不同的退款状态，交易超时不同：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（1）如当前退款状态为“退款申请等待卖家处理中”的，卖方自本退款申请提交之日起3天内，不响应退款申请的,默认达成退款申请,按退款申请中的约定直接退款给买方：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（2）如当前退款状态为“卖家拒绝退款，等待买家处理”的，卖方拒绝退款的，买方有权修改退款申请，要求闲鱼介入或确认收货。买方在卖方拒绝退款后3天未操作的，退款流程关闭，交易正常进行。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2、买方选择退款类型为“买家已收到货，退货并退款（已收到货，退货退款）”，如当前退款状态为“退款申请等待卖家处理中”的，卖方自本退款申请提交之日起3天内,不响应退款申请的,默认达成退款申请,进入到退货程序。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">3、买方选择退款类型为“买家已收到货，退货并退款（已收到货，退货退款）”，如当前退款状态为“退款申请达成,等待买家退货”的，买方未在7天内点击退货的，退款流程关闭，交易正常进行。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">4、买方选择退款类型为“买家已收到货，退货并退款（已收到货，退货退款）”，如当前退款状态为“买家已退货,等待卖家确认”的，买方通过快递退货10天内卖方未确认收货的，默认卖方收到退货且无疑义，按退款申请中的约定直接退款给买方。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">5、买方选择退款类型为“买家已收到货，退货并退款（已收到货，退货退款）”，如当前退款状态为“买家已退货，卖家不同意退款，等待买家修改”的，卖方拒绝退款的，买方有权修改退款申请，要求闲鱼介入或确认收货。买方在卖方拒绝退款后3天内未操作的，退款流程关闭，交易正常进行。<\/span><\/p><h2><strong style=\"color: rgb(64, 64, 64);\">三、超时时间变更说明：<\/strong><\/h2><p><span style=\"color: rgb(51, 51, 51);\">（一）当交易状态为“卖家已发货，等待买家确认收货”，离确认收货超时结束还剩72小时时（包括：快递、EMS、无需快递），买方可以延长收货超时。延长收货超时时间次数只能申请一次，超时延长时间可申请3天。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）当交易状态为“卖家已发货，等待买家确认收货”时，卖方可以延长交易超时，延长时间可以选择为3天或5天或7天或10天，延长次数不限。一旦买方点击申请退款，此时卖方无法延长交易超时。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（三）买方自付款之时起即可申请退款，若买方点击申请退款，交易超时将会暂停；若退款流程关闭，则交易正常进行，交易超时继续。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（四）一旦买卖双方任何一方点击申请客服介入按钮，则退款超时暂停。<\/span><\/p><p>附录说明：<\/p><p>1.闲鱼特殊交易及相关退款的超时说明以产品页面提示或相关公告为准。<\/p><p>2.本说明中的“天”，以24小时计算。<\/p><p class=\"ql-align-right\">闲鱼社区<\/p><p class=\"ql-align-right\">2023年1月5日<\/p>","text":"闲鱼交易超时说明 闲鱼交易超时说明包括闲鱼通用交易及通用退款超时说明，详情如下。 一、闲鱼通用交易超时说明： （一）交易状态为“等待买家付款”时，买方自拍下商品之时起1天内未付款的，交易自动关闭。 （二）交易状态为“卖家已发货,等待买家确认收货”时，自卖方操作“发货”之时起，如买方未在以下时限内确认收货且未申请退款的，默认买方已收到货且货物质量符合交易双方的约定，交易成功：快递、EMS及不需要物流的商品10天内。 （三）买卖双方选择在线付款后见面交易的，自卖方操作“发货”之时起，如买方未在10天内确认收货且未申请退款的，交易状态自动变更为交易成功。 （四）买卖双方选择“见一见”见面交易的，如买方未在发起“见一见”见面交易预约的15天内付款的，交易自动关闭。如买方付款后卖方完成“扫码收款”的，交易状态自动变更为交易成功。 二、闲鱼通用退款超时说明： （一）交易状态为“买家已付款,等待卖家发货”时，买方选择退款类型为“卖家未发货，全额退款 (未收到货)”，如当前退款状态为“退款申请等待卖家处理中”的，卖方自买方申请退款之时起1天内未点击发货的，闲鱼通知支付宝退款给买方；若卖方在1天内点击发货，则退款流程关闭，交易正常进行。 （二）交易状态为“卖家已发货,等待买家确认”时，结合买方选择的退款类型及当前的退款状态，超时说明如下： 1、买方选择退款类型为以下任一类型（①卖家已发货，买家未收到货，全额退款(未收到货) ②买家已收到货，不退货仅退款(已收到货不退货)），根据不同的退款状态，交易超时不同： （1）如当前退款状态为“退款申请等待卖家处理中”的，卖方自本退款申请提交之日起3天内，不响应退款申请的,默认达成退款申请,按退款申请中的约定直接退款给买方： （2）如当前退款状态为“卖家拒绝退款，等待买家处理”的，卖方拒绝退款的，买方有权修改退款申请，要求闲鱼介入或确认收货。买方在卖方拒绝退款后3天未操作的，退款流程关闭，交易正常进行。 2、买方选择退款类型为“买家已收到货，退货并退款（已收到货，退货退款）”，如当前退款状态为“退款申请等待卖家处理中”的，卖方自本退款申请提交之日起3天内,不响应退款申请的,默认达成退款申请,进入到退货程序。 3、买方选择退款类型为“买家已收到货，退货并退款（已收到货，退货退款）”，如当前退款状态为“退款申请达成,等待买家退货”的，买方未在7天内点击退货的，退款流程关闭，交易正常进行。 4、买方选择退款类型为“买家已收到货，退货并退款（已收到货，退货退款）”，如当前退款状态为“买家已退货,等待卖家确认”的，买方通过快递退货10天内卖方未确认收货的，默认卖方收到退货且无疑义，按退款申请中的约定直接退款给买方。 5、买方选择退款类型为“买家已收到货，退货并退款（已收到货，退货退款）”，如当前退款状态为“买家已退货，卖家不同意退款，等待买家修改”的，卖方拒绝退款的，买方有权修改退款申请，要求闲鱼介入或确认收货。买方在卖方拒绝退款后3天内未操作的，退款流程关闭，交易正常进行。 三、超时时间变更说明： （一）当交易状态为“卖家已发货，等待买家确认收货”，离确认收货超时结束还剩72小时时（包括：快递、EMS、无需快递），买方可以延长收货超时。延长收货超时时间次数只能申请一次，超时延长时间可申请3天。 （二）当交易状态为“卖家已发货，等待买家确认收货”时，卖方可以延长交易超时，延长时间可以选择为3天或5天或7天或10天，延长次数不限。一旦买方点击申请退款，此时卖方无法延长交易超时。 （三）买方自付款之时起即可申请退款，若买方点击申请退款，交易超时将会暂停；若退款流程关闭，则交易正常进行，交易超时继续。 （四）一旦买卖双方任何一方点击申请客服介入按钮，则退款超时暂停。 附录说明： 1.闲鱼特殊交易及相关退款的超时说明以产品页面提示或相关公告为准。 2.本说明中的“天”，以24小时计算。 闲鱼社区 2023年1月5日","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":1638,"sections":0,"subs":0,"version":""},"related":["sec-67"]},{"id":"sec-67","kind":"chapter","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"保证金与履约时效","title":"第十三章 售后管理与申诉指南","title_raw":"第十三章 售后管理与申诉指南","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-68\">13.1 标准化发货流程<\/h3><ol>\n<li>拍照留存：商品+快递单合照，易碎品拍包装过程。<\/li>\n<li>24小时内发货：上传物流单号，超时影响信用分。<\/li>\n<li>同步通知买家：「亲，已发货，快递单号XXX，请注意查收~」。<\/li>\n<li>物流跟踪：签收后主动确认，引导买家及时确认收货。<\/li>\n<\/ol>\n<h3 id=\"sec-69\">13.2 退货退款策略<\/h3><table>\n<thead>\n<tr>\n<th>场景<\/th>\n<th>处理方式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>商品与描述不符<\/td>\n<td>主动承担退货运费，道歉+补偿小礼品<\/td>\n<\/tr>\n<tr>\n<td>买家主观不喜欢<\/td>\n<td>二手商品标明&quot;非质量问题不退不换&quot;<\/td>\n<\/tr>\n<tr>\n<td>物流损坏<\/td>\n<td>保价商品走理赔；未保价与买家协商分担<\/td>\n<\/tr>\n<tr>\n<td>买家恶意退款<\/td>\n<td>保留聊天+发货证据，走平台仲裁<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-70\">13.3 申诉全流程<\/h3><p>即使合规运营也可能遇到误判，提前留存证据是关键。所有证据至少保存3个月。<\/p>\n<table>\n<thead>\n<tr>\n<th>步骤<\/th>\n<th>操作<\/th>\n<th>时效<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. 收到违规通知<\/td>\n<td>立即查看违规类型和原因<\/td>\n<td>即时<\/td>\n<\/tr>\n<tr>\n<td>2. 准备申诉材料<\/td>\n<td>聊天记录截图、发货视频/照片、物流单号、质检报告（如有）<\/td>\n<td>24小时内<\/td>\n<\/tr>\n<tr>\n<td>3. 提交申诉<\/td>\n<td>闲鱼APP → 我的 → 交易记录 → 对应订单 → 我要申诉 → 上传材料<\/td>\n<td>72小时内<\/td>\n<\/tr>\n<tr>\n<td>4. 首次申诉失败<\/td>\n<td>申请「人工仲裁复核」（成功率最高的路径）<\/td>\n<td>收到结果后48小时内<\/td>\n<\/tr>\n<tr>\n<td>5. 复核失败<\/td>\n<td>联系客服热线进一步沟通，准备补充证据<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-71\">13.4 证据留存清单<\/h3><ul>\n<li>订单相关聊天记录完整截图（含时间）<\/li>\n<li>发货前商品实拍照片（多角度）<\/li>\n<li>商品包装过程视频/照片<\/li>\n<li>快递单号 + 物流轨迹截图<\/li>\n<li>买家签收证明（物流显示已签收）<\/li>\n<li>商品质检报告（如有）<\/li>\n<li>购买凭证/发票（品牌商品）<\/li>\n<\/ul>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 13.1 标准化发货流程 拍照留存：商品+快递单合照，易碎品拍包装过程。 24小时内发货：上传物流单号，超时影响信用分。 同步通知买家：「亲，已发货，快递单号XXX，请注意查收~」。 物流跟踪：签收后主动确认，引导买家及时确认收货。 13.2 退货退款策略 场景 处理方式 商品与描述不符 主动承担退货运费，道歉+补偿小礼品 买家主观不喜欢 二手商品标明\"非质量问题不退不换\" 物流损坏 保价商品走理赔；未保价与买家协商分担 买家恶意退款 保留聊天+发货证据，走平台仲裁 13.3 申诉全流程 即使合规运营也可能遇到误判，提前留存证据是关键。所有证据至少保存3个月。 步骤 操作 时效 1. 收到违规通知 立即查看违规类型和原因 即时 2. 准备申诉材料 聊天记录截图、发货视频/照片、物流单号、质检报告（如有） 24小时内 3. 提交申诉 闲鱼APP → 我的 → 交易记录 → 对应订单 → 我要申诉 → 上传材料 72小时内 4. 首次申诉失败 申请「人工仲裁复核」（成功率最高的路径） 收到结果后48小时内 5. 复核失败 联系客服热线进一步沟通，准备补充证据 — 13.4 证据留存清单 订单相关聊天记录完整截图（含时间） 发货前商品实拍照片（多角度） 商品包装过程视频/照片 快递单号 + 物流轨迹截图 买家签收证明（物流显示已签收） 商品质检报告（如有） 购买凭证/发票（品牌商品）","toc":[{"id":"sec-68","title":"13.1 标准化发货流程"},{"id":"sec-69","title":"13.2 退货退款策略"},{"id":"sec-70","title":"13.3 申诉全流程"},{"id":"sec-71","title":"13.4 证据留存清单"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":2,"imgs":0,"words":687,"sections":4,"subs":0,"version":"V2026.10.12"},"related":["a498495935731077","a498419828663685","a498492590744965","a498493973546309"]}]},{"module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"退货退款与买家保障","color":"blue","count":3,"items":[{"id":"a498493973546309","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"退货退款与买家保障","title":"闲鱼社区七天无理由退货规范","title_raw":"闲鱼社区七天无理由退货规范","html":"<p class=\"ql-align-center\"><strong class=\"ql-size-16px\">闲鱼社区七天无理由退货规范<\/strong><\/p><p class=\"ql-align-center\"><strong><\/strong><\/p><p><strong style=\"color: black;\">第一条&nbsp;<\/strong><span style=\"color: black;\">为维护闲鱼社区健康的市场秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据国家相关法律法规及规范性文件，《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则等，制定本规范。<\/span><\/p><p><strong style=\"color: black;\">第二条<\/strong><span style=\"color: black;\">&nbsp;本规范适用于闲鱼社区内从事商业经营活动的经营性卖家（以下简称“卖家”，经营性卖家定义见规则解读）于闲鱼社区出售符合本规范约定适用情形的商品。<\/span><\/p><p><strong style=\"color: black;\">第三条<\/strong><span style=\"color: black;\">&nbsp;本规范适用于符合本规范第十二条“适用情形”的商品，具体类型有：<\/span><\/p><p><span style=\"color: black;\">（一）卖家设置的、商品成色属性显示为“全新”的、不属于排除适用范围的全新商品；其中，当卖家发布的同一商品链接下含有不同销售属性的商品（简称“多SKU商品”），该链接下商品均按照全新商品处理（以下简称“全新商品”）；<\/span><\/p><p><span style=\"color: black;\">（二）虽然卖家设置的商品成色属性为非全新、但卖家自主选择承诺七天无理由退货的、不属于排除适用范围的非全新商品（以下简称“非全新商品”）。卖家应在商品信息发布、交易磋商等过程中如实、全面向买家披露非全新商品成色、瑕疵/缺陷/磨损（如有）等情况。<\/span><\/p><p><strong style=\"color: black;\">第四条&nbsp;<\/strong><span style=\"color: black;\">发布符合本规范适用范围全新商品的卖家，以及发布非全新商品且愿意提供七天无理由退货服务的卖家，需缴纳足额保证金500元，支持七天无理由退货的商品会带有“7天无理由退货”标识。<\/span><\/p><p><strong style=\"color: black;\">第五条&nbsp;<\/strong><span style=\"color: black;\">买家在签收商品之日起七天内，对支持七天无理由退货且符合商品完好标准不影响二次销售的商品，可向卖家发起7天无理由退货申请。<\/span><\/p><p><strong style=\"color: black;\">第六条&nbsp;<\/strong><span style=\"color: black;\">选择无理由退货的买家应当自收到商品之日起七天内向闲鱼社区卖家发出退货通知。七天期间自物流显示签收商品的次日零时开始算，满168小时为7天。<\/span><\/p><p><strong style=\"color: black;\">第七条&nbsp;<\/strong><span style=\"color: black;\">买家退回的商品应当完好（商品完好标准详见第十三条）。<\/span><\/p><p><strong style=\"color: black;\">第八条&nbsp;<\/strong><span style=\"color: black;\">闲鱼社区要求支持七天无理由退货的商品，卖家单方或买卖双方约定不支持七天无理由退货的行为无效。鼓励卖家向买家提供更优于闲鱼社区要求的七天无理由退货政策。<\/span><\/p><p><strong style=\"color: black;\">第九条&nbsp;<\/strong><span style=\"color: black;\">买家进行七天无理由退货时，若商品卖家包邮，买家仅承担退回运费；若商品未有包邮或商品系卖家附条件包邮的，买家部分退货致使无法满足包邮条件的，由买家承担所有邮费。双方另有约定的，从其约定。<\/span><\/p><p><span style=\"color: black;\">买家存在滥用会员权利行为的，所有运费均由买家承担。<\/span><\/p><p><strong style=\"color: black;\">第十条&nbsp;<\/strong><span style=\"color: black;\">赠品（如有）遗失或破损、发票（如有）遗失不影响商品退货；赠品（如有）破损或遗失作折价处理，发票（如有）遗失由买家承担相应税款。<\/span><\/p><p><strong style=\"color: black;\">第十一条&nbsp;<\/strong><span style=\"color: black;\">本规则自2022年10月8日首次生效。闲鱼社区买家“七天无理由退货”行为发生在本规则修订生效以前的，适用当时的规则；发生在本规则修订生效以后的，适用本规则。<\/span><\/p><p><strong style=\"color: black;\">第十二条&nbsp;<\/strong><span style=\"color: black;\">适用情形<\/span><img src=\"assets/img/163523-8462nofl-c7d9b2.jpg\"><\/p><p><strong style=\"color: black;\">第十三条&nbsp;<\/strong><span style=\"color: black;\">商品完好标准<\/span><\/p><p><span style=\"color: black;\">一、通用标准<\/span><\/p><p><span style=\"color: black;\">1.商品能够保持原有品质、功能。买家应当确保退回商品和相关配（附）件（如吊牌、说明书、三包卡等）齐全，并保持原有品质、功能，无受损、受污、刮开防伪、产生激活（授权）等情形，无难以恢复原状的外观类使用痕迹、不合理的个人数据使用痕迹；<\/span><\/p><p><span style=\"color: black;\">2.买家基于查验需要而打开商品包装，或者为确认商品的品质、功能而进行合理的调试不影响商品的完好。对超出查验和确认商品品质、功能需要而使用商品，导致商品价值贬损较大的，视为商品不完好；<\/span><\/p><p><span style=\"color: black;\">3.商品包装作为商品的必要组成部分，其缺损状况易导致商品价值贬损，故退回时应确保商品包装完整。部分具有特定价值或功能的特殊商品包装，可依卖家事前显著明示的包装保护要求处理。<\/span><\/p><p><span style=\"color: black;\">（1）一般商品包装的完整标准：<\/span><\/p><p><span style=\"color: black;\">商品原包装未缺失，包装整体结构完整。但在包装运输或拆卸过程中产生的难以避免的形态变化，如适度的变形、污渍、局部破损等，不认定其影响商品包装完整。<\/span><\/p><p><span style=\"color: black;\">（2）特殊商品包装的保护要求：<\/span><\/p><p><span style=\"color: black;\">若商品包装客观上确有防伪性、唯一性、收藏纪念价值或另附昂贵价值等特殊附加价值或功能，卖家可在合理范围内提出特定的包装保护要求。对于合理可行的包装保护要求，经卖家事前显著明示后，买家应予积极谨慎保护。若该类包装损坏程度足以造成价值贬损或功能丧失，可认定其商品价值贬损。<\/span><\/p><p><span style=\"color: black;\">若卖家未经事前显著明示提出包装保护要求，则依照一般商品包装的完整标准处理。<\/span><\/p><p><span style=\"color: black;\">若商品包装并不具备上述特殊性，则依照一般商品包装的完整标准处理。<\/span><\/p><p><span style=\"color: black;\">4.赠品遗失或破损、发票遗失不影响商品退货；赠品破损或遗失作折价处理，发票遗失由买家承担相应税款；<\/span><\/p><p><span style=\"color: black;\">5.食品（含保健食品）、化妆品、个人护理用品、计生用品、成人用品、图书、婴儿尿片、音像制品外包装被一次性密封的，不得拆封。<\/span><\/p><p><span style=\"color: black;\">“密封”系指：商品外包装被生产厂商加以了封条（签）或整体塑（密）封的包装措施。<\/span><\/p><p><span style=\"color: black;\">二、特殊完好标准<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">1.&nbsp;全新商品<\/span><\/p><p><img src=\"assets/img/163614-2020klho-553a85.jpg\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">2.&nbsp;&nbsp;非全新商品<\/span><\/p><p><span style=\"color: black;\">买家需确保退货时商品状态与收到货时保持一致。<\/span><\/p><p><span style=\"color: black;\"><\/span><\/p><p><span style=\"color: black;\">—————————————————————————<\/span><\/p><p>规则解读：<\/p><p>1.七天无理由服务是强制卖家开通的吗？<\/p><p>七天无理由退货服务适用范围是<span style=\"color: rgb(254, 3, 0);\">经营性卖家<\/span>，发布<span style=\"color: rgb(254, 3, 0);\">新品<\/span>且<span style=\"color: rgb(254, 3, 0);\">满足规范第十二条必须支持七天无理由退货服务商品类型<\/span>时强制开通，其余商品类型卖家可根据情况自愿开通，具体可根据发布商品时页面提示操作。<\/p><p>2.什么样的卖家属于经营性卖家？<\/p><p>完成亮证亮照或个人声明，闲鱼个人主页展示<span style=\"color: rgb(254, 3, 0);\">“商”标识<\/span>的卖家。（如下图）<img src=\"assets/img/163657-1624vsfc-9cad77.png\"><\/p>","text":"闲鱼社区七天无理由退货规范 第一条 为维护闲鱼社区健康的市场秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据国家相关法律法规及规范性文件，《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则等，制定本规范。 第二条 本规范适用于闲鱼社区内从事商业经营活动的经营性卖家（以下简称“卖家”，经营性卖家定义见规则解读）于闲鱼社区出售符合本规范约定适用情形的商品。 第三条 本规范适用于符合本规范第十二条“适用情形”的商品，具体类型有： （一）卖家设置的、商品成色属性显示为“全新”的、不属于排除适用范围的全新商品；其中，当卖家发布的同一商品链接下含有不同销售属性的商品（简称“多SKU商品”），该链接下商品均按照全新商品处理（以下简称“全新商品”）； （二）虽然卖家设置的商品成色属性为非全新、但卖家自主选择承诺七天无理由退货的、不属于排除适用范围的非全新商品（以下简称“非全新商品”）。卖家应在商品信息发布、交易磋商等过程中如实、全面向买家披露非全新商品成色、瑕疵/缺陷/磨损（如有）等情况。 第四条 发布符合本规范适用范围全新商品的卖家，以及发布非全新商品且愿意提供七天无理由退货服务的卖家，需缴纳足额保证金500元，支持七天无理由退货的商品会带有“7天无理由退货”标识。 第五条 买家在签收商品之日起七天内，对支持七天无理由退货且符合商品完好标准不影响二次销售的商品，可向卖家发起7天无理由退货申请。 第六条 选择无理由退货的买家应当自收到商品之日起七天内向闲鱼社区卖家发出退货通知。七天期间自物流显示签收商品的次日零时开始算，满168小时为7天。 第七条 买家退回的商品应当完好（商品完好标准详见第十三条）。 第八条 闲鱼社区要求支持七天无理由退货的商品，卖家单方或买卖双方约定不支持七天无理由退货的行为无效。鼓励卖家向买家提供更优于闲鱼社区要求的七天无理由退货政策。 第九条 买家进行七天无理由退货时，若商品卖家包邮，买家仅承担退回运费；若商品未有包邮或商品系卖家附条件包邮的，买家部分退货致使无法满足包邮条件的，由买家承担所有邮费。双方另有约定的，从其约定。 买家存在滥用会员权利行为的，所有运费均由买家承担。 第十条 赠品（如有）遗失或破损、发票（如有）遗失不影响商品退货；赠品（如有）破损或遗失作折价处理，发票（如有）遗失由买家承担相应税款。 第十一条 本规则自2022年10月8日首次生效。闲鱼社区买家“七天无理由退货”行为发生在本规则修订生效以前的，适用当时的规则；发生在本规则修订生效以后的，适用本规则。 第十二条 适用情形 第十三条 商品完好标准 一、通用标准 1.商品能够保持原有品质、功能。买家应当确保退回商品和相关配（附）件（如吊牌、说明书、三包卡等）齐全，并保持原有品质、功能，无受损、受污、刮开防伪、产生激活（授权）等情形，无难以恢复原状的外观类使用痕迹、不合理的个人数据使用痕迹； 2.买家基于查验需要而打开商品包装，或者为确认商品的品质、功能而进行合理的调试不影响商品的完好。对超出查验和确认商品品质、功能需要而使用商品，导致商品价值贬损较大的，视为商品不完好； 3.商品包装作为商品的必要组成部分，其缺损状况易导致商品价值贬损，故退回时应确保商品包装完整。部分具有特定价值或功能的特殊商品包装，可依卖家事前显著明示的包装保护要求处理。 （1）一般商品包装的完整标准： 商品原包装未缺失，包装整体结构完整。但在包装运输或拆卸过程中产生的难以避免的形态变化，如适度的变形、污渍、局部破损等，不认定其影响商品包装完整。 （2）特殊商品包装的保护要求： 若商品包装客观上确有防伪性、唯一性、收藏纪念价值或另附昂贵价值等特殊附加价值或功能，卖家可在合理范围内提出特定的包装保护要求。对于合理可行的包装保护要求，经卖家事前显著明示后，买家应予积极谨慎保护。若该类包装损坏程度足以造成价值贬损或功能丧失，可认定其商品价值贬损。 若卖家未经事前显著明示提出包装保护要求，则依照一般商品包装的完整标准处理。 若商品包装并不具备上述特殊性，则依照一般商品包装的完整标准处理。 4.赠品遗失或破损、发票遗失不影响商品退货；赠品破损或遗失作折价处理，发票遗失由买家承担相应税款； 5.食品（含保健食品）、化妆品、个人护理用品、计生用品、成人用品、图书、婴儿尿片、音像制品外包装被一次性密封的，不得拆封。 “密封”系指：商品外包装被生产厂商加以了封条（签）或整体塑（密）封的包装措施。 二、特殊完好标准 1. 全新商品 2. 非全新商品 买家需确保退货时商品状态与收到货时保持一致。 ————————————————————————— 规则解读： 1.七天无理由服务是强制卖家开通的吗？ 七天无理由退货服务适用范围是 经营性卖家 ，发布 新品 且 满足规范第十二条必须支持七天无理由退货服务商品类型 时强制开通，其余商品类型卖家可根据情况自愿开通，具体可根据发布商品时页面提示操作。 2.什么样的卖家属于经营性卖家？ 完成亮证亮照或个人声明，闲鱼个人主页展示 “商”标识 的卖家。（如下图）","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":3,"words":2100,"sections":0,"subs":0,"version":""},"related":["sec-67","a498492590744965","a498827573106053","a498491379729797"]},{"id":"a498492590744965","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"退货退款与买家保障","title":"闲鱼社区“描述不符包邮退”服务规范","title_raw":"闲鱼社区“描述不符包邮退”服务规范","html":"<p class=\"ql-align-center\"><strong class=\"ql-size-16px\">闲鱼社区“描述不符包邮退”服务规范<\/strong><\/p><p><strong>第一章 概述<\/strong><\/p><p><strong>第一条【目的背景】<\/strong><\/p><p>为维护闲鱼社区健康的市场秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据国家相关法律法规及规范性文件，《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则等，制定本规范。<\/p><p><strong>第二条【定义】<\/strong><\/p><p>描述不符指买家收到的商品存在与卖家描述不相符，或卖家未对商品瑕疵等信息进行披露等情形，妨害买家权益的行为。<\/p><p>“描述不符包邮退”服务是指当买家在闲鱼社区上购买带有“描述不符包邮退”服务标识的商品，签收后、确认收货前发现收到商品存在描述不符情形时，买家可发起服务申请，满足条件时可退货且退货运费由卖家承担的服务。<\/p><p><img src=\"assets/img/162855-3612iuvf-1d5c9d.jpg\"><\/p><p><strong>第二章 卖家要求<\/strong><\/p><p><strong>第三条【准入及退出】<\/strong><\/p><p>同时符合以下准入条件时，卖家可选择就其发布的实物类商品开通“描述不符包邮退”服务；开通服务商品后续因故退出服务的，卖家就服务存续期间产生的订单仍应履行相应服务承诺。<\/p><p>（一）开通并使用鱼小铺工具；<\/p><p>（二）闲气值高于80分；<\/p><p>（三）保证金足额缴纳200元。<\/p><p>可主动申请退出该服务或申请部分商品退出该服务。<\/p><p>当申请退出该服务时，需满足无该服务履约中的订单。<\/p><p>存在以下任一情形时立即取消服务准入：<\/p><p>（一）退出不使用鱼小铺工具；<\/p><p>（二）保证金不足。<\/p><p>符合准入要求<\/p><p><strong>第四条【服务要求】<\/strong><\/p><p>开通“描述不符包邮退”服务的卖家，须履行以下服务承诺：<\/p><p>（一）响应时效<\/p><p>买家在签收后、确认收货前，以“描述不符包邮退”原因发起的退货，卖家应在买家发起之时起72小时内响应；若超时未处理，则系统将自动同意退货申请。<\/p><p>买家寄回商品后，卖家需根据买家提供的邮费凭证向买家支付邮费；若订单退款完成后24小时内卖家未支付邮费的，则系统将从卖家缴纳的保证金中自动扣除相应邮费金额。<\/p><p>（二）服务保障<\/p><p>物流显示买家寄出退货商品后，卖家应向买家赔付该商品的退货运费；若卖家一直未操作，订单退款完成24小时后系统将自动向买家完成赔付，赔付金额最高不超过200元；但买家存在滥用本规范发起服务申请行为的，将不支持赔付。<\/p><p><strong>第三章 买家保障<\/strong><\/p><p><strong>第五条【服务展示】<\/strong><\/p><p>成功开通该服务的商品将在商品详情等页面展示“描述不符包邮退”服务标识。<\/p><p><strong>第六条【服务申请】<\/strong><\/p><p>同时满足以下条件，买家方可申请“描述不符包邮退”服务：<\/p><p>（一）买家购买的商品展示有“描述不符包邮退”服务标识；<\/p><p>（二）买家签收后、确认收货前发现商品存在描述不符情形。描述不符具体包含但不限于以下情形：<\/p><p>商品存在质量问题、功能故障或更换拆修记录等未描述；<\/p><p>商品的基本参数、规格信息描述与实物不符；<\/p><p>商品的成色描述与实物明显不符或存在明显瑕疵未描述 ；<\/p><p>（三）买家应选择“描述不符包邮退”类型的退款原因发起服务申请。<\/p><p>&nbsp;因买家使用或保管不当等原因导致商品出现问题的，卖家有权拒绝提供“描述不符包邮退”服务。<\/p><p><strong>第七条【举证要求】<\/strong><\/p><p>买家应提供商品细节实拍图片或视频、闲鱼社区聊天记录等信息以证明商品描述不符情况属实。<\/p><p><strong>第四章 附则<\/strong><\/p><p><strong>第八条【上位规范】<\/strong><\/p><p>本规范为《闲鱼社区公约》、《闲鱼社区交易争议处理规范》、《闲鱼社区管理规范》等相关规则的下位规范。本规范有特殊约定的，以本规范约定为准；本规范未约定事宜，仍需执行前述规范。<\/p><p><strong>第九条【生效时间】<\/strong><\/p><p>本规范于2022年10月8日首次生效。<\/p>","text":"闲鱼社区“描述不符包邮退”服务规范 第一章 概述 第一条【目的背景】 为维护闲鱼社区健康的市场秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据国家相关法律法规及规范性文件，《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则等，制定本规范。 第二条【定义】 描述不符指买家收到的商品存在与卖家描述不相符，或卖家未对商品瑕疵等信息进行披露等情形，妨害买家权益的行为。 “描述不符包邮退”服务是指当买家在闲鱼社区上购买带有“描述不符包邮退”服务标识的商品，签收后、确认收货前发现收到商品存在描述不符情形时，买家可发起服务申请，满足条件时可退货且退货运费由卖家承担的服务。 第二章 卖家要求 第三条【准入及退出】 同时符合以下准入条件时，卖家可选择就其发布的实物类商品开通“描述不符包邮退”服务；开通服务商品后续因故退出服务的，卖家就服务存续期间产生的订单仍应履行相应服务承诺。 （一）开通并使用鱼小铺工具； （二）闲气值高于80分； （三）保证金足额缴纳200元。 可主动申请退出该服务或申请部分商品退出该服务。 当申请退出该服务时，需满足无该服务履约中的订单。 存在以下任一情形时立即取消服务准入： （一）退出不使用鱼小铺工具； （二）保证金不足。 符合准入要求 第四条【服务要求】 开通“描述不符包邮退”服务的卖家，须履行以下服务承诺： （一）响应时效 买家在签收后、确认收货前，以“描述不符包邮退”原因发起的退货，卖家应在买家发起之时起72小时内响应；若超时未处理，则系统将自动同意退货申请。 买家寄回商品后，卖家需根据买家提供的邮费凭证向买家支付邮费；若订单退款完成后24小时内卖家未支付邮费的，则系统将从卖家缴纳的保证金中自动扣除相应邮费金额。 （二）服务保障 物流显示买家寄出退货商品后，卖家应向买家赔付该商品的退货运费；若卖家一直未操作，订单退款完成24小时后系统将自动向买家完成赔付，赔付金额最高不超过200元；但买家存在滥用本规范发起服务申请行为的，将不支持赔付。 第三章 买家保障 第五条【服务展示】 成功开通该服务的商品将在商品详情等页面展示“描述不符包邮退”服务标识。 第六条【服务申请】 同时满足以下条件，买家方可申请“描述不符包邮退”服务： （一）买家购买的商品展示有“描述不符包邮退”服务标识； （二）买家签收后、确认收货前发现商品存在描述不符情形。描述不符具体包含但不限于以下情形： 商品存在质量问题、功能故障或更换拆修记录等未描述； 商品的基本参数、规格信息描述与实物不符； 商品的成色描述与实物明显不符或存在明显瑕疵未描述 ； （三）买家应选择“描述不符包邮退”类型的退款原因发起服务申请。 因买家使用或保管不当等原因导致商品出现问题的，卖家有权拒绝提供“描述不符包邮退”服务。 第七条【举证要求】 买家应提供商品细节实拍图片或视频、闲鱼社区聊天记录等信息以证明商品描述不符情况属实。 第四章 附则 第八条【上位规范】 本规范为《闲鱼社区公约》、《闲鱼社区交易争议处理规范》、《闲鱼社区管理规范》等相关规则的下位规范。本规范有特殊约定的，以本规范约定为准；本规范未约定事宜，仍需执行前述规范。 第九条【生效时间】 本规范于2022年10月8日首次生效。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":1,"words":1343,"sections":0,"subs":0,"version":""},"related":["a498773110658437","a499947955983749","a498458897921413","a498834062509445"]},{"id":"a498767719605573","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"退货退款与买家保障","title":"闲鱼社区“描述不符全额退”服务规范","title_raw":"闲鱼社区“描述不符全额退”服务规范","html":"<p class=\"ql-align-center\"><strong style=\"color: rgb(0, 0, 0);\" class=\"ql-size-16px\">闲鱼社区“描述不符全额退”服务规范<\/strong><\/p><p class=\"ql-align-center\"><br><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第一章 概述<\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第一条【目的背景】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">为了维护闲鱼社区卡券、服务等虚拟行业健康的市场秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据国家相关法律法规及规范性文件，《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则等，制定本规范。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\"><\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第二条【定义】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">“描述不符全额退”服务是指当买家在闲鱼社区上购买带有“描述不符全额退”服务标识的商品，买家发现收到商品或服务存在描述不符情形时，买家可发起服务申请，满足条件时可全额退款。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第二章 卖家要求<\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第三条【准入及退出】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">同时符合以下准入条件时，卖家可选择就其发布的卡券充值、服务类等虚拟商品（具体覆盖商品范围请以商品发布页面提示为准）开通“描述不符全额退”服务；开通服务商品后续因故退出服务，卖家就服务存续期间产生的订单仍应履行相应服务承诺。<\/span><\/p><p><img src=\"assets/img/110826-5064zstj-5021b0.jpg\"><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第四条【服务要求】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">开通“描述不符全额退”服务的卖家，须履行以下服务承诺：<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">买家确认收货前，因描述不符发起的退款申请，卖家应在买家发起之时起72小时内响应，若超时未处理，则系统将自动同意退款申请；买家确认收货后，选择“描述不符全额退”发起服务申请，卖家应在买家发起之时起48小时内响应，若超时未处理，则系统将自动同意服务申请。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第三章 买家保障<\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第五条【服务展示】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">成功开通该服务的商品将在商品详情等页面展示“描述不符全额退”服务标识。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第六条【服务申请】<\/strong><\/p><p><span style=\"color: rgb(0, 0, 0);\">同时满足以下条件，买家方可申请“描述不符全额退”服务：<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">（一）买家购买商品时，商品展示有“描述不符全额退”服务标识；&nbsp;<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">（二）买家发现商品/服务存在描述不符情形。本服务下描述不符具体包含但不限于以下情形：<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">账号无法成功登录、充值未到账等问题造成账号或服务无法使用；<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">商品或服务的基本参数信息（如服务内容、使用周期等）与卖家的描述不符；<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">商品或服务的承诺交付时间、可达到的效果等与卖家的描述不符；<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">其他描述不符情形根据买卖家提供的举证，以闲鱼社区判责为准；<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">（三）如在确认收货前发现描述不符情形的，买家在点击确认收货或交易超时默认交易成功前发起退款申请；如在确认收货后发现描述不符情形的，买家在确认收货之日起60天内，在订单详情页-服务保障-选择“描述不符全额退”发起服务申请。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">如发现买家提供信息有误或存在滥用本规则发起服务申请的，将无法支持退款，滥用规则发起服务申请的账号可能被处罚。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\"><\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第七条【举证要求】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">买家应提供闲鱼社区内的聊天记录截图等、语音、视频信息等以证明商品/服务描述不符情况属实。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第四章 附则<\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第八条【上位规范】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">本规范为《闲鱼社区公约》、《闲鱼社区交易争议处理规范》、《闲鱼社区管理规范》等相关规则的下位规范。本规范有特殊约定的，以本规范约定为准；本规范未约定事宜，仍需执行前述规范。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">第九条【生效时间】<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">本规范于2023年3月23日首次生效。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">【温馨提示】<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">申请服务提交的举证中，须提交闲鱼社区内的聊天记录截图等凭证，脱离闲鱼社区的沟通、转账付款记录平台无法核实，不能成为判定依据，请务必在闲鱼社区内进行交易及沟通。<\/span><\/p>","text":"闲鱼社区“描述不符全额退”服务规范 第一章 概述 第一条【目的背景】 为了维护闲鱼社区卡券、服务等虚拟行业健康的市场秩序，加强买家保障的同时切实遵守闲鱼社区相关规则，根据国家相关法律法规及规范性文件，《闲鱼社区公约》、《闲鱼社区管理规范》等相关规则等，制定本规范。 第二条【定义】 “描述不符全额退”服务是指当买家在闲鱼社区上购买带有“描述不符全额退”服务标识的商品，买家发现收到商品或服务存在描述不符情形时，买家可发起服务申请，满足条件时可全额退款。 第二章 卖家要求 第三条【准入及退出】 同时符合以下准入条件时，卖家可选择就其发布的卡券充值、服务类等虚拟商品（具体覆盖商品范围请以商品发布页面提示为准）开通“描述不符全额退”服务；开通服务商品后续因故退出服务，卖家就服务存续期间产生的订单仍应履行相应服务承诺。 第四条【服务要求】 开通“描述不符全额退”服务的卖家，须履行以下服务承诺： 买家确认收货前，因描述不符发起的退款申请，卖家应在买家发起之时起72小时内响应，若超时未处理，则系统将自动同意退款申请；买家确认收货后，选择“描述不符全额退”发起服务申请，卖家应在买家发起之时起48小时内响应，若超时未处理，则系统将自动同意服务申请。 第三章 买家保障 第五条【服务展示】 成功开通该服务的商品将在商品详情等页面展示“描述不符全额退”服务标识。 第六条【服务申请】 同时满足以下条件，买家方可申请“描述不符全额退”服务： （一）买家购买商品时，商品展示有“描述不符全额退”服务标识； （二）买家发现商品/服务存在描述不符情形。本服务下描述不符具体包含但不限于以下情形： 账号无法成功登录、充值未到账等问题造成账号或服务无法使用； 商品或服务的基本参数信息（如服务内容、使用周期等）与卖家的描述不符； 商品或服务的承诺交付时间、可达到的效果等与卖家的描述不符； 其他描述不符情形根据买卖家提供的举证，以闲鱼社区判责为准； （三）如在确认收货前发现描述不符情形的，买家在点击确认收货或交易超时默认交易成功前发起退款申请；如在确认收货后发现描述不符情形的，买家在确认收货之日起60天内，在订单详情页-服务保障-选择“描述不符全额退”发起服务申请。 如发现买家提供信息有误或存在滥用本规则发起服务申请的，将无法支持退款，滥用规则发起服务申请的账号可能被处罚。 第七条【举证要求】 买家应提供闲鱼社区内的聊天记录截图等、语音、视频信息等以证明商品/服务描述不符情况属实。 第四章 附则 第八条【上位规范】 本规范为《闲鱼社区公约》、《闲鱼社区交易争议处理规范》、《闲鱼社区管理规范》等相关规则的下位规范。本规范有特殊约定的，以本规范约定为准；本规范未约定事宜，仍需执行前述规范。 第九条【生效时间】 本规范于2023年3月23日首次生效。 【温馨提示】 申请服务提交的举证中，须提交闲鱼社区内的聊天记录截图等凭证，脱离闲鱼社区的沟通、转账付款记录平台无法核实，不能成为判定依据，请务必在闲鱼社区内进行交易及沟通。","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":1,"words":1256,"sections":0,"subs":0,"version":""},"related":["sec-67","a498492590744965","a498495935731077","a498491379729797"]}]},{"module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"纠纷处理与防坑维权","color":"blue","count":4,"items":[{"id":"a498827573106053","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"纠纷处理与防坑维权","title":"闲鱼社区交易争议处理规范","title_raw":"闲鱼社区交易争议处理规范","html":"<p class=\"ql-align-center\"><strong style=\"color: rgb(51, 51, 51);\">闲鱼社区交易争议处理规范<\/strong><\/p><p class=\"ql-align-center\"><br><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第一章 总则<\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第一节 概述<\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">第一条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">为保护交易双方当事人的合法权益，维护闲鱼社区（以下简称“闲鱼”）的正常运营秩序，依据闲鱼社区相关规范，制定本规范。买卖双方在闲鱼社区交易发生争议，适用本规范。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">买卖双方在闲鱼上交易发生交易争议，应以公平、诚信为原则进行友好、理性协商，若双方无法自行协商解决的，任一方向闲鱼投诉处理的，闲鱼将根据本规范进行处理。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第三条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼将根据本规范的规定对买卖双方的争议做出处理。部分买卖双方的争议，闲鱼视争议内容将交由闲鱼小法庭作为独立的第三方进行判断，闲鱼将根据闲鱼小法庭的判断结果对该等争议作出处理。当交易任意一方无法处理，为保障买卖双方交易安全，闲鱼可主动介入处理。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第四条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼通过闲鱼系统、阿里旺旺、电子邮件、短信或电话等方式向买卖双方发送的与争议处理相关的提示或通知，构成争议处理依据及结论的有效组成部分。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第二节 定义<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">运费，指发货/退货所产生的必要费用，如物品拆卸、打包、加固、搬运等相关费用以及运输费用等。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">退货退款，指在卖方签收买方退货后，交易款项支付给买方。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">部分退款，指交易款项部分支付给买方，余款打款给卖方。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">退款，指交易款项支付给买方，物品由卖方自行和买方协商处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">打款，指交易款项支付给卖方。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">破损，指物品的一般性损伤，经简单修复后仍可恢复全部使用功能或不影响核心功能使用。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">损毁，指物品严重受损，无法予以修复或修复后其核心功能已不具有使用价值。修复成本接近物品价值的，视为损毁。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">交易成功，指订单状态显示“交易成功”。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">关闭交易，是指买方付款前关闭订单或卖方在发货前关闭订单的操作行为。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十四条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">质量问题，指卖方出售的物品违反相关法律法规规定或闲鱼社区相关规范要求。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">表面不一致，指凭肉眼即可判断交易物品存在破损、少件、空包等情形。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">描述不符，指买方收到的物品或接受的服务，存在与卖方描述不相符，或卖方未对物品瑕疵等信息进行披露等情形，妨害买方权益的行为。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">“瑕疵异常”泛指：物品外观破损、功能异常或失效、配件部件更换或缺失等情形。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">承运人，指负责物品运输的快递或物流一方。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼小法庭：是闲鱼官方发起的，由闲鱼用户以投票表决形式处理用户违规行为和用户纠纷的判定平台。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第二十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼排查：是指闲鱼根据闲鱼交易模式、交易内容、交易习惯等多种情形进行综合判断。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"><\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第二章 争议受理<\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第一节 受理期限 <\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二十一条 <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">受理期限，在确认收货前或在《闲鱼交易超时说明》超时打款的时限内提出退款申请，闲鱼进行受理。 <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">特别风险提示：个人物品的交易并非商品经营行为，若买方对交易存有争议，应当在交易上述受理期限内向卖方申请退款或要求闲鱼客服介入。一旦交易成功，之后产生的纠纷争议闲鱼将不予受理。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第二节 受理范围 <\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼受理买卖双方在闲鱼上交易产生的争议处理申请，但出现如下情形的争议申请，闲鱼有权不予受理，由买卖双方自行协商或通过其他途径处理：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二十二条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">买卖任一方未在本规范规定的受理期限内申请闲鱼介入的；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二十三条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">交易做退款处理后，因卖方需要取回物品产生争议的；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二十四条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">交易做打款处理后，因买方需要取回物品产生争议的；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二十五条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">买卖双方未在闲鱼上产生交易订单的，或者通过闲鱼指定的支付流程及支付方式以外的其他方式支付交易费用或其他额外费用的；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二十六条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">买卖双方主张交易引发的额外损失或法定赔偿事宜的；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">本条款说明：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼非国家行政或司法机构，对买卖双方主张交易引发的额外损失或法定赔偿事宜无权认定及执行，故买卖双方对该等事宜的主张由买卖双方自行协商或通过其他途径处理。<\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第三章 争议处理<\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第一节 通用规范<\/strong><span style=\"color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第二十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方就交易物品或服务有约定的，优先从约定；未约定或约定不明的，双方可协议补充；无法达成补充协议的，闲鱼将按照本规范进行处理，本规范有特别规定的优先从特别规定。若仍无法确定争议责任归属的，闲鱼将按照交易习惯处理或支持退货退款。支持退货退款的，退货运费由买方承担。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第二十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方将物品交付承运人后买方正常签收前，物品风险由卖方承担。若买方无正当理由拒绝签收物品的，按下述方式处置，双方另有约定的，从其约定。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（一）若物品返回后，卖方应当及时签收物品，交易扣除全部运费后退款买方。卖方怠于或无正当理由拒绝签收的，由其承担物品相关风险； <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（二）若买方无正当理由拒绝签收物品，物品返回后卖方已签收物品的： <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">1.如物品已损毁、灭失、或不适宜发回的（如鲜活易腐类物品），交易支持打款卖方。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">2.如物品特殊情形（特殊情形包括定制类物品、买方无理由拒签退回过程中因物流原因产生损伤的物品等），卖方可选择退款买方或将物品再次发回买方，卖方发回物品产生的所有相关物流、仓储、包装等费用由双方自行协商处理，发回后物品除严重质量问题和描述不符问题外，物品的破损、损毁、灭失风险均由买方自行承担。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">3.如物品非特殊情形且买方拒签退回后完好，则交易支持退款买方处理，来回运费买方承担。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（三）其他特殊情形由闲鱼根据实际情况作出判断及处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第二十九条<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">物品签收后，闲鱼不支持无理由退货、换货，双方另有约定的，从其约定。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">物品因签收时存在破损，致使交易作退货退款处理的，买方将退货物品交付承运人后产生的物品损毁、灭失风险由卖方承担，交易支持退款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">争议过程中，买卖双方应按本规范规定进行举证。本规范未有规定或闲鱼发现双方的交易或一方账号异常的，闲鱼将视双方实际情形作出举证责任分配。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方应自行对证据的真实性、关联性、完整性、准确性和及时性负责，闲鱼将基于普通人的认知，根据该等证据作出纠纷责任的归属认定及纠纷调处的结论。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方主张物品存在表面不一致的，卖方应就收件人已按本规范“签收规范”之规定签收物品承担举证责任；卖方举证有效的，则由买方举证证明物品签收时即存在表面不一致情形。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十四条<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼应买卖双方需求及查明事实需要，必要时将向第三方核实争议问题，并据此作为交易调处的参考依据。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方就交易的物品存在没有约定或约定不明情形的，双方可以协议补充，无法达成补充协议的，闲鱼将按照卖方物品信息表述条款和（或）交易习惯予以确定，若仍无法确定争议责任归属的，交易做退货退款处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方将退货物品交付承运人后，物品的破损、损毁、灭失风险由买方承担，买方有权向承运人求偿。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方主张卖方交付的物品存在描述不符或质量问题情形： <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（一）通过肉眼可识别的，买方需提供凭证（包括但不限于：物品实物图片或视频）予以证明。若买方举证有效，则交易支持退货退款；若买方举证无效，交易支持打款卖方。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（二）通过肉眼不可以识别的，买方应当根据闲鱼要求提供有效的质检证据或其他有效凭证以证明物品存在问题，若买方举证有效，则交易支持退货退款，若买方举证无效，交易支持打款卖方。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">“肉眼可识别”泛指：使用中可以通过肉眼判断的问题，包含但不仅限于颜色不符、尺寸不符等。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">“肉眼不可识别”泛指：使用中无法直接通过肉眼判断的问题，包含但不仅限于材质不符、功能性问题等。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">物品的描述不符系无需使用，肉眼即可显著识别的，若物品完好，交易支持退货退款；若买方已经使用且影响物品完好的，仍以描述不符提起退货退款的，应当自行和卖方协商一致。如无法协商一致，交易支持打款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方应当对所售物品的瑕疵异常及维修记录等进行充分详实的描述及披露。买方应当事先对所购物品的性能、特点等向卖方充分了解。卖方针对上述情形未披露的，交易作退货退款处理。 买方将退货物品交付承运人后，物品的破损风险由卖方承担；物品的损毁、灭失风险由买方承担，买方有权向承运人求偿。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第三十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼认定卖方出售的物品质量问题属实的，交易支持退货退款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">物品因质量问题致使买方交易目的不能实现的，买方将退货物品交付承运人后，物品破损、损毁、灭失的风险由卖方承担，交易支持退款。“致使买方交易目的不能实现”的情形，包括但不限于：功能性故障、材质不符情形。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">物品存在一定瑕疵但尚未影响买方交易目的实现的，买方将退货物品交付承运人后，物品破损的风险由卖方承担，交易支持退款；若物品出现损毁、灭失情形的，交易支持打款，买方有权向承运人求偿。“尚未影响买方交易目的实现”的情形，包括但不限于：标识标签瑕疵情形。  <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">物品因存在问题作退货退款处理的，买方将退货物品交付承运人后产生的物品破损风险由卖方承担，交易支持退款；物品损毁、灭失的风险由买方承担，若物品出现损毁、灭失情形的，交易支持打款，买方有权向承运人求偿。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方在同意退货协议时附有合理条件的，买方退货应符合该条件。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方应对出售涉及保质期的物品事先予以页面明示或征得买方同意，未显著明示或征得买方同意的，买方有权拒签或要求退货。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（一）买方在本规范规定或双方约定的退货时限内退货的，若物品已过期，交易支持退款买方。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（二）卖方发出物品时尚未过期但买方签收物品时已过期的，交易支持退款买方。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方将退货物品交付承运人后，若物品损毁或灭失时未过期，风险由买方承担；若物品损毁或灭失时已过期的，风险由卖方承担。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十四条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">物品如需送往专业机构送检，检测费用由双方自行协商处理。若经买方送检后证实为质量问题，被检物品因检测而被物理破坏导致无法退货或无退货价值的，交易支持退款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方出售假冒物品，买方基于生活消费所需购买的，交易支持退款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">生活消费所需的认定： <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼将依照普通人的认知水准及日常经验判断，或基于概率学和大数据技术，从交易主体、交易信息、交易行为等多个维度进行排查、综合判断买方是否属生活消费所需购买。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方退货前若物品性质已不适宜退货，则作退款处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方达成补充协议但一方否认的，主张协议无效的一方应提供有效证据予以证明，否则应承担相关不利后果。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方表述对对方有重大利害关系的格式条款内容应显著，且不得低于闲鱼社区规范要求，同时不存在免除自身应承担的责任、加重对方责任、排除对方主要权利等内容，否则该条款无效。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">经闲鱼排查，买方或卖方的行为模式或对应账户实际控制人的其他闲鱼账户存在下述异常情形的，闲鱼将综合双方情形及结合交易实际情况作出相关举证责任分配，最终作出纠纷调处的结论。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">1、包含但不限于骗取他人财物、出售假冒商品、扰乱平台秩序（如滥用会员权利、提供虚假凭证）等违规行为的情形； <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">2、其他经闲鱼排查发现的异常情形。 <\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第二节 发货规范 <\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">本规范所称的“发货”，具体按如下情形认定： <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（一）承运人官网系统内有记录时间的，以该时间为准； <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（二）尚不具有系统记录条件的承运人，按其提供承运面单上填写的日期和卖方“点击发货”的日期相较，取晚者。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方对每个独立生成并付款的交易订单应予单独发货，除双方另有约定外，若未征得买方同意，不得合并成一个包裹发货。否则，买方签收后主张物品少件的，由卖方负举证责任。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方超过约定的发货时间或买方申请退款时尚未发货的，卖方应在征得买方同意后再发货。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方应将物品送达至买方订单收货地址并交由收件人本人签收，需买方至指定地点提取的，应事先予以显著明示或征得买方同意。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十四条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方承诺或买卖双方约定采用特定的承运人运送物品的，卖方应按照承诺或约定履行。否则，非包邮订单且买方已签收物品的，可要求卖方退还买方已支付的运费。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方使用运费到付方式发货的，应事先明确承运人和运费事宜，并征得买方同意。买方要求卖方采取到付方式发货的，应自行和卖方明确承运人及运费事宜。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方违反发货规范导致买方未收到物品或拒收物品的，由此产生的相关费用及物品损毁或灭失风险，由卖方自行承担，交易作退款处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方违反“发货规范”，支持买方退货退款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方违反“发货规范”但买方已实际使用物品或点击“确认收货”的，买方以卖方违反发货规范为由而主张退货退款的，应和卖方协商一致，否则闲鱼将不予支持。因卖方的不正当行为诱使买方确认收货的情形除外。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第五十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方发货物品中不得包含物流禁运品的物品（如：易燃易爆物品、管制刀具、电池等），否则由卖方承担物品拒签、签收后无法转运需退回等所产生的运费及物品毁损、灭失的风险。<\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第三节 签收规范<\/strong><span style=\"color: rgb(51, 51, 51); background-color: rgba(0, 0, 0, 0);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方需确保订单中填写的收件信息真实、详细、准确、有效。买方提供的收件信息错误导致未收到物品的，由买方承担该责任限度内的不利后果。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方需变更收件信息中任一要素的，应征得卖方同意。卖方同意后实际未变更成功，物品仍按变更前的收件信息被签收，买方主张未收到物品的，经闲鱼判断若变更前和变更后的收件信息和买方无显著关联的，交易支持退款买方，由卖方承担物品相应风险。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方发货或买方退货后，收件人应亲自签收物品。收件人委托他人签收物品或承运人已按收件人的指示将物品置于指定地点的，视为收件人本人签收。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">收件人应在承运人交付物品时，当场检视物品表面是否一致。若发现物品表面不一致，可予以拍照并拒签，若系卖方发货则支持退款买方；若系买方原因退货，则支持打款卖方，物品相关风险由相对方承担。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十四条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方主张未收到物品或卖方主张未收到买方退货的，由相对方承担举证责任，举证无效的，支持退款买方或打款卖方。 <\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第四节 退货规范 <\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方应对自行填写的默认退货地址确保正确，交易达成退货协议后，若需要指定退货地址或多地址退货的，应征得买方同意。否则，买方可选择按闲鱼社区系统给出的退货地址进行退货，退货后物品无法送达的风险由卖方承担，交易支持退款买方。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方提供的退货地址未经买方同意不得为中国大陆以外地区，同时需和物品页面中显示的发货地一致。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方线下达成退货协议的，买方应在系统规定的退货时间内进行退货。买方因超时未退货，对同一问题或维权原因再次主张要求退货的，应自行和卖方协商一致，否则，闲鱼有权不予处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方退货时应采用与卖方发货时相同类型的承运人进行退货。  <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方根据本规范退货后，应及时在闲鱼社区系统内填写承运单号或告知卖方，若卖方签收物品时买方仍未获知该承运单号，卖方主张表面不一致情形的，将由闲鱼根据实际情况分配举证责任。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方使用到付方式退货或卖方要求买方使用到付方式退货的，应事先征得对方同意，并自行和对方明确承运人和运费事宜。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方违反“退货规范”致使卖方未收到退货或拒签的，交易支持打款，由买方承担物品损毁或灭失的风险。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"><\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第五节 运费规范<\/strong><span style=\"color: rgb(51, 51, 51); background-color: rgba(0, 0, 0, 0);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">运费争议：交易作退货退款处理时，由卖方承担发货运费，买方承担退货运费（确属卖方责任的除外），若双方另有约定，从其约定。闲鱼介入后，应承担运费一方未能履行的，闲鱼将根据实际情况作出违背交易约定处置。  <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方未经买方同意采取到付方式发货的，买方可选择拒签或签收后要求卖方承担到付产生的运费。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十四条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方未经卖方同意采取到付方式退货且卖方予以签收物品的，若退货运费本由买方承担的，则该到付产生的运费由买方承担。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">交易由买方承担退货运费时，若卖方提供的退货地址和物品页面中显示的发货地不一致，导致买方退货的运费高于按该发货地进行退货的运费，其差额由卖方承担。 <\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第六节 当面交易处理规范 <\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方采用当面交付物品的方式进行交易的，应当自行承担因此产生的风险。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">因买方未收到货产生的争议，交易做退款处理，但卖方可以证明买方自认收到物品的除外。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">因物品表面不一致产生的争议，交易做打款处理，但买方可以证明卖方自认物品存在表面不一致的除外。 <\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七节 定金交易处理规范 <\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第七十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">需要买方预先支付部分款项的交易，买卖双方应当具体约定该部分款项的支付和返还条件。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">仅以“定金”、“订金”、“预付款”等字样进行描述，但未明确约定具体支付和返还条件的，相应争议按照本规范第三章的规定处理。 <\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第八节 定制交易处理规范<\/strong><span style=\"color: rgb(51, 51, 51); background-color: rgba(0, 0, 0, 0);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">定制物品是指卖方通过生产加工、裁剪制作等方式，最终向买方交付包含有买方指定个性化需求信息素材（如图案、文字、印记、配件、尺寸等）并区别于标准化、规模化生产的实物物品。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方进行定制物品交易的，应当对定制物品的交付标准（如数量、规格尺寸、图案、材质、工艺）、交付或发货时间、运费承担、违约责任等进行明确约定。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">因买卖双方其他未约定或约定不清事项导致的损失由买卖双方分担，具体比例由闲鱼按照双方过错程度判定。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">定制物品发货时间界满前且卖方尚未定制完成，买方无理由申请退款的，若对卖方造成损失的，应当赔偿损失，但最高不超过交易订单金额。 本条款说明（以下提及的“卖方损失”均同）： <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（一）卖方对其损失负举证责任。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（二）闲鱼将以普通大众的认知水准及日常经验对卖方提供的相关损失证据进行判断及认定。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十四条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">定制物品发货时间界满前但卖方已完成定制物品的，买方无正当理由申请退款的，需和卖方协商一致，否则卖方有权拒绝买方的退款申请。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方定制物品发货后，买方无正当理由拒签或退回定制物品的，卖方未予签收的，交易支持打款卖方，物品由买方自行负责召回并承担由此产生的相关费用，以及承担因无理由拒签或退回的物品风险；卖方已签收的，除买方明确表示拒绝接受该定制物品的，交易支持打款卖方外，卖方仍有义务再次向买方发还该物品，发货运费由买方承担。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方应在物品详情页面显著说明或者与买方约定完成定制物品生产需要买方提供的个性化信息素材以及提供期限，如因卖方未尽告知义务或约定不清产生争议的，由卖方承担相关不利后果。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方应按照约定及时、完整、准确的提供定制相关的个性化信息素材，如买方逾期提供，则定制物品交付期限相应顺延。经卖方催告后买方仍怠于提供的，卖方有权终止履行，交易做退款处理。卖方为履行合同交易已作出必要准备而产生的损失，买方应予赔偿，但最高不超过订单金额。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方变更定制需求的，应与卖方就需求变更后定制物品的价款、交付时间和交付标准达成新的约定，否则卖方有权中止履行定制合同交易。卖方中止履行合同交易后，应向买方确认是否继续履行原定制合同交易，买方拒绝或怠于确认的，卖方有权终止履行合同交易，交易做退款处理，对卖方造成损失的，应予赔偿损失，但最高不超过交易订单金额。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方定制物品逾期发货的，闲鱼介入时卖方实际已发货，买方应签收物品，交易支持打款卖方。买卖双方另有约定的，按约定执行。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼介入时卖方实际未发货，经催告后的72小时内仍未有发货的，交易作退款处理，若卖方在该72小时外发货的，发货前应当和买方协商一致，否则买方有权拒绝签收。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方逾期发货行为导致买方交易目的无法实现的，买方有权拒绝签收物品。<\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第九节 海外交易处理规范<\/strong><strong style=\"color: rgb(51, 51, 51); background-color: rgba(0, 0, 0, 0);\"> <\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第八十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">本规范所称海外，系指买卖双方依据订单及相关约定，买卖双方一方在境外的交易。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方在买方申请退款时尚未发货的，卖方应在征得买方同意后再发货。若卖方未征得买方同意仍继续发货，导致买方未收到物品或拒收物品的，由此产生的相关费用及物品损毁或灭失风险，由卖方自行承担，交易作退款处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方需确保所售物品符合物品出境的相关法律法规，买方需确保所购物品符合物品入境的相关法律法规。若物品因违反出境相关法律法规导致被监管部门（如海关）没收、扣押或采取其他强制措施的，相应出境风险由卖方承担，若物品因违反入境相关法律法规导致被监管部门（如海关）没收、扣押或采取其他强制措施的，相应入境风险由买方承担。  <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">办理通关出入境手续需要买方或卖方合理的协助配合，相对方应提供相关协助。若一方怠于或拒绝提供协助导致物品无法办理通关手续的，由此可能产生的通关滞货费用（如额外运费、相应仓储、保管费等）及物品灭失风险均由该责任方承担。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方应确保按订单载明及双方约定的内容按时、按质、按量交付物品。因卖方责任产生退货的，当买方提供无法退货的凭证（如被海关扣押等）或客观上退货存障的，卖方应主动向买方提供协商处理的方案。协商不成的，闲鱼有权根据买方合理诉求进行处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十四条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">非卖方责任产生退货的，由买方承担退货风险。<\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/strong><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十节 生鲜类物品处理规范 <\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">本规范所称的生鲜类物品是指物品包含但不仅限于新鲜水产/新鲜蔬果/活体等物品。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">生鲜类物品，买方无正当理由拒绝签收的，导致生鲜类物品出现损伤、变质、腐烂等死亡情形的，相关运费及物品相应风险由买方承担。买卖双方另有约定的，从其约定； <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">生鲜类物品存在腐烂、重量短缺、大小不符三类情形的，作如下处置： <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">生鲜类物品存在大小不符或腐烂情形或重量短缺的，其数量占物品总量百分之十及以内的，按照支付金额的百分之十进行部分退款；其数量占物品总量百分之十至百分之五十以内的，按照支付金额的百分之五十进行退款；其数量占物品总量百分之五十及以上，作全额退款处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">生鲜类物品存在上述情形，且情节严重的，闲鱼将视物品实际情形作出退货退款或退款处理。 情节严重系指：<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（一）物品大小不符、重量短缺及腐烂三类情形两两并存的； <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（二）卖方历史销售记录内大量存在上述物品责任情形的。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">【特殊举证时效】活体类物品买方主张变质、死亡等情形的，需在收到物品当天24点前拍照并上传举证。非活体类物品（不含需催熟类水果）买方主张变质、腐烂情形的，需在收到物品之时起24小时内拍照并上传举证。需催熟类水果在正常催熟期内，买方主张出现腐烂、变质等情形的，应当及时拍照并上传举证。若该物品的物理性状极易受时间、环境等客观因素影响而发生质变，买方逾期举证的，闲鱼不予采信。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">收到物品的时间以快递公司系统内记录签收时间为准。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> 买卖双方对举证时间、方式另有约定的，从其约定。 <\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第十一节 服务类交易处理规范<\/strong><span style=\"color: rgb(51, 51, 51); background-color: rgba(0, 0, 0, 0);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第九十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">本规范所称的服务类交易，系指由卖方向买方提供服务或买方委托卖方处理对应事务的交易。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">服务订单交付时间届满前，卖方已产生实质服务行为的，或卖方依约已完成服务的，买方要求退款或拒绝接受服务的，需与卖方协商一致。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">维修服务类交易，卖方应当自签收买方寄修物品次日起30天内完成修理并交付物流（以物流官网所载明的揽收记录时间为准）回寄，回寄的邮费由买方承担，双方另有约定的从其约定。 维修更换零配件后，被更换的故障配件由双方自行协商处置，闲鱼不再受理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买卖双方通过线下完成服务成果交付的，卖方需对交付服务的凭证予以留存并妥善保管，否则由卖方承担交易不利后果。  <\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十二节 直播交易处理规范<\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零三条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方或主播与买方就交易物品或服务有约定的，优先从约定；未约定或约定不明的，双方可协议补充；无法达成补充协议的，闲鱼将按照本规范进行处理，本规范有特别规定的优先从特别规定。若仍无法确定争议责任归属的，闲鱼将按照交易习惯处理或支持退货退款，支持退货退款的。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零四条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">直播交易发生的争议，经闲鱼认定属于卖方或主播责任的，由卖方先行承担履约、协商、举证、退款、运费等责任。若是因主播违反平台要求或跟卖方的约定导致的争议，卖方向买方承担责任后可向主播/机构等追偿。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">因直播交易发生的争议，经闲鱼认定需查看直播回放的，应由卖方承担相应的举证责任，包括但不限于直播视频回放链接、直播时间等。如卖方提供无效的直播回放或未能提供直播回放的，交易支持退货退款。  <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">主播在直播过程中应当如实描述物品信息。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（一）若因实物与主播描述不一致引发争议的，闲鱼将依据本规范第三章第一节进行处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（二）若因主播夸大宣传使用效果引发争议的，交易支持退货退款，不考虑是否影响完好。如物品不适宜退货或无退货价值，交易支持退款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">（三）物品有瑕疵的，主播应当在直播过程中进行展示和口播提醒。若因主播未展示瑕疵和口播提醒引发争议的，交易支持退货退款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">主播应当按照卖方物品详情页的描述或与卖方约定的承诺进行直播，若主播在直播间的描述或承诺与卖方的描述或承诺不一致时，以有利于买方的描述或承诺为准。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">主播在直播过程中的承诺（如赠品、优惠活动等）未履行的，卖方应履行相应承诺或与买方协商一致，否则交易支持退货退款。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百零九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方将同品类物品聚合为一个物品发布（如专拍链接）的，除须符合平台相关发布要求，主播还应在直播过程中口播描述清楚关键属性。若因物品不符合发布要求或关键属性描述不清引发争议的，交易支持退货退款。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第十三节 禁售物品处理规范 <\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百一十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">禁售物品，是指国家法律法规规定或闲鱼自身管理要求禁止发布及出售的物品。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百一十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">买方主张物品或服务为禁售的，闲鱼将根据交易模式、交易内容、交易习惯等多种情形综合判断后作出举证责任分配，或依据前述情形直接予以认定禁售行为属实。 <\/span><\/p><p><s
