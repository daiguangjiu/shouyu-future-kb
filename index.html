条不同话术的动态，分别发布至不同鱼塘，每条间隔 ≥ 15 分钟。 圈子动态配图用商品实拍图，正文通常不写售价，只描述成色或征询意见（如「刚淘到一台 XX，成色惊喜，想听听老哥们怎么看」）。 发布后 2 小时内回复至少 3 条圈子内其他用户的评论，连续 3 天保持互动可提升账号权重。 玩法2：创意内容霸屏法 操作 ：在「会玩」板块（圈子 + 广场）发布原创创意帖，争取首页推荐，获取百万级曝光。 技巧 ： 内容方向：使用教程、经验分享、开箱测评、避坑指南等 有价值 的内容，而非硬广。 标题 前 15 字权重最高 ，需包含品牌词、属性词、场景词、长尾词及城市标签。 上传 9–12 秒功能演示短视频，系统识别为高价值内容并给予额外推荐权重。 带上平台热门话题标签（如 #二手好物），蹭话题流量池——这是成本最低的固定蹭曝光动作。 玩法3：垂直圈层深耕法 操作 ：选择一个垂直领域（如宠物用品、数码配件、汉服洛丽塔等），持续在对应圈子内输出内容，建立专业人设。 技巧 ： 账号标签要纯——系统基于 兴趣标签 而非关键词匹配推荐，标签越纯，精准流量转化率越高。 在圈子内对同类优质笔记做真实评论和点赞，提升账号在该圈层的权重。 粉丝沉淀：设置「粉丝专享价」引导关注，定期发布粉丝专属内容，提升复购率并享受评价分加成。 玩法4：同城流量截流法 操作 ：关闭定位，手动选择一二线城市发布，利用本地流量权重获取精准买家。 技巧 ： 适合同城配送 / 自提的商品（如室内绿植、二手品牌家具、宠物用品等）效果最佳。 结合时间节点（毕业季 4–6 月、年底离城潮、购物节后）蹲点高校或大城市低价扫货。 玩法5：AI 工具辅助法 操作 ：使用闲鱼 AI 相机拍照自动识别物品、估价并生成文案；使用 AI 智能定价，基于近 3 个月成交数据给出建议价。 技巧 ： 「AI 帮聊」可自动回复常见问题及智能议价，提升回复率与权重。 「闲鱼空间」可拍摄全景照批量识别物品并估价发布，大幅提升上架效率。 7.4.3 2026年重点合规红线（圈子场景高频踩坑） ① 站外引流：专项治理零容忍 2026 年 4 月 20 日起启动「站外引流信息专项治理」，AI 智能风控支持 文字、图片 OCR、语音转文字、符号乱码、数字拆分、谐音暗语 的全形式秒级实时识别。 违规判定覆盖群聊、商品详情、评论区、聊天消息、图片、语音、自动回复等 全场景 。 处罚 ：首次违规禁言 7 天并下架全店商品，二次违规账号永久受限。圈子内容、圈子评论同样在监测范围内。 ⚠️ 特别注意：卖家在自动回复或圈子帖里放站外文档链接（如腾讯文档），同样会被判定「引导站外交易」。 2026-09-23 官方口径补充 ：在一对一私聊中 发送其他平台二维码 同属被识别并处置的引流行为——平台会处置相关商品与账号，并将该商家、二维码与聊天记录 举报至第三方平台 由其跟进（详见 15.6 ④）。结论：站内表述干净不等于安全，联系方式只走本节 ② 的官方通道。 ② 官方合规通道：可用，但必须按要求用 （2026 年新变化，重要） 闲鱼已上线【发送站外信息】官方功能（部分资料称「线索通」「留资卡」）：在聊天中通过官方通道发送手机号、微信号，用于交易交付、代拍下单、售后服务等场景， 不再等于站外引流违规 。 开通入口（三选一） ：① 发布宝贝页底部弹窗模块；② 聊天会话中系统自动弹出的开通引导卡片；③ 聊天输入框旁「+」→「发送站外信息」。 使用规则 ：每类信息最多保存 5 条，同一账号下所有宝贝共用一套信息；买家需点击「确认查看」才能看到内容，卖家会收到「买家已查看」提醒；查看记录会沉淀到「客资管理」，同一买家多条记录自动合并。 限制 ：有类目与账号条件限制（没看到入口＝未开放到该账号）；内容需通过安全校验； 发送过于频繁会被限流 。 ✅ 执行口径：需要留联系方式时 只走官方通道 ，禁止再用谐音、拼音、emoji、图片藏号、语音绕过等土办法——这些正是风控重点打击对象。 ③ 经营性卖家认定 现行依据是 2026 年 6 月 1 日生效的《闲鱼社区经营性行为界定与管理规范》，认定口径见本手册 15.2 节（五条量化红线 + 经营性话术特征） 。 ⚠️ 网络流传的「月成交额超 1 万元或月成交超 50 单满足其一即认定」「连续 90 天有成交即认定」「认定后需缴纳 1000–5000 元保证金」等说法，均无官方条款依据 。保证金口径以 15.3 节及商品发布页实际提示为准（开通七天无理由退货为 500 元）。 ④ 禁售品类与敏感词 / 暗语 严禁：高仿 / 复刻 / 原单 / A货 / 水货；药品、保健品、医疗器械；烟草、电子烟；活体动物；虚拟资源（游戏账号、课程资源、网盘链接、激活码等）。 暗语识别已升级：「学习资料」「邮箱盲盒」「游戏CDK」「Steam家教」「虚拟恋人」「树洞」等违规服务或擦边球暗示均会被识别。 「学生自用」「女生自用」「懂的来」等表述易被系统标记为低信任度内容导致流量降权（此为行业经验口径，非官方条文，谨慎参考，建议改用可验证的真实描述）。 ⑤ 色情低俗与擦边引流：本年度力度最大的一轮治理（2026-09-18 起） 2026 年 9 月 18 日闲鱼发布《关于持续严打色情引流的公告》，年内累计处置该类风险账号 98358 个、警企联动打掉色情团伙 15 个； 识别即永久封禁、无解封通道 。 圈子场景的高危动作：昵称 / 头像 / 个人简介使用暧昧词汇或暗示性配图；圈子帖与评论用「同城可约」「懂的私」「私聊详谈」等模糊话术；用正常商品名、数字或符号组合充当暗号引流。官方已明确将 借昵称、头像变相引流的隐蔽账号 列为人工巡查重点。 完整的三类打击场景、治理机制与举报入口见 15.6 ④ 色情引流专项治理 ；色情类高危词与伪装式暗号清单见 12.3 。 7.4.4 曝光影响要素对照（圈子特有 vs 全店通用） 因素 归属 说明 圈子互动质量 圈子特有 帖子互动率（回复速度、评论数、涨粉）是圈层权重的主要来源，日常频次见 7.3.5，具体动作见玩法1 内容形态 圈子特有 9–12 秒功能演示短视频 + 真实实拍图被识别为高价值内容，额外加权 账号兴趣标签 圈子特有 标签越纯，圈内推荐越精准；「百货商店」式账号标签会被打散 「我想要」人数 全店通用 核心排名信号，人数越多排名越靠前（详见 7.1） 留言 / 评价 全店通用 好评型、问答型、晒图型留言提高转化与排名（详见 7.3.1） 芝麻信用 全店通用 芝麻分 600–650 良好、650–700 优秀、700 以上「极好」；开通鱼小铺与投放开户门槛为 ≥600（详见 7.3） 每日擦亮 全店通用 高峰时段 9:30–10:30、15:00–16:00、20:00–22:00（详见 7.1） 回复速度 全店通用 30 分钟内秒回以获取系统推流，长时间不回会被降权限流（详见 7.1） 账号活跃度 全店通用 每日更新 1–3 款商品，单日超 5 款易被判营销号（详见 7.3.5） 7.4.5 2026年圈子运营建议 新手起步 ：前 3 天模拟真实用户行为（浏览、点赞、收藏），完善实名认证与芝麻信用；可先买便宜货、在他人商品下互动养号，再开始内容输出。 垂直深耕 ：不要做「百货商店」。选一个自己能搞定货源、自己也懂的领域持续深耕，圈子标签纯，推荐才精准。 合规第一 ：假货、仿款一公分都别碰，一次封号满盘皆输；联系方式只走官方【发送站外信息】通道。 数据运营 ：借助运营提效包分析商品热度与用户需求，用「哪个圈子带来的曝光 / 咨询 / 成交更多」来优化内容布局，而不是凭感觉发帖。 节奏红线 ：同步鱼塘数量上限、多条动态间隔、单日上新上限等硬性边界见 7.4.1 内容规范与 7.4.4 表。 📌 落地顺序建议：先按 7.3.4 把圈子纳入每日 / 每周权重任务 → 再用本节五大玩法做内容分发 → 最后按 7.4.3 做合规自检（站外引流 / 禁售品类 / 敏感词 / 色情低俗与擦边）。圈子是「慢流量」，靠持续输出积累信任，切忌一天猛发几十条。","toc":[{"id":"sec-31","title":"7.1 自然流量获取策略"},{"id":"sec-32","title":"7.2 超级擦亮投放指南（大鱼动力）"},{"id":"sec-33","title":"7.3 成长权重体系：等级·闲气值·闲鱼币·鱼塘圈子"},{"id":"sec-92","title":"7.4 闲鱼圈子（社区）规则与玩法全攻略（2026版）"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":16,"imgs":0,"words":10350,"sections":4,"subs":25,"version":"V2026.10.12"},"related":["a498458897921413","sec-86","sec-2","sec-11"]}]},{"module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"高级流量与规模扩张","color":"blue","count":3,"items":[{"id":"sec-43","kind":"chapter","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"高级流量与规模扩张","title":"⭐ 第九章 闲鱼值得买规则与运营","title_raw":"⭐ 第九章 闲鱼值得买规则与运营","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-44\">9.1 什么是「闲鱼值得买」？<\/h3><p>「闲鱼值得买」是闲鱼平台推出的官方精选推荐频道，为优质商品提供亿级流量曝光扶持。入选「值得买」的商品将获得平台专属推荐位、搜索加权、频道内展示等多项流量权益。该频道于2024年底上线，是鱼小铺卖家的核心流量增长渠道之一。<\/p>\n<h3 id=\"sec-45\">9.2 值得买的流量价值<\/h3><table>\n<thead>\n<tr>\n<th>流量权益<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>专属频道展示<\/td>\n<td>在闲鱼APP「值得买」频道内获得推荐位展示<\/td>\n<\/tr>\n<tr>\n<td>搜索加权<\/td>\n<td>入选商品在搜索结果中获得更高排名<\/td>\n<\/tr>\n<tr>\n<td>首页推荐<\/td>\n<td>有机会进入闲鱼首页「猜你喜欢」等高曝光位置<\/td>\n<\/tr>\n<tr>\n<td>活动优先权<\/td>\n<td>平台大促、主题活动优先参与资格<\/td>\n<\/tr>\n<tr>\n<td>标签展示<\/td>\n<td>商品详情页展示「值得买」认证标签，提升转化率<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>核心认知：「值得买」不是付费推广，是平台基于商品质量+价格力的免费精选推荐。入选后的流量是平台额外给予的，不需要额外付费。但入选标准高，需要主动经营。<\/p>\n<h3 id=\"sec-46\">9.3 入选条件与标准<\/h3><h4>账号层面要求<\/h4>\n<table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>具体要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鱼小铺状态<\/td>\n<td>必须已开通鱼小铺，且状态正常<\/td>\n<\/tr>\n<tr>\n<td>信用评级<\/td>\n<td>卖家信用评级达到B级及以上（2026年新体系）<\/td>\n<\/tr>\n<tr>\n<td>违规记录<\/td>\n<td>近90天无违规扣分记录<\/td>\n<\/tr>\n<tr>\n<td>交易表现<\/td>\n<td>近30天交易成功率≥95%，响应率≥90%<\/td>\n<\/tr>\n<tr>\n<td>退货率<\/td>\n<td>近30天退货率＜5%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>商品层面要求<\/h4>\n<table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>具体要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>价格力<\/td>\n<td>商品价格低于或等于同款全网均价（平台自动比价）<\/td>\n<\/tr>\n<tr>\n<td>商品质量<\/td>\n<td>描述清晰准确、主图优质、无虚假宣传<\/td>\n<\/tr>\n<tr>\n<td>库存保障<\/td>\n<td>有实际库存，非空挂/代发虚假库存<\/td>\n<\/tr>\n<tr>\n<td>类目合规<\/td>\n<td>商品归属类目正确，非禁售/限制品类<\/td>\n<\/tr>\n<tr>\n<td>成交数据<\/td>\n<td>商品有稳定成交记录（建议至少3笔以上真实成交）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-47\">9.4 如何开通「值得买」<\/h3>\n<ol>\n<li>确保基础达标：确认鱼小铺已开通、信用评级B级以上、近90天无违规。<\/li>\n<li>进入申请入口：闲鱼APP → 我的 → 卖家中心 → 鱼小铺 → 「值得买」频道 → 点击「申请开通」。<\/li>\n<li>选择提报商品：从在售商品中选择符合价格力和质量要求的商品提交审核。<\/li>\n<li>等待平台审核：审核周期通常为1-3个工作日，审核结果通过站内信通知。<\/li>\n<li>审核通过后运营：入选商品获得「值得买」标签和流量加权，持续维护商品数据。\n提示：如果申请入口不可见，说明账号暂不满足基础条件。优先提升信用评级、降低退货率、积累成交数据后再申请。<\/li>\n<\/ol>\n<h3 id=\"sec-48\">9.5 商家运营策略：如何持续获得值得买流量<\/h3><h4>策略一：价格力是核心门槛<\/h4>\n<ul>\n<li>定期对比同款商品的全网售价，保持价格竞争力<\/li>\n<li>不要盲目降价——结合优惠券、满减、赠品等组合提升「感知性价比」<\/li>\n<li>新品上架时可以适当让利，快速积累成交后申请值得买<\/li>\n<\/ul>\n<h4>策略二：商品质量是长期通行证<\/h4>\n<ul>\n<li>主图使用实拍图，避免过度PS（平台会检测图片真实性）<\/li>\n<li>描述中明确标注成色、瑕疵、规格参数，减少退货纠纷<\/li>\n<li>保持好评率≥98%，差评会影响整个店铺的值得买资格<\/li>\n<\/ul>\n<h4>策略三：数据维护是持续保障<\/h4>\n<table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th>维护目标<\/th>\n<th>维护方法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>响应率<\/td>\n<td>≥95%<\/td>\n<td>开启自动回复，30分钟内响应所有咨询<\/td>\n<\/tr>\n<tr>\n<td>交易成功率<\/td>\n<td>≥95%<\/td>\n<td>不无故关闭订单，库存不足及时下架<\/td>\n<\/tr>\n<tr>\n<td>退货率<\/td>\n<td>＜5%<\/td>\n<td>发货前检查商品质量，描述与实物一致<\/td>\n<\/tr>\n<tr>\n<td>好评率<\/td>\n<td>≥98%<\/td>\n<td>主动跟进售后，问题商品及时处理<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>策略四：商品汰换机制<\/h4>\n<ul>\n<li>入选值得买的商品如果数据下滑（转化率降低、退货率上升），及时替换<\/li>\n<li>保持值得买频道内有3-5个活跃商品，形成稳定流量池<\/li>\n<li>新品先在普通渠道验证数据（成交≥3笔、转化率≥3%），再申请值得买<\/li>\n<\/ul>\n<h4>策略五：矩阵联动放大流量<\/h4>\n<ul>\n<li>核心账号的值得买商品作为「流量锚点」，带动店铺其他商品曝光<\/li>\n<li>值得买商品详情页中嵌入店铺其他商品的推荐链接<\/li>\n<li>同一商品在不同矩阵账号中差异化定价，选择数据最好的账号申请值得买<\/li>\n<\/ul>\n<h3 id=\"sec-49\">9.6 值得买与无忧卖的协同策略<\/h3><table>\n<thead>\n<tr>\n<th>场景<\/th>\n<th>推荐方案<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>高利润标品<\/td>\n<td>值得买获取流量 + 无忧卖AI托管运营，双重加持<\/td>\n<\/tr>\n<tr>\n<td>价格敏感品<\/td>\n<td>先以低价入选值得买获取流量，稳定后适度提价<\/td>\n<\/tr>\n<tr>\n<td>新品测试<\/td>\n<td>先自主运营养数据，入选值得买后再考虑是否开通无忧卖<\/td>\n<\/tr>\n<tr>\n<td>库存清仓<\/td>\n<td>开通无忧卖短期（3天/10%）快速出清，不值得申请值得买<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-50\">9.7 常见问题与避坑指南<\/h3><table>\n<thead>\n<tr>\n<th>问题<\/th>\n<th>解答<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Q: 值得买需要付费吗？<\/td>\n<td>不需要。值得买是免费精选推荐，非付费推广产品。<\/td>\n<\/tr>\n<tr>\n<td>Q: 入选后可以修改商品信息吗？<\/td>\n<td>可以修改，但大幅修改（尤其是价格上调）可能导致被移出值得买。<\/td>\n<\/tr>\n<tr>\n<td>Q: 多久审核一次？<\/td>\n<td>提交申请后1-3个工作日审核。已入选商品平台会定期复检。<\/td>\n<\/tr>\n<tr>\n<td>Q: 可以提交多少个商品？<\/td>\n<td>根据账号等级不同，通常可同时有5-20个商品在值得买频道。<\/td>\n<\/tr>\n<tr>\n<td>Q: 被移出值得买后还能再申请吗？<\/td>\n<td>可以。分析被移除原因、整改后重新申请。建议间隔至少7天。<\/td>\n<\/tr>\n<tr>\n<td>Q: 虚拟商品可以申请吗？<\/td>\n<td>目前值得买主要面向实物商品，虚拟商品入选难度较大。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ 避坑提醒：<\/p>\n<p>• 不要为了入选值得买而恶意低价（低于成本价），平台会检测异常定价<\/p>\n<p>• 入选后不要大幅提价，会导致被移出且影响后续申请<\/p>\n<p>• 值得买流量是「锦上添花」，不是「雪中送炭」——商品本身质量是基础<\/p>\n<p>• 不要同时用多个账号对同一商品申请值得买，可能被判定为操纵流量<\/p>\n<h3 id=\"sec-51\">9.8 值得买运营节奏建议<\/h3><table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>时间<\/th>\n<th>核心动作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>准备期<\/td>\n<td>第1-2周<\/td>\n<td>提升账号信用评级至B级以上，降低退货率至5%以下，优化商品主图和描述<\/td>\n<\/tr>\n<tr>\n<td>申请期<\/td>\n<td>第3周<\/td>\n<td>选择3-5个数据最好的商品提交值得买申请<\/td>\n<\/tr>\n<tr>\n<td>爬坡期<\/td>\n<td>第4-6周<\/td>\n<td>入选后密切监控转化率、退货率，保持响应速度，积累好评<\/td>\n<\/tr>\n<tr>\n<td>稳定期<\/td>\n<td>第7周起<\/td>\n<td>持续维护核心指标，定期汰换表现差的商品，保持3-5个活跃值得买商品<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 9.1 什么是「闲鱼值得买」？ 「闲鱼值得买」是闲鱼平台推出的官方精选推荐频道，为优质商品提供亿级流量曝光扶持。入选「值得买」的商品将获得平台专属推荐位、搜索加权、频道内展示等多项流量权益。该频道于2024年底上线，是鱼小铺卖家的核心流量增长渠道之一。 9.2 值得买的流量价值 流量权益 说明 专属频道展示 在闲鱼APP「值得买」频道内获得推荐位展示 搜索加权 入选商品在搜索结果中获得更高排名 首页推荐 有机会进入闲鱼首页「猜你喜欢」等高曝光位置 活动优先权 平台大促、主题活动优先参与资格 标签展示 商品详情页展示「值得买」认证标签，提升转化率 核心认知：「值得买」不是付费推广，是平台基于商品质量+价格力的免费精选推荐。入选后的流量是平台额外给予的，不需要额外付费。但入选标准高，需要主动经营。 9.3 入选条件与标准 账号层面要求 条件 具体要求 鱼小铺状态 必须已开通鱼小铺，且状态正常 信用评级 卖家信用评级达到B级及以上（2026年新体系） 违规记录 近90天无违规扣分记录 交易表现 近30天交易成功率≥95%，响应率≥90% 退货率 近30天退货率＜5% 商品层面要求 条件 具体要求 价格力 商品价格低于或等于同款全网均价（平台自动比价） 商品质量 描述清晰准确、主图优质、无虚假宣传 库存保障 有实际库存，非空挂/代发虚假库存 类目合规 商品归属类目正确，非禁售/限制品类 成交数据 商品有稳定成交记录（建议至少3笔以上真实成交） 9.4 如何开通「值得买」 确保基础达标：确认鱼小铺已开通、信用评级B级以上、近90天无违规。 进入申请入口：闲鱼APP → 我的 → 卖家中心 → 鱼小铺 → 「值得买」频道 → 点击「申请开通」。 选择提报商品：从在售商品中选择符合价格力和质量要求的商品提交审核。 等待平台审核：审核周期通常为1-3个工作日，审核结果通过站内信通知。 审核通过后运营：入选商品获得「值得买」标签和流量加权，持续维护商品数据。 提示：如果申请入口不可见，说明账号暂不满足基础条件。优先提升信用评级、降低退货率、积累成交数据后再申请。 9.5 商家运营策略：如何持续获得值得买流量 策略一：价格力是核心门槛 定期对比同款商品的全网售价，保持价格竞争力 不要盲目降价——结合优惠券、满减、赠品等组合提升「感知性价比」 新品上架时可以适当让利，快速积累成交后申请值得买 策略二：商品质量是长期通行证 主图使用实拍图，避免过度PS（平台会检测图片真实性） 描述中明确标注成色、瑕疵、规格参数，减少退货纠纷 保持好评率≥98%，差评会影响整个店铺的值得买资格 策略三：数据维护是持续保障 指标 维护目标 维护方法 响应率 ≥95% 开启自动回复，30分钟内响应所有咨询 交易成功率 ≥95% 不无故关闭订单，库存不足及时下架 退货率 ＜5% 发货前检查商品质量，描述与实物一致 好评率 ≥98% 主动跟进售后，问题商品及时处理 策略四：商品汰换机制 入选值得买的商品如果数据下滑（转化率降低、退货率上升），及时替换 保持值得买频道内有3-5个活跃商品，形成稳定流量池 新品先在普通渠道验证数据（成交≥3笔、转化率≥3%），再申请值得买 策略五：矩阵联动放大流量 核心账号的值得买商品作为「流量锚点」，带动店铺其他商品曝光 值得买商品详情页中嵌入店铺其他商品的推荐链接 同一商品在不同矩阵账号中差异化定价，选择数据最好的账号申请值得买 9.6 值得买与无忧卖的协同策略 场景 推荐方案 高利润标品 值得买获取流量 + 无忧卖AI托管运营，双重加持 价格敏感品 先以低价入选值得买获取流量，稳定后适度提价 新品测试 先自主运营养数据，入选值得买后再考虑是否开通无忧卖 库存清仓 开通无忧卖短期（3天/10%）快速出清，不值得申请值得买 9.7 常见问题与避坑指南 问题 解答 Q: 值得买需要付费吗？ 不需要。值得买是免费精选推荐，非付费推广产品。 Q: 入选后可以修改商品信息吗？ 可以修改，但大幅修改（尤其是价格上调）可能导致被移出值得买。 Q: 多久审核一次？ 提交申请后1-3个工作日审核。已入选商品平台会定期复检。 Q: 可以提交多少个商品？ 根据账号等级不同，通常可同时有5-20个商品在值得买频道。 Q: 被移出值得买后还能再申请吗？ 可以。分析被移除原因、整改后重新申请。建议间隔至少7天。 Q: 虚拟商品可以申请吗？ 目前值得买主要面向实物商品，虚拟商品入选难度较大。 ⚠️ 避坑提醒： • 不要为了入选值得买而恶意低价（低于成本价），平台会检测异常定价 • 入选后不要大幅提价，会导致被移出且影响后续申请 • 值得买流量是「锦上添花」，不是「雪中送炭」——商品本身质量是基础 • 不要同时用多个账号对同一商品申请值得买，可能被判定为操纵流量 9.8 值得买运营节奏建议 阶段 时间 核心动作 准备期 第1-2周 提升账号信用评级至B级以上，降低退货率至5%以下，优化商品主图和描述 申请期 第3周 选择3-5个数据最好的商品提交值得买申请 爬坡期 第4-6周 入选后密切监控转化率、退货率，保持响应速度，积累好评 稳定期 第7周起 持续维护核心指标，定期汰换表现差的商品，保持3-5个活跃值得买商品","toc":[{"id":"sec-44","title":"9.1 什么是「闲鱼值得买」？"},{"id":"sec-45","title":"9.2 值得买的流量价值"},{"id":"sec-46","title":"9.3 入选条件与标准"},{"id":"sec-47","title":"9.4 如何开通「值得买」"},{"id":"sec-48","title":"9.5 商家运营策略：如何持续获得值得买流量"},{"id":"sec-49","title":"9.6 值得买与无忧卖的协同策略"},{"id":"sec-50","title":"9.7 常见问题与避坑指南"},{"id":"sec-51","title":"9.8 值得买运营节奏建议"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":7,"imgs":0,"words":2262,"sections":8,"subs":7,"version":"V2026.10.12"},"related":["a498458897921413","sec-2","sec-34","sec-30"]},{"id":"sec-34","kind":"chapter","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"高级流量与规模扩张","title":"第八章 托管无忧卖规则与运营","title_raw":"第八章 托管无忧卖规则与运营","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-35\">8.1 什么是托管无忧卖？<\/h3><p>闲鱼「无忧卖」是平台面向经营型卖家推出的 <strong>AI 全托管运营服务<\/strong>：不成交不收费，按成交额抽佣。卖家提供商品和底价，平台 AI 接管客服、定价、商品优化等运营环节。该服务 2026 年 6 月 9 日全量推出，<strong>2026 年 7 月 1 日起升级为全托管模式<\/strong>，权限与责任机制发生重大变化。<\/p>\n<h3 id=\"sec-36\">8.2 无忧卖核心机制（2026年7月版）<\/h3>\n<table>\n<thead>\n<tr>\n<th>运营环节<\/th>\n<th>旧版（2025）<\/th>\n<th>新版（2026.7）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>商品编辑权<\/td>\n<td> 双向锁定（卖家+平台均不可改）<\/td>\n<td>平台AI可自主修改，卖家不可改<\/td>\n<\/tr>\n<tr>\n<td>定价机制<\/td>\n<td>卖家设定固定价格<\/td>\n<td>卖家设底价，AI动态调价（底价以上）<\/td>\n<\/tr>\n<tr>\n<td>客服接待<\/td>\n<td>卖家自行回复<\/td>\n<td>AI以卖家身份自动接待，24小时在线<\/td>\n<\/tr>\n<tr>\n<td>商品优化<\/td>\n<td>卖家手动优化<\/td>\n<td>AI自动调整标题、主图、详情文案<\/td>\n<\/tr>\n<tr>\n<td>准入方式<\/td>\n<td> 平台邀约制<\/td>\n<td>卖家自主申报 + 平台审核<\/td>\n<\/tr>\n<tr>\n<td>计费模式<\/td>\n<td>按类目固定费率<\/td>\n<td>按类目分档区间计费：14天档 <strong>1%–3.5%<\/strong>、7天档 <strong>1.5%–7%<\/strong>、3天档 <strong>3%–17.5%<\/strong>；另叠加基础软件服务费；多数类目单笔封顶 500 元<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-37\">8.3 三项AI自动化运营能力<\/h3><h4>1. 智能客服托管<\/h4>\n<ul>\n<li>系统以卖家账号身份自动接待买家咨询<\/li>\n<li>参考商品参数、底价、行业数据生成回复话术<\/li>\n<li>实现24小时无人值守接待，提升响应速度<\/li>\n<li>注意：AI生成话术如有不实承诺，法律和平台责任归卖家<\/li>\n<\/ul>\n<h4>2. 动态智能调价<\/h4>\n<ul>\n<li>底价为价格下限，算法依据全网同款成交价自主调整售价<\/li>\n<li>店铺内开启的小刀、满减等优惠会自动叠加计算<\/li>\n<li>实际成交价可能低于卖家预期——底价务必预留利润缓冲<\/li>\n<\/ul>\n<h4>3. 商品智能优化<\/h4>\n<ul>\n<li>平台大数据自动调整标题关键词、主图排序、详情文案<\/li>\n<li>系统自主完成流量优化动作，无需卖家审核确认<\/li>\n<li>成熟爆款谨慎托管：AI改动可能破坏已稳定的人群标签<\/li>\n<\/ul>\n<h3 id=\"sec-38\">8.4 计费规则详解<\/h3><table>\n<thead>\n<tr>\n<th>服务周期<\/th>\n<th>费率<\/th>\n<th>适用场景<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>14天<\/td>\n<td>1%–3.5%<\/td>\n<td>长周期商品、库存充裕、不急出<\/td>\n<\/tr>\n<tr>\n<td>7天<\/td>\n<td>1.5%–7%<\/td>\n<td>中等周期、常规清库存<\/td>\n<\/tr>\n<tr>\n<td>3天<\/td>\n<td>3%–17.5%<\/td>\n<td>急需出售、快速回款（周期越短费率越高，最短档最高可达 17.5%）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ 上表为<strong>分档区间<\/strong>——具体费率按类目在该区间内取值，开通前务必在页面底部「服务费明细」核对本类目费率。<\/p>\n<p>📌 档位与叠加口径补充：据 2026 年 9 月媒体报道，三档中<strong>目前仅上线 14 天、7 天两档，3 天档尚未上线<\/strong>；无忧卖服务费<strong>在基础软件服务费之外叠加计算<\/strong>（普通卖家 0.6% / 鱼小铺 1.6%，见 15.1），即 7 天档高费率类目的综合成本可达成交额的 8% 以上。上述档位开放状态为<strong>媒体口径 <\/strong>，以页面实际展示为准。<\/p>\n<p>计费关键规则：<\/p>\n<p>• 未归入指定费率类目的商品，执行统一最高费率；服务费之外仍按订单另计基础软件服务费<\/p>\n<p>• 刻意错放类目避费 → 追加处罚<\/p>\n<p>• 卖家责任导致退货 → 服务费不予返还，往返运费卖家自理<\/p>\n<p>• 绝大多数类目单笔服务费封顶500元<\/p>\n<h3 id=\"sec-39\">8.5 履约与处罚规则<\/h3><table>\n<thead>\n<tr>\n<th>行为<\/th>\n<th>后果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>无故关闭订单<\/td>\n<td>账号降权 + 流量限制<\/td>\n<\/tr>\n<tr>\n<td>引导站外交易/私下付款<\/td>\n<td>按站外引流专项治理处理：<strong>首次违规禁言 7 天 + 全店商品下架，二次违规永久受限<\/strong>；无忧卖资格同步清退<\/td>\n<\/tr>\n<tr>\n<td>提报后修改商品信息<\/td>\n<td>不可修改（提交前务必逐项核验）<\/td>\n<\/tr>\n<tr>\n<td>延迟发货/虚假发货<\/td>\n<td>按平台规则扣分，严重者清退无忧卖资格<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>核心权责红线：AI生成的客服话术、系统自动修改的商品图文信息，法律与平台规则层面均归属卖家行为。由此衍生的售后退款、纠纷赔付、违规扣分、限流处罚，全部责任与经济损失由卖家独自承担。平台仅提供技术工具，不承担兜底责任。<\/p>\n<h3 id=\"sec-40\">8.6 商家运营策略：如何用好无忧卖<\/h3><h4>✅ 适合开通无忧卖的商家<\/h4>\n<table>\n<thead>\n<tr>\n<th>特征<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>标准化货源<\/td>\n<td>全新品/标品，成色统一，无个体差异<\/td>\n<\/tr>\n<tr>\n<td>高利润商品<\/td>\n<td>毛利率≥40%，能覆盖3.5%-10%服务费<\/td>\n<\/tr>\n<tr>\n<td>低售后类目<\/td>\n<td>退货率低、纠纷少（如日用百货、图书文具）<\/td>\n<\/tr>\n<tr>\n<td>人力不足<\/td>\n<td>没有专职客服和运营人员，需要AI托管<\/td>\n<\/tr>\n<tr>\n<td>库存量大<\/td>\n<td>商品数量多，手动运营成本高<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>❌ 不建议开通的商家<\/h4>\n<table>\n<thead>\n<tr>\n<th>特征<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>二手非标品<\/td>\n<td>成色差异大，AI无法准确描述瑕疵<\/td>\n<\/tr>\n<tr>\n<td>薄利商品<\/td>\n<td>毛利率＜25%，服务费会吃掉大部分利润<\/td>\n<\/tr>\n<tr>\n<td>高退货率类目<\/td>\n<td>退货不退服务费，双重损失<\/td>\n<\/tr>\n<tr>\n<td>成熟爆款<\/td>\n<td>AI改动可能破坏已稳定的人群标签和搜索权重<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>🔧 实操五步法<\/h4>\n<ol>\n<li>底价定价留缓冲：底价 = 成本价 + 服务费 + 运费 + 至少15%利润缓冲。算法会向下调价，底价定太低可能亏本。<\/li>\n<li>原始文案标准化：在提报前完整标注成色、瑕疵、售后边界、发货时效。AI在此基础上优化，减少描述偏差风险。<\/li>\n<li>库存分批提报：不要一次性把所有库存提交无忧卖。分批次少量提报，降低滞销和降价风险。<\/li>\n<li>小批量灰度测试：先用3-5个商品测试AI调价逻辑、客服话术、图文修改规律，验证后再批量上线。<\/li>\n<li>定期复盘调整：每周检查无忧卖商品的成交价、退货率、客服评价，发现异常及时关闭托管。<\/li>\n<\/ol>\n<h4>📊 无忧卖 vs 自主运营对比<\/h4>\n<table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>无忧卖托管<\/th>\n<th>自主运营<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>时间投入<\/td>\n<td>低（AI接管日常运营）<\/td>\n<td>高（需全天候运营）<\/td>\n<\/tr>\n<tr>\n<td>定价控制<\/td>\n<td>弱（AI动态调价）<\/td>\n<td>强（完全自主定价）<\/td>\n<\/tr>\n<tr>\n<td>流量获取<\/td>\n<td>有平台流量加权<\/td>\n<td>靠自然流量+付费推广<\/td>\n<\/tr>\n<tr>\n<td>客服质量<\/td>\n<td>AI 24小时在线，但可能答非所问<\/td>\n<td>人工回复，质量可控<\/td>\n<\/tr>\n<tr>\n<td>商品描述<\/td>\n<td>AI自动优化，可能失真<\/td>\n<td>完全可控，真实准确<\/td>\n<\/tr>\n<tr>\n<td>成本<\/td>\n<td>3.5%-10%服务费<\/td>\n<td>人力+时间成本<\/td>\n<\/tr>\n<tr>\n<td>风险<\/td>\n<td>AI行为归责卖家，不可控风险高<\/td>\n<td>风险完全自控<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-41\">8.7 关键注意事项<\/h3><p>⚠️ 四条底线：<\/p>\n<ol>\n<li>\n<p>底价≠售价：底价是下限，不是建议售价。务必留足利润空间。<\/p>\n<\/li>\n<li>\n<p>退货损失翻倍：退货不仅损失运费，服务费也不退，薄利商品尤其谨慎。<\/p>\n<\/li>\n<li>\n<p>AI言论你买单：AI客服做出的任何承诺，法律责任全归卖家。<\/p>\n<\/li>\n<li>\n<p><strong>开通前先确认开关与费率（2026 年 9 月起重点自查项）<\/strong>：据黑猫投诉平台 2026 年 9 月 15 日至 18 日的集中公开记录，多名个人卖家反映无忧卖系<strong>弹窗默认开通<\/strong>、费率提示位置不显著、成交后扣费申请退款被拒（涉诉金额从数十元至数百元不等，费率档位集中在 6% 一档，落在 8.4 计费规则的 1.5%–7% 区间内）。<br/>\n执行要求：① 无忧卖弹窗出现时<strong>先看开关状态与当期费率再点确认<\/strong>，不点「一键开通」；② 已开通的商品在成交前截图留痕（含费率展示页）；③ 自助联系买家促成的订单尤其注意——该类订单若被扣费，争议最大。<br/>\n⚠️ 上述为公开投诉平台的<strong>用户反馈<\/strong>，非官方规则条文，费率档位与默认开关状态以 App 内实际提示为准 <strong><\/strong>；本节不改变 8.4 的官方计费口径。<\/p>\n<\/li>\n<\/ol>\n<h3 id=\"sec-42\">8.8 无忧卖与矩阵运营的结合策略<\/h3><table>\n<thead>\n<tr>\n<th>策略<\/th>\n<th>操作方式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>分层测试<\/td>\n<td>用1-2个低权重账号开通无忧卖做测试，核心账号保持自主运营<\/td>\n<\/tr>\n<tr>\n<td>品类分离<\/td>\n<td>标准化商品走无忧卖，非标品/高价值商品自主运营<\/td>\n<\/tr>\n<tr>\n<td>库存对冲<\/td>\n<td>同一商品在无忧卖和自主运营账号各放一部分，对比成交效果<\/td>\n<\/tr>\n<tr>\n<td>周期轮换<\/td>\n<td>无忧卖商品售罄后，新一批商品先自主运营养权重，再决定是否托管<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 8.1 什么是托管无忧卖？ 闲鱼「无忧卖」是平台面向经营型卖家推出的 AI 全托管运营服务 ：不成交不收费，按成交额抽佣。卖家提供商品和底价，平台 AI 接管客服、定价、商品优化等运营环节。该服务 2026 年 6 月 9 日全量推出， 2026 年 7 月 1 日起升级为全托管模式 ，权限与责任机制发生重大变化。 8.2 无忧卖核心机制（2026年7月版） 运营环节 旧版（2025） 新版（2026.7） 商品编辑权 双向锁定（卖家+平台均不可改） 平台AI可自主修改，卖家不可改 定价机制 卖家设定固定价格 卖家设底价，AI动态调价（底价以上） 客服接待 卖家自行回复 AI以卖家身份自动接待，24小时在线 商品优化 卖家手动优化 AI自动调整标题、主图、详情文案 准入方式 平台邀约制 卖家自主申报 + 平台审核 计费模式 按类目固定费率 按类目分档区间计费：14天档 1%–3.5% 、7天档 1.5%–7% 、3天档 3%–17.5% ；另叠加基础软件服务费；多数类目单笔封顶 500 元 8.3 三项AI自动化运营能力 1. 智能客服托管 系统以卖家账号身份自动接待买家咨询 参考商品参数、底价、行业数据生成回复话术 实现24小时无人值守接待，提升响应速度 注意：AI生成话术如有不实承诺，法律和平台责任归卖家 2. 动态智能调价 底价为价格下限，算法依据全网同款成交价自主调整售价 店铺内开启的小刀、满减等优惠会自动叠加计算 实际成交价可能低于卖家预期——底价务必预留利润缓冲 3. 商品智能优化 平台大数据自动调整标题关键词、主图排序、详情文案 系统自主完成流量优化动作，无需卖家审核确认 成熟爆款谨慎托管：AI改动可能破坏已稳定的人群标签 8.4 计费规则详解 服务周期 费率 适用场景 14天 1%–3.5% 长周期商品、库存充裕、不急出 7天 1.5%–7% 中等周期、常规清库存 3天 3%–17.5% 急需出售、快速回款（周期越短费率越高，最短档最高可达 17.5%） ⚠️ 上表为 分档区间 ——具体费率按类目在该区间内取值，开通前务必在页面底部「服务费明细」核对本类目费率。 📌 档位与叠加口径补充：据 2026 年 9 月媒体报道，三档中 目前仅上线 14 天、7 天两档，3 天档尚未上线 ；无忧卖服务费 在基础软件服务费之外叠加计算 （普通卖家 0.6% / 鱼小铺 1.6%，见 15.1），即 7 天档高费率类目的综合成本可达成交额的 8% 以上。上述档位开放状态为 媒体口径 ，以页面实际展示为准。 计费关键规则： • 未归入指定费率类目的商品，执行统一最高费率；服务费之外仍按订单另计基础软件服务费 • 刻意错放类目避费 → 追加处罚 • 卖家责任导致退货 → 服务费不予返还，往返运费卖家自理 • 绝大多数类目单笔服务费封顶500元 8.5 履约与处罚规则 行为 后果 无故关闭订单 账号降权 + 流量限制 引导站外交易/私下付款 按站外引流专项治理处理： 首次违规禁言 7 天 + 全店商品下架，二次违规永久受限 ；无忧卖资格同步清退 提报后修改商品信息 不可修改（提交前务必逐项核验） 延迟发货/虚假发货 按平台规则扣分，严重者清退无忧卖资格 核心权责红线：AI生成的客服话术、系统自动修改的商品图文信息，法律与平台规则层面均归属卖家行为。由此衍生的售后退款、纠纷赔付、违规扣分、限流处罚，全部责任与经济损失由卖家独自承担。平台仅提供技术工具，不承担兜底责任。 8.6 商家运营策略：如何用好无忧卖 ✅ 适合开通无忧卖的商家 特征 说明 标准化货源 全新品/标品，成色统一，无个体差异 高利润商品 毛利率≥40%，能覆盖3.5%-10%服务费 低售后类目 退货率低、纠纷少（如日用百货、图书文具） 人力不足 没有专职客服和运营人员，需要AI托管 库存量大 商品数量多，手动运营成本高 ❌ 不建议开通的商家 特征 说明 二手非标品 成色差异大，AI无法准确描述瑕疵 薄利商品 毛利率＜25%，服务费会吃掉大部分利润 高退货率类目 退货不退服务费，双重损失 成熟爆款 AI改动可能破坏已稳定的人群标签和搜索权重 🔧 实操五步法 底价定价留缓冲：底价 = 成本价 + 服务费 + 运费 + 至少15%利润缓冲。算法会向下调价，底价定太低可能亏本。 原始文案标准化：在提报前完整标注成色、瑕疵、售后边界、发货时效。AI在此基础上优化，减少描述偏差风险。 库存分批提报：不要一次性把所有库存提交无忧卖。分批次少量提报，降低滞销和降价风险。 小批量灰度测试：先用3-5个商品测试AI调价逻辑、客服话术、图文修改规律，验证后再批量上线。 定期复盘调整：每周检查无忧卖商品的成交价、退货率、客服评价，发现异常及时关闭托管。 📊 无忧卖 vs 自主运营对比 维度 无忧卖托管 自主运营 时间投入 低（AI接管日常运营） 高（需全天候运营） 定价控制 弱（AI动态调价） 强（完全自主定价） 流量获取 有平台流量加权 靠自然流量+付费推广 客服质量 AI 24小时在线，但可能答非所问 人工回复，质量可控 商品描述 AI自动优化，可能失真 完全可控，真实准确 成本 3.5%-10%服务费 人力+时间成本 风险 AI行为归责卖家，不可控风险高 风险完全自控 8.7 关键注意事项 ⚠️ 四条底线： 底价≠售价：底价是下限，不是建议售价。务必留足利润空间。 退货损失翻倍：退货不仅损失运费，服务费也不退，薄利商品尤其谨慎。 AI言论你买单：AI客服做出的任何承诺，法律责任全归卖家。 开通前先确认开关与费率（2026 年 9 月起重点自查项） ：据黑猫投诉平台 2026 年 9 月 15 日至 18 日的集中公开记录，多名个人卖家反映无忧卖系 弹窗默认开通 、费率提示位置不显著、成交后扣费申请退款被拒（涉诉金额从数十元至数百元不等，费率档位集中在 6% 一档，落在 8.4 计费规则的 1.5%–7% 区间内）。 执行要求：① 无忧卖弹窗出现时 先看开关状态与当期费率再点确认 ，不点「一键开通」；② 已开通的商品在成交前截图留痕（含费率展示页）；③ 自助联系买家促成的订单尤其注意——该类订单若被扣费，争议最大。 ⚠️ 上述为公开投诉平台的 用户反馈 ，非官方规则条文，费率档位与默认开关状态以 App 内实际提示为准 ；本节不改变 8.4 的官方计费口径。 8.8 无忧卖与矩阵运营的结合策略 策略 操作方式 分层测试 用1-2个低权重账号开通无忧卖做测试，核心账号保持自主运营 品类分离 标准化商品走无忧卖，非标品/高价值商品自主运营 库存对冲 同一商品在无忧卖和自主运营账号各放一部分，对比成交效果 周期轮换 无忧卖商品售罄后，新一批商品先自主运营养权重，再决定是否托管","toc":[{"id":"sec-35","title":"8.1 什么是托管无忧卖？"},{"id":"sec-36","title":"8.2 无忧卖核心机制（2026年7月版）"},{"id":"sec-37","title":"8.3 三项AI自动化运营能力"},{"id":"sec-38","title":"8.4 计费规则详解"},{"id":"sec-39","title":"8.5 履约与处罚规则"},{"id":"sec-40","title":"8.6 商家运营策略：如何用好无忧卖"},{"id":"sec-41","title":"8.7 关键注意事项"},{"id":"sec-42","title":"8.8 无忧卖与矩阵运营的结合策略"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":7,"imgs":0,"words":2896,"sections":8,"subs":7,"version":"V2026.10.12"},"related":["a498458897921413","sec-43","sec-2","sec-62"]},{"id":"sec-52","kind":"chapter","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"高级流量与规模扩张","title":"第十章 矩阵裂变与分层投放","title_raw":"第十章 矩阵裂变与分层投放","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-53\">10.1 矩阵账号架构<\/h3><p>单账号天花板约月销3-5万，突破需矩阵化运营。矩阵核心：分层定位 + 独立环境 + 风控巡检。<\/p>\n<h4>三阶段矩阵模型<\/h4>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>账号数量<\/th>\n<th>核心任务<\/th>\n<th>关键指标<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>起步期<\/td>\n<td>1-3个<\/td>\n<td>跑通单账号模型：选品→发布→成交→售后全链路<\/td>\n<td>单账号月销≥5000元<\/td>\n<\/tr>\n<tr>\n<td>成长期<\/td>\n<td>5-10个<\/td>\n<td>类目分层：主号打品牌 + 小号铺量测品<\/td>\n<td>矩阵月销≥3万元<\/td>\n<\/tr>\n<tr>\n<td>成熟期<\/td>\n<td>10-50个<\/td>\n<td>精细化运营：赛道分组 + 风控巡检 + 数据中台<\/td>\n<td>矩阵月销≥10万元<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-54\">10.2 账号分层定位<\/h3>\n<table>\n<thead>\n<tr>\n<th>层级<\/th>\n<th>定位<\/th>\n<th>数量占比<\/th>\n<th>策略<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>旗舰号<\/td>\n<td>品牌/IP主号，鱼小铺+蓝V，投放主力<\/td>\n<td>10%-20%<\/td>\n<td>精品化运营、高客单价、付费投放<\/td>\n<\/tr>\n<tr>\n<td>垂直号<\/td>\n<td>单一类目深耕（如数码号、家居号、宠物号）<\/td>\n<td>40%-50%<\/td>\n<td>专业人设、精准标签、自然流量为主<\/td>\n<\/tr>\n<tr>\n<td>测品号<\/td>\n<td>杂货铺模式，快速测试不同品类和单品<\/td>\n<td>20%-30%<\/td>\n<td>大量上架、快速迭代、低成本测爆款<\/td>\n<\/tr>\n<tr>\n<td>备用号<\/td>\n<td>养号储备，应对封号/限流风险<\/td>\n<td>10%<\/td>\n<td>保持活跃、随时可启用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-55\">10.3 一机一卡一号原则（铁律）<\/h3><ul>\n<li>一台设备 + 一张手机卡（独立网络）+ 一个闲鱼号<\/li>\n<li>不同账号使用不同WiFi或手机流量，绝不共用同一网络<\/li>\n<li>不同账号之间不互相转发/点赞/交易<\/li>\n<li>不同账号不共用同一收货地址（可微调：XX小区1栋 vs XX小区2栋）<\/li>\n<li>同一WiFi下登录多个账号 → 系统判定恶意刷量 → 全部限流<\/li>\n<\/ul>\n<h3 id=\"sec-56\">10.4 矩阵风控巡检机制<\/h3><table>\n<thead>\n<tr>\n<th>频次<\/th>\n<th>检查项<\/th>\n<th>动作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>每日<\/td>\n<td>各账号安全中心状态、违规通知<\/td>\n<td>异常账号立即停止操作<\/td>\n<\/tr>\n<tr>\n<td>每周<\/td>\n<td>闲气值变化、流量趋势、转化数据<\/td>\n<td>低分账号增加养号动作<\/td>\n<\/tr>\n<tr>\n<td>每月<\/td>\n<td>全账号健康度评分、类目表现<\/td>\n<td>淘汰低效号、启用备用号<\/td>\n<\/tr>\n<tr>\n<td>季度<\/td>\n<td>规则更新对照、竞品动态<\/td>\n<td>调整运营策略<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 10.1 矩阵账号架构 单账号天花板约月销3-5万，突破需矩阵化运营。矩阵核心：分层定位 + 独立环境 + 风控巡检。 三阶段矩阵模型 阶段 账号数量 核心任务 关键指标 起步期 1-3个 跑通单账号模型：选品→发布→成交→售后全链路 单账号月销≥5000元 成长期 5-10个 类目分层：主号打品牌 + 小号铺量测品 矩阵月销≥3万元 成熟期 10-50个 精细化运营：赛道分组 + 风控巡检 + 数据中台 矩阵月销≥10万元 10.2 账号分层定位 层级 定位 数量占比 策略 旗舰号 品牌/IP主号，鱼小铺+蓝V，投放主力 10%-20% 精品化运营、高客单价、付费投放 垂直号 单一类目深耕（如数码号、家居号、宠物号） 40%-50% 专业人设、精准标签、自然流量为主 测品号 杂货铺模式，快速测试不同品类和单品 20%-30% 大量上架、快速迭代、低成本测爆款 备用号 养号储备，应对封号/限流风险 10% 保持活跃、随时可启用 10.3 一机一卡一号原则（铁律） 一台设备 + 一张手机卡（独立网络）+ 一个闲鱼号 不同账号使用不同WiFi或手机流量，绝不共用同一网络 不同账号之间不互相转发/点赞/交易 不同账号不共用同一收货地址（可微调：XX小区1栋 vs XX小区2栋） 同一WiFi下登录多个账号 → 系统判定恶意刷量 → 全部限流 10.4 矩阵风控巡检机制 频次 检查项 动作 每日 各账号安全中心状态、违规通知 异常账号立即停止操作 每周 闲气值变化、流量趋势、转化数据 低分账号增加养号动作 每月 全账号健康度评分、类目表现 淘汰低效号、启用备用号 季度 规则更新对照、竞品动态 调整运营策略","toc":[{"id":"sec-53","title":"10.1 矩阵账号架构"},{"id":"sec-54","title":"10.2 账号分层定位"},{"id":"sec-55","title":"10.3 一机一卡一号原则（铁律）"},{"id":"sec-56","title":"10.4 矩阵风控巡检机制"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":3,"imgs":0,"words":799,"sections":4,"subs":1,"version":"V2026.10.12"},"related":["a498458897921413","sec-86","sec-30","sec-11"]}]},{"module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"社区公约与行为规范","color":"green","count":3,"items":[{"id":"a498834499044741","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"社区公约与行为规范","title":"闲鱼社区公约","title_raw":"闲鱼社区公约","html":"<p class=\"ql-align-center\"><strong style=\"color: rgb(51, 51, 51);\" class=\"ql-size-16px\">闲鱼社区公约<\/strong><\/p><p class=\"ql-align-center\"><br><\/p><p><span style=\"color: rgb(51, 51, 51);\"> “让闲置流通起来”，我们认为建立彼此的信任是闲鱼社区最重要的事情。为此，我们建立了《闲鱼社区公约》（以下简称“《公约》”）来指引我们，让我们的闲置资源交易社区能更好地持续健康发展。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"> 闲鱼社区是我们大家共同的社区，不断完善我们的《公约》变得极为重要，我们会随时向我们的社区传递什么行为是我们反对的，什么行为是我们鼓励支持的，并根据情况适时修订《公约》。下面这三条公约是迄今为止我们从社区用户了解到的核心理念，我们会努力确保执行这些公约。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第一条 真实<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">既然我们认为建立彼此的信任是我们社区最重要的事情，那么网络社区中的您是否是一个真实的人就变得至关重要。虽然认证成本高昂，但我们依然相信，实人认证是真实的基础。当然您所有的信息安全和隐私都会被我们当成生命一样去重视和保护。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1、身份认证<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">通过实名认证：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">当您登录闲鱼社区发布信息、互动或交易时，需要先通过实名认证；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">通过实人认证：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">当您发布闲置物品、商品/服务时，需要先通过实人认证；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">当然实人认证不是终身有效的，为了确保认证信息真实及持续有效，我们会在不同场景中要求您再次进行实人认证。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2、承诺履行<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">不论您在闲鱼社区转让闲置还是社区互动，请遵守您与用户的约定并按约定履行，建立彼此信任从你我做起。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二条 安全<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">只有当您觉得这个社区是安全的，一切才有可能。正因如此，安全是我们的重要条件。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1、非法、违规信息及行为严肃处置<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼用户在闲鱼社区的行为、发布的物品、商品/服务及信息不得违反国家法律法规及闲鱼社区相关要求，违规场景及处置措施详见《闲鱼社区管理规范》；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2、担保交易保障交易安全<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼联合支付宝提供担保交易，保障您的钱款安全，买卖双方选择闲鱼线上交易的，须遵守《闲鱼交易超时说明》的相关要求，个人闲置物品、商品/服务不支持七天无理由退换货，双方另行约定的除外。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">3、隐私保护<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">为了保障闲鱼社区用户在社区中的安全，闲鱼非常重视个人隐私保护，会积极维护网络数据和用户信息安全，严格按照法律及相关法规采取技术保护措施并进行安全评估。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">用户不得发布或提供泄露他人隐私的信息，包括但不限于：公开他人真实姓名及身份证号、电话号码、住址等隐私信息。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第三条 平等<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">我们希望这里是闲置资源交易社区，希望每个人得到的机会都是平等的，让我们真正实现闲置资源的流通。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1、身份平等<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">我们彼此是平等的，因此每一次互动中都应该尊重对方。在遵守所有适用法律的基础上，社区用户公平享有闲置自由交易等权利。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼用户交易遵循平等、公平、自愿的原则。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2、交易平等<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼社区是一个闲置交易社区，因此，我们鼓励闲置资源公平享有流通的权利。如买卖双方在交易过程中有争议，按照《闲鱼社区交易争议处理规范》处理。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">本公约中已有规定的从本公约，本公约未有规定的依据《闲鱼社区管理规范》等相关规则执行。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">本公约生效时间为：2017年8月31日，最新修订时间为2021年12月17日。<\/span><\/p>","text":"闲鱼社区公约 “让闲置流通起来”，我们认为建立彼此的信任是闲鱼社区最重要的事情。为此，我们建立了《闲鱼社区公约》（以下简称“《公约》”）来指引我们，让我们的闲置资源交易社区能更好地持续健康发展。 闲鱼社区是我们大家共同的社区，不断完善我们的《公约》变得极为重要，我们会随时向我们的社区传递什么行为是我们反对的，什么行为是我们鼓励支持的，并根据情况适时修订《公约》。下面这三条公约是迄今为止我们从社区用户了解到的核心理念，我们会努力确保执行这些公约。 第一条 真实 既然我们认为建立彼此的信任是我们社区最重要的事情，那么网络社区中的您是否是一个真实的人就变得至关重要。虽然认证成本高昂，但我们依然相信，实人认证是真实的基础。当然您所有的信息安全和隐私都会被我们当成生命一样去重视和保护。 1、身份认证 通过实名认证： 当您登录闲鱼社区发布信息、互动或交易时，需要先通过实名认证； 通过实人认证： 当您发布闲置物品、商品/服务时，需要先通过实人认证； 当然实人认证不是终身有效的，为了确保认证信息真实及持续有效，我们会在不同场景中要求您再次进行实人认证。 2、承诺履行 不论您在闲鱼社区转让闲置还是社区互动，请遵守您与用户的约定并按约定履行，建立彼此信任从你我做起。 第二条 安全 只有当您觉得这个社区是安全的，一切才有可能。正因如此，安全是我们的重要条件。 1、非法、违规信息及行为严肃处置 闲鱼用户在闲鱼社区的行为、发布的物品、商品/服务及信息不得违反国家法律法规及闲鱼社区相关要求，违规场景及处置措施详见《闲鱼社区管理规范》； 2、担保交易保障交易安全 闲鱼联合支付宝提供担保交易，保障您的钱款安全，买卖双方选择闲鱼线上交易的，须遵守《闲鱼交易超时说明》的相关要求，个人闲置物品、商品/服务不支持七天无理由退换货，双方另行约定的除外。 3、隐私保护 为了保障闲鱼社区用户在社区中的安全，闲鱼非常重视个人隐私保护，会积极维护网络数据和用户信息安全，严格按照法律及相关法规采取技术保护措施并进行安全评估。 用户不得发布或提供泄露他人隐私的信息，包括但不限于：公开他人真实姓名及身份证号、电话号码、住址等隐私信息。 第三条 平等 我们希望这里是闲置资源交易社区，希望每个人得到的机会都是平等的，让我们真正实现闲置资源的流通。 1、身份平等 我们彼此是平等的，因此每一次互动中都应该尊重对方。在遵守所有适用法律的基础上，社区用户公平享有闲置自由交易等权利。 闲鱼用户交易遵循平等、公平、自愿的原则。 2、交易平等 闲鱼社区是一个闲置交易社区，因此，我们鼓励闲置资源公平享有流通的权利。如买卖双方在交易过程中有争议，按照《闲鱼社区交易争议处理规范》处理。 本公约中已有规定的从本公约，本公约未有规定的依据《闲鱼社区管理规范》等相关规则执行。 本公约生效时间为：2017年8月31日，最新修订时间为2021年12月17日。","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":1206,"sections":0,"subs":0,"version":""},"related":["sec-57","sec-62","a498834062509445","a498773110658437"]},{"id":"a498834062509445","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"社区公约与行为规范","title":"闲鱼社区用户行为规范","title_raw":"闲鱼社区用户行为规范","html":"<p class=\"ql-align-center\"><strong style=\"color: rgb(51, 51, 51); background-color: rgba(0, 0, 0, 0);\" class=\"ql-size-16px\">闲鱼社区用户行为规范<\/strong><span style=\"color: rgb(51, 51, 51); background-color: rgba(0, 0, 0, 0);\" class=\"ql-size-16px\"> <\/span><\/p><p class=\"ql-align-center\"><br><\/p><p><span style=\"color: rgb(51, 51, 51);\"> 闲鱼用户在闲鱼社区的行为不得违反国家相关法律法规及闲鱼社区的相关要求。若闲鱼通过主动发现或经用户举报等方式核实用户存在违反本规范的行为的，闲鱼可根据用户违规的具体情形及严重程度对闲鱼用户进行处置，措施包括处理违规商品或信息、闲鱼用户权限管控、违规扣分等处置措施，同时，针对涉嫌违法违规的行为，闲鱼也将依法配合移送相关行政管理部门处理。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">一、【注册】根据闲鱼平台的流程和要求完成注册的会员可登录闲鱼社区，成为闲鱼用户，会员名注册后无法自行修改。 <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">二、【认证】闲鱼用户在闲鱼发布信息、互动或交易时，需要通过实名认证，同时闲鱼用户须根据平台要求完成实人认证及认证复核，确保认证信息真实有效。 <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">三、【发布商品及信息】闲鱼用户发布商品及信息须遵守《闲鱼社区信息发布规范》，闲鱼用户发布的在线商品数同一时间不得超过50件。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">四、【交易】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（一）【交易约定】交易前，买卖双方可针对交易及商品情况沟通交流，可选择线上交易或“见一见”见面交易。买方拍下且未付款到支付宝担保账户前，以及买家付款后卖方发货前，买卖双方均可自主关闭订单。线上交易卖方操作“我要发货”，或“见一见”交易卖方完成“扫码收款”即表示买卖双方达成交易约定。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）【交易超时】买卖双方选择闲鱼线上交易的，须遵守《闲鱼交易超时说明》的相关要求。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（三）【交易流程】闲鱼支持支付宝担保交易，若买方对交易货物有疑问，买方可在确认收货（含系统超时自动确认收货）前提出退款申请。选择在线付款后见面交易或用“见一见”发起见面交易的，买方需当面验货，当面收货即表示买方对货物无异议。交易成功后，不支持售后维权。如买卖双方在交易过程中有争议，按照《闲鱼社区交易争议处理规范》处理。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（四）【交易评价】为确保评价内容能为买方购物决策提供可靠的依据，反映商品或服务的真实情况，买卖双方通过闲鱼评价工具发布评价的，其评价应当与交易的商品或服务具有关联性，且合法、客观、真实，买卖双方不得利用闲鱼评价侵害相关方合法权益。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">五、【违规行为】闲鱼用户违反本规范相关规定的，将依据本规范对闲鱼用户进行处置，措施包括处理违规商品或信息、闲鱼用户权限管控等，具体管控措施包括但不限于下架/删除/屏蔽/降权违规信息、解除相关身份（如玩家等）、限制发布商品、限制互动（如帖子、留言、评论、点赞、聊天、问答、个人主页信息等）、限制交易、闲鱼交易账期延长、限制参加营销活动、违规扣分甚至查封账户，具体违规行为包括但不限于：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（一）泄漏用户信息，如擅自将他人隐私信息（包括但不限于电话、住址、姓名等）公布，或提供给第三方等；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）出现辱骂、恶意中伤或人身攻击的行为；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（三）出现扰乱平台秩序的行为，如通过刷单、炒作等形式进行数据造假作弊，准入申请、活动报名、违规申诉等环节向闲鱼提供不真实的证明材料，滥用/恶意利用闲鱼所赋予的各项权利损害他人合法权益、妨害闲鱼运营秩序的行为等；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（四）出现危及账户安全的行为，如恶意注册、盗用他人账户等；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（五）出现欺诈或可能造成交易风险的行为，如骗取他人财物、诱导站外交易、虚假发货、以交定金/预付款为由的诈骗行为、冒充闲鱼官方人员等。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（六）出现描述不符的行为，即闲鱼卖方须在商品描述页面、交易约定过程中，对商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等必须说明的信息进行真实、完整的描述。若买方收到的货物与卖方的描述不一致，视为描述不符。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（七）出现违背交易约定的行为。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">卖方违背交易约定，是指闲鱼卖方须在商品描述、商品留言、私聊等闲鱼提供的官方沟通渠道中（不包括手机、电话、QQ等非官方渠道）明确买卖双方的交易约定，约定内容包括但不限于是否提供发票、发货时间、交易方式等。在达成交易约定后，对于买卖双方约定的事项，若由于卖方单方面原因导致未履行的，视为卖方违背交易约定。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">买方违背交易约定，是指闲鱼买方需在交易前充分了解必要的商品情况，包括但不仅限于商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等，并约定商品的交易价格。在达成交易约定后，买方需客观、理性地进行交易。在达成交易约定后，对于买卖双方约定的事项，若由于买方单方面违约的(卖方原因导致的除外)，视为买方违背交易约定。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">六、【违规关联管控】闲鱼用户若发生以下行为，包括但不限于闲鱼用户被处以特定违规行为处罚或发生过危及交易安全的情形（包括但不限于因骗取他人财物、出售假冒商品等严重违规行为被处以查封账户、违规节点处罚、永久限制闲鱼权限等）的，除该闲鱼用户被闲鱼违规处置外, 闲鱼可对该闲鱼用户实际控制人下的其他闲鱼用户账户进行处置（包括闲鱼用户权限管控、违规扣分等）。<\/span><\/p><p class=\"ql-align-right\"><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p class=\"ql-align-right\"><span style=\"color: rgb(51, 51, 51);\">闲鱼社区<\/span><\/p><p class=\"ql-align-right\"><span style=\"color: rgb(51, 51, 51);\">2020年2月25日<\/span><\/p>","text":"闲鱼社区用户行为规范 闲鱼用户在闲鱼社区的行为不得违反国家相关法律法规及闲鱼社区的相关要求。若闲鱼通过主动发现或经用户举报等方式核实用户存在违反本规范的行为的，闲鱼可根据用户违规的具体情形及严重程度对闲鱼用户进行处置，措施包括处理违规商品或信息、闲鱼用户权限管控、违规扣分等处置措施，同时，针对涉嫌违法违规的行为，闲鱼也将依法配合移送相关行政管理部门处理。 一、【注册】根据闲鱼平台的流程和要求完成注册的会员可登录闲鱼社区，成为闲鱼用户，会员名注册后无法自行修改。 二、【认证】闲鱼用户在闲鱼发布信息、互动或交易时，需要通过实名认证，同时闲鱼用户须根据平台要求完成实人认证及认证复核，确保认证信息真实有效。 三、【发布商品及信息】闲鱼用户发布商品及信息须遵守《闲鱼社区信息发布规范》，闲鱼用户发布的在线商品数同一时间不得超过50件。 四、【交易】 （一）【交易约定】交易前，买卖双方可针对交易及商品情况沟通交流，可选择线上交易或“见一见”见面交易。买方拍下且未付款到支付宝担保账户前，以及买家付款后卖方发货前，买卖双方均可自主关闭订单。线上交易卖方操作“我要发货”，或“见一见”交易卖方完成“扫码收款”即表示买卖双方达成交易约定。 （二）【交易超时】买卖双方选择闲鱼线上交易的，须遵守《闲鱼交易超时说明》的相关要求。 （三）【交易流程】闲鱼支持支付宝担保交易，若买方对交易货物有疑问，买方可在确认收货（含系统超时自动确认收货）前提出退款申请。选择在线付款后见面交易或用“见一见”发起见面交易的，买方需当面验货，当面收货即表示买方对货物无异议。交易成功后，不支持售后维权。如买卖双方在交易过程中有争议，按照《闲鱼社区交易争议处理规范》处理。 （四）【交易评价】为确保评价内容能为买方购物决策提供可靠的依据，反映商品或服务的真实情况，买卖双方通过闲鱼评价工具发布评价的，其评价应当与交易的商品或服务具有关联性，且合法、客观、真实，买卖双方不得利用闲鱼评价侵害相关方合法权益。 五、【违规行为】闲鱼用户违反本规范相关规定的，将依据本规范对闲鱼用户进行处置，措施包括处理违规商品或信息、闲鱼用户权限管控等，具体管控措施包括但不限于下架/删除/屏蔽/降权违规信息、解除相关身份（如玩家等）、限制发布商品、限制互动（如帖子、留言、评论、点赞、聊天、问答、个人主页信息等）、限制交易、闲鱼交易账期延长、限制参加营销活动、违规扣分甚至查封账户，具体违规行为包括但不限于： （一）泄漏用户信息，如擅自将他人隐私信息（包括但不限于电话、住址、姓名等）公布，或提供给第三方等； （二）出现辱骂、恶意中伤或人身攻击的行为； （三）出现扰乱平台秩序的行为，如通过刷单、炒作等形式进行数据造假作弊，准入申请、活动报名、违规申诉等环节向闲鱼提供不真实的证明材料，滥用/恶意利用闲鱼所赋予的各项权利损害他人合法权益、妨害闲鱼运营秩序的行为等； （四）出现危及账户安全的行为，如恶意注册、盗用他人账户等； （五）出现欺诈或可能造成交易风险的行为，如骗取他人财物、诱导站外交易、虚假发货、以交定金/预付款为由的诈骗行为、冒充闲鱼官方人员等。 （六）出现描述不符的行为，即闲鱼卖方须在商品描述页面、交易约定过程中，对商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等必须说明的信息进行真实、完整的描述。若买方收到的货物与卖方的描述不一致，视为描述不符。 （七）出现违背交易约定的行为。 卖方违背交易约定，是指闲鱼卖方须在商品描述、商品留言、私聊等闲鱼提供的官方沟通渠道中（不包括手机、电话、QQ等非官方渠道）明确买卖双方的交易约定，约定内容包括但不限于是否提供发票、发货时间、交易方式等。在达成交易约定后，对于买卖双方约定的事项，若由于卖方单方面原因导致未履行的，视为卖方违背交易约定。 买方违背交易约定，是指闲鱼买方需在交易前充分了解必要的商品情况，包括但不仅限于商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等，并约定商品的交易价格。在达成交易约定后，买方需客观、理性地进行交易。在达成交易约定后，对于买卖双方约定的事项，若由于买方单方面违约的(卖方原因导致的除外)，视为买方违背交易约定。 六、【违规关联管控】闲鱼用户若发生以下行为，包括但不限于闲鱼用户被处以特定违规行为处罚或发生过危及交易安全的情形（包括但不限于因骗取他人财物、出售假冒商品等严重违规行为被处以查封账户、违规节点处罚、永久限制闲鱼权限等）的，除该闲鱼用户被闲鱼违规处置外, 闲鱼可对该闲鱼用户实际控制人下的其他闲鱼用户账户进行处置（包括闲鱼用户权限管控、违规扣分等）。 闲鱼社区 2020年2月25日","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":1956,"sections":0,"subs":0,"version":""},"related":["sec-57","sec-62","a499947645891973","a498832766117253"]},{"id":"a499947645891973","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"社区公约与行为规范","title":"闲鱼社区用户行为规范（公告版）","title_raw":"闲鱼社区用户行为规范","html":"<p><strong>一、【注册】<\/strong><\/p><p>根据闲鱼平台的流程和要求完成注册的会员可登录闲鱼社区，成为闲鱼用户，会员名注册后无法自行修改。 二、【认证】闲鱼用户在闲鱼发布信息、互动或交易时，需要通过实名认证，同时闲鱼用户须根据平台要求完成实人认证及认证复核，确保认证信息真实有效。 三、【发布商品及信息】闲鱼用户发布商品及信息须遵守《闲鱼社区信息发布规范》，闲鱼用户发布的在线商品数同一时间不得超过50件。<\/p><p><strong>四、【交易】<\/strong><\/p><p>（一）【交易约定】交易前，买卖双方可针对交易及商品情况沟通交流，可选择线上交易或“见一见”见面交易。买方拍下且未付款到支付宝担保账户前，以及买家付款后卖方发货前，买卖双方均可自主关闭订单。线上交易卖方操作“我要发货”，或“见一见”交易卖方完成“扫码收款”即表示买卖双方达成交易约定。<\/p><p>（二）【交易超时】买卖双方选择闲鱼线上交易的，须遵守《闲鱼交易超时说明》的相关要求。<\/p><p>（三）【交易流程】闲鱼支持支付宝担保交易，若买方对交易货物有疑问，买方可在确认收货（含系统超时自动确认收货）前提出退款申请。选择在线付款后见面交易或用“见一见”发起见面交易的，买方需当面验货，当面收货即表示买方对货物无异议。交易成功后，不支持售后维权。如买卖双方在交易过程中有争议，按照《闲鱼社区交易争议处理规范》处理。<\/p><p>（四）【交易评价】为确保评价内容能为买方购物决策提供可靠的依据，反映商品或服务的真实情况，买卖双方通过闲鱼评价工具发布评价的，其评价应当与交易的商品或服务具有关联性，且合法、客观、真实，买卖双方不得利用闲鱼评价侵害相关方合法权益。<\/p><p><strong>五、【违规行为】<\/strong><\/p><p>闲鱼用户违反本规范相关规定的，将依据本规范对闲鱼用户进行处置，措施包括处理违规商品或信息、闲鱼用户权限管控等，具体管控措施包括但不限于下架/删除/屏蔽/降权违规信息、解除相关身份（如玩家等）、限制发布商品、限制互动（如帖子、留言、评论、点赞、聊天、问答、个人主页信息等）、限制交易、闲鱼交易账期延长、限制参加营销活动、违规扣分甚至查封账户，具体违规行为包括但不限于：<\/p><p>（一）泄漏用户信息，如擅自将他人隐私信息（包括但不限于电话、住址、姓名等）公布，或提供给第三方等；<\/p><p>（二）出现辱骂、恶意中伤或人身攻击的行为；<\/p><p>（三）出现扰乱平台秩序的行为，如通过刷单、炒作等形式进行数据造假作弊，准入申请、活动报名、违规申诉等环节向闲鱼提供不真实的证明材料，滥用/恶意利用闲鱼所赋予的各项权利损害他人合法权益、妨害闲鱼运营秩序的行为等；<\/p><p>（四）出现危及账户安全的行为，如恶意注册、盗用他人账户等；<\/p><p>（五）出现欺诈或可能造成交易风险的行为，如骗取他人财物、诱导站外交易、虚假发货、以交定金/预付款为由的诈骗行为、冒充闲鱼官方人员等。<\/p><p>（六）出现描述不符的行为，即闲鱼卖方须在商品描述页面、交易约定过程中，对商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等必须说明的信息进行真实、完整的描述。若买方收到的货物与卖方的描述不一致，视为描述不符。<\/p><p>（七）出现违背交易约定的行为。<\/p><p>卖方违背交易约定，是指闲鱼卖方须在商品描述、商品留言、私聊等闲鱼提供的官方沟通渠道中（不包括手机、电话、QQ等非官方渠道）明确买卖双方的交易约定，约定内容包括但不限于是否提供发票、发货时间、交易方式等。在达成交易约定后，对于买卖双方约定的事项，若由于卖方单方面原因导致未履行的，视为卖方违背交易约定。<\/p><p>买方违背交易约定，是指闲鱼买方需在交易前充分了解必要的商品情况，包括但不仅限于商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等，并约定商品的交易价格。在达成交易约定后，买方需客观、理性地进行交易。在达成交易约定后，对于买卖双方约定的事项，若由于买方单方面违约的(卖方原因导致的除外)，视为买方违背交易约定。<\/p><p><strong>六、【违规关联管控】<\/strong><\/p><p>闲鱼用户若发生以下行为，包括但不限于闲鱼用户被处以特定违规行为处罚或发生过危及交易安全的情形（包括但不限于因骗取他人财物、出售假冒商品等严重违规行为被处以查封账户、违规节点处罚、永久限制闲鱼权限等）的，除该闲鱼用户被闲鱼违规处置外, 闲鱼可对该闲鱼用户实际控制人下的其他闲鱼用户账户进行处置（包括闲鱼用户权限管控、违规扣分等）。<\/p><p class=\"ql-align-right\"><br><\/p><p class=\"ql-align-right\"><br><\/p>","text":"一、【注册】 根据闲鱼平台的流程和要求完成注册的会员可登录闲鱼社区，成为闲鱼用户，会员名注册后无法自行修改。 二、【认证】闲鱼用户在闲鱼发布信息、互动或交易时，需要通过实名认证，同时闲鱼用户须根据平台要求完成实人认证及认证复核，确保认证信息真实有效。 三、【发布商品及信息】闲鱼用户发布商品及信息须遵守《闲鱼社区信息发布规范》，闲鱼用户发布的在线商品数同一时间不得超过50件。 四、【交易】 （一）【交易约定】交易前，买卖双方可针对交易及商品情况沟通交流，可选择线上交易或“见一见”见面交易。买方拍下且未付款到支付宝担保账户前，以及买家付款后卖方发货前，买卖双方均可自主关闭订单。线上交易卖方操作“我要发货”，或“见一见”交易卖方完成“扫码收款”即表示买卖双方达成交易约定。 （二）【交易超时】买卖双方选择闲鱼线上交易的，须遵守《闲鱼交
