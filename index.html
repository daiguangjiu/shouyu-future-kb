ytil-75a2f4.png\"><img src=\"assets/img/154554-6590yuyv-9430ec.png\"><img src=\"assets/img/154556-6145gyba-9a3f69.png\"><img src=\"assets/img/154558-3635kbbc-953ac4.png\"><img src=\"assets/img/154601-7731fsfv-b07550.png\"><img src=\"assets/img/154605-7888pofk-5799e8.png\"><img src=\"assets/img/154607-1362jhwt-664ee9.png\"><img src=\"assets/img/154610-0271sxhb-52d056.png\"><img src=\"assets/img/154613-6815blzs-2c7964.png\"><\/p>","text":"","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":11,"words":0,"sections":0,"subs":0,"version":""},"related":["sec-62","sec-57","a498772537632133","a498773110658437"]},{"id":"a498833513358725","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"信息发布与禁售限售","title":"闲鱼社区信息发布规范（完整版）","title_raw":"闲鱼社区信息发布规范（完整版）","html":"<h1 class=\"ql-align-center\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">闲鱼社区信息发布规范<\/span><\/h1><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\" class=\"ql-size-16px\">第一章&nbsp;总则<\/strong><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第一条&nbsp;目的<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">闲鱼社区的用户在闲鱼闲置资源交易社区内发布商品、帖子、评论等内容信息，直接或间接影响着其他用户体验和社区生态健康。为规范用户在闲鱼社区的信息发布行为，维护广大用户的权益和良好的社区生态环境，闲鱼社区依据相关法律法规等，秉持真实、安全、平等的闲鱼社区规则理念基础，制定本规范。<\/span><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第二条&nbsp;适用范围<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">本规范适用于闲鱼社区的所有用户，闲鱼社区服务形态包括但不限于移动客户端、小程序、域名为“goofish.com”的闲鱼网站等（包括未来技术发展出现的新的服务形态，以下统称“闲鱼社区”，其中域名及名称可能根据实际情况进行修改，届时以最新内容为准）。<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">发布信息范围包括但不限于商品信息及标题、帖子、评论、交易评价、留言、出价留言、问答、私聊、话题、表态、拼单、圈子、个人主页信息、短视频等（包括未来产品升级出现的新的产品形态）。信息格式包括但不限于文本、图片、视频、音频、直播、语音通话等。<\/span><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\" class=\"ql-size-16px\">第二章&nbsp;发布规范<\/strong><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第三条&nbsp;禁止发布的信息<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（一）枪支弹药、危险武器、军警及行政机关用品类：如枪支及其配件、军火、管制器具（如管制刀具、弩、飞镖等杀伤性冷兵器） 、军警标志/服装/器具、行政机关的标志/制服/专用工具等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（二）易燃易爆、危险化学品、毒品类：如炸弹、火药、毒品、制毒原料/化学品、致瘾性药物、吸毒工具/配件/相关教程、烟花爆竹、腐蚀性/易燃易爆/有毒类化学品、放射性物质及射线装置等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（三） 危害国家安全、破坏政治与社会稳定的有害信息类：如分裂/破坏国家统一、泄露国家机密、宣扬反动/邪<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">教、损害国家名誉等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（四）色情低俗、催情用品类：如含色情淫秽内容的音像/视频/游戏/软件/图文等、色情网站相关、色情低俗服务、原味、催情类用品等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（五）涉及人身隐私、安全类：如禁止出售的航空器、车辆及“五大总成”、破坏行驶安全的配件（如安全带插口）、侵犯个人隐私类的数据/服务/软件/设备等（如监听/窃取隐私或机密的软件/设备、身份证件、个人隐私信息、企业内部敏感信息、盗取/破解账号密码的软件/工具等、群发设备/软件/服务等）、辱骂/恶意中伤/人身攻击的信息等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（六）药品、医疗器械、保健食品类：如药品、医疗器械、美容针剂、农药、兽药、病原微生物（能够使人或者动物致病的微生物）、保健食品、奶粉、食品添加剂类商品。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（七）非法服务、票证、违反公序良俗类：如需特定资质/机构方可提供产品或服务（如代办社会公共服务/行政管理事务、募捐类、军需、特供商品、境外出版物及代购服务等），发布作弊/虚假商品或信息（如假章、假证、假发票、学术/考试作弊、代接电话、代体检、代炒作、代投票等）、规避出入境流程的商品及服务、赌博、翻墙软件、迷信、违反公序良俗的商品等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（八）动植物、器官及捕杀工具类：如人口买卖、人体器官（含卵子、精子等）、保护动植物、动物捕杀工具（含配件）、猫狗肉/皮毛、鱼翅、熊胆及其制品等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（九）涉及盗取等非法所得及非法用途软件、工具或设备类：如非法渠道物资、偷盗工具、作弊/造假工具（如电子秤、指纹膜、虚假定位、游戏外挂等）、群发设备/服务、蹭网设备/服务、信号屏蔽设备、涉嫌欺诈工具/服务、规避交通管理工具/服务、手机卡复<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">制<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">器、手机串号修改软件等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（十）具有实施电信网络诈骗用途的设备、软件及服务类：电话卡批量插入设备（如多卡接收器\\卡槽 、多卡宝、GoIP设备、猫池等），批量账号、网络地址自动切换或批量接收提供短信验证、语音验证的设备、软件及服务（如短信猫、网页\\APP\\账号代短信验证服务及软件、IP修改/代理/伪造的软件及服务、打码/扫码/接码平台、IP转换软件及服务、秒拨IP等），具有改变主叫号码、虚拟拨号、互联网电话违规接入公用电信网络等功能的设备或软件（如改号软件、伪基站、VOIP、Google Voice等），为他人实施电信诈骗活动提供帮助的商品或服务（如短信端口服务/源码、仿冒网页\\APP\\小程序制作服务或源码等）。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（十一）假冒商品、不当使用他人权利的商品或信息类：如假冒注册商标、盗版、侵犯他人商标权/著作权/专利权的商品或信息。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（十二）未经允许违反国家行政法规或不适合交易的商品或信息类：如流通中的货币及兑换服务、电子货币及衍生服务、假币及印刷设备、手机卡/上网卡、文物、烟草、禁止或限制进出口的商品或服务等、未经国家备案/官方已停运的游戏相关、棋牌类游戏点卡、外挂/私服相关的网游商品、互联网用户账号、SP业务自消费类、航空公司积分/里程及兑换的机票、机票代订、充值平台软件/加款卡、不可查询的虚拟服务商品、一次性发泡塑料餐具等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（十三）其他违反法规或平台要求的高风险类：如非法传销、不合格商品、禁止发行及停售的出版物、实际不存在商品、干扰公平秩序的软件/服务、制假风险的品牌配件（如品牌空瓶、空酒瓶、空奶粉罐等）、引导站外、垃圾无效广告、虚假夸大宣传存在误导、信息要素不一致、借用话题/内容炒作引导等。<\/span><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第四条&nbsp;按要求发布的信息<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（一）出版物类商品 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">出版物是指图书、报纸、期刊、音像制品、地图、挂历、电子出版物等。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">二级类目“图书”商品需扫描ISBN编码发布，发布的单一闲置物品信息中不得含有多件出版物类物品信息（套装出版物除外）。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">从事商业经营活动的经营性卖家，需要上传出版物经营许可证、出版物租赁备案、营业执照等资质证明，经平台审核通过后方可发布。<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（二）食品类商品 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">用户发布食品类商品，需上传食品经营许可证、预包装食品销售备案凭证、食品生产许可证、小作坊许可证、营业执照等资质证明，经平台审核通过后方可发布。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">不支持发布保健食品、奶粉、食品添加剂类商品。<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（三）演出门票类商品<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">用户不得在未获得合法票品销售资质或确认合法票品来源情况下发布演出门票类商品，不得发布涉嫌违法违规、无效等情形的演出、赛事、展览等各类活动票品或类似、相关票品。<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（四）电子卡券类商品<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">电子卡券是指话费充值卡、加油卡、电商/商超卡、游戏卡、视频娱乐卡、咖啡美食卡券、旅游出行卡券等电子形式的卡券。<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">用户需在指定的回收频道提交电子卡券信息进行交易，不得通过发布闲置物品的方式发布电子卡券类商品。<\/span><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">（五）兼职信息类商品 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">发布此类信息的用户主体必须是企业或获得企业授权，且发布信息真实有效。 <\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0);\">（六）特定频道的类目要求<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">用户在“海鲜市场”频道发布拼单，禁止发布包括但不限于生活服务/票务/卡券、技能服务、兼职、房屋租赁、个人服务、游戏等类目的商品。<\/span><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0);\"> <\/span><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\" class=\"ql-size-16px\">第三章&nbsp;违规管理<\/strong><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第五条&nbsp;违规管理<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">用户在闲鱼社区不得发布违反国家相关法律法规和闲鱼社区相关管理规范的商品或信息。若闲鱼主动发现，或经用户举报等方式核实用户存在违反本规范的行为，闲鱼可根据用户违规的具体情况及严重程度，根据本规范、《闲鱼社区管理规范（试行）》等采取包括下架/删除/屏蔽/降权违规信息、限制发布商品、限制发布互动（如帖子、留言、评论、点赞、表态、聊天、问答、个人主页等）、限制交易、扣分甚至冻结账户等处置措施。针对情节严重的，闲鱼将建立违规公示名单，在社区内公开披露相关违规情形，涉嫌违法违规的，闲鱼将配合移送相关国家机关处理。更详细的违规管理内容见《闲鱼社区管理规范（试行）》。<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第六条&nbsp;争议处理<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">用户如对平台对其发布的信息进行管理存在争议，可在规定时间内向平台提交申诉。平台将会对用户发布的信息进行复核并给出处理意见。用户也可以向闲鱼社区举报其他用户发布的违反本规范的信息或行为。<\/span><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"><\/span><\/p><p class=\"ql-align-justify\"><strong style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\" class=\"ql-size-16px\">第四章&nbsp;其他<\/strong><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第七条&nbsp;上位规范<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">本规范中已有规定的从本规范，本规范未有规定的依据《闲鱼社区公约》、《闲鱼社区管理规范（试行）》等其他相关规则执行。<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第八条&nbsp;内容更新<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">为进一步改善用户体验，闲鱼社区将会持续升级产品功能和调整服务，本规范可能会随之更新。此外，闲鱼将会根据国家法律法规的变化要求，更新本规范的内容。更新内容将于本规范更新公告公布的生效之日起生效。<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">第九条&nbsp;生效<\/span><\/p><p class=\"ql-align-justify\"><br><\/p><p class=\"ql-align-justify\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">本规范的修订日期是2023年6月19日，正式生效日期是2023年6月26日。<\/span><\/p><p class=\"ql-align-right\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-right\">\t<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\"> <\/span><\/p><p class=\"ql-align-right\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">闲鱼社区<\/span><\/p><p class=\"ql-align-right\"><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(38, 38, 38);\">2023年06月26日<\/span><\/p>","text":"闲鱼社区信息发布规范 第一章 总则 第一条 目的 闲鱼社区的用户在闲鱼闲置资源交易社区内发布商品、帖子、评论等内容信息，直接或间接影响着其他用户体验和社区生态健康。为规范用户在闲鱼社区的信息发布行为，维护广大用户的权益和良好的社区生态环境，闲鱼社区依据相关法律法规等，秉持真实、安全、平等的闲鱼社区规则理念基础，制定本规范。 第二条 适用范围 本规范适用于闲鱼社区的所有用户，闲鱼社区服务形态包括但不限于移动客户端、小程序、域名为“goofish.com”的闲鱼网站等（包括未来技术发展出现的新的服务形态，以下统称“闲鱼社区”，其中域名及名称可能根据实际情况进行修改，届时以最新内容为准）。 发布信息范围包括但不限于商品信息及标题、帖子、评论、交易评价、留言、出价留言、问答、私聊、话题、表态、拼单、圈子、个人主页信息、短视频等（包括未来产品升级出现的新的产品形态）。信息格式包括但不限于文本、图片、视频、音频、直播、语音通话等。 第二章 发布规范 第三条 禁止发布的信息 （一）枪支弹药、危险武器、军警及行政机关用品类：如枪支及其配件、军火、管制器具（如管制刀具、弩、飞镖等杀伤性冷兵器） 、军警标志/服装/器具、行政机关的标志/制服/专用工具等。 （二）易燃易爆、危险化学品、毒品类：如炸弹、火药、毒品、制毒原料/化学品、致瘾性药物、吸毒工具/配件/相关教程、烟花爆竹、腐蚀性/易燃易爆/有毒类化学品、放射性物质及射线装置等。 （三） 危害国家安全、破坏政治与社会稳定的有害信息类：如分裂/破坏国家统一、泄露国家机密、宣扬反动/邪 ​ 教、损害国家名誉等。 （四）色情低俗、催情用品类：如含色情淫秽内容的音像/视频/游戏/软件/图文等、色情网站相关、色情低俗服务、原味、催情类用品等。 （五）涉及人身隐私、安全类：如禁止出售的航空器、车辆及“五大总成”、破坏行驶安全的配件（如安全带插口）、侵犯个人隐私类的数据/服务/软件/设备等（如监听/窃取隐私或机密的软件/设备、身份证件、个人隐私信息、企业内部敏感信息、盗取/破解账号密码的软件/工具等、群发设备/软件/服务等）、辱骂/恶意中伤/人身攻击的信息等。 （六）药品、医疗器械、保健食品类：如药品、医疗器械、美容针剂、农药、兽药、病原微生物（能够使人或者动物致病的微生物）、保健食品、奶粉、食品添加剂类商品。 （七）非法服务、票证、违反公序良俗类：如需特定资质/机构方可提供产品或服务（如代办社会公共服务/行政管理事务、募捐类、军需、特供商品、境外出版物及代购服务等），发布作弊/虚假商品或信息（如假章、假证、假发票、学术/考试作弊、代接电话、代体检、代炒作、代投票等）、规避出入境流程的商品及服务、赌博、翻墙软件、迷信、违反公序良俗的商品等。 （八）动植物、器官及捕杀工具类：如人口买卖、人体器官（含卵子、精子等）、保护动植物、动物捕杀工具（含配件）、猫狗肉/皮毛、鱼翅、熊胆及其制品等。 （九）涉及盗取等非法所得及非法用途软件、工具或设备类：如非法渠道物资、偷盗工具、作弊/造假工具（如电子秤、指纹膜、虚假定位、游戏外挂等）、群发设备/服务、蹭网设备/服务、信号屏蔽设备、涉嫌欺诈工具/服务、规避交通管理工具/服务、手机卡复 ​ 制 ​ 器、手机串号修改软件等。 （十）具有实施电信网络诈骗用途的设备、软件及服务类：电话卡批量插入设备（如多卡接收器\\卡槽 、多卡宝、GoIP设备、猫池等），批量账号、网络地址自动切换或批量接收提供短信验证、语音验证的设备、软件及服务（如短信猫、网页\\APP\\账号代短信验证服务及软件、IP修改/代理/伪造的软件及服务、打码/扫码/接码平台、IP转换软件及服务、秒拨IP等），具有改变主叫号码、虚拟拨号、互联网电话违规接入公用电信网络等功能的设备或软件（如改号软件、伪基站、VOIP、Google Voice等），为他人实施电信诈骗活动提供帮助的商品或服务（如短信端口服务/源码、仿冒网页\\APP\\小程序制作服务或源码等）。 （十一）假冒商品、不当使用他人权利的商品或信息类：如假冒注册商标、盗版、侵犯他人商标权/著作权/专利权的商品或信息。 （十二）未经允许违反国家行政法规或不适合交易的商品或信息类：如流通中的货币及兑换服务、电子货币及衍生服务、假币及印刷设备、手机卡/上网卡、文物、烟草、禁止或限制进出口的商品或服务等、未经国家备案/官方已停运的游戏相关、棋牌类游戏点卡、外挂/私服相关的网游商品、互联网用户账号、SP业务自消费类、航空公司积分/里程及兑换的机票、机票代订、充值平台软件/加款卡、不可查询的虚拟服务商品、一次性发泡塑料餐具等。 （十三）其他违反法规或平台要求的高风险类：如非法传销、不合格商品、禁止发行及停售的出版物、实际不存在商品、干扰公平秩序的软件/服务、制假风险的品牌配件（如品牌空瓶、空酒瓶、空奶粉罐等）、引导站外、垃圾无效广告、虚假夸大宣传存在误导、信息要素不一致、借用话题/内容炒作引导等。 第四条 按要求发布的信息 （一）出版物类商品 出版物是指图书、报纸、期刊、音像制品、地图、挂历、电子出版物等。 二级类目“图书”商品需扫描ISBN编码发布，发布的单一闲置物品信息中不得含有多件出版物类物品信息（套装出版物除外）。 从事商业经营活动的经营性卖家，需要上传出版物经营许可证、出版物租赁备案、营业执照等资质证明，经平台审核通过后方可发布。 （二）食品类商品 用户发布食品类商品，需上传食品经营许可证、预包装食品销售备案凭证、食品生产许可证、小作坊许可证、营业执照等资质证明，经平台审核通过后方可发布。 不支持发布保健食品、奶粉、食品添加剂类商品。 （三）演出门票类商品 用户不得在未获得合法票品销售资质或确认合法票品来源情况下发布演出门票类商品，不得发布涉嫌违法违规、无效等情形的演出、赛事、展览等各类活动票品或类似、相关票品。 （四）电子卡券类商品 电子卡券是指话费充值卡、加油卡、电商/商超卡、游戏卡、视频娱乐卡、咖啡美食卡券、旅游出行卡券等电子形式的卡券。 用户需在指定的回收频道提交电子卡券信息进行交易，不得通过发布闲置物品的方式发布电子卡券类商品。 （五）兼职信息类商品 发布此类信息的用户主体必须是企业或获得企业授权，且发布信息真实有效。 （六）特定频道的类目要求 用户在“海鲜市场”频道发布拼单，禁止发布包括但不限于生活服务/票务/卡券、技能服务、兼职、房屋租赁、个人服务、游戏等类目的商品。 第三章 违规管理 第五条 违规管理 用户在闲鱼社区不得发布违反国家相关法律法规和闲鱼社区相关管理规范的商品或信息。若闲鱼主动发现，或经用户举报等方式核实用户存在违反本规范的行为，闲鱼可根据用户违规的具体情况及严重程度，根据本规范、《闲鱼社区管理规范（试行）》等采取包括下架/删除/屏蔽/降权违规信息、限制发布商品、限制发布互动（如帖子、留言、评论、点赞、表态、聊天、问答、个人主页等）、限制交易、扣分甚至冻结账户等处置措施。针对情节严重的，闲鱼将建立违规公示名单，在社区内公开披露相关违规情形，涉嫌违法违规的，闲鱼将配合移送相关国家机关处理。更详细的违规管理内容见《闲鱼社区管理规范（试行）》。 第六条 争议处理 用户如对平台对其发布的信息进行管理存在争议，可在规定时间内向平台提交申诉。平台将会对用户发布的信息进行复核并给出处理意见。用户也可以向闲鱼社区举报其他用户发布的违反本规范的信息或行为。 第四章 其他 第七条 上位规范 本规范中已有规定的从本规范，本规范未有规定的依据《闲鱼社区公约》、《闲鱼社区管理规范（试行）》等其他相关规则执行。 第八条 内容更新 为进一步改善用户体验，闲鱼社区将会持续升级产品功能和调整服务，本规范可能会随之更新。此外，闲鱼将会根据国家法律法规的变化要求，更新本规范的内容。更新内容将于本规范更新公告公布的生效之日起生效。 第九条 生效 本规范的修订日期是2023年6月19日，正式生效日期是2023年6月26日。 闲鱼社区 2023年06月26日","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":3309,"sections":0,"subs":0,"version":""},"related":["sec-57","sec-62","sec-76","sec-23"]},{"id":"a498772537632133","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"信息发布与禁售限售","title":"闲鱼成人用品/情趣用品商品及信息发布规范","title_raw":"闲鱼成人用品/情趣用品商品及信息发布规范","html":"<p class=\"ql-align-center\"><strong style=\"color: rgb(31, 38, 51);\" class=\"ql-size-16px\">闲鱼成人用品/情趣用品商品及信息发布规范<\/strong><\/p><p class=\"ql-align-center\"><br><\/p><h3><span style=\"color: black;\">第一条【适用范围】<\/span><\/h3><p><span style=\"color: rgb(0, 0, 0);\">本规范适用于在闲鱼发布“成人用品/情趣用品”商品或信息的用户。<\/span><\/p><h3><span style=\"color: black;\">第二条【商品及信息发布具体规范】<\/span><\/h3><h4><span style=\"color: rgb(0, 0, 0);\">（一）图片类发布规范<\/span><\/h4><p>1.直接或间接展示人体隐私部位（女性上两点下一点、男性下一点、露毛、露乳晕、凸点、露屁股、龟头、睾丸等）；<\/p><p>2.<span style=\"color: rgb(0, 0, 0);\">直接展示不雅动作<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">（1）真人或仿真人不雅动作，如撅臀、趴裆、真人性姿势等；<\/span><\/p><p><img src=\"https://file.goofish.pro/cms/image/20231230/112021-4610lmcr.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">（2）情趣用品本身带有性爱姿势；<\/span><img src=\"assets/img/112036-9119yzcn-f847cf.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">（3）对性生殖器官或女性乳房进行扒、捏或展示；<\/span><img src=\"assets/img/112044-7317frho-a322d9.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">3.含有表现或隐晦表现性行为、性挑逗等令人引发性行为联想的元素。具体包括<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">（1）具有挑逗性的图片，如面部表情迷离、泛红晕、不明液体等<\/span><img src=\"assets/img/112101-4606baqz-266652.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">（2）具体或暗示性行为的图片，如男男、女女、男女性爱舌吻等<\/span><img src=\"assets/img/112238-0360uyfi-a8db72.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">（3）演示仿真器具或性爱工具<\/span><img src=\"assets/img/112304-9107dhxg-b2d15c.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">4.图片仅可用于展示产品自身实物内容（含外包装），不得附加额外的人物形象、文字宣传<\/span><img src=\"https://file.goofish.pro/cms/image/20231230/112317-8241vaqp.png\"><img src=\"https://file.goofish.pro/cms/image/20231230/112430-9536lhcq.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">5.生殖器或类生殖器样式以及倒模等商品不得做图片展示（含图片遮挡）<\/span><img src=\"assets/img/112458-8974qwch-0bd94f.png\"><\/p><p>6.<span style=\"color: rgb(0, 0, 0);\">不可以真人或类真人形式展示如卡通形象（充气娃娃需遵循其他规范），包括但不限于以下形式：<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">（1）SM道具等特殊场景道具<\/span><\/p><p><img src=\"assets/img/112512-8545tymy-0defd6.png\"><img src=\"assets/img/112615-0561bafs-1d829e.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">（2）成人性生殖器具（如飞机杯等）<\/span><img src=\"assets/img/112626-4234czen-679b9b.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">（3）情趣内衣类商品不得通过人物穿戴方式展示产品实物<\/span><\/p><p><img src=\"assets/img/112643-4297gywh-b09da5.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">7.充气娃娃类商品不得使用以下类型图片展示<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">（1）不得使用真人图片展示<\/span><\/p><p><img src=\"assets/img/112654-4466jzbz-9deb93.png\"><\/p><p><span style=\"color: rgb(0, 0, 0);\">（2）不得突出展示臀部、胸部、私处以及其他可引发性联想的部位<\/span><img src=\"assets/img/112704-5458qlio-3426c0.png\"><\/p><p><span style=\"color: rgb(64, 64, 64);\">8.<\/span><span style=\"color: rgb(0, 0, 0);\">不得涉及未成年形象或疑似未成年人装扮（如高中校服）<\/span><\/p><p><img src=\"https://file.goofish.pro/cms/image/20231230/112718-3935dgpp.png\"><img src=\"assets/img/112720-0679jhqs-5e640f.png\"><\/p><h4><span style=\"color: rgb(0, 0, 0);\">（二）文字描述类发布规范<\/span><\/h4><p>1.<span style=\"color: rgb(0, 0, 0);\">不得使用未成年人及学生相关描述，如大学生、在校生<\/span><\/p><p><img src=\"assets/img/112730-5028naax-f7ef8d.png\"><\/p><p><span style=\"color: rgb(64, 64, 64);\">2.<\/span><span style=\"color: rgb(0, 0, 0);\">不得含有明显性场景、性暗示的描述，如莞式服务<\/span><img src=\"assets/img/112741-4005wkgh-7d4a84.png\"><\/p><p><span style=\"color: rgb(64, 64, 64);\">3.<\/span><span style=\"color: rgb(0, 0, 0);\">不得含有赠送资源、视频等暗示涉及传播淫秽色情内容的描述<\/span><\/p><p><img src=\"assets/img/112755-8962uhva-946aca.png\"><\/p><p><span style=\"color: rgb(64, 64, 64);\">4.<\/span><span style=\"color: rgb(0, 0, 0);\">不得含有违背公序良俗的低俗描述，如凶器、腿玩年等。<\/span><\/p><h4><span style=\"color: rgb(0, 0, 0);\">（三）正确发布展示样例<\/span><\/h4><p><span style=\"color: rgb(0, 0, 0);\">成人用品/情趣用品发布时仅能展示商品本身图片，且不涉及上述违规展现。可参考以下样例，<\/span><\/p><p><img src=\"assets/img/112817-1343hjui-09f672.png\"><\/p><p><img src=\"assets/img/112826-9182kgfl-b53856.png\"><img src=\"assets/img/112831-5364ckth-88d3a7.png\"><img src=\"assets/img/112835-6216ityl-0d9e51.png\"><\/p><h3><span style=\"color: black;\">第三条【生效时间】<\/span><\/h3><p><span style=\"color: black;\">本规范于2022年7月11日首次生效<\/span><span style=\"color: rgb(38, 38, 38);\">。<\/span><\/p>","text":"闲鱼成人用品/情趣用品商品及信息发布规范 第一条【适用范围】 本规范适用于在闲鱼发布“成人用品/情趣用品”商品或信息的用户。 第二条【商品及信息发布具体规范】 （一）图片类发布规范 1.直接或间接展示人体隐私部位（女性上两点下一点、男性下一点、露毛、露乳晕、凸点、露屁股、龟头、睾丸等）； 2. 直接展示不雅动作 （1）真人或仿真人不雅动作，如撅臀、趴裆、真人性姿势等； （2）情趣用品本身带有性爱姿势； （3）对性生殖器官或女性乳房进行扒、捏或展示； 3.含有表现或隐晦表现性行为、性挑逗等令人引发性行为联想的元素。具体包括 （1）具有挑逗性的图片，如面部表情迷离、泛红晕、不明液体等 （2）具体或暗示性行为的图片，如男男、女女、男女性爱舌吻等 （3）演示仿真器具或性爱工具 4.图片仅可用于展示产品自身实物内容（含外包装），不得附加额外的人物形象、文字宣传 5.生殖器或类生殖器样式以及倒模等商品不得做图片展示（含图片遮挡） 6. 不可以真人或类真人形式展示如卡通形象（充气娃娃需遵循其他规范），包括但不限于以下形式： （1）SM道具等特殊场景道具 （2）成人性生殖器具（如飞机杯等） （3）情趣内衣类商品不得通过人物穿戴方式展示产品实物 7.充气娃娃类商品不得使用以下类型图片展示 （1）不得使用真人图片展示 （2）不得突出展示臀部、胸部、私处以及其他可引发性联想的部位 8. 不得涉及未成年形象或疑似未成年人装扮（如高中校服） （二）文字描述类发布规范 1. 不得使用未成年人及学生相关描述，如大学生、在校生 2. 不得含有明显性场景、性暗示的描述，如莞式服务 3. 不得含有赠送资源、视频等暗示涉及传播淫秽色情内容的描述 4. 不得含有违背公序良俗的低俗描述，如凶器、腿玩年等。 （三）正确发布展示样例 成人用品/情趣用品发布时仅能展示商品本身图片，且不涉及上述违规展现。可参考以下样例， 第三条【生效时间】 本规范于2022年7月11日首次生效 。","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":24,"words":830,"sections":0,"subs":0,"version":""},"related":["sec-62","sec-57","a498835398546821","a498422174320005"]},{"id":"a498490926056837","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"信息发布与禁售限售","title":"合规重点风险学习","title_raw":"合规重点风险学习","html":"<p><img src=\"assets/img/162354-3613gdvq-24bc12.png\"><img src=\"assets/img/162357-9716ntse-cbf5d6.png\"><img src=\"assets/img/162359-9267ynwb-1b2e65.png\"><img src=\"assets/img/162401-6274balx-688670.png\"><img src=\"assets/img/162403-1796zwuy-f5b3bd.png\"><img src=\"assets/img/162405-7583skcs-2b8dd8.png\"><img src=\"assets/img/162408-8219nysc-2d1893.png\"><img src=\"assets/img/162414-6649lcgc-9cf0e4.png\"><\/p>","text":"","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":8,"words":0,"sections":0,"subs":0,"version":""},"related":[]}]},{"module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"管理规范与违规处罚","color":"green","count":5,"items":[{"id":"sec-62","kind":"chapter","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"管理规范与违规处罚","title":"第十二章 合规风控与违规避坑","title_raw":"第十二章 合规风控与违规避坑","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-63\">12.1 违规等级与处罚<\/h3><table>\n<thead>\n<tr>\n<th>等级<\/th>\n<th>典型行为<\/th>\n<th>处罚<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>扣分档位（官方）<\/td>\n<td>一般情节（信息不全、类目错放、轻度描述不当等）<\/td>\n<td><strong>每次扣 1 分<\/strong><\/td>\n<\/tr>\n<tr>\n<td>扣分档位（官方）<\/td>\n<td>严重情节（累犯、多条并犯、已损害他人或平台权益）<\/td>\n<td><strong>每次扣 20 分<\/strong><\/td>\n<\/tr>\n<tr>\n<td>扣分档位（官方）<\/td>\n<td>特别严重情节（手段恶劣、刻意规避、造成严重后果）<\/td>\n<td><strong>每次扣 100 分<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>官方计分逻辑（重要，勿按「累计扣分」理解）<\/strong>：闲鱼的信用分叫<strong>闲气值<\/strong>，满分 100 分，<strong>当前闲气值 = 100 − 近 90 天内因违规被扣分数的总和<\/strong>；扣到 0 分后分值不再变化。也就是说——<strong>违规记录会在 90 天内滚动生效、90 天后自动恢复<\/strong>，不存在「攒够 20 分降权」这类累计阈值。<\/p>\n<table>\n<thead>\n<tr>\n<th>闲气值区间<\/th>\n<th>平台处置（官方口径）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>81–100 分<\/td>\n<td>正常，无额外限制<\/td>\n<\/tr>\n<tr>\n<td>61–80 分<\/td>\n<td>下架全部商品 + 禁止发布与互动 7 天<\/td>\n<\/tr>\n<tr>\n<td>31–60 分<\/td>\n<td>同上，限制期 14 天<\/td>\n<\/tr>\n<tr>\n<td>1–30 分<\/td>\n<td>同上，限制期 21 天<\/td>\n<\/tr>\n<tr>\n<td>0 分<\/td>\n<td>永久限制（分值不再恢复）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ 典型扣分示例（官方规范）：引导站外交易一般扣 1 分、严重扣 20 分、特别严重扣 100 分；刷单/虚假交易属扰乱平台秩序，严重 40 分、特别严重 100 分；<strong>售假被权利人投诉同一自然年累计 3 次 → 扣 100 分且分值不再恢复、永久限制<\/strong>。<\/p>\n<h3 id=\"sec-64\">12.2 十大运营禁区<\/h3><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>禁区<\/th>\n<th>避坑方法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>选品踩红线（盗版/仿品/违禁品）<\/td>\n<td>熟记禁售清单，上架前自查<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>批量操作账号（同WiFi多号）<\/td>\n<td>一机一卡一号，独立网络<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>频繁修改商品信息<\/td>\n<td>首发即优化，用优惠券变相调价<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>忽视售后服务<\/td>\n<td>描述标准化，主动承担退货运费<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>刷单与虚假交易<\/td>\n<td>用自然流量+付费推广替代<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>引导站外交易（留微信/QQ/二维码/站外链接）<\/td>\n<td><strong>只走官方【发送站外信息】通道<\/strong>（聊天框「+」→发送站外信息，每类最多存5条，买家「确认查看」后可见）；禁止谐音、拼音、emoji、图片藏号、语音暗示<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>低价内卷（客单价＜50元）<\/td>\n<td>走高利润赛道，捆绑销售提升客单价<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>忽视平台规则更新<\/td>\n<td>每月1日查看&quot;闲鱼公约&quot;更新<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>物流管理混乱<\/td>\n<td>24小时发货+上传单号+拍照留证<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>数据盲目优化<\/td>\n<td>基于数据看板做决策，不凭感觉<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-65\">12.3 商品描述违禁词清单<\/h3><p>以下词汇严禁出现在商品标题、描述、聊天中：<\/p>\n<p><strong>商品/品牌类<\/strong>：高仿、A货、1:1、原单、尾货、精仿、复刻、水货、走私、孤品、绝版、唯一<br/>\n<strong>广告法极限词<\/strong>：最好、最棒、第一、全网最低、绝对、100%、国家级、万能、特效、顶级<br/>\n<strong>引流类<\/strong>：加VX、加微信、加QQ、扫码、仅支持线下交易，以及「V我」「+V」「卫星」「喂信」等谐音变体<br/>\n<strong>2026 年新增高危（暗语识别已升级）<\/strong>：代做、代写、论文、作业、学习资料、网盘资源、游戏账号、游戏CDK、Steam家教、陪聊、树洞、虚拟恋人、邮箱盲盒<br/>\n<strong>论文类特别提示（2026-10-10 官方专项治理，见 15.6 ⑤）<\/strong>：提供学术论文代写服务、售卖论文代写工具，以及以「论文辅导 / 润色 / 查重降重」等名义实质承接代写的变相形式，均属违法违规信息——2026 年 9 月单月平台已下架处置相关商品 636 件，文案与聊天中一律不得出现\n<br/>\n<strong>色情类高危（2026-09-18 专项治理，永久封禁档）<\/strong>：色情暗示词——可约、同城可约、上门服务、全套、懂的私、私聊详谈、原味、模特上门约拍、上门健身；伪装式暗号——以<strong>普通商品名 + 数字或符号组合<\/strong>（如小配件、硬币、安装类服务名等）暗示服务内容与时长。此类内容一经识别即永久封禁、无解封通道，圈子场景另见 7.4.3 ⑤<\/p>\n<p>⚠️ 平台不公开完整词表，以上为高频触发项；<strong>正式发布前务必用闲鱼 App 的「发布检测」功能自查<\/strong>，以检测结果为准。<\/p>\n<h3 id=\"sec-66\">12.4 合规引流方法<\/h3><table>\n<thead>\n<tr>\n<th>方法<\/th>\n<th>操作<\/th>\n<th>风险<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 官方【发送站外信息】<\/td>\n<td>聊天框「+」→「发送站外信息」→ 添加手机号/微信号（每类最多存 5 条，同一账号所有宝贝共用）→ 发送后买家需点「确认查看」才可见，你会收到「买家已查看」提醒，查看记录沉淀到「客资管理」<\/td>\n<td>合规（官方通道）。注意：有类目与账号条件限制；发太频繁会被限流<\/td>\n<\/tr>\n<tr>\n<td>② 留资卡 / 线索通<\/td>\n<td>部分服务类目可开通留资卡，由买家留手机号，你通过虚拟号外呼<\/td>\n<td>合规（官方通道）；目前按账号逐步开放<\/td>\n<\/tr>\n<tr>\n<td>③ 官方虚拟号沟通<\/td>\n<td>订单履约、售后场景使用平台虚拟号联系买家<\/td>\n<td>合规<\/td>\n<\/tr>\n<tr>\n<td>④ 内容引流（会玩社区）<\/td>\n<td>发布真实使用心得/测评/避坑内容，靠内容质量自然吸引关注，不做硬广<\/td>\n<td>合规（注意：内容里同样不能出现联系方式）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>🚫 <strong>明令禁止（2026-04-20 站外引流专项治理重点打击，AI 可识别文字、图片 OCR、语音转文字、符号乱码、数字拆分、谐音暗语）<\/strong>：商品描述/聊天/图片/评论/个人主页/自动回复里出现微信号、QQ 号、手机号、二维码、站外链接；用谐音、拼音、emoji、空格拆数字、图片藏号、语音口述等方式绕过审核。<br/>\n处罚：<strong>首次违规禁言 7 天 + 全店商品下架，二次违规账号永久受限<\/strong>，无缓冲空间。<\/p>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 12.1 违规等级与处罚 等级 典型行为 处罚 扣分档位（官方） 一般情节（信息不全、类目错放、轻度描述不当等） 每次扣 1 分 扣分档位（官方） 严重情节（累犯、多条并犯、已损害他人或平台权益） 每次扣 20 分 扣分档位（官方） 特别严重情节（手段恶劣、刻意规避、造成严重后果） 每次扣 100 分 官方计分逻辑（重要，勿按「累计扣分」理解） ：闲鱼的信用分叫 闲气值 ，满分 100 分， 当前闲气值 = 100 − 近 90 天内因违规被扣分数的总和 ；扣到 0 分后分值不再变化。也就是说—— 违规记录会在 90 天内滚动生效、90 天后自动恢复 ，不存在「攒够 20 分降权」这类累计阈值。 闲气值区间 平台处置（官方口径） 81–100 分 正常，无额外限制 61–80 分 下架全部商品 + 禁止发布与互动 7 天 31–60 分 同上，限制期 14 天 1–30 分 同上，限制期 21 天 0 分 永久限制（分值不再恢复） ⚠️ 典型扣分示例（官方规范）：引导站外交易一般扣 1 分、严重扣 20 分、特别严重扣 100 分；刷单/虚假交易属扰乱平台秩序，严重 40 分、特别严重 100 分； 售假被权利人投诉同一自然年累计 3 次 → 扣 100 分且分值不再恢复、永久限制 。 12.2 十大运营禁区 # 禁区 避坑方法 1 选品踩红线（盗版/仿品/违禁品） 熟记禁售清单，上架前自查 2 批量操作账号（同WiFi多号） 一机一卡一号，独立网络 3 频繁修改商品信息 首发即优化，用优惠券变相调价 4 忽视售后服务 描述标准化，主动承担退货运费 5 刷单与虚假交易 用自然流量+付费推广替代 6 引导站外交易（留微信/QQ/二维码/站外链接） 只走官方【发送站外信息】通道 （聊天框「+」→发送站外信息，每类最多存5条，买家「确认查看」后可见）；禁止谐音、拼音、emoji、图片藏号、语音暗示 7 低价内卷（客单价＜50元） 走高利润赛道，捆绑销售提升客单价 8 忽视平台规则更新 每月1日查看\"闲鱼公约\"更新 9 物流管理混乱 24小时发货+上传单号+拍照留证 10 数据盲目优化 基于数据看板做决策，不凭感觉 12.3 商品描述违禁词清单 以下词汇严禁出现在商品标题、描述、聊天中： 商品/品牌类 ：高仿、A货、1:1、原单、尾货、精仿、复刻、水货、走私、孤品、绝版、唯一 广告法极限词 ：最好、最棒、第一、全网最低、绝对、100%、国家级、万能、特效、顶级 引流类 ：加VX、加微信、加QQ、扫码、仅支持线下交易，以及「V我」「+V」「卫星」「喂信」等谐音变体 2026 年新增高危（暗语识别已升级） ：代做、代写、论文、作业、学习资料、网盘资源、游戏账号、游戏CDK、Steam家教、陪聊、树洞、虚拟恋人、邮箱盲盒 论文类特别提示（2026-10-10 官方专项治理，见 15.6 ⑤） ：提供学术论文代写服务、售卖论文代写工具，以及以「论文辅导 / 润色 / 查重降重」等名义实质承接代写的变相形式，均属违法违规信息——2026 年 9 月单月平台已下架处置相关商品 636 件，文案与聊天中一律不得出现 色情类高危（2026-09-18 专项治理，永久封禁档） ：色情暗示词——可约、同城可约、上门服务、全套、懂的私、私聊详谈、原味、模特上门约拍、上门健身；伪装式暗号——以 普通商品名 + 数字或符号组合 （如小配件、硬币、安装类服务名等）暗示服务内容与时长。此类内容一经识别即永久封禁、无解封通道，圈子场景另见 7.4.3 ⑤ ⚠️ 平台不公开完整词表，以上为高频触发项； 正式发布前务必用闲鱼 App 的「发布检测」功能自查 ，以检测结果为准。 12.4 合规引流方法 方法 操作 风险 ① 官方【发送站外信息】 聊天框「+」→「发送站外信息」→ 添加手机号/微信号（每类最多存 5 条，同一账号所有宝贝共用）→ 发送后买家需点「确认查看」才可见，你会收到「买家已查看」提醒，查看记录沉淀到「客资管理」 合规（官方通道）。注意：有类目与账号条件限制；发太频繁会被限流 ② 留资卡 / 线索通 部分服务类目可开通留资卡，由买家留手机号，你通过虚拟号外呼 合规（官方通道）；目前按账号逐步开放 ③ 官方虚拟号沟通 订单履约、售后场景使用平台虚拟号联系买家 合规 ④ 内容引流（会玩社区） 发布真实使用心得/测评/避坑内容，靠内容质量自然吸引关注，不做硬广 合规（注意：内容里同样不能出现联系方式） 🚫 明令禁止（2026-04-20 站外引流专项治理重点打击，AI 可识别文字、图片 OCR、语音转文字、符号乱码、数字拆分、谐音暗语） ：商品描述/聊天/图片/评论/个人主页/自动回复里出现微信号、QQ 号、手机号、二维码、站外链接；用谐音、拼音、emoji、空格拆数字、图片藏号、语音口述等方式绕过审核。 处罚： 首次违规禁言 7 天 + 全店商品下架，二次违规账号永久受限 ，无缓冲空间。","toc":[{"id":"sec-63","title":"12.1 违规等级与处罚"},{"id":"sec-64","title":"12.2 十大运营禁区"},{"id":"sec-65","title":"12.3 商品描述违禁词清单"},{"id":"sec-66","title":"12.4 合规引流方法"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":4,"imgs":0,"words":2155,"sections":4,"subs":0,"version":"V2026.10.12"},"related":["sec-23","sec-11","sec-86","sec-2"]},{"id":"a498832766117253","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"管理规范与违规处罚","title":"闲鱼社区管理规范（试行）","title_raw":"闲鱼社区管理规范（试行）","html":"<p class=\"ql-align-center\"><strong style=\"color: rgb(51, 51, 51);\">闲鱼社区管理规范（试行）<\/strong><\/p><p><span style=\"color: black;\"><\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第一章 概述<\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">第一节【适用范围】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">适用于所有的闲鱼用户（本规范试行期间逐步适用，具体以闲鱼通知为准），包括在闲鱼移动客户端、域名为“goofish.com”的闲鱼网站、小程序等发布/购买闲置商品、发布/浏览信息的闲鱼用户。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第二节【原则】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（一）闲鱼用户的所有行为均须遵守国家法律、法规规定、闲鱼规则要求，以及根据相应页面指引进行操作。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）试行本规范的闲鱼用户在本规范的适用上一律平等。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（三）除违反法律、法规规定外，闲鱼用户首次、非故意或轻微违规等的，视具体情节享有减免、从轻、警告、教育学习等替代性处理的机会。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（四）闲鱼用户累犯、多条并犯、或对其他会员或平台造成恶劣影响的，视具体情节从重或加重处理。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第二章 基本要求<\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">第三节【注册】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">根据闲鱼平台的流程和要求完成注册的会员可登录闲鱼社区，成为闲鱼用户，账号名注册后无法自行修改。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第四节【认证】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼用户在闲鱼发布信息、互动或交易时，需要通过实名认证，同时闲鱼用户须根据平台要求完成实人认证及认证复核，确保认证信息真实有效。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第五节【信息发布及审核】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">对闲鱼用户在闲鱼社区发布的部分商品及信息，闲鱼将采取随机方式进行审核，审核过程中如发现用户存在违法违规、恶意或故意规避行为的，闲鱼除处理商品及信息外，还将酌情采取扣分、处置限权等措施。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第六节【交易】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（一）【交易约定】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">交易前，买卖双方可针对交易及商品情况沟通交流，可选择线上交易或“见一见”见面交易。买方拍下且未付款到支付宝担保账号前，以及买方付款后卖方发货前，买卖双方均可自主关闭订单。线上交易卖方操作“我要发货”，或“见一见”交易卖方完成“扫码收款”即表示买卖双方达成交易约定。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）【交易超时】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">买卖双方选择通过闲鱼社区进行线上交易的，须遵守<\/span><span style=\"color: rgb(80, 124, 201);\">《闲鱼交易超时说明》<\/span><span style=\"color: rgb(51, 51, 51);\">的相关要求。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（三）【交易流程】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼支持支付宝担保交易，若买方对交易货物有疑问，买方可在确认收货（含系统超时自动确认收货）前提出退款申请。选择在线付款后见面交易或用“见一见”发起见面交易的，买方需当面验货，当面收货即表示买方对货物无异议。交易成功后，不支持售后维权。如买卖双方在交易过程中有争议，按照<\/span><span style=\"color: rgb(80, 124, 201);\">《闲鱼社区交易争议处理规范》<\/span><span style=\"color: rgb(51, 51, 51);\">处理。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（四）【交易评价】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">为确保评价内容能为买方购物决策提供可靠的依据，反映商品或服务的真实情况，买卖双方通过闲鱼评价工具发布评价的，其评价应当与交易的商品或服务具有关联性，且合法、客观、真实，买卖双方不得利用闲鱼评价侵害相关方合法权益。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第三章 社区管理<\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">第七节【违规管控】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（一）【危及交易安全】每次扣100分。对涉嫌危及交易安全的用户，闲鱼还可视情节严重程度直接对其订单、通知支付宝对其绑定的支付宝账号采取必要的管控措施等。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“危及交易安全”指涉嫌以非法获利为目的，造成交易任何一方出现严重钱/货损失的行为，或可能引发资金风险的行为，包括但不限于虚假发货、诱导缴纳定金/预付款/保证金、诱导诈骗等；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">同时，闲鱼长期致力于建立彼此信任的社区环境，为了让闲置资源交易社区持续健康发展，确保交易的安全性，避免用户因跳转至第三方网站后发生交易纠纷、欺诈以及维权困难等问题，闲鱼在用户私聊场景中对非由闲鱼社区产生的且在闲鱼社区内传播的外部链接进行规范，对可能存在影响正常交易及用户体验的外部链接，在闲鱼APP中不支持直接访问，链接的范围包括但不仅限于：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1、诱导用户类<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1）涉嫌诱导用户进行有虚假宣传、诈骗欺诈等潜在风险的交易、拼团的外部链接；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2）涉嫌误导用户关注、分享、下载、传播的外部链接；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2、用户体验类<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1）含骚扰信息、垃圾短信等影响用户体验的外部链接；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2）传播涉及谣言、低俗或引人不适的内容的外部链接；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">3、其他传播虚假、欺诈、不良信息以及影响用户使用体验的外部链接。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）【不当注册】每次扣100分。视情节严重程度还可采取限制登录等措施。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“不当注册”指通过软<\/span><span style=\"color: rgb(0, 0, 0); background-color: rgba(0, 0, 0, 0);\">​<\/span><span style=\"color: rgb(51, 51, 51);\">件、程序或人工等方式大量注册账号的行为；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（三）【不当使用账号】每次扣100分。视情节严重程度还可采取限制登录等措施。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“不当使用账号”指涉嫌租借、盗取、转让或囤积账号等行为；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（四）【泄露用户信息】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“泄露用户信息”指擅自将他人隐私信息（包括但不限于电话、住址、姓名等）提供给第三方或公布于众的行为；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（五）【骚扰他人】处理违规信息。视情节严重程度还可采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“骚扰他人”指恐吓、辱骂、恶意中伤或人身攻击他人的行为；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（六）【扰乱平台秩序】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣40分，特别严重的扣100分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“扰乱平台秩序”指利用平台所赋予的权利损害他人合法权益或妨碍平台运营秩序的行为，包括但不限于通过刷单、刷赞、刷粉等炒作形式进行数据造假，或在准入申请、活动报名、违规申诉、举报、纠纷判责等环节提供不真实的证明材料；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（七）【发布违禁信息】处理违规信息。视情节严重程度还可采取扣分措施，扣分详见附表1。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“发布违禁信息”指用户发布了违反国家相关法律法规、违反<\/span><span style=\"color: rgb(0, 0, 0); background-color: rgba(0, 0, 0, 0);\">​<\/span><span style=\"color: rgb(51, 51, 51);\">社<\/span><span style=\"color: rgb(0, 0, 0); background-color: rgba(0, 0, 0, 0);\">​<\/span><span style=\"color: rgb(51, 51, 51);\">会道德规范、违反平台要求的信息；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（八）【出售假冒、盗版商品】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“出售假冒、盗版商品”指用户涉嫌出售假冒注册商标、盗版商品，闲鱼可基于符合常理的认知，通过商品信息、交易凭证等依据进行判断并处理；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（九）【不当使用他人权利】处理违规信息。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“不当使用他人权利”指用户发布的商品或信息涉嫌不当使用他人商标权、著作权、专利权、肖像权等权利，或造成不正当竞争的行为。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（十）【被权利人投诉出售假冒商品】处理违规信息，情节特别严重的将采取扣100分措施。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“被权利人投诉出售假冒商品”指用户被权利人投诉出售假冒商品。无论是否被司法、行政机关认定，同一闲鱼用户被权利人投诉出售假冒商品的行为在同一自然年内累计不可达到三次及以上（三天内的投诉算一次），一旦出现同一自然年内累计三次被权利人投诉的，视为特别严重扣100分，分值不再恢复，永久限制闲鱼账号使用。<\/span><\/p><p>（十一）【规避准入要求发布商品或信息】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/p><p>“规避准入要求发布商品或信息”指用户未经资质备案发布商品或信息，或规避行业特殊要求发布商品或信息，包括但不限于：<\/p><p>1.发布需资质备案后方可发布的商品或信息，如预包装食品、保健食品、酒、婴幼儿食品、特殊用途类食品、法律咨询/代理/法律文书代拟、专利/知识产权/商标/版权代理及相关服务、工商注册/登记、会计服务、租房等；<\/p><p>2.规避行业特殊要求发布的商品或信息：比如发布未获得合法票品销售资质或未确认合法票品来源情况下的演出门票类商品，发布涉嫌违法违规、无效等情形的演出、赛事/展览等各类活动票品或类似、相关票品；在回收频道之外，通过发布闲置物品的方式发布电子卡券类商品；发布不符合相关法律法规、政策要求的，虚假的，或者收取不合理费用的租房房源类信息；发布未获得企业授权的或虚假的兼职信息。<\/p><p>二级类目“图书”商品需扫描ISBN编码发布，发布的单一闲置物品信息中不得含有多件出版物类物品信息（套装出版物除外）。 从事商业经营活动的经营性卖家，需要上传出版物经营许可证、出版物租赁备案、营业执照等资质证明，经平台审核通过后方可发布。<\/p><p><span style=\"color: rgb(51, 51, 51);\">（十二）【发布风险信息】处理违规信息。视情节严重程度还可采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“发布风险信息”指用户发布存在妨害用户权益或影响平台秩序的商品或信息，包括但不限于：发布质量不合格商品（经新闻媒体曝光、国家质监部门等行政管理部门通报，系质量不合格的线下某一品牌、品类、批次的商品，或其他要求协查的商品）、存在交易风险的虚拟类商品、实际不存在商品、制假风险的品牌配件（如品牌空瓶、空酒瓶、空奶粉罐等）、引流、无效广告、信息要素不一致、借用话题/内容炒作引导、或有违公序良俗、规则或闲鱼服务协议的商品或信息等。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（十三）【描述不当】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“描述不当”指通过买方反馈或闲鱼排查等方式，发现商品（或服务）与卖方描述不相符或不符合平台相关要求，妨害用户权益的行为，包括但不限于：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1.买方收到的商品或接受的服务与卖方描述不相符，损害买方权益的；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2.闲鱼排查到的商品或服务存在与卖方描述不相符的；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">3.卖方未对商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等必须说明的信息进行真实、完整的描述进行如实披露的。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（十四）【违背承诺】每次扣20分，严重的每次扣40分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“违背承诺”指用户未按约定或平台规定提供承诺的服务，妨害用户权益的行为，包括但不限于：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1.卖方违背交易约定，是指闲鱼卖方须在商品描述、商品留言、私聊等闲鱼提供的官方沟通渠道中（不包括手机、电话、QQ等非官方渠道）明确买卖双方的交易约定，约定内容包括但不限于是否提供发票、发货时间、交易方式等。在达成交易约定后，对于买卖双方约定的事项，若由于卖方单方面原因导致未履行的，视为卖方违背交易约定；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2.买方违背交易约定，是指闲鱼买方需在交易前充分了解必要的商品情况，包括但不限于商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等，并约定商品的交易价格。在达成交易约定后，买方需客观、理性地进行交易。在达成交易约定后，对于买卖双方约定的事项，若由于买方单方面违约的(卖方原因导致的除外)，视为买方违背交易约定；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">3.违背自行作出的其他承诺，如承诺互动活动有奖品、赠品等奖励、但未兑现，承诺参与闲鱼活动但未如期履约或擅自退出；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">4.未按闲鱼规定向闲鱼履约或向闲鱼用户提供相应服务的。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（十五）【违反公序良俗、规则或协议的行为】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“违反公序良俗、规则或协议的行为”指闲鱼用户存在违反法律法规、违反闲鱼规则或《闲鱼社区用户服务协议》、或有违公序良俗的行为；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（十六）【引导站外交易】处理违规信息。视情节严重程度还可以采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">“引导站外交易”是指发布或推送含有容易导致交易风险的第三方商品或信息，或者通过其他方式诱导用户跳转至第三方网站或客户端等，可能产生骚扰用户、诈骗、影响用户交易安全等损害用户合法权益的行为。引导站外交易的情形包括但不限于：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1.发布或推送含有容易导致交易风险的第三方商品或信息（如网络购物、导购、团购、促销、拼单、砍价、返利、领取优惠券等第三方网站或客户端的名称、标识、二维码、超链接、联系账号等信息，信息格式包括但不限于文字或变异文字、图片、语音、视频），引导用户在第三方平台交易。特定频道另有约定的除外；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2.通过其他方式诱导用户跳转至第三方网站或客户端等，如：在头像、个人主页背景图片中添加引导到第三方平台交易的内容。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"><\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\">违规情节说明如下：<\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">一般情节：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">影响范围可控，且未对其他会员/平台权益造成严重损害。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">严重情节：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1.同一违规行为累犯或多条并犯的，视具体情节违规扣分加重；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2.已经或即将严重损害其他会员/平台权益的。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">特别严重情节：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">1.手段特别恶劣或刻意规避；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">2.造成严重的人身伤害或其他极其恶劣影响。<\/span><\/p><p><span style=\"color: black;\">第八节【管控措施】<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼用户违反本规范相关规定的，闲鱼将依据本规范进行处理，具体措施包括但不限于处理违规信息、扣分、闲鱼用户权限管控等措施，同时针对情节严重的，闲鱼将建立违规公示名单，在社区内公开披露其违法违规情形，涉嫌违法违规的，闲鱼也将配合移送相关国家机关处理。<\/span><\/p><p><span style=\"color: black;\">（一）【分值及限权】<\/span><\/p><p><span style=\"color: black;\">闲鱼用户的违规行为可导致 “闲气值”分数（满分100）降低，当前闲气值=100分-近90天因违规扣分的总和，当前闲气值等于0分时，分值不再变化。不同闲气值区间，闲鱼对用户采取不同的处理措施：<\/span><\/p><p><img src=\"assets/img/153133-0781znli-d9dea7.jpg\"><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）【管控解除及申诉】 <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">被执行权限管控的闲鱼用户，当其全部违规行为被纠正、通过学习/公益等方式提前解除、或权限管控措施执行完毕，闲鱼账号使用权限可恢复正常； 针对违规管控，闲鱼用户在规定的期限内可发起申诉，根据申诉信息进行审核判断，申诉成立，撤销违规处理；逾期未申诉或申诉不成立，违规处理不中止、不撤销。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（三）【违规关联管控】 <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">【违规关联管控】闲鱼用户若发生以下行为，包括但不限于闲鱼用户被处以特定违规行为处罚或发生过危及交易安全的情形（包括但不限于因骗取他人财物、出售假冒商品等被处以查封账号、违规节点处罚、永久限制闲鱼权限等）的，除该闲鱼用户被闲鱼违规处置外, 闲鱼可对该闲鱼用户实际控制人下的其他闲鱼用户账号进行处置（包括处理商品或信息、闲鱼用户权限管控、扣分等）。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"> <\/span><strong style=\"color: rgb(51, 51, 51);\">第四章 附录 <\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">第九节 本规范于2021年9月7日首次生效，最新修订生效时间为2023年6月1日。<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"> <\/span><strong style=\"color: rgb(51, 51, 51);\">附管控措施 <\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">一、处理违规信息： <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">商品类信息：降权/屏蔽、下架或删除闲鱼商品 <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">互动类信息：屏蔽帖子/留言/评论内容/交易评价/个人主页等，删除留言/私聊/个人信息/帖子及评论/问答/圈子信息/交易评价/抽奖信息等； <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">二、闲鱼用户权限管控： <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">卖方：搜索降权或屏蔽闲鱼商品、限制发布闲鱼商品、屏蔽个人主页； <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">互动：限制留言/私聊、限制编辑个人信息/帖子及评论/圈子信息/问答/交易评价、限制使用抽奖工具等； <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">买方：限制购买； <\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">其他：关闭订单（包括未付款、已付款未发货等状态的订单）、通知支付宝对用户绑定的支付宝账号采取必要的管控措施（包括但不限于禁止余额支付、禁止余额提现、冻结支付宝余额、延长交易账期等）；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\"> <\/span><strong style=\"color: rgb(51, 51, 51);\">附表1：闲鱼社区违禁信息管控扣分明细<\/strong><\/p><p><img src=\"assets/img/153346-6618msno-093165.jpg\"><img src=\"assets/img/153352-3620xcyz-fc2851.jpg\"><img src=\"assets/img/153400-9959qnpo-28328e.jpg\"><img src=\"assets/img/153417-7284msih-f3b267.jpg\"><img src=\"assets/img/153419-6701kxfh-c6ebc4.jpg\"><img src=\"assets/img/153421-5117bxjs-861181.jpg\"><img src=\"assets/img/153423-5024nyon-fd5bff.jpg\"><img src=\"assets/img/153426-1425tvyq-287df6.jpg\"><\/p>","text":"闲鱼社区管理规范（试行） 第一章 概述 第一节【适用范围】 适用于所有的闲鱼用户（本规范试行期间逐步适用，具体以闲鱼通知为准），包括在闲鱼移动客户端、域名为“goofish.com”的闲鱼网站、小程序等发布/购买闲置商品、发布/浏览信息的闲鱼用户。 第二节【原则】 （一）闲鱼用户的所有行为均须遵守国家法律、法规规定、闲鱼规则要求，以及根据相应页面指引进行操作。 （二）试行本规范的闲鱼用户在本规范的适用上一律平等。 （三）除违反法律、法规规定外，闲鱼用户首次、非故意或轻微违规等的，视具体情节享有减免、从轻、警告、教育学习等替代性处理的机会。 （四）闲鱼用户累犯、多条并犯、或对其他会员或平台造成恶劣影响的，视具体情节从重或加重处理。 第二章 基本要求 第三节【注册】 根据闲鱼平台的流程和要求完成注册的会员可登录闲鱼社区，成为闲鱼用户，账号名注册后无法自行修改。 第四节【认证】 闲鱼用户在闲鱼发布信息、互动或交易时，需要通过实名认证，同时闲鱼用户须根据平台要求完成实人认证及认证复核，确保认证信息真实有效。 第五节【信息发布及审核】 对闲鱼用户在闲鱼社区发布的部分商品及信息，闲鱼将采取随机方式进行审核，审核过程中如发现用户存在违法违规、恶意或故意规避行为的，闲鱼除处理商品及信息外，还将酌情采取扣分、处置限权等措施。 第六节【交易】 （一）【交易约定】 交易前，买卖双方可针对交易及商品情况沟通交流，可选择线上交易或“见一见”见面交易。买方拍下且未付款到支付宝担保账号前，以及买方付款后卖方发货前，买卖双方均可自主关闭订单。线上交易卖方操作“我要发货”，或“见一见”交易卖方完成“扫码收款”即表示买卖双方达成交易约定。 （二）【交易超时】 买卖双方选择通过闲鱼社区进行线上交易的，须遵守 《闲鱼交易超时说明》 的相关要求。 （三）【交易流程】 闲鱼支持支付宝担保交易，若买方对交易货物有疑问，买方可在确认收货（含系统超时自动确认收货）前提出退款申请。选择在线付款后见面交易或用“见一见”发起见面交易的，买方需当面验货，当面收货即表示买方对货物无异议。交易成功后，不支持售后维权。如买卖双方在交易过程中有争议，按照 《闲鱼社区交易争议处理规范》 处理。 （四）【交易评价】 为确保评价内容能为买方购物决策提供可靠的依据，反映商品或服务的真实情况，买卖双方通过闲鱼评价工具发布评价的，其评价应当与交易的商品或服务具有关联性，且合法、客观、真实，买卖双方不得利用闲鱼评价侵害相关方合法权益。 第三章 社区管理 第七节【违规管控】 （一）【危及交易安全】每次扣100分。对涉嫌危及交易安全的用户，闲鱼还可视情节严重程度直接对其订单、通知支付宝对其绑定的支付宝账号采取必要的管控措施等。 “危及交易安全”指涉嫌以非法获利为目的，造成交易任何一方出现严重钱/货损失的行为，或可能引发资金风险的行为，包括但不限于虚假发货、诱导缴纳定金/预付款/保证金、诱导诈骗等； 同时，闲鱼长期致力于建立彼此信任的社区环境，为了让闲置资源交易社区持续健康发展，确保交易的安全性，避免用户因跳转至第三方网站后发生交易纠纷、欺诈以及维权困难等问题，闲鱼在用户私聊场景中对非由闲鱼社区产生的且在闲鱼社区内传播的外部链接进行规范，对可能存在影响正常交易及用户体验的外部链接，在闲鱼APP中不支持直接访问，链接的范围包括但不仅限于： 1、诱导用户类 1）涉嫌诱导用户进行有虚假宣传、诈骗欺诈等潜在风险的交易、拼团的外部链接； 2）涉嫌误导用户关注、分享、下载、传播的外部链接； 2、用户体验类 1）含骚扰信息、垃圾短信等影响用户体验的外部链接； 2）传播涉及谣言、低俗或引人不适的内容的外部链接； 3、其他传播虚假、欺诈、不良信息以及影响用户使用体验的外部链接。 （二）【不当注册】每次扣100分。视情节严重程度还可采取限制登录等措施。 “不当注册”指通过软 ​ 件、程序或人工等方式大量注册账号的行为； （三）【不当使用账号】每次扣100分。视情节严重程度还可采取限制登录等措施。 “不当使用账号”指涉嫌租借、盗取、转让或囤积账号等行为； （四）【泄露用户信息】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “泄露用户信息”指擅自将他人隐私信息（包括但不限于电话、住址、姓名等）提供给第三方或公布于众的行为； （五）【骚扰他人】处理违规信息。视情节严重程度还可采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。 “骚扰他人”指恐吓、辱骂、恶意中伤或人身攻击他人的行为； （六）【扰乱平台秩序】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣40分，特别严重的扣100分。 “扰乱平台秩序”指利用平台所赋予的权利损害他人合法权益或妨碍平台运营秩序的行为，包括但不限于通过刷单、刷赞、刷粉等炒作形式进行数据造假，或在准入申请、活动报名、违规申诉、举报、纠纷判责等环节提供不真实的证明材料； （七）【发布违禁信息】处理违规信息。视情节严重程度还可采取扣分措施，扣分详见附表1。 “发布违禁信息”指用户发布了违反国家相关法律法规、违反 ​ 社 ​ 会道德规范、违反平台要求的信息； （八）【出售假冒、盗版商品】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “出售假冒、盗版商品”指用户涉嫌出售假冒注册商标、盗版商品，闲鱼可基于符合常理的认知，通过商品信息、交易凭证等依据进行判断并处理； （九）【不当使用他人权利】处理违规信息。 “不当使用他人权利”指用户发布的商品或信息涉嫌不当使用他人商标权、著作权、专利权、肖像权等权利，或造成不正当竞争的行为。 （十）【被权利人投诉出售假冒商品】处理违规信息，情节特别严重的将采取扣100分措施。 “被权利人投诉出售假冒商品”指用户被权利人投诉出售假冒商品。无论是否被司法、行政机关认定，同一闲鱼用户被权利人投诉出售假冒商品的行为在同一自然年内累计不可达到三次及以上（三天内的投诉算一次），一旦出现同一自然年内累计三次被权利人投诉的，视为特别严重扣100分，分值不再恢复，永久限制闲鱼账号使用。 （十一）【规避准入要求发布商品或信息】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “规避准入要求发布商品或信息”指用户未经资质备案发布商品或信息，或规避行业特殊要求发布商品或信息，包括但不限于： 1.发布需资质备案后方可发布的商品或信息，如预包装食品、保健食品、酒、婴幼儿食品、特殊用途类食品、法律咨询/代理/法律文书代拟、专利/知识产权/商标/版权代理及相关服务、工商注册/登记、会计服务、租房等； 2.规避行业特殊要求发布的商品或信息：比如发布未获得合法票品销售资质或未确认合法票品来源情况下的演出门票类商品，发布涉嫌违法违规、无效等情形的演出、赛事/展览等各类活动票品或类似、相关票品；在回收频道之外，通过发布闲置物品的方式发布电子卡券类商品；发布不符合相关法律法规、政策要求的，虚假的，或者收取不合理费用的租房房源类信息；发布未获得企业授权的或虚假的兼职信息。 二级类目“图书”商品需扫描ISBN编码发布，发布的单一闲置物品信息中不得含有多件出版物类物品信息（套装出版物除外）。 从事商业经营活动的经营性卖家，需要上传出版物经营许可证、出版物租赁备案、营业执照等资质证明，经平台审核通过后方可发布。 （十二）【发布风险信息】处理违规信息。视情节严重程度还可采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。 “发布风险信息”指用户发布存在妨害用户权益或影响平台秩序的商品或信息，包括但不限于：发布质量不合格商品（经新闻媒体曝光、国家质监部门等行政管理部门通报，系质量不合格的线下某一品牌、品类、批次的商品，或其他要求协查的商品）、存在交易风险的虚拟类商品、实际不存在商品、制假风险的品牌配件（如品牌空瓶、空酒瓶、空奶粉罐等）、引流、无效广告、信息要素不一致、借用话题/内容炒作引导、或有违公序良俗、规则或闲鱼服务协议的商品或信息等。 （十三）【描述不当】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “描述不当”指通过买方反馈或闲鱼排查等方式，发现商品（或服务）与卖方描述不相符或不符合平台相关要求，妨害用户权益的行为，包括但不限于： 1.买方收到的商品或接受的服务与卖方描述不相符，损害买方权益的； 2.闲鱼排查到的商品或服务存在与卖方描述不相符的； 3.卖方未对商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等必须说明的信息进行真实、完整的描述进行如实披露的。 （十四）【违背承诺】每次扣20分，严重的每次扣40分。 “违背承诺”指用户未按约定或平台规定提供承诺的服务，妨害用户权益的行为，包括但不限于： 1.卖方违背交易约定，是指闲鱼卖方须在商品描述、商品留言、私聊等闲鱼提供的官方沟通渠道中（不包括手机、电话、QQ等非官方渠道）明确买卖双方的交易约定，约定内容包括但不限于是否提供发票、发货时间、交易方式等。在达成交易约定后，对于买卖双方约定的事项，若由于卖方单方面原因导致未履行的，视为卖方违背交易约定； 2.买方违背交易约定，是指闲鱼买方需在交易前充分了解必要的商品情况，包括但不限于商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等，并约定商品的交易价格。在达成交易约定后，买方需客观、理性地进行交易。在达成交易约定后，对于买卖双方约定的事项，若由于买方单方面违约的(卖方原因导致的除外)，视为买方违背交易约定； 3.违背自行作出的其他承诺，如承诺互动活动有奖品、赠品等奖励、但未兑现，承诺参与闲鱼活动但未如期履约或擅自退出； 4.未按闲鱼规定向闲鱼履约或向闲鱼用户提供相应服务的。 （十五）【违反公序良俗、规则或协议的行为】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “违反公序良俗、规则或协议的行为”指闲鱼用户存在违反法律法规、违反闲鱼规则或《闲鱼社区用户服务协议》、或有违公序良俗的行为； （十六）【引导站外交易】处理违规信息。视情节严重程度还可以采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。 “引导站外交易”是指发布或推送含有容易导致交易风险的第三方商品或信息，或者通过其他方式诱导用户跳转至第三方网站或客户端等，可能产生骚扰用户、诈骗、影响用户交易安全等损害用户合法权益的行为。引导站外交易的情形包括但不限于： 1.发布或推送含有容易导致交易风险的第三方商品或信息（如网络购物、导购、团购、促销、拼单、砍价、返利、领取优惠券等第三方网站或客户端的名称、标识、二维码、超链接、联系账号等信息，信息格式包括但不限于文字或变异文字、图片、语音、视频），引导用户在第三方平台交易。特定频道另有约定的除外； 2.通过其他方式诱导用户跳转至第三方网站或客户端等，如：在头像、个人主页背景图片中添加引导到第三方平台交易的内容。 违规情节说明如下： 一般情节： 影响范围可控，且未对其他会员/平台权益造成严重损害。 严重情节： 1.同一违规行为累犯或多条并犯的，视具体情节违规扣分加重； 2.已经或即将严重损害其他会员/平台权益的。 特别严重情节： 1.手段特别恶劣或刻意规避； 2.造成严重的人身伤害或其他极其恶劣影响。 第八节【管控措施】 闲鱼用户违反本规范相关规定的，闲鱼将依据本规范进行处理，具体措施包括但不限于处理违规信息、扣分、闲鱼用户权限管控等措施，同时针对情节严重的，闲鱼将建立违规公示名单，在社区内公开披露其违法违规情形，涉嫌违法违规的，闲鱼也将配合移送相关国家机关处理。 （一）【分值及限权】 闲鱼用户的违规行为可导致 “闲气值”分数（满分100）降低，当前闲气值=100分-近90天因违规扣分的总和，当前闲气值等于0分时，分值不再变化。不同闲气值区间，闲鱼对用户采取不同的处理措施： （二）【管控解除及申诉】 被执行权限管控的闲鱼用户，当其全部违规行为被纠正、通过学习/公益等方式提前解除、或权限管控措施执行完毕，闲鱼账号使用权限可恢复正常； 针对违规管控，闲鱼用户在规定的期限内可发起申诉，根据申诉信息进行审核判断，申诉成立，撤销违规处理；逾期未申诉或申诉不成立，违规处理不中止、不撤销。 （三）【违规关联管控】 【违规关联管控】闲鱼用户若发生以下行为，包括但不限于闲鱼用户被处以特定违规行为处罚或发生过危及交易安全的情形（包括但不限于因骗取他人财物、出售假冒商品等被处以查封账号、违规节点处罚、永久限制闲鱼权限等）的，除该闲鱼用户被闲鱼违规处置外, 闲鱼可对该闲鱼用户实际控制人下的其他闲鱼用户账号进行处置（包括处理商品或信息、闲鱼用户权限管控、扣分等）。 第四章 附录 第九节 本规范于2021年9月7日首次生效，最新修订生效时间为2023年6月1日。 附管控措施 一、处理违规信息： 商品类信息：降权/屏蔽、下架或删除闲鱼商品 互动类信息：屏蔽帖子/留言/评论内容/交易评价/个人主页等，删除留言/私聊/个人信息/帖子及评论/问答/圈子信息/交易评价/抽奖信息等； 二、闲鱼用户权限管控： 卖方：搜索降权或屏蔽闲鱼商品、限制发布闲鱼商品、屏蔽个人主页； 互动：限制留言/私聊、限制编辑个人信息/帖子及评论/圈子信息/问答/交易评价、限制使用抽奖工具等； 买方：限制购买； 其他：关闭订单（包括未付款、已付款未发货等状态的订单）、通知支付宝对用户绑定的支付宝账号采取必要的管控措施（包括但不限于禁止余额支付、禁止余额提现、冻结支付宝余额、延长交易账期等）； 附表1：闲鱼社区违禁信息管控扣分明细","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":9,"words":5712,"sections":0,"subs":0,"version":""},"related":["sec-62","a499946761471365","a498773110658437","a499947955983749"]},{"id":"a499946761471365","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"管理规范与违规处罚","title":"闲鱼社区管理规范（试行）（公告版）","title_raw":"闲鱼社区管理规范（试行）","html":"<p><strong>第一章 概述<\/strong><\/p><p>第一节【适用范围】<\/p><p>适用于所有的闲鱼用户（本规范试行期间逐步适用，具体以闲鱼通知为准），包括在闲鱼移动客户端、域名为“goofish.com”的闲鱼网站、小程序等发布/购买闲置商品、发布/浏览信息的闲鱼用户。<\/p><p>第二节【原则】<\/p><p>（一）闲鱼用户的所有行为均须遵守国家法律、法规规定、闲鱼规则要求，以及根据相应页面指引进行操作。<\/p><p>（二）试行本规范的闲鱼用户在本规范的适用上一律平等。<\/p><p>（三）除违反法律、法规规定外，闲鱼用户首次、非故意或轻微违规等的，视具体情节享有减免、从轻、警告、教育学习等替代性处理的机会。<\/p><p>（四）闲鱼用户累犯、多条并犯、或对其他会员或平台造成恶劣影响的，视具体情节从重或加重处理。<\/p><p><strong>第二章 基本要求<\/strong><\/p><p>第三节【注册】<\/p><p>根据闲鱼平台的流程和要求完成注册的会员可登录闲鱼社区，成为闲鱼用户，账号名注册后无法自行修改。<\/p><p>第四节【认证】<\/p><p>闲鱼用户在闲鱼发布信息、互动或交易时，需要通过实名认证，同时闲鱼用户须根据平台要求完成实人认证及认证复核，确保认证信息真实有效。<\/p><p>第五节【信息发布及审核】<\/p><p>对闲鱼用户在闲鱼社区发布的部分商品及信息，闲鱼将采取随机方式进行审核，审核过程中如发现用户存在违法违规、恶意或故意规避行为的，闲鱼除处理商品及信息外，还将酌情采取扣分、处置限权等措施。<\/p><p>第六节【交易】<\/p><p>（一）【交易约定】<\/p><p>交易前，买卖双方可针对交易及商品情况沟通交流，可选择线上交易或“见一见”见面交易。买方拍下且未付款到支付宝担保账号前，以及买方付款后卖方发货前，买卖双方均可自主关闭订单。线上交易卖方操作“我要发货”，或“见一见”交易卖方完成“扫码收款”即表示买卖双方达成交易约定。<\/p><p>（二）【交易超时】<\/p><p>买卖双方选择通过闲鱼社区进行线上交易的，须遵守<span style=\"color: rgb(80, 124, 201);\">《闲鱼交易超时说明》<\/span>的相关要求。<\/p><p>（三）【交易流程】<\/p><p>闲鱼支持支付宝担保交易，若买方对交易货物有疑问，买方可在确认收货（含系统超时自动确认收货）前提出退款申请。选择在线付款后见面交易或用“见一见”发起见面交易的，买方需当面验货，当面收货即表示买方对货物无异议。交易成功后，不支持售后维权。如买卖双方在交易过程中有争议，按照<span style=\"color: rgb(80, 124, 201);\">《闲鱼社区交易争议处理规范》<\/span>处理。<\/p><p>（四）【交易评价】<\/p><p>为确保评价内容能为买方购物决策提供可靠的依据，反映商品或服务的真实情况，买卖双方通过闲鱼评价工具发布评价的，其评价应当与交易的商品或服务具有关联性，且合法、客观、真实，买卖双方不得利用闲鱼评价侵害相关方合法权益。<\/p><p><strong>第三章 社区管理<\/strong><\/p><p>第七节【违规管控】<\/p><p>（一）【危及交易安全】每次扣100分。对涉嫌危及交易安全的用户，闲鱼还可视情节严重程度直接对其订单、通知支付宝对其绑定的支付宝账号采取必要的管控措施等。<\/p><p>“危及交易安全”指涉嫌以非法获利为目的，造成交易任何一方出现严重钱/货损失的行为，或可能引发资金风险的行为，包括但不限于虚假发货、诱导缴纳定金/预付款/保证金、诱导诈骗等；<\/p><p>同时，闲鱼长期致力于建立彼此信任的社区环境，为了让闲置资源交易社区持续健康发展，确保交易的安全性，避免用户因跳转至第三方网站后发生交易纠纷、欺诈以及维权困难等问题，闲鱼在用户私聊场景中对非由闲鱼社区产生的且在闲鱼社区内传播的外部链接进行规范，对可能存在影响正常交易及用户体验的外部链接，在闲鱼APP中不支持直接访问，链接的范围包括但不仅限于：<\/p><p>1、诱导用户类<\/p><p>1）涉嫌诱导用户进行有虚假宣传、诈骗欺诈等潜在风险的交易、拼团的外部链接；<\/p><p>2）涉嫌误导用户关注、分享、下载、传播的外部链接；<\/p><p>2、用户体验类<\/p><p>1）含骚扰信息、垃圾短信等影响用户体验的外部链接；<\/p><p>2）传播涉及谣言、低俗或引人不适的内容的外部链接；<\/p><p>3、其他传播虚假、欺诈、不良信息以及影响用户使用体验的外部链接。<\/p><p>（二）【不当注册】每次扣100分。视情节严重程度还可采取限制登录等措施。<\/p><p>“不当注册”指通过软<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>件、程序或人工等方式大量注册账号的行为；<\/p><p>（三）【不当使用账号】每次扣100分。视情节严重程度还可采取限制登录等措施。<\/p><p>“不当使用账号”指涉嫌租借、盗取、转让或囤积账号等行为；<\/p><p>（四）【泄露用户信息】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/p><p>“泄露用户信息”指擅自将他人隐私信息（包括但不限于电话、住址、姓名等）提供给第三方或公布于众的行为；<\/p><p>（五）【骚扰他人】处理违规信息。视情节严重程度还可采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。<\/p><p>“骚扰他人”指恐吓、辱骂、恶意中伤或人身攻击他人的行为；<\/p><p>（六）【扰乱平台秩序】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣40分，特别严重的扣100分。<\/p><p>“扰乱平台秩序”指利用平台所赋予的权利损害他人合法权益或妨碍平台运营秩序的行为，包括但不限于通过刷单、刷赞、刷粉等炒作形式进行数据造假，或在准入申请、活动报名、违规申诉、举报、纠纷判责等环节提供不真实的证明材料；<\/p><p>（七）【发布违禁信息】处理违规信息。视情节严重程度还可采取扣分措施，扣分详见附表1。<\/p><p>“发布违禁信息”指用户发布了违反国家相关法律法规、违反<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>社<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>会道德规范、违反平台要求的信息；<\/p><p>（八）【出售假冒、盗版商品】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/p><p>“出售假冒、盗版商品”指用户涉嫌出售假冒注册商标、盗版商品，闲鱼可基于符合常理的认知，通过商品信息、交易凭证等依据进行判断并处理；<\/p><p>（九）【不当使用他人权利】处理违规信息。<\/p><p>“不当使用他人权利”指用户发布的商品或信息涉嫌不当使用他人商标权、著作权、专利权、肖像权等权利，或造成不正当竞争的行为。<\/p><p>（十）【被权利人投诉出售假冒商品】处理违规信息，情节特别严重的将采取扣100分措施。<\/p><p>“被权利人投诉出售假冒商品”指用户被权利人投诉出售假冒商品。无论是否被司法、行政机关认定，同一闲鱼用户被权利人投诉出售假冒商品的行为在同一自然年内累计不可达到三次及以上（三天内的投诉算一次），一旦出现同一自然年内累计三次被权利人投诉的，视为特别严重扣100分，分值不再恢复，永久限制闲鱼账号使用。<\/p><p>（十一）【规避准入要求发布商品或信息】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/p><p>“规避准入要求发布商品或信息”指用户未经资质备案发布商品或信息，或规避行业特殊要求发布商品或信息，包括但不限于：<\/p><p>1.发布需资质备案后方可发布的商品或信息，如预包装食品、保健食品、酒、婴幼儿食品、特殊用途类食品、法律咨询/代理/法律文书代拟、专利/知识产权/商标/版权代理及相关服务、工商注册/登记、会计服务、租房等；<\/p><p>2.规避行业特殊要求发布的商品或信息：<\/p><p>二级类目“图书”商品需扫描ISBN编码发布，发布的单一闲置物品信息中不得含有多件出版物类物品信息（套装出版物除外）。 从事商业经营活动的经营性卖家，需要上传出版物经营许可证、出版物租赁备案、营业执照等资质证明，经平台审核通过后方可发布;<\/p><p>票务类商品须发布在二级类目“演艺/表演类门票”，在线商品数不得超过3件，单张门票的售卖价格不得超过票面价格的10%，且近90天演艺/表演类门票交易笔数不得超过3笔；<\/p><p>租房房源类信息须和发布类目匹配并符合相关法律、法规、政策要求，房源信息必须真实不得重复，且不得收取不合理费用；<\/p><p>兼职信息类商品的用户主体须为企业或获得企业授权，且发布信息真实有效。<\/p><p>（十二）【发布风险信息】处理违规信息。视情节严重程度还可采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。<\/p><p>“发布风险信息”指用户发布存在妨害用户权益或影响平台秩序的商品或信息，包括但不限于：发布质量不合格商品（经新闻媒体曝光、国家质监部门等行政管理部门通报，系质量不合格的线下某一品牌、品类、批次的商品，或其他要求协查的商品）、存在交易风险的虚拟类商品、实际不存在商品、制假风险的品牌配件（如品牌空瓶、空酒瓶、空奶粉罐等）、引流、无效广告、信息要素不一致、借用话题/内容炒作引导、或有违公序良俗、规则或闲鱼服务协议的商品或信息等。<\/p><p>（十三）【描述不当】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/p><p>“描述不当”指通过买方反馈或闲鱼排查等方式，发现商品（或服务）与卖方描述不相符或不符合平台相关要求，妨害用户权益的行为，包括但不限于：<\/p><p>1.买方收到的商品或接受的服务与卖方描述不相符，损害买方权益的；<\/p><p>2.闲鱼排查到的商品或服务存在与卖方描述不相符的；<\/p><p>3.卖方未对商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等必须说明的信息进行真实、完整的描述进行如实披露的。<\/p><p>（十四）【违背承诺】每次扣20分，严重的每次扣40分。<\/p><p>“违背承诺”指用户未按约定或平台规定提供承诺的服务，妨害用户权益的行为，包括但不限于：<\/p><p>1.卖方违背交易约定，是指闲鱼卖方须在商品描述、商品留言、私聊等闲鱼提供的官方沟通渠道中（不包括手机、电话、QQ等非官方渠道）明确买卖双方的交易约定，约定内容包括但不限于是否提供发票、发货时间、交易方式等。在达成交易约定后，对于买卖双方约定的事项，若由于卖方单方面原因导致未履行的，视为卖方违背交易约定；<\/p><p>2.买方违背交易约定，是指闲鱼买方需在交易前充分了解必要的商品情况，包括但不限于商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等，并约定商品的交易价格。在达成交易约定后，买方需客观、理性地进行交易。在达成交易约定后，对于买卖双方约定的事项，若由于买方单方面违约的(卖方原因导致的除外)，视为买方违背交易约定；<\/p><p>3.违背自行作出的其他承诺，如承诺互动活动有奖品、赠品等奖励、但未兑现，承诺参与闲鱼活动但未如期履约或擅自退出；<\/p><p>4.未按闲鱼规定向闲鱼履约或向闲鱼用户提供相应服务的。<\/p><p>（十五）【违反公序良俗、规则或协议的行为】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。<\/p><p>“违反公序良俗、规则或协议的行为”指闲鱼用户存在违反法律法规、违反闲鱼规则或《闲鱼社区用户服务协议》、或有违公序良俗的行为；<\/p><p>（十六）【引导站外交易】处理违规信息。视情节严重程度还可以采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。<\/p><p>“引导站外交易”是指发布或推送含有容易导致交易风险的第三方商品或信息，或者通过其他方式诱导用户跳转至第三方网站或客户端等，可能产生骚扰用户、诈骗、影响用户交易安全等损害用户合法权益的行为。引导站外交易的情形包括但不限于：<\/p><p>1.发布或推送含有容易导致交易风险的第三方商品或信息（如网络购物、导购、团购、促销、拼单、砍价、返利、领取优惠券等第三方网站或客户端的名称、标识、二维码、超链接、联系账号等信息，信息格式包括但不限于文字或变异文字、图片、语音、视频），引导用户在第三方平台交易。特定频道另有约定的除外；<\/p><p>2.通过其他方式诱导用户跳转至第三方网站或客户端等，如：在头像、个人主页背景图片中添加引导到第三方平台交易的内容。<\/p><p><strong>违规情节说明如下：<\/strong><\/p><p>一般情节：<\/p><p>影响范围可控，且未对其他会员/平台权益造成严重损害。<\/p><p>严重情节：<\/p><p>1.同一违规行为累犯或多条并犯的，视具体情节违规扣分加重；<\/p><p>2.已经或即将严重损害其他会员/平台权益的。<\/p><p>特别严重情节：<\/p><p>1.手段特别恶劣或刻意规避；<\/p><p>2.造成严重的人身伤害或其他极其恶劣影响。<\/p><p><span style=\"color: black;\">第八节【管控措施】<\/span><\/p><p>闲鱼用户违反本规范相关规定的，闲鱼将依据本规范进行处理，具体措施包括但不限于处理违规信息、扣分、闲鱼用户权限管控等措施，同时针对情节严重的，闲鱼将建立违规公示名单，在社区内公开披露其违法违规情形，涉嫌违法违规的，闲鱼也将配合移送相关国家机关处理。<\/p><p><span style=\"color: black;\">（一）【分值及限权】<\/span><\/p><p><span style=\"color: black;\">闲鱼用户的违规行为可导致 “闲气值”分数（满分100）降低，当前闲气值=100分-近90天因违规扣分的总和，当前闲气值等于0分时，分值不再变化。不同闲气值区间，闲鱼对用户采取不同的处理措施：<\/span><\/p><p><img src=\"assets/img/173345-4860xlvr-dad26b.png\"><\/p><p>（二）【管控解除及申诉】 被执行权限管控的闲鱼用户，当其全部违规行为被纠正、通过学习/公益等方式提前解除、或权限管控措施执行完毕，闲鱼账号使用权限可恢复正常； 针对违规管控，闲鱼用户在规定的期限内可发起申诉，根据申诉信息进行审核判断，申诉成立，撤销违规处理；逾期未申诉或申诉不成立，违规处理不中止、不撤销。 （三）【违规关联管控】 【违规关联管控】闲鱼用户若发生以下行为，包括但不限于闲鱼用户被处以特定违规行为处罚或发生过危及交易安全的情形（包括但不限于因骗取他人财物、出售假冒商品等被处以查封账号、违规节点处罚、永久限制闲鱼权限等）的，除该闲鱼用户被闲鱼违规处置外, 闲鱼可对该闲鱼用户实际控制人下的其他闲鱼用户账号进行处置（包括处理商品或信息、闲鱼用户权限管控、扣分等）。<\/p><p><strong>第四章 附录 <\/strong>第九节 本规范于2021年9月7日首次生效，最新修订生效时间为2023年6月1日。<\/p><p><strong>附管控措施 <\/strong>一、处理违规信息： 商品类信息：降权/屏蔽、下架或删除闲鱼商品 互动类信息：屏蔽帖子/留言/评论内容/交易评价/个人主页等，删除留言/私聊/个人信息/帖子及评论/问答/圈子信息/交易评价/抽奖信息等； 二、闲鱼用户权限管控： 卖方：搜索降权或屏蔽闲鱼商品、限制发布闲鱼商品、屏蔽个人主页； 互动：限制留言/私聊、限制编辑个人信息/帖子及评论/圈子信息/问答/交易评价、限制使用抽奖工具等； 买方：限制购买； 其他：关闭订单（包括未付款、已付款未发货等状态的订单）、通知支付宝对用户绑定的支付宝账号采取必要的管控措施（包括但不限于禁止余额支付、禁止余额提现、冻结支付宝余额、延长交易账期等）；<\/p><p><strong>闲鱼社区违禁信息管控扣分明细 ：违禁商品及信息 对应管控扣分 <\/strong><\/p><p>一、枪支弹药、管制器具、军警及行政机关用品类<\/p><p>（一）枪支、弹药、军火<\/p><p>每次扣100分<\/p><p>（二）枪支、弹药、军火的零部件、相关器材、配件、附属产品及其制作方法；仿真枪支、仿真弹药、仿真军火类商品<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（三）可致使他人暂时失去反抗能力，对他人身体造成重大伤害的管制器具<\/p><p>每次扣100分<\/p><p>（四）管制刀具；弓弩配件及飞镖等可能用于危害他人人身安全的商品<\/p><p>每次扣1分，严重的每次扣20分，特别严重的扣100分<\/p><p>（五）军警及行政机关用品类，如服装、服饰器具及相关仿制品；军用、警用的设备制品及其仿制品<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（六）不当使用军用、警用及其他国家机关部门标志的商品；军需、国家机关专供、特<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>供等商品<\/p><p>每次扣2分<\/p><p>二、易燃易爆、危险化学品、毒品类<\/p><p>（一）危险化学品、易制爆化学品、消耗臭氧层物质、放射性物质及射线装置<\/p><p>每次扣20分，严重的扣100分<\/p><p>（二）存在易燃易爆风险的物品<\/p><p>每次扣1分，严重的每次扣20分，特别严重的扣100分<\/p><p>（三）介绍制作易燃易爆品的相关方法<\/p><p>每次扣1分，严重的每次扣5分，特别严重的每次扣20分<\/p><p>（四）毒品及毒品衍生品；制毒原料、易制毒化学品<\/p><p>每次扣20分，严重的扣100分<\/p><p>（五）吸毒工具、配件及介绍制作毒品的相关方法及信息<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>三、危害国家安全、破坏政治与社会稳定的有害信息类<\/p><p>（一）含有分裂国家，破坏国家统一，危害国家安全或利益，破坏国家政治稳定，煽动颠覆国家政权，推翻社会主义制度，泄露国家秘密的商品或信息<\/p><p>每次扣20分，严重的扣100分<\/p><p>（二）含有宣扬恐怖主义、极端主义，煽动民族仇恨、种族歧视，破坏民族团结，破坏国家宗教政策、宣扬邪教的商品或信息<\/p><p>每次扣20分，严重的扣100分<\/p><p>（三）含有损害国家荣誉、名誉，歪曲、丑化、亵渎、否定英雄烈士事迹和精神，美化他国侵略史实或宣扬军<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>国<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>主<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>义思想的商品或信息<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（四）含有传播或评议国家政策、国家领<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>导<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>人、政治事件、社会事件、宗教活动及等商品或信息<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>四、色情暴力低俗、催情用品类<\/p><p>（一）含有淫秽内容的音像及其制品、视频及其制品、招嫖服务、成人网站论坛的账号及邀请码，原味内衣及相关信息<\/p><p>每次扣20分，严重的扣100分<\/p><p>（二）含有色情、暴力、低俗内容的音像及其制品、视频及其制品、读物、游戏；用于传播色情、暴力内容的软件、图片、种子文件、网盘资源<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（三）含有色情、暴力、低俗内容的图片及信息；用于传播低俗信息的软件、图片、种子文件、网盘资源<\/p><p>含色情暴力信息每次扣5分（含低俗恶心信息每次扣1分），严重的每次扣20分，特别严重的扣100分<\/p><p>（四）境外成人秀商品<\/p><p>每次扣2分，严重的每次扣20分<\/p><p>（五）可致使他人暂时失去反抗能力、意识模糊的口服或外用的催情类商品<\/p><p>每次扣20分，严重的扣100分<\/p><p>五、涉及人身隐私、安全类<\/p><p>（一）用于侵害信息或数据的软件、设备及相关服务；身份证件及个人隐私信息、企业内部敏感信息；黑客相关的软件、工具、教程类商品及服务；用于非法摄像、录音、取证，窃听窃照的设备、软件及相关服务<\/p><p>每次扣5分（暗示不良用途的每次扣1分），严重的每次扣20分，特别严重的扣100分<\/p><p>（二）已报废、达到国家强制报废标准的车辆及“五大总成”；非法拼装的车辆<\/p><p>每次扣1分，严重的每次扣2分，特别严重的每次扣20分<\/p><p>（三）汽车安全气囊、安全带扣等具有交通安全隐患的汽车配件类商品<\/p><p>每次扣1分，严重的每次扣2分，特别严重的每次扣20分<\/p><p>（四）特定行政管理部门或机构方可发布或采购的商品或服务，如涉及航空、铁路相关的设备、配件等<\/p><p>每次扣1分，严重的每次扣2分，特别严重的每次扣20分<\/p><p>六、药品、医疗器械、农药兽药类<\/p><p>（一）假药、劣药、未经境内备案等禁止出售的药品；特殊管理类药品（如精神类、麻醉类、放射类、兴奋剂类、疫苗、血液制品、有毒及易制毒药品等）<\/p><p>每次扣20分，严重的扣100分<\/p><p>（二）境内处方药及非处方药、境外药；与药品作用相同或相似情形的商品，如可致使他人暂时失去反抗能力、意识模糊的迷药；注射类美容针剂类商品；<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（三）未经药品监督管理部门批准生产、进口或未经检验即销售的医疗器械；依照国家食品药品监督管理总局发布的《医疗器械分类规则》及相关分类目录认定的“三类医疗器械”；<\/p><p>每次扣20分，严重的扣100分<\/p><p>（四）农业部发布的禁用限用类农药<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（五）假劣兽药、兽药处方药、国家公示查处的兽药、兽药监督管理部门禁止生产、禁止使用和限制使用的兽药、兽药原料药等<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（六）病原微生物（能够使人或者动物致病的微生物）<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>七、不适宜商品或服务、违反公序良俗类<\/p><p>（一）未取得旅游资质、规避合法出入境流程的商品或服务<\/p><p>每次扣1分，严重的每次扣2分，特别严重的每次扣20分<\/p><p>（二）航空公司积分、里程，航空公司积分/里程兑换的机票，机票代订服务<\/p><p>每次扣1分，严重的每次扣2分，特别严重的每次扣20分<\/p><p>（三）违反自然科学、封建迷信类的商品及服务<\/p><p>每次扣1分，严重的每次扣2分，特别严重的每次扣20分<\/p><p>（四）涉嫌违反法规政策、存在造假作弊风险的商品或服务，如代考试类、代办套牌、代办理特许证明、代办理就业证明等<\/p><p>每次扣2分，严重的每次扣5分，特别严重的每次扣20分<\/p><p>（五）存在妨碍行政管理、扰乱公共秩序类的不适宜代办服务，如代挂号、代健康诊断咨询服务等<\/p><p>每次扣1分，严重的每次扣2分，特别严重的每次扣20分<\/p><p>（六）阿里巴巴及旗下公司提供的各项服务账号及服务，未经授权或仿阿里巴巴及旗下公司的产品、软件及服务<\/p><p>每次扣2分，严重的每次扣20分<\/p><p>（七）未经许可发布的奥林匹克运动会、世界博览会、亚洲运动会等特许商品<\/p><p>每次扣1分，严重的每次扣5分，特别严重的每次扣20分<\/p><p>（八）食用盐，如碘盐、无碘盐、进口食用盐等<\/p><p>每次扣1分<\/p><p>（九）不得私自转让的物流类商品及补助类商品<\/p><p>每次扣1分<\/p><p>（十）存在质量问题或危害人身安全的不合格商品<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>八、动植物、器官及捕杀工具类<\/p><p>（一）人口买卖、人体器官（含卵子、精子）、遗体、人类遗传资源材料及相关服务<\/p><p>每次扣20分，严重的扣100分<\/p><p>（二）国家保护类动物、濒危动物及相关商品；已灭绝动物、国家二级以上保护动物的化石<\/p><p>每次扣20分，严重的扣100分<\/p><p>（三）国家保护类植物、濒危植物及相关商品<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（四）地域性保护动植物、公益性动植物、“三有”类保护动物等<\/p><p>每次扣1分，严重的每次扣5分<\/p><p>（五）严重危害人畜安全的动物捕杀设备及配件<\/p><p>每次扣1分，严重的每次扣20分，特别严重的扣100分<\/p><p>（六）猫狗肉、猫狗皮毛、鱼翅、熊胆及相关制品；其他暂不对人畜构成安全危害的捕杀设备及配件<\/p><p>每次扣1分，严重的每次扣5分<\/p><p>九、涉及盗取、作弊、欺诈、骚扰他人等商品或信息类<\/p><p>（一）偷盗、走私、抢劫、欺诈、无人认领等非法所得<\/p><p>每次扣20分，严重的扣100分<\/p><p>（二）用于达到盗取目的的工具、教程及服务，如开锁工具、教程、信号干扰器等<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（三）利用电话线路上的直流电来发光的电话灯<\/p><p>每次扣1分，严重的每次扣20分<\/p><p>（四）具有欺诈风险的商品及服务，如达到欺诈目的的工具或服务<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（五）存在兑换风险的卡券、分期返还、时间不可查虚拟类商品等<\/p><p>每次扣2分，严重的每次扣20分<\/p><p>（六）具有作弊风险的商品及服务，或用于达到作弊目的的工具、教程及服务<\/p><p>每次扣20分，严重的扣100分<\/p><p>（七）代炒作、代投票、代删除等不当获取流量或人气的商品或服务<\/p><p>每次扣20分，严重的扣100分<\/p><p>（八）用于提高抢购成功概率、干扰平台正常秩序的软件或服务<\/p><p>每次扣2分，严重的每次扣20分<\/p><p>（九）骚扰他人的工具类商品及服务，如骚扰软件、群<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>发设备及服务等<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>十、未经允许违反国家行政法规或不适合交易的商品或信息类<\/p><p>（一）伪造变造的货币以及印制设备<\/p><p>每次扣100分<\/p><p>（二）人民币/外币及仿制品；非法买卖外汇，资金支付结算服务或相关产品<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（三）基于区块链技术生成的虚拟货币等数字化产品及衍生服务<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（四）特定金融机构方可提供的商品或相关服务<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（五）涉及非法传销的商品或服务<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（六）非法集资类商品<\/p><p>每次扣1分，严重的每次扣20分，特别严重的扣100分<\/p><p>（七）赌博、博彩类商品及服务，如赌博平台、工具等<\/p><p>每次扣20分，严重的扣100分<\/p><p>（八）违反国家实名制规定的商品，如已激活的手机卡、上网卡等<\/p><p>每次扣20分，严重的扣100分<\/p><p>（九）境内运营商的上网资费卡或资费套餐及SIM卡及未经实名登记便可登录使用的通话、上网类商品及服务；SP业务自消费类商品<\/p><p>每次扣2分，严重的每次扣20分<\/p><p>(十)互联网用户账号类商品或服务<\/p><p>购物类账号每次扣2分，社交等其他账号每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（十一）未经国家备案、官方已停止经营、外挂、私服的网络游戏、游戏点卡、货币类商品及服务；游戏版权号交易及相关服务<\/p><p>每次扣20分，严重的扣100分<\/p><p>（十二）棋牌类游戏币商品及充值类服务<\/p><p>每次扣2分，严重的每次扣20分<\/p><p>（十三）烟草及烟草专<span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(0, 0, 0);\">​<\/span>用机械，电子烟及相关产品<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（十四）法律法规、管理措施与决议等要求中被禁止或限制进出口的商品或服务<\/p><p>每次扣1分，严重的每次扣20分，特别严重的扣100分<\/p><p>（十五）境外出版物代购类商品或服务<\/p><p>每次扣5分，严重的每次扣20分，特别严重的扣100分<\/p><p>（十六）法律规定禁止出版发行的内容、国家明令淘汰或停止销售的出版物、禁止及未经批准的集邮票品、文物<\/p><p>每次扣2分，严重的每次扣5分，特别严重的每次扣20分<\/p><p>（十七）内部资料性出版物、内部发行图书<\/p><p>每次扣1分，严重的每次扣20分，特别严重的扣100分<\/p><p>（十八）借用热点话题恶意营销、存在内容炒作的商品或服务<\/p><p>每次扣2分，严重的每次扣20分<\/p><p>（十九）禁止出售的塑料制品<\/p><p>每次扣1分，严重的每次扣5分<\/p>","text":"第一章 概述 第一节【适用范围】 适用于所有的闲鱼用户（本规范试行期间逐步适用，具体以闲鱼通知为准），包括在闲鱼移动客户端、域名为“goofish.com”的闲鱼网站、小程序等发布/购买闲置商品、发布/浏览信息的闲鱼用户。 第二节【原则】 （一）闲鱼用户的所有行为均须遵守国家法律、法规规定、闲鱼规则要求，以及根据相应页面指引进行操作。 （二）试行本规范的闲鱼用户在本规范的适用上一律平等。 （三）除违反法律、法规规定外，闲鱼用户首次、非故意或轻微违规等的，视具体情节享有减免、从轻、警告、教育学习等替代性处理的机会。 （四）闲鱼用户累犯、多条并犯、或对其他会员或平台造成恶劣影响的，视具体情节从重或加重处理。 第二章 基本要求 第三节【注册】 根据闲鱼平台的流程和要求完成注册的会员可登录闲鱼社区，成为闲鱼用户，账号名注册后无法自行修改。 第四节【认证】 闲鱼用户在闲鱼发布信息、互动或交易时，需要通过实名认证，同时闲鱼用户须根据平台要求完成实人认证及认证复核，确保认证信息真实有效。 第五节【信息发布及审核】 对闲鱼用户在闲鱼社区发布的部分商品及信息，闲鱼将采取随机方式进行审核，审核过程中如发现用户存在违法违规、恶意或故意规避行为的，闲鱼除处理商品及信息外，还将酌情采取扣分、处置限权等措施。 第六节【交易】 （一）【交易约定】 交易前，买卖双方可针对交易及商品情况沟通交流，可选择线上交易或“见一见”见面交易。买方拍下且未付款到支付宝担保账号前，以及买方付款后卖方发货前，买卖双方均可自主关闭订单。线上交易卖方操作“我要发货”，或“见一见”交易卖方完成“扫码收款”即表示买卖双方达成交易约定。 （二）【交易超时】 买卖双方选择通过闲鱼社区进行线上交易的，须遵守 《闲鱼交易超时说明》 的相关要求。 （三）【交易流程】 闲鱼支持支付宝担保交易，若买方对交易货物有疑问，买方可在确认收货（含系统超时自动确认收货）前提出退款申请。选择在线付款后见面交易或用“见一见”发起见面交易的，买方需当面验货，当面收货即表示买方对货物无异议。交易成功后，不支持售后维权。如买卖双方在交易过程中有争议，按照 《闲鱼社区交易争议处理规范》 处理。 （四）【交易评价】 为确保评价内容能为买方购物决策提供可靠的依据，反映商品或服务的真实情况，买卖双方通过闲鱼评价工具发布评价的，其评价应当与交易的商品或服务具有关联性，且合法、客观、真实，买卖双方不得利用闲鱼评价侵害相关方合法权益。 第三章 社区管理 第七节【违规管控】 （一）【危及交易安全】每次扣100分。对涉嫌危及交易安全的用户，闲鱼还可视情节严重程度直接对其订单、通知支付宝对其绑定的支付宝账号采取必要的管控措施等。 “危及交易安全”指涉嫌以非法获利为目的，造成交易任何一方出现严重钱/货损失的行为，或可能引发资金风险的行为，包括但不限于虚假发货、诱导缴纳定金/预付款/保证金、诱导诈骗等； 同时，闲鱼长期致力于建立彼此信任的社区环境，为了让闲置资源交易社区持续健康发展，确保交易的安全性，避免用户因跳转至第三方网站后发生交易纠纷、欺诈以及维权困难等问题，闲鱼在用户私聊场景中对非由闲鱼社区产生的且在闲鱼社区内传播的外部链接进行规范，对可能存在影响正常交易及用户体验的外部链接，在闲鱼APP中不支持直接访问，链接的范围包括但不仅限于： 1、诱导用户类 1）涉嫌诱导用户进行有虚假宣传、诈骗欺诈等潜在风险的交易、拼团的外部链接； 2）涉嫌误导用户关注、分享、下载、传播的外部链接； 2、用户体验类 1）含骚扰信息、垃圾短信等影响用户体验的外部链接； 2）传播涉及谣言、低俗或引人不适的内容的外部链接； 3、其他传播虚假、欺诈、不良信息以及影响用户使用体验的外部链接。 （二）【不当注册】每次扣100分。视情节严重程度还可采取限制登录等措施。 “不当注册”指通过软 ​ 件、程序或人工等方式大量注册账号的行为； （三）【不当使用账号】每次扣100分。视情节严重程度还可采取限制登录等措施。 “不当使用账号”指涉嫌租借、盗取、转让或囤积账号等行为； （四）【泄露用户信息】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “泄露用户信息”指擅自将他人隐私信息（包括但不限于电话、住址、姓名等）提供给第三方或公布于众的行为； （五）【骚扰他人】处理违规信息。视情节严重程度还可采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。 “骚扰他人”指恐吓、辱骂、恶意中伤或人身攻击他人的行为； （六）【扰乱平台秩序】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣40分，特别严重的扣100分。 “扰乱平台秩序”指利用平台所赋予的权利损害他人合法权益或妨碍平台运营秩序的行为，包括但不限于通过刷单、刷赞、刷粉等炒作形式进行数据造假，或在准入申请、活动报名、违规申诉、举报、纠纷判责等环节提供不真实的证明材料； （七）【发布违禁信息】处理违规信息。视情节严重程度还可采取扣分措施，扣分详见附表1。 “发布违禁信息”指用户发布了违反国家相关法律法规、违反 ​ 社 ​ 会道德规范、违反平台要求的信息； （八）【出售假冒、盗版商品】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “出售假冒、盗版商品”指用户涉嫌出售假冒注册商标、盗版商品，闲鱼可基于符合常理的认知，通过商品信息、交易凭证等依据进行判断并处理； （九）【不当使用他人权利】处理违规信息。 “不当使用他人权利”指用户发布的商品或信息涉嫌不当使用他人商标权、著作权、专利权、肖像权等权利，或造成不正当竞争的行为。 （十）【被权利人投诉出售假冒商品】处理违规信息，情节特别严重的将采取扣100分措施。 “被权利人投诉出售假冒商品”指用户被权利人投诉出售假冒商品。无论是否被司法、行政机关认定，同一闲鱼用户被权利人投诉出售假冒商品的行为在同一自然年内累计不可达到三次及以上（三天内的投诉算一次），一旦出现同一自然年内累计三次被权利人投诉的，视为特别严重扣100分，分值不再恢复，永久限制闲鱼账号使用。 （十一）【规避准入要求发布商品或信息】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “规避准入要求发布商品或信息”指用户未经资质备案发布商品或信息，或规避行业特殊要求发布商品或信息，包括但不限于： 1.发布需资质备案后方可发布的商品或信息，如预包装食品、保健食品、酒、婴幼儿食品、特殊用途类食品、法律咨询/代理/法律文书代拟、专利/知识产权/商标/版权代理及相关服务、工商注册/登记、会计服务、租房等； 2.规避行业特殊要求发布的商品或信息： 二级类目“图书”商品需扫描ISBN编码发布，发布的单一闲置物品信息中不得含有多件出版物类物品信息（套装出版物除外）。 从事商业经营活动的经营性卖家，需要上传出版物经营许可证、出版物租赁备案、营业执照等资质证明，经平台审核通过后方可发布; 票务类商品须发布在二级类目“演艺/表演类门票”，在线商品数不得超过3件，单张门票的售卖价格不得超过票面价格的10%，且近90天演艺/表演类门票交易笔数不得超过3笔； 租房房源类信息须和发布类目匹配并符合相关法律、法规、政策要求，房源信息必须真实不得重复，且不得收取不合理费用； 兼职信息类商品的用户主体须为企业或获得企业授权，且发布信息真实有效。 （十二）【发布风险信息】处理违规信息。视情节严重程度还可采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。 “发布风险信息”指用户发布存在妨害用户权益或影响平台秩序的商品或信息，包括但不限于：发布质量不合格商品（经新闻媒体曝光、国家质监部门等行政管理部门通报，系质量不合格的线下某一品牌、品类、批次的商品，或其他要求协查的商品）、存在交易风险的虚拟类商品、实际不存在商品、制假风险的品牌配件（如品牌空瓶、空酒瓶、空奶粉罐等）、引流、无效广告、信息要素不一致、借用话题/内容炒作引导、或有违公序良俗、规则或闲鱼服务协议的商品或信息等。 （十三）【描述不当】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “描述不当”指通过买方反馈或闲鱼排查等方式，发现商品（或服务）与卖方描述不相符或不符合平台相关要求，妨害用户权益的行为，包括但不限于： 1.买方收到的商品或接受的服务与卖方描述不相符，损害买方权益的； 2.闲鱼排查到的商品或服务存在与卖方描述不相符的； 3.卖方未对商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等必须说明的信息进行真实、完整的描述进行如实披露的。 （十四）【违背承诺】每次扣20分，严重的每次扣40分。 “违背承诺”指用户未按约定或平台规定提供承诺的服务，妨害用户权益的行为，包括但不限于： 1.卖方违背交易约定，是指闲鱼卖方须在商品描述、商品留言、私聊等闲鱼提供的官方沟通渠道中（不包括手机、电话、QQ等非官方渠道）明确买卖双方的交易约定，约定内容包括但不限于是否提供发票、发货时间、交易方式等。在达成交易约定后，对于买卖双方约定的事项，若由于卖方单方面原因导致未履行的，视为卖方违背交易约定； 2.买方违背交易约定，是指闲鱼买方需在交易前充分了解必要的商品情况，包括但不限于商品的基本属性、使用时长、成色、具体瑕疵（划痕、裂痕等）、维修记录、质量问题及质保期等，并约定商品的交易价格。在达成交易约定后，买方需客观、理性地进行交易。在达成交易约定后，对于买卖双方约定的事项，若由于买方单方面违约的(卖方原因导致的除外)，视为买方违背交易约定； 3.违背自行作出的其他承诺，如承诺互动活动有奖品、赠品等奖励、但未兑现，承诺参与闲鱼活动但未如期履约或擅自退出； 4.未按闲鱼规定向闲鱼履约或向闲鱼用户提供相应服务的。 （十五）【违反公序良俗、规则或协议的行为】处理违规信息。视情节严重程度还可采取扣分措施，严重的每次扣20分，特别严重的扣100分。 “违反公序良俗、规则或协议的行为”指闲鱼用户存在违反法律法规、违反闲鱼规则或《闲鱼社区用户服务协议》、或有违公序良俗的行为； （十六）【引导站外交易】处理违规信息。视情节严重程度还可以采取扣分措施，一般的每次扣1分，严重的每次扣20分，特别严重的扣100分。 “引导站外交易”是指发布或推送含有容易导致交易风险的第三方商品或信息，或者通过其他方式诱导用户跳转至第三方网站或客户端等，可能产生骚扰用户、诈骗、影响用户交易安全等损害用户合法权益的行为。引导站外交易的情形包括但不限于： 1.发布或推送含有容易导致交易风险的第三方商品或信息（如网络购物、导购、团购、促销、拼单、砍价、返利、领取优惠券等第三方网站或客户端的名称、标识、二维码、超链接、联系账号等信息，信息格式包括但不限于文字或变异文字、图片、语音、视频），引导用户在第三方平台交易。特定频道另有约定的除外； 2.通过其他方式诱导用户跳转至第三方网站或客户端等，如：在头像、个人主页背景图片中添加引导到第三方平台交易的内容。 违规情节说明如下： 一般情节： 影响范围可控，且未对其他会员/平台权益造成严重损害。 严重情节： 1.同一违规行为累犯或多条并犯的，视具体情节违规扣分加重； 2.已经或即将严重损害其他会员/平台权益的。 特别严重情节： 1.手段特别恶劣或刻意规避； 2.造成严重的人身伤害或其他极其恶劣影响。 第八节【管控措施】 闲鱼用户违反本规范相关规定的，闲鱼将依据本规范进行处理，具体措施包括但不限于处理违规信息、扣分、闲鱼用户权限管控等措施，同时针对情节严重的，闲鱼将建立违规公示名单，在社区内公开披露其违法违规情形，涉嫌违法违规的，闲鱼也将配合移送相关国家机关处理。 （一）【分值及限权】 闲鱼用户的违规行为可导致 “闲气值”分数（满分100）降低，当前闲气值=100分-近90天因违规扣分的总和，当前闲气值等于0分时，分值不再变化。不同闲气值区间，闲鱼对用户采取不同的处理措施： （二）【管控解除及申诉】 被执行权限管控的闲鱼用户，当其全部违规行为被纠正、通过学习/公益等方式提前解除、或权限管控措施执行完毕，闲鱼账号使用权限可恢复正常； 针对违规管控，闲鱼用户在规定的期限内可发起申诉，根据申诉信息进行审核判断，申诉成立，撤销违规处理；逾期未申诉或申诉不成立，违规处理不中止、不撤销。 （三）【违规关联管控】 【违规关联管控】闲鱼用户若发生以下行为，包括但不限于闲鱼用户被处以特定违规行为处罚或发生过危及交易安全的情形（包括但不限于因骗取他人财物、出售假冒商品等被处以查封账号、违规节点处罚、永久限制闲鱼权限等）的，除该闲鱼用户被闲鱼违规处置外, 闲鱼可对该闲鱼用户实际控制人下的其他闲鱼用户账号进行处置（包括处理商品或信息、闲鱼用户权限管控、扣分等）。 第四章 附录 第九节 本规范于2021年9月7日首次生效，最新修订生效时间为2023年6月1日。 附管控措施 一、处理违规信息： 商品类信息：降权/屏蔽、下架或删除闲鱼商品 互动类信息：屏蔽帖 rgb(34, 34, 34);\">3、欺诈风险永久限权<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">因闲鱼平台核实到用户账户存在严重安全风险，现对用户账户做永久限制闲鱼权限，包括删除闲鱼个人主页信息、限制发布/购买商品/私聊/留言等。请务必注意在发布商品及售卖沟通过程中不要出现脱离平台交易等高风险行为。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">4、涉嫌交易风险永久限权<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">因平台核实到用户账号发送违规信息，涉嫌欺诈风险，严重干扰闲鱼正常交易秩序，故对用户账户做永久限制闲鱼权限，包括删除闲鱼个人主页信息、限制发布/购买商品/私聊/留言等。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">5、其他违规<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">其他违规可以通过点击违规消息通知查询具体违规详情。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">二、收到违规判定通知可以这样做<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1、查看违规判定，违规属实，确认处罚方式，并加强发布和交易规范。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2、查看违规判定，违规误判，进行自助申诉解除处罚。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">查看违规判断的路径：【我的】—【安全中心】—【闲气值】—【违规详情】，进行查询。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●闲气值和违规记录挂钩，无违规记录会显示100分，不良行为会扣除相应的闲气值。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●闲气值中还能查看90天内违规记录、历史违规、闲气值明细。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●当违规属实，扣除相应的闲气值，部分权限受到限制。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●当违规误判时，在规定时间内发起申诉，申诉成功处罚将撤销，闲气值也会恢复正常。<\/span><\/p><p><img src=\"assets/img/112952-0311fhed-111b9a.png\"><img src=\"assets/img/112958-7346oiov-530997.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">三、如何进行违规申诉<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">如您对平台判定有疑问，可在处置后的90天内在【违规记录】中，点击该违规详情下方按钮进行申诉。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">也可在90天内，在消息—通知消息—违规通知，查看违规信息，并进行申诉。<\/span><\/p><p><img src=\"assets/img/113014-1681iorg-6de1a5.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">*温馨提示：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">1、请具体描述申诉问题，申诉后，平台会根据您账户行为、历史发布信息等进行复核。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2、您完成申诉后，一般会在3—5个工作日内有申诉结果，申诉结果您在对应违规记录里可查看。<\/span><\/p>","text":"一、 常见违规类型介绍 1、危及交易安全（闲鱼交易纠纷） 该违规是因为接到会员举报，和被举报用户账号之间存在货物、货款等纠纷未解决，但是钱款等已经损失的情况。 2、闲鱼商品涉及违禁风险 因发布的商品存在违禁信息，请勿再发布此类商品，以避免不必要的违规。 3、欺诈风险永久限权 因闲鱼平台核实到用户账户存在严重安全风险，现对用户账户做永久限制闲鱼权限，包括删除闲鱼个人主页信息、限制发布/购买商品/私聊/留言等。请务必注意在发布商品及售卖沟通过程中不要出现脱离平台交易等高风险行为。 4、涉嫌交易风险永久限权 因平台核实到用户账号发送违规信息，涉嫌欺诈风险，严重干扰闲鱼正常交易秩序，故对用户账户做永久限制闲鱼权限，包括删除闲鱼个人主页信息、限制发布/购买商品/私聊/留言等。 5、其他违规 其他违规可以通过点击违规消息通知查询具体违规详情。 二、收到违规判定通知可以这样做 1、查看违规判定，违规属实，确认处罚方式，并加强发布和交易规范。 2、查看违规判定，违规误判，进行自助申诉解除处罚。 查看违规判断的路径：【我的】—【安全中心】—【闲气值】—【违规详情】，进行查询。 ●闲气值和违规记录挂钩，无违规记录会显示100分，不良行为会扣除相应的闲气值。 ●闲气值中还能查看90天内违规记录、历史违规、闲气值明细。 ●当违规属实，扣除相应的闲气值，部分权限受到限制。 ●当违规误判时，在规定时间内发起申诉，申诉成功处罚将撤销，闲气值也会恢复正常。 三、如何进行违规申诉 如您对平台判定有疑问，可在处置后的90天内在【违规记录】中，点击该违规详情下方按钮进行申诉。 也可在90天内，在消息—通知消息—违规通知，查看违规信息，并进行申诉。 *温馨提示： 1、请具体描述申诉问题，申诉后，平台会根据您账户行为、历史发布信息等进行复核。 2、您完成申诉后，一般会在3—5个工作日内有申诉结果，申诉结果您在对应违规记录里可查看。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":3,"words":808,"sections":0,"subs":0,"version":""},"related":["sec-57","sec-62","a498834062509445","a499947645891973"]}]},{"module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"风控与账号安全","color":"green","count":4,"items":[{"id":"sec-57","kind":"chapter","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"风控与账号安全","title":"第十一章 风控管理与风险排查","title_raw":"第十一章 风控管理与风险排查","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><p>闲鱼风控已从&quot;人工审核&quot;升级为&quot;AI+人工&quot;双轨制。矩阵运营和批量操作一旦触发风控，轻则限制登录，重则永久封禁。本章基于实际违规案例，建立预防-识别-处置-复盘全流程。<\/p>\n<h3 id=\"sec-58\">11.1 风控预防体系<\/h3><p>风控不是事后补救，而是贯穿账号全生命周期的管理。核心原则：环境隔离、行为真实、节奏自然、证据完整。<\/p>\n<table>\n<thead>\n<tr>\n<th>层级<\/th>\n<th>防控点<\/th>\n<th>执行标准<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>设备层<\/td>\n<td>一机一卡一号<\/td>\n<td>每账号独立设备；不频繁切换设备登录；不安装多开/分身软件<\/td>\n<\/tr>\n<tr>\n<td>网络层<\/td>\n<td>独立网络<\/td>\n<td>多账号使用不同WiFi或手机流量；禁止同WiFi下登录超过1个账号<\/td>\n<\/tr>\n<tr>\n<td>注册层<\/td>\n<td>真实注册<\/td>\n<td>实名/实人认证；避免批量注册、虚拟号段、接码平台注册<\/td>\n<\/tr>\n<tr>\n<td>行为层<\/td>\n<td>自然养号<\/td>\n<td>每日在线≥2小时；模拟真实用户浏览、点赞、评论<\/td>\n<\/tr>\n<tr>\n<td>交易层<\/td>\n<td>真实交易<\/td>\n<td>避免同一账号高频买卖给相同对象；拒绝刷单、虚假发货<\/td>\n<\/tr>\n<tr>\n<td>内容层<\/td>\n<td>合规发布<\/td>\n<td>禁售清单对照；不使用违禁词；不发布站外联系方式<\/td>\n<\/tr>\n<tr>\n<td>证据层<\/td>\n<td>留痕备查<\/td>\n<td>发货视频、聊天记录、物流单号保存至少3个月<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>环境隔离检查清单（每日执行）<\/h4>\n<ul>\n<li>每个账号是否使用独立设备？<\/li>\n<li>每个账号是否使用独立网络（WiFi/流量）？<\/li>\n<li>是否关闭了手机的多开/分身/虚拟机？<\/li>\n<li>账号是否完成实名+实人认证？<\/li>\n<li>今日是否保持2小时以上自然在线？<\/li>\n<li>是否有多个账号互相点赞/交易/转发？<\/li>\n<li>是否使用同一收货地址发货？<\/li>\n<\/ul>\n<h3 id=\"sec-59\">11.2 常见风险类型与识别<\/h3><p>根据官方规则及实际案例，以下风险类型最高发：<\/p>\n<table>\n<thead>\n<tr>\n<th>风险类型<\/th>\n<th>触发原因<\/th>\n<th>页面提示<\/th>\n<th>后果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>不当注册<\/td>\n<td>批量注册、虚拟号、同一设备注册多号、异常IP<\/td>\n<td>“存在1条限制登录风险！需完成实名认证解除风险”<\/td>\n<td>限制登录，需完成认证；多次触发可能永久封禁<\/td>\n<\/tr>\n<tr>\n<td>不当使用账户<\/td>\n<td>租借/买卖账号、同一账号多人使用、异常登录地<\/td>\n<td>“账号被永久限制使用，请使用其他手机号重新注册”<\/td>\n<td>永久限制登录，无法解封<\/td>\n<\/tr>\n<tr>\n<td>危及交易安全<\/td>\n<td>虚假发货、诱导定金/预付款、诈骗欺诈<\/td>\n<td>安全中心显示&quot;危及交易安全&quot;<\/td>\n<td>视情节扣分（严重 20 分 / 特别严重 100 分），并可通知支付宝管控<\/td>\n<\/tr>\n<tr>\n<td>发布违禁信息<\/td>\n<td>售卖禁售品、使用违禁词、引导站外<\/td>\n<td>商品被下架+违规扣分<\/td>\n<td>1-100分不等，视品类<\/td>\n<\/tr>\n<tr>\n<td>扰乱平台秩序<\/td>\n<td>刷单、刷赞、刷粉、数据造假<\/td>\n<td>安全中心显示&quot;扰乱平台秩序&quot;<\/td>\n<td>严重40分，特别严重100分<\/td>\n<\/tr>\n<tr>\n<td>描述不当/违背承诺<\/td>\n<td>商品与描述不符、不履约、不发货<\/td>\n<td>买家投诉+平台判定<\/td>\n<td>严重 20 分 / 特别严重 100 分（官方档位）<\/td>\n<\/tr>\n<tr>\n<td>关联风控<\/td>\n<td>同一控制人名下账号违规，连带其他账号<\/td>\n<td>多个账号同时被限制<\/td>\n<td>对控制人名下账号统一处置<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>风险示例截图<\/h4>\n<p>图：不当注册风险示例——账号被限制登录，需完成实名认证解除（点击放大）<\/p>\n<p>图：不当使用账户风险示例——账号被永久限制使用，需重新注册（点击放大）<\/p>\n<p>“不当使用账户”（租借/买卖账号）是红线中的红线。一旦被判定，该账号永久无法解封，且会触发关联风控，影响同一控制人名下其他账号。<\/p>\n<h3 id=\"sec-60\">11.3 风险出现后排查与处置<\/h3><p>当收到风控提示后，按以下流程处理，避免情绪化操作导致二次违规：<\/p>\n<h4>第一步：确认风险类型<\/h4>\n<table>\n<thead>\n<tr>\n<th>提示文案<\/th>\n<th>对应风险类型<\/th>\n<th>可逆性<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>“需完成实名认证解除风险”<\/td>\n<td>不当注册<\/td>\n<td>可逆（完成认证后可能恢复）<\/td>\n<\/tr>\n<tr>\n<td>“账号被永久限制使用，请使用其他手机号重新注册”<\/td>\n<td>不当使用账户<\/td>\n<td>不可逆<\/td>\n<\/tr>\n<tr>\n<td>“存在危及交易安全”<\/td>\n<td>危及交易安全<\/td>\n<td>视情节，可申诉<\/td>\n<\/tr>\n<tr>\n<td>商品被下架 + 扣分<\/td>\n<td>发布违禁/风险信息<\/td>\n<td>可申诉<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>第二步：定位触发原因<\/h4>\n<ol>\n<li>检查近7天操作记录：是否批量注册、多账号共用网络、同一设备切换账号、异常IP登录。<\/li>\n<li>检查交易行为：是否高频买卖给同一对象、是否有买家投诉、是否有虚假发货。<\/li>\n<li>检查商品内容：是否误触禁售品类、是否使用违禁词、是否引导站外。<\/li>\n<li>检查矩阵关联：同一身份证/手机号/设备/网络下其他账号是否同时异常。<\/li>\n<li>检查登录环境：是否使用了VPN/代理IP、是否异地登录频繁。<\/li>\n<\/ol>\n<h4>第三步：分类型处置<\/h4>\n<table>\n<thead>\n<tr>\n<th>风险类型<\/th>\n<th>处置动作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>不当注册<\/td>\n<td>立即完成实名认证+实人认证；暂停该设备3天内的注册行为；检查该设备是否登录其他账号<\/td>\n<\/tr>\n<tr>\n<td>不当使用账户<\/td>\n<td>该账号弃用，不可再尝试登录；检查同设备/同网络/同身份证下其他账号是否被关联；隔离所有相关账号<\/td>\n<\/tr>\n<tr>\n<td>危及交易安全<\/td>\n<td>停止可疑交易；整理发货凭证、聊天记录；在处置后 <strong>90 天内<\/strong>提交申诉（一般 3–5 个工作日反馈）<\/td>\n<\/tr>\n<tr>\n<td>发布违禁信息<\/td>\n<td>删除违规商品；对照禁售清单整改；保留申诉证据<\/td>\n<\/tr>\n<tr>\n<td>关联风控<\/td>\n<td>立即隔离所有账号（换设备、换网络、换手机号）；暂停矩阵操作，待风险解除并完成环境隔离后再恢复<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>第四步：复盘与规避<\/h4>\n<ul>\n<li>建立该账号的完整&quot;风控档案&quot;：设备、网络、手机号、操作时间线<\/li>\n<li>标记高风险设备和网络，后续不再使用<\/li>\n<li>同批次注册的账号全部重点观察7天<\/li>\n<li>调整养号节奏，降低操作频率<\/li>\n<\/ul>\n<h3 id=\"sec-61\">11.4 矩阵关联风控与隔离策略<\/h3><p>官方规则明确：若一个账号因骗取财物、售假、扰乱秩序等被严重处罚，闲鱼可对同一实际控制人名下的其他账号一并处置。矩阵运营必须做好隔离。<\/p>\n<table>\n<thead>\n<tr>\n<th>隔离维度<\/th>\n<th>最低标准<\/th>\n<th>推荐标准<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>设备<\/td>\n<td>一账号一设备<\/td>\n<td>一账号一手机，不使用任何多开/分身<\/td>\n<\/tr>\n<tr>\n<td>网络<\/td>\n<td>不同WiFi<\/td>\n<td>每账号独立手机流量，或每账号独立宽带<\/td>\n<\/tr>\n<tr>\n<td>手机号<\/td>\n<td>一账号一手机号<\/td>\n<td>不同运营商号段，避免连号/虚拟号<\/td>\n<\/tr>\n<tr>\n<td>身份证<\/td>\n<td>一身份证最多3个支付宝/闲鱼号<\/td>\n<td>核心账号使用不同身份证主体<\/td>\n<\/tr>\n<tr>\n<td>支付宝<\/td>\n<td>一账号绑定一支付宝<\/td>\n<td>核心账号使用独立支付宝，避免资金关联<\/td>\n<\/tr>\n<tr>\n<td>收货地址<\/td>\n<td>不共用同一地址<\/td>\n<td>不同城市/区域，地址有明显差异<\/td>\n<\/tr>\n<tr>\n<td>商品<\/td>\n<td>不互相转发/点赞<\/td>\n<td>不同账号经营不同类目，避免同质化<\/td>\n<\/tr>\n<tr>\n<td>交易<\/td>\n<td>不互相买卖<\/td>\n<td>无任何交易关联，不共用同一个买家<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>矩阵风控巡检表<\/h4>\n<table>\n<thead>\n<tr>\n<th>检查项<\/th>\n<th>频率<\/th>\n<th>正常<\/th>\n<th>异常<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>各账号安全中心状态<\/td>\n<td>每日<\/td>\n<td>无风险提示<\/td>\n<td>立即隔离+标记<\/td>\n<\/tr>\n<tr>\n<td>各账号闲气值<\/td>\n<td>每日<\/td>\n<td>≥80<\/td>\n<td>低于80停止发布，养号<\/td>\n<\/tr>\n<tr>\n<td>多账号是否共用网络/设备<\/td>\n<td>每周<\/td>\n<td>完全隔离<\/td>\n<td>拆分设备和网络<\/td>\n<\/tr>\n<tr>\n<td>矩阵账号交易关联<\/td>\n<td>每周<\/td>\n<td>无互相交易<\/td>\n<td>停止关联交易<\/td>\n<\/tr>\n<tr>\n<td>违规账号关联影响<\/td>\n<td>每次封号后<\/td>\n<td>其他账号正常<\/td>\n<td>全面隔离+换主体<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>风控红线口诀<\/h4>\n<p>一机一卡一号，不共网不互点不互买。<\/p>\n<p>实名实人要一致，批量注册必被封。<\/p>\n<p>异常登录先停用，关联账号要隔离。<\/p>\n<p>发货凭证留三月，申诉才能有理据。<\/p>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 闲鱼风控已从\"人工审核\"升级为\"AI+人工\"双轨制。矩阵运营和批量操作一旦触发风控，轻则限制登录，重则永久封禁。本章基于实际违规案例，建立预防-识别-处置-复盘全流程。 11.1 风控预防体系 风控不是事后补救，而是贯穿账号全生命周期的管理。核心原则：环境隔离、行为真实、节奏自然、证据完整。 层级 防控点 执行标准 设备层 一机一卡一号 每账号独立设备；不频繁切换设备登录；不安装多开/分身软件 网络层 独立网络 多账号使用不同WiFi或手机流量；禁止同WiFi下登录超过1个账号 注册层 真实注册 实名/实人认证；避免批量注册、虚拟号段、接码平台注册 行为层 自然养号 每日在线≥2小时；模拟真实用户浏览、点赞、评论 交易层 真实交易 避免同一账号高频买卖给相同对象；拒绝刷单、虚假发货 内容层 合规发布 禁售清单对照；不使用违禁词；不发布站外联系方式 证据层 留痕备查 发货视频、聊天记录、物流单号保存至少3个月 环境隔离检查清单（每日执行） 每个账号是否使用独立设备？ 每个账号是否使用独立网络（WiFi/流量）？ 是否关闭了手机的多开/分身/虚拟机？ 账号是否完成实名+实人认证？ 今日是否保持2小时以上自然在线？ 是否有多个账号互相点赞/交易/转发？ 是否使用同一收货地址发货？ 11.2 常见风险类型与识别 根据官方规则及实际案例，以下风险类型最高发： 风险类型 触发原因 页面提示 后果 不当注册 批量注册、虚拟号、同一设备注册多号、异常IP “存在1条限制登录风险！需完成实名认证解除风险” 限制登录，需完成认证；多次触发可能永久封禁 不当使用账户 租借/买卖账号、同一账号多人使用、异常登录地 “账号被永久限制使用，请使用其他手机号重新注册” 永久限制登录，无法解封 危及交易安全 虚假发货、诱导定金/预付款、诈骗欺诈 安全中心显示\"危及交易安全\" 视情节扣分（严重 20 分 / 特别严重 100 分），并可通知支付宝管控 发布违禁信息 售卖禁售品、使用违禁词、引导站外 商品被下架+违规扣分 1-100分不等，视品类 扰乱平台秩序 刷单、刷赞、刷粉、数据造假 安全中心显示\"扰乱平台秩序\" 严重40分，特别严重100分 描述不当/违背承诺 商品与描述不符、不履约、不发货 买家投诉+平台判定 严重 20 分 / 特别严重 100 分（官方档位） 关联风控 同一控制人名下账号违规，连带其他账号 多个账号同时被限制 对控制人名下账号统一处置 风险示例截图 图：不当注册风险示例——账号被限制登录，需完成实名认证解除（点击放大） 图：不当使用账户风险示例——账号被永久限制使用，需重新注册（点击放大） “不当使用账户”（租借/买卖账号）是红线中的红线。一旦被判定，该账号永久无法解封，且会触发关联风控，影响同一控制人名下其他账号。 11.3 风险出现后排查与处置 当收到风控提示后，按以下流程处理，避免情绪化操作导致二次违规： 第一步：确认风险类型 提示文案 对应风险类型 可逆性 “需完成实名认证解除风险” 不当注册 可逆（完成认证后可能恢复） “账号被永久限制使用，请使用其他手机号重新注册” 不当使用账户 不可逆 “存在危及交易安全” 危及交易安全 视情节，可申诉 商品被下架 + 扣分 发布违禁/风险信息 可申诉 第二步：定位触发原因 检查近7天操作记录：是否批量注册、多账号共用网络、同一设备切换账号、异常IP登录。 检查交易行为：是否高频买卖给同一对象、是否有买家投诉、是否有虚假发货。 检查商品内容：是否误触禁售品类、是否使用违禁词、是否引导站外。 检查矩阵关联：同一身份证/手机号/设备/网络下其他账号是否同时异常。 检查登录环境：是否使用了VPN/代理IP、是否异地登录频繁。 第三步：分类型处置 风险类型 处置动作 不当注册 立即完成实名认证+实人认证；暂停该设备3天内的注册行为；检查该设备是否登录其他账号 不当使用账户 该账号弃用，不可再尝试登录；检查同设备/同网络/同身份证下其他账号是否被关联；隔离所有相关账号 危及交易安全 停止可疑交易；整理发货凭证、聊天记录；在处置后 90 天内 提交申诉（一般 3–5 个工作日反馈） 发布违禁信息 删除违规商品；对照禁售清单整改；保留申诉证据 关联风控 立即隔离所有账号（换设备、换网络、换手机号）；暂停矩阵操作，待风险解除并完成环境隔离后再恢复 第四步：复盘与规避 建立该账号的完整\"风控档案\"：设备、网络、手机号、操作时间线 标记高风险设备和网络，后续不再使用 同批次注册的账号全部重点观察7天 调整养号节奏，降低操作频率 11.4 矩阵关联风控与隔离策略 官方规则明确：若一个账号因骗取财物、售假、扰乱秩序等被严重处罚，闲鱼可对同一实际控制人名下的其他账号一并处置。矩阵运营必须做好隔离。 隔离维度 最低标准 推荐标准 设备 一账号一设备 一账号一手机，不使用任何多开/分身 网络 不同WiFi 每账号独立手机流量，或每账号独立宽带 手机号 一账号一手机号 不同运营商号段，避免连号/虚拟号 身份证 一身份证最多3个支付宝/闲鱼号 核心账号使用不同身份证主体 支付宝 一账号绑定一支付宝 核心账号使用独立支付宝，避免资金关联 收货地址 不共用同一地址 不同城市/区域，地址有明显差异 商品 不互相转发/点赞 不同账号经营不同类目，避免同质化 交易 不互相买卖 无任何交易关联，不共用同一个买家 矩阵风控巡检表 检查项 频率 正常 异常 各账号安全中心状态 每日 无风险提示 立即隔离+标记 各账号闲气值 每日 ≥80 低于80停止发布，养号 多账号是否共用网络/设备 每周 完全隔离 拆分设备和网络 矩阵账号交易关联 每周 无互相交易 停止关联交易 违规账号关联影响 每次封号后 其他账号正常 全面隔离+换主体 风控红线口诀 一机一卡一号，不共网不互点不互买。 实名实人要一致，批量注册必被封。 异常登录先停用，关联账号要隔离。 发货凭证留三月，申诉才能有理据。","toc":[{"id":"sec-58","title":"11.1 风控预防体系"},{"id":"sec-59","title":"11.2 常见风险类型与识别"},{"id":"sec-60","title":"11.3 风险出现后排查与处置"},{"id":"sec-61","title":"11.4 矩阵关联风控与隔离策略"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":6,"imgs":0,"words":2568,"sections":5,"subs":8,"version":"V2026.10.12"},"related":["sec-86","sec-62","sec-11","sec-23"]},{"id":"a498419103917445","kind":"article","module":"合规风控","module_sub":"底线篇 · 不踩红线","section":"风控与账号安全","title":"识破保证金欺诈骗局","title_raw":"识破保证金欺诈骗局","html":"<p><strong style=\"color: rgb(34, 34, 34);\" clas
