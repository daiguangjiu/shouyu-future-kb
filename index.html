pan style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百一十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方出售禁售物品或提供禁售服务的，交易将视情形做退款或退货退款处理。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"><\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第四章 撤销和中止<\/strong><\/p><p><span style=\"color: rgb(51, 51, 51);\">第一百一十三条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">闲鱼处理争议期间，出现以下任一情形的，闲鱼将中止争议处理程序：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（一）买卖双方一致要求中止，并约定期限自行协商处理争议；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）任何一方通知闲鱼要求将争议提交司法机关或拟向公安机关报案。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"><\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">第一百一十四条<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">出现以下任一情形的，闲鱼将恢复争议处理程序：<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（一）买卖双方自行协商处理争议的，应在程序中止后30日内自行操作交易款项，或向闲鱼提供协商结果，由闲鱼代为操作，逾期买卖双方既未操作交易款项也未告知协商结果；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（二）一方通知闲鱼要求通过司法机关解决争议或拟向公安机关报案的，未在通知闲鱼后的7个工作日内向闲鱼社区提供司法机关或公安机关的案件受理凭证；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（三）争议被司法机关撤诉；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（四）司法机关对争议作出判决且生效；<\/span><\/p><p><span style=\"color: rgb(51, 51, 51);\">（五）公安机关受理案件后的六个月后仍未对案件给出调查结论或处理建议。<\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\"><\/strong><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第五章 执行<\/strong><span style=\"color: rgb(51, 51, 51); background-color: rgba(0, 0, 0, 0);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百一十五条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼处理争议期间，买卖双方协商一致达成和解协议，但无法自行操作的，闲鱼有权根据双方达成的和解协议内容，通知支付宝公司及/或网商银行操作相应的交易款项和(或)保证金。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百一十六条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼对争议做出处理后，或行政机关及消协、人民调解委员会组织调解，买卖双方认可调解结果的，有权按照处理结果通知支付宝公司及/或网商银行将交易款项和（或）保证金的全部或部分支付给买方和(或)卖方，或协助卖方(或买方)按照处理结果将相关款项支付给买方(或卖方)。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百一十七条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">除交易款项外，根据争议处理结果仍需卖方承担赔偿责任的，闲鱼有权通知支付宝公司及/或网商银行划拨卖方根据闲鱼社区相关协议缴纳的保证金或其他款项支付给买方。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百一十八条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">卖方账户余额不足致使无法退款或赔付的，由买卖双方自行协商或通过其他途径解决。<\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\"> <\/span><\/p><p><strong style=\"color: rgb(51, 51, 51);\">第六章 附则 <\/strong><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百一十九条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼活动对买卖双方争议处理有特殊要求的，按照特殊要求处理。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百二十条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">本规范生效或变更后尚未处理完结的交易，适用生效或变更后的规范。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百二十一条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">闲鱼对争议做出处理并通知支付宝公司及/或网商银行支付争议款项后，买方或(和)卖方对闲鱼的处理有异议的，可向人民法院起诉。 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">第一百二十二条 <\/span><\/p><p><span style=\"background-color: rgba(0, 0, 0, 0); color: rgb(51, 51, 51);\">本规范于2015年1月16日首次生效，于2021年3月17日最新修订。<\/span><\/p>","text":"闲鱼社区交易争议处理规范 第一章 总则 第一节 概述 第一条 为保护交易双方当事人的合法权益，维护闲鱼社区（以下简称“闲鱼”）的正常运营秩序，依据闲鱼社区相关规范，制定本规范。买卖双方在闲鱼社区交易发生争议，适用本规范。 第二条 买卖双方在闲鱼上交易发生交易争议，应以公平、诚信为原则进行友好、理性协商，若双方无法自行协商解决的，任一方向闲鱼投诉处理的，闲鱼将根据本规范进行处理。 第三条 闲鱼将根据本规范的规定对买卖双方的争议做出处理。部分买卖双方的争议，闲鱼视争议内容将交由闲鱼小法庭作为独立的第三方进行判断，闲鱼将根据闲鱼小法庭的判断结果对该等争议作出处理。当交易任意一方无法处理，为保障买卖双方交易安全，闲鱼可主动介入处理。 第四条 闲鱼通过闲鱼系统、阿里旺旺、电子邮件、短信或电话等方式向买卖双方发送的与争议处理相关的提示或通知，构成争议处理依据及结论的有效组成部分。 第二节 定义 第五条 运费，指发货/退货所产生的必要费用，如物品拆卸、打包、加固、搬运等相关费用以及运输费用等。 第六条 退货退款，指在卖方签收买方退货后，交易款项支付给买方。 第七条 部分退款，指交易款项部分支付给买方，余款打款给卖方。 第八条 退款，指交易款项支付给买方，物品由卖方自行和买方协商处理。 第九条 打款，指交易款项支付给卖方。 第十条 破损，指物品的一般性损伤，经简单修复后仍可恢复全部使用功能或不影响核心功能使用。 第十一条 损毁，指物品严重受损，无法予以修复或修复后其核心功能已不具有使用价值。修复成本接近物品价值的，视为损毁。 第十二条 交易成功，指订单状态显示“交易成功”。 第十三条 关闭交易，是指买方付款前关闭订单或卖方在发货前关闭订单的操作行为。 第十四条 质量问题，指卖方出售的物品违反相关法律法规规定或闲鱼社区相关规范要求。 第十五条 表面不一致，指凭肉眼即可判断交易物品存在破损、少件、空包等情形。 第十六条 描述不符，指买方收到的物品或接受的服务，存在与卖方描述不相符，或卖方未对物品瑕疵等信息进行披露等情形，妨害买方权益的行为。 第十七条 “瑕疵异常”泛指：物品外观破损、功能异常或失效、配件部件更换或缺失等情形。 第十八条 承运人，指负责物品运输的快递或物流一方。 第十九条 闲鱼小法庭：是闲鱼官方发起的，由闲鱼用户以投票表决形式处理用户违规行为和用户纠纷的判定平台。 第二十条 闲鱼排查：是指闲鱼根据闲鱼交易模式、交易内容、交易习惯等多种情形进行综合判断。 第二章 争议受理 第一节 受理期限 第二十一条 受理期限，在确认收货前或在《闲鱼交易超时说明》超时打款的时限内提出退款申请，闲鱼进行受理。 特别风险提示：个人物品的交易并非商品经营行为，若买方对交易存有争议，应当在交易上述受理期限内向卖方申请退款或要求闲鱼客服介入。一旦交易成功，之后产生的纠纷争议闲鱼将不予受理。 第二节 受理范围 闲鱼受理买卖双方在闲鱼上交易产生的争议处理申请，但出现如下情形的争议申请，闲鱼有权不予受理，由买卖双方自行协商或通过其他途径处理： 第二十二条 买卖任一方未在本规范规定的受理期限内申请闲鱼介入的； 第二十三条 交易做退款处理后，因卖方需要取回物品产生争议的； 第二十四条 交易做打款处理后，因买方需要取回物品产生争议的； 第二十五条 买卖双方未在闲鱼上产生交易订单的，或者通过闲鱼指定的支付流程及支付方式以外的其他方式支付交易费用或其他额外费用的； 第二十六条 买卖双方主张交易引发的额外损失或法定赔偿事宜的； 本条款说明： 闲鱼非国家行政或司法机构，对买卖双方主张交易引发的额外损失或法定赔偿事宜无权认定及执行，故买卖双方对该等事宜的主张由买卖双方自行协商或通过其他途径处理。 第三章 争议处理 第一节 通用规范 第二十七条 买卖双方就交易物品或服务有约定的，优先从约定；未约定或约定不明的，双方可协议补充；无法达成补充协议的，闲鱼将按照本规范进行处理，本规范有特别规定的优先从特别规定。若仍无法确定争议责任归属的，闲鱼将按照交易习惯处理或支持退货退款。支持退货退款的，退货运费由买方承担。 第二十八条 卖方将物品交付承运人后买方正常签收前，物品风险由卖方承担。若买方无正当理由拒绝签收物品的，按下述方式处置，双方另有约定的，从其约定。 （一）若物品返回后，卖方应当及时签收物品，交易扣除全部运费后退款买方。卖方怠于或无正当理由拒绝签收的，由其承担物品相关风险； （二）若买方无正当理由拒绝签收物品，物品返回后卖方已签收物品的： 1.如物品已损毁、灭失、或不适宜发回的（如鲜活易腐类物品），交易支持打款卖方。 2.如物品特殊情形（特殊情形包括定制类物品、买方无理由拒签退回过程中因物流原因产生损伤的物品等），卖方可选择退款买方或将物品再次发回买方，卖方发回物品产生的所有相关物流、仓储、包装等费用由双方自行协商处理，发回后物品除严重质量问题和描述不符问题外，物品的破损、损毁、灭失风险均由买方自行承担。 3.如物品非特殊情形且买方拒签退回后完好，则交易支持退款买方处理，来回运费买方承担。 （三）其他特殊情形由闲鱼根据实际情况作出判断及处理。 第二十九条 物品签收后，闲鱼不支持无理由退货、换货，双方另有约定的，从其约定。 第三十条 物品因签收时存在破损，致使交易作退货退款处理的，买方将退货物品交付承运人后产生的物品损毁、灭失风险由卖方承担，交易支持退款。 第三十一条 争议过程中，买卖双方应按本规范规定进行举证。本规范未有规定或闲鱼发现双方的交易或一方账号异常的，闲鱼将视双方实际情形作出举证责任分配。 第三十二条 买卖双方应自行对证据的真实性、关联性、完整性、准确性和及时性负责，闲鱼将基于普通人的认知，根据该等证据作出纠纷责任的归属认定及纠纷调处的结论。 第三十三条 买方主张物品存在表面不一致的，卖方应就收件人已按本规范“签收规范”之规定签收物品承担举证责任；卖方举证有效的，则由买方举证证明物品签收时即存在表面不一致情形。 第三十四条 闲鱼应买卖双方需求及查明事实需要，必要时将向第三方核实争议问题，并据此作为交易调处的参考依据。 第三十五条 买卖双方就交易的物品存在没有约定或约定不明情形的，双方可以协议补充，无法达成补充协议的，闲鱼将按照卖方物品信息表述条款和（或）交易习惯予以确定，若仍无法确定争议责任归属的，交易做退货退款处理。 买方将退货物品交付承运人后，物品的破损、损毁、灭失风险由买方承担，买方有权向承运人求偿。 第三十六条 买方主张卖方交付的物品存在描述不符或质量问题情形： （一）通过肉眼可识别的，买方需提供凭证（包括但不限于：物品实物图片或视频）予以证明。若买方举证有效，则交易支持退货退款；若买方举证无效，交易支持打款卖方。 （二）通过肉眼不可以识别的，买方应当根据闲鱼要求提供有效的质检证据或其他有效凭证以证明物品存在问题，若买方举证有效，则交易支持退货退款，若买方举证无效，交易支持打款卖方。 “肉眼可识别”泛指：使用中可以通过肉眼判断的问题，包含但不仅限于颜色不符、尺寸不符等。 “肉眼不可识别”泛指：使用中无法直接通过肉眼判断的问题，包含但不仅限于材质不符、功能性问题等。 第三十七条 物品的描述不符系无需使用，肉眼即可显著识别的，若物品完好，交易支持退货退款；若买方已经使用且影响物品完好的，仍以描述不符提起退货退款的，应当自行和卖方协商一致。如无法协商一致，交易支持打款。 第三十八条 卖方应当对所售物品的瑕疵异常及维修记录等进行充分详实的描述及披露。买方应当事先对所购物品的性能、特点等向卖方充分了解。卖方针对上述情形未披露的，交易作退货退款处理。 买方将退货物品交付承运人后，物品的破损风险由卖方承担；物品的损毁、灭失风险由买方承担，买方有权向承运人求偿。 第三十九条 闲鱼认定卖方出售的物品质量问题属实的，交易支持退货退款。 第四十条 物品因质量问题致使买方交易目的不能实现的，买方将退货物品交付承运人后，物品破损、损毁、灭失的风险由卖方承担，交易支持退款。“致使买方交易目的不能实现”的情形，包括但不限于：功能性故障、材质不符情形。 第四十一条 物品存在一定瑕疵但尚未影响买方交易目的实现的，买方将退货物品交付承运人后，物品破损的风险由卖方承担，交易支持退款；若物品出现损毁、灭失情形的，交易支持打款，买方有权向承运人求偿。“尚未影响买方交易目的实现”的情形，包括但不限于：标识标签瑕疵情形。 第四十二条 物品因存在问题作退货退款处理的，买方将退货物品交付承运人后产生的物品破损风险由卖方承担，交易支持退款；物品损毁、灭失的风险由买方承担，若物品出现损毁、灭失情形的，交易支持打款，买方有权向承运人求偿。 卖方在同意退货协议时附有合理条件的，买方退货应符合该条件。 第四十三条 卖方应对出售涉及保质期的物品事先予以页面明示或征得买方同意，未显著明示或征得买方同意的，买方有权拒签或要求退货。 （一）买方在本规范规定或双方约定的退货时限内退货的，若物品已过期，交易支持退款买方。 （二）卖方发出物品时尚未过期但买方签收物品时已过期的，交易支持退款买方。 买方将退货物品交付承运人后，若物品损毁或灭失时未过期，风险由买方承担；若物品损毁或灭失时已过期的，风险由卖方承担。 第四十四条 物品如需送往专业机构送检，检测费用由双方自行协商处理。若经买方送检后证实为质量问题，被检物品因检测而被物理破坏导致无法退货或无退货价值的，交易支持退款。 第四十五条 卖方出售假冒物品，买方基于生活消费所需购买的，交易支持退款。 生活消费所需的认定： 闲鱼将依照普通人的认知水准及日常经验判断，或基于概率学和大数据技术，从交易主体、交易信息、交易行为等多个维度进行排查、综合判断买方是否属生活消费所需购买。 第四十六条 买方退货前若物品性质已不适宜退货，则作退款处理。 第四十七条 买卖双方达成补充协议但一方否认的，主张协议无效的一方应提供有效证据予以证明，否则应承担相关不利后果。 第四十八条 买卖双方表述对对方有重大利害关系的格式条款内容应显著，且不得低于闲鱼社区规范要求，同时不存在免除自身应承担的责任、加重对方责任、排除对方主要权利等内容，否则该条款无效。 第四十九条 经闲鱼排查，买方或卖方的行为模式或对应账户实际控制人的其他闲鱼账户存在下述异常情形的，闲鱼将综合双方情形及结合交易实际情况作出相关举证责任分配，最终作出纠纷调处的结论。 1、包含但不限于骗取他人财物、出售假冒商品、扰乱平台秩序（如滥用会员权利、提供虚假凭证）等违规行为的情形； 2、其他经闲鱼排查发现的异常情形。 第二节 发货规范 第五十条 本规范所称的“发货”，具体按如下情形认定： （一）承运人官网系统内有记录时间的，以该时间为准； （二）尚不具有系统记录条件的承运人，按其提供承运面单上填写的日期和卖方“点击发货”的日期相较，取晚者。 第五十一条 卖方对每个独立生成并付款的交易订单应予单独发货，除双方另有约定外，若未征得买方同意，不得合并成一个包裹发货。否则，买方签收后主张物品少件的，由卖方负举证责任。 第五十二条 卖方超过约定的发货时间或买方申请退款时尚未发货的，卖方应在征得买方同意后再发货。 第五十三条 卖方应将物品送达至买方订单收货地址并交由收件人本人签收，需买方至指定地点提取的，应事先予以显著明示或征得买方同意。 第五十四条 卖方承诺或买卖双方约定采用特定的承运人运送物品的，卖方应按照承诺或约定履行。否则，非包邮订单且买方已签收物品的，可要求卖方退还买方已支付的运费。 第五十五条 卖方使用运费到付方式发货的，应事先明确承运人和运费事宜，并征得买方同意。买方要求卖方采取到付方式发货的，应自行和卖方明确承运人及运费事宜。 第五十六条 卖方违反发货规范导致买方未收到物品或拒收物品的，由此产生的相关费用及物品损毁或灭失风险，由卖方自行承担，交易作退款处理。 第五十七条 卖方违反“发货规范”，支持买方退货退款。 第五十八条 卖方违反“发货规范”但买方已实际使用物品或点击“确认收货”的，买方以卖方违反发货规范为由而主张退货退款的，应和卖方协商一致，否则闲鱼将不予支持。因卖方的不正当行为诱使买方确认收货的情形除外。 第五十九条 卖方发货物品中不得包含物流禁运品的物品（如：易燃易爆物品、管制刀具、电池等），否则由卖方承担物品拒签、签收后无法转运需退回等所产生的运费及物品毁损、灭失的风险。 第三节 签收规范 第六十条 买方需确保订单中填写的收件信息真实、详细、准确、有效。买方提供的收件信息错误导致未收到物品的，由买方承担该责任限度内的不利后果。 第六十一条 买方需变更收件信息中任一要素的，应征得卖方同意。卖方同意后实际未变更成功，物品仍按变更前的收件信息被签收，买方主张未收到物品的，经闲鱼判断若变更前和变更后的收件信息和买方无显著关联的，交易支持退款买方，由卖方承担物品相应风险。 第六十二条 卖方发货或买方退货后，收件人应亲自签收物品。收件人委托他人签收物品或承运人已按收件人的指示将物品置于指定地点的，视为收件人本人签收。 第六十三条 收件人应在承运人交付物品时，当场检视物品表面是否一致。若发现物品表面不一致，可予以拍照并拒签，若系卖方发货则支持退款买方；若系买方原因退货，则支持打款卖方，物品相关风险由相对方承担。 第六十四条 买方主张未收到物品或卖方主张未收到买方退货的，由相对方承担举证责任，举证无效的，支持退款买方或打款卖方。 第四节 退货规范 第六十五条 卖方应对自行填写的默认退货地址确保正确，交易达成退货协议后，若需要指定退货地址或多地址退货的，应征得买方同意。否则，买方可选择按闲鱼社区系统给出的退货地址进行退货，退货后物品无法送达的风险由卖方承担，交易支持退款买方。 第六十六条 卖方提供的退货地址未经买方同意不得为中国大陆以外地区，同时需和物品页面中显示的发货地一致。 第六十七条 买卖双方线下达成退货协议的，买方应在系统规定的退货时间内进行退货。买方因超时未退货，对同一问题或维权原因再次主张要求退货的，应自行和卖方协商一致，否则，闲鱼有权不予处理。 第六十八条 买方退货时应采用与卖方发货时相同类型的承运人进行退货。 第六十九条 买方根据本规范退货后，应及时在闲鱼社区系统内填写承运单号或告知卖方，若卖方签收物品时买方仍未获知该承运单号，卖方主张表面不一致情形的，将由闲鱼根据实际情况分配举证责任。 第七十条 买方使用到付方式退货或卖方要求买方使用到付方式退货的，应事先征得对方同意，并自行和对方明确承运人和运费事宜。 第七十一条 买方违反“退货规范”致使卖方未收到退货或拒签的，交易支持打款，由买方承担物品损毁或灭失的风险。 第五节 运费规范 第七十二条 运费争议：交易作退货退款处理时，由卖方承担发货运费，买方承担退货运费（确属卖方责任的除外），若双方另有约定，从其约定。闲鱼介入后，应承担运费一方未能履行的，闲鱼将根据实际情况作出违背交易约定处置。 第七十三条 卖方未经买方同意采取到付方式发货的，买方可选择拒签或签收后要求卖方承担到付产生的运费。 第七十四条 买方未经卖方同意采取到付方式退货且卖方予以签收物品的，若退货运费本由买方承担的，则该到付产生的运费由买方承担。 第七十五条 交易由买方承担退货运费时，若卖方提供的退货地址和物品页面中显示的发货地不一致，导致买方退货的运费高于按该发货地进行退货的运费，其差额由卖方承担。 第六节 当面交易处理规范 第七十六条 买卖双方采用当面交付物品的方式进行交易的，应当自行承担因此产生的风险。 第七十七条 因买方未收到货产生的争议，交易做退款处理，但卖方可以证明买方自认收到物品的除外。 第七十八条 因物品表面不一致产生的争议，交易做打款处理，但买方可以证明卖方自认物品存在表面不一致的除外。 第七节 定金交易处理规范 第七十九条 需要买方预先支付部分款项的交易，买卖双方应当具体约定该部分款项的支付和返还条件。 仅以“定金”、“订金”、“预付款”等字样进行描述，但未明确约定具体支付和返还条件的，相应争议按照本规范第三章的规定处理。 第八节 定制交易处理规范 第八十条 定制物品是指卖方通过生产加工、裁剪制作等方式，最终向买方交付包含有买方指定个性化需求信息素材（如图案、文字、印记、配件、尺寸等）并区别于标准化、规模化生产的实物物品。 第八十一条 买卖双方进行定制物品交易的，应当对定制物品的交付标准（如数量、规格尺寸、图案、材质、工艺）、交付或发货时间、运费承担、违约责任等进行明确约定。 第八十二条 因买卖双方其他未约定或约定不清事项导致的损失由买卖双方分担，具体比例由闲鱼按照双方过错程度判定。 第八十三条 定制物品发货时间界满前且卖方尚未定制完成，买方无理由申请退款的，若对卖方造成损失的，应当赔偿损失，但最高不超过交易订单金额。 本条款说明（以下提及的“卖方损失”均同）： （一）卖方对其损失负举证责任。 （二）闲鱼将以普通大众的认知水准及日常经验对卖方提供的相关损失证据进行判断及认定。 第八十四条 定制物品发货时间界满前但卖方已完成定制物品的，买方无正当理由申请退款的，需和卖方协商一致，否则卖方有权拒绝买方的退款申请。 第八十五条 卖方定制物品发货后，买方无正当理由拒签或退回定制物品的，卖方未予签收的，交易支持打款卖方，物品由买方自行负责召回并承担由此产生的相关费用，以及承担因无理由拒签或退回的物品风险；卖方已签收的，除买方明确表示拒绝接受该定制物品的，交易支持打款卖方外，卖方仍有义务再次向买方发还该物品，发货运费由买方承担。 第八十六条 卖方应在物品详情页面显著说明或者与买方约定完成定制物品生产需要买方提供的个性化信息素材以及提供期限，如因卖方未尽告知义务或约定不清产生争议的，由卖方承担相关不利后果。 第八十七条 买方应按照约定及时、完整、准确的提供定制相关的个性化信息素材，如买方逾期提供，则定制物品交付期限相应顺延。经卖方催告后买方仍怠于提供的，卖方有权终止履行，交易做退款处理。卖方为履行合同交易已作出必要准备而产生的损失，买方应予赔偿，但最高不超过订单金额。 买方变更定制需求的，应与卖方就需求变更后定制物品的价款、交付时间和交付标准达成新的约定，否则卖方有权中止履行定制合同交易。卖方中止履行合同交易后，应向买方确认是否继续履行原定制合同交易，买方拒绝或怠于确认的，卖方有权终止履行合同交易，交易做退款处理，对卖方造成损失的，应予赔偿损失，但最高不超过交易订单金额。 第八十八条 卖方定制物品逾期发货的，闲鱼介入时卖方实际已发货，买方应签收物品，交易支持打款卖方。买卖双方另有约定的，按约定执行。 闲鱼介入时卖方实际未发货，经催告后的72小时内仍未有发货的，交易作退款处理，若卖方在该72小时外发货的，发货前应当和买方协商一致，否则买方有权拒绝签收。 卖方逾期发货行为导致买方交易目的无法实现的，买方有权拒绝签收物品。 第九节 海外交易处理规范 第八十九条 本规范所称海外，系指买卖双方依据订单及相关约定，买卖双方一方在境外的交易。 第九十条 卖方在买方申请退款时尚未发货的，卖方应在征得买方同意后再发货。若卖方未征得买方同意仍继续发货，导致买方未收到物品或拒收物品的，由此产生的相关费用及物品损毁或灭失风险，由卖方自行承担，交易作退款处理。 第九十一条 卖方需确保所售物品符合物品出境的相关法律法规，买方需确保所购物品符合物品入境的相关法律法规。若物品因违反出境相关法律法规导致被监管部门（如海关）没收、扣押或采取其他强制措施的，相应出境风险由卖方承担，若物品因违反入境相关法律法规导致被监管部门（如海关）没收、扣押或采取其他强制措施的，相应入境风险由买方承担。 第九十二条 办理通关出入境手续需要买方或卖方合理的协助配合，相对方应提供相关协助。若一方怠于或拒绝提供协助导致物品无法办理通关手续的，由此可能产生的通关滞货费用（如额外运费、相应仓储、保管费等）及物品灭失风险均由该责任方承担。 第九十三条 卖方应确保按订单载明及双方约定的内容按时、按质、按量交付物品。因卖方责任产生退货的，当买方提供无法退货的凭证（如被海关扣押等）或客观上退货存障的，卖方应主动向买方提供协商处理的方案。协商不成的，闲鱼有权根据买方合理诉求进行处理。 第九十四条 非卖方责任产生退货的，由买方承担退货风险。 第十节 生鲜类物品处理规范 第九十五条 本规范所称的生鲜类物品是指物品包含但不仅限于新鲜水产/新鲜蔬果/活体等物品。 第九十六条 生鲜类物品，买方无正当理由拒绝签收的，导致生鲜类物品出现损伤、变质、腐烂等死亡情形的，相关运费及物品相应风险由买方承担。买卖双方另有约定的，从其约定； 第九十七条 生鲜类物品存在腐烂、重量短缺、大小不符三类情形的，作如下处置： 生鲜类物品存在大小不符或腐烂情形或重量短缺的，其数量占物品总量百分之十及以内的，按照支付金额的百分之十进行部分退款；其数量占物品总量百分之十至百分之五十以内的，按照支付金额的百分之五十进行退款；其数量占物品总量百分之五十及以上，作全额退款处理。 生鲜类物品存在上述情形，且情节严重的，闲鱼将视物品实际情形作出退货退款或退款处理。 情节严重系指： （一）物品大小不符、重量短缺及腐烂三类情形两两并存的； （二）卖方历史销售记录内大量存在上述物品责任情形的。 第九十八条 【特殊举证时效】活体类物品买方主张变质、死亡等情形的，需在收到物品当天24点前拍照并上传举证。非活体类物品（不含需催熟类水果）买方主张变质、腐烂情形的，需在收到物品之时起24小时内拍照并上传举证。需催熟类水果在正常催熟期内，买方主张出现腐烂、变质等情形的，应当及时拍照并上传举证。若该物品的物理性状极易受时间、环境等客观因素影响而发生质变，买方逾期举证的，闲鱼不予采信。 收到物品的时间以快递公司系统内记录签收时间为准。 买卖双方对举证时间、方式另有约定的，从其约定。 第十一节 服务类交易处理规范 第九十九条 本规范所称的服务类交易，系指由卖方向买方提供服务或买方委托卖方处理对应事务的交易。 第一百条 服务订单交付时间届满前，卖方已产生实质服务行为的，或卖方依约已完成服务的，买方要求退款或拒绝接受服务的，需与卖方协商一致。 第一百零一条 维修服务类交易，卖方应当自签收买方寄修物品次日起30天内完成修理并交付物流（以物流官网所载明的揽收记录时间为准）回寄，回寄的邮费由买方承担，双方另有约定的从其约定。 维修更换零配件后，被更换的故障配件由双方自行协商处置，闲鱼不再受理。 第一百零二条 买卖双方通过线下完成服务成果交付的，卖方需对交付服务的凭证予以留存并妥善保管，否则由卖方承担交易不利后果。 第十二节 直播交易处理规范 第一百零三条 卖方或主播与买方就交易物品或服务有约定的，优先从约定；未约定或约定不明的，双方可协议补充；无法达成补充协议的，闲鱼将按照本规范进行处理，本规范有特别规定的优先从特别规定。若仍无法确定争议责任归属的，闲鱼将按照交易习惯处理或支持退货退款，支持退货退款的。 第一百零四条 直播交易发生的争议，经闲鱼认定属于卖方或主播责任的，由卖方先行承担履约、协商、举证、退款、运费等责任。若是因主播违反平台要求或跟卖方的约定导致的争议，卖方向买方承担责任后可向主播/机构等追偿。 第一百零五条 因直播交易发生的争议，经闲鱼认定需查看直播回放的，应由卖方承担相应的举证责任，包括但不限于直播视频回放链接、直播时间等。如卖方提供无效的直播回放或未能提供直播回放的，交易支持退货退款。 第一百零六条 主播在直播过程中应当如实描述物品信息。 （一）若因实物与主播描述不一致引发争议的，闲鱼将依据本规范第三章第一节进行处理。 （二）若因主播夸大宣传使用效果引发争议的，交易支持退货退款，不考虑是否影响完好。如物品不适宜退货或无退货价值，交易支持退款。 （三）物品有瑕疵的，主播应当在直播过程中进行展示和口播提醒。若因主播未展示瑕疵和口播提醒引发争议的，交易支持退货退款。 第一百零七条 主播应当按照卖方物品详情页的描述或与卖方约定的承诺进行直播，若主播在直播间的描述或承诺与卖方的描述或承诺不一致时，以有利于买方的描述或承诺为准。 第一百零八条 主播在直播过程中的承诺（如赠品、优惠活动等）未履行的，卖方应履行相应承诺或与买方协商一致，否则交易支持退货退款。 第一百零九条 卖方将同品类物品聚合为一个物品发布（如专拍链接）的，除须符合平台相关发布要求，主播还应在直播过程中口播描述清楚关键属性。若因物品不符合发布要求或关键属性描述不清引发争议的，交易支持退货退款。 第十三节 禁售物品处理规范 第一百一十条 禁售物品，是指国家法律法规规定或闲鱼自身管理要求禁止发布及出售的物品。 第一百一十一条 买方主张物品或服务为禁售的，闲鱼将根据交易模式、交易内容、交易习惯等多种情形综合判断后作出举证责任分配，或依据前述情形直接予以认定禁售行为属实。 第一百一十二条 卖方出售禁售物品或提供禁售服务的，交易将视情形做退款或退货退款处理。 第四章 撤销和中止 第一百一十三条 闲鱼处理争议期间，出现以下任一情形的，闲鱼将中止争议处理程序： （一）买卖双方一致要求中止，并约定期限自行协商处理争议； （二）任何一方通知闲鱼要求将争议提交司法机关或拟向公安机关报案。 第一百一十四条 出现以下任一情形的，闲鱼将恢复争议处理程序： （一）买卖双方自行协商处理争议的，应在程序中止后30日内自行操作交易款项，或向闲鱼提供协商结果，由闲鱼代为操作，逾期买卖双方既未操作交易款项也未告知协商结果； （二）一方通知闲鱼要求通过司法机关解决争议或拟向公安机关报案的，未在通知闲鱼后的7个工作日内向闲鱼社区提供司法机关或公安机关的案件受理凭证； （三）争议被司法机关撤诉； （四）司法机关对争议作出判决且生效； （五）公安机关受理案件后的六个月后仍未对案件给出调查结论或处理建议。 第五章 执行 第一百一十五条 闲鱼处理争议期间，买卖双方协商一致达成和解协议，但无法自行操作的，闲鱼有权根据双方达成的和解协议内容，通知支付宝公司及/或网商银行操作相应的交易款项和(或)保证金。 第一百一十六条 闲鱼对争议做出处理后，或行政机关及消协、人民调解委员会组织调解，买卖双方认可调解结果的，有权按照处理结果通知支付宝公司及/或网商银行将交易款项和（或）保证金的全部或部分支付给买方和(或)卖方，或协助卖方(或买方)按照处理结果将相关款项支付给买方(或卖方)。 第一百一十七条 除交易款项外，根据争议处理结果仍需卖方承担赔偿责任的，闲鱼有权通知支付宝公司及/或网商银行划拨卖方根据闲鱼社区相关协议缴纳的保证金或其他款项支付给买方。 第一百一十八条 卖方账户余额不足致使无法退款或赔付的，由买卖双方自行协商或通过其他途径解决。 第六章 附则 第一百一十九条 闲鱼活动对买卖双方争议处理有特殊要求的，按照特殊要求处理。 第一百二十条 本规范生效或变更后尚未处理完结的交易，适用生效或变更后的规范。 第一百二十一条 闲鱼对争议做出处理并通知支付宝公司及/或网商银行支付争议款项后，买方或(和)卖方对闲鱼的处理有异议的，可向人民法院起诉。 第一百二十二条 本规范于2015年1月16日首次生效，于2021年3月17日最新修订。","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":11248,"sections":0,"subs":0,"version":""},"related":["sec-67","a499946252522885","a499947645891973","a498834062509445"]},{"id":"a499946252522885","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"纠纷处理与防坑维权","title":"关于新增《闲鱼社区宠物活体类纠纷争议处理规范》的公示通知","title_raw":"关于新增《闲鱼社区宠物活体类纠纷争议处理规范》的公示通知","html":"<p><strong>第一章 总则<\/strong><\/p><p><strong>第一条【概述】<\/strong><\/p><p>为明确闲鱼社区宠物活体类物品交易纠纷处理标准，降低买卖双方因售后争议产生的纠纷，特依据《闲鱼社区公约》《闲鱼社区交易争议处理规范》制定本规范。本规范有规定的，优先适用本规范，本规范未做单独说明的场景，依据《闲鱼社区交易争议处理规范》、《闲鱼社区七天无理由退货规范》（如适用）、《闲鱼社区“描述不符包邮退”服务规范》（如适用）执行。<\/p><p><strong>第二条【适用范围】<\/strong><\/p><p>本规范适用于宠物活体类物品的交易纠纷处理，包括猫、狗、鸟、水族、异宠等。<\/p><p><strong>第三条【倡议】<\/strong><\/p><p>宠物是伴侣动物，闲鱼社区倡议在交易过程中，买卖双方应采取适当的措施保障动物福利，及时诊治患病宠物，妥善安置死亡宠物。<\/p><p><strong>第二章 争议处理规范<\/strong><\/p><p><strong>第四条 【发货前要求】<\/strong><\/p><p>（一）卖方服务过程中，若基于服务履行之必要，需要买方配合提供协助的，或对买方的配合行为存在时限要求的，包含但不限于发货规则、定金规则、签收规则、举证规则等，卖方应当在商品详情页予以明示或双方事先约定一致，否则买方有权拒绝并由卖方承担交易不利后果。<\/p><p>（二）卖方需在发货前与买方确认宠物交付标准，包括宠物全面体检和排畸、宠物全貌视频、包装视频、发货时间、运输方式和预计到货时间等，并说明注意事项等需要额外提示的内容。<\/p><p>（三）卖方宣称宠物已接种过疫苗的，卖方需在发货前向买方提供宠物免疫证（接种信息包括但不限于接种疫苗种类、接种时间等）。<\/p><p>（四）卖方宣称宠物是血统宠物的，卖方需在发货前向买方提供所购买宠物的血统证书和编号。血统宠物指的是可办理正规血统证书（包括但不限于宠物协会等行业公认组织颁发的血统证书）的优质的纯种宠物。<\/p><p>以上信息由买方确认无误后，卖方方可发货。若因卖方未联系买方或未与买方达成一致、直接发货而引发的纠纷，判定为卖方责任。<\/p><p><strong>第五条 【具体争议处理规范】<\/strong><\/p><p>（一）签收问题<\/p><p>买方需及时取件，若发生买方原因改派或买方超过12小时取件导致宠物死亡的，不视为卖方责任。交易双方另有约定的，从其约定。<\/p><p>若买方已确认可发货，且商品已发出，买方无故拒签，双方应当优先协商处理；若双方无法达成一致的，不视为卖方责任，买方承担交易不利后果。<\/p><p>（二）质量问题<\/p><p>1.宠物信息不一致<\/p><p>买方主张收到的实物与发货前确认的信息不一致（包括但不限于性别不符、毛色严重不符、血统信息不符、年龄差距6个月以上等），买方需在确认收货前提供凭证并联系卖方协商。<\/p><p>（1）举证要求<\/p><p>①举证内容<\/p><p>a.买方可提供宠物实拍图片或视频、完整的拆包视频、交易快照，闲鱼社区内聊天记录等信息证明宠物信息不一致情况属实；<\/p><p>b.卖方可提供发货图片或视频，闲鱼社区内聊天记录等信息证明宠物信息一致。<\/p><p>②举证时效<\/p><p>买方需在收到宠物后48小时内拍照并联系卖家协商。<\/p><p>（2）处理标准<\/p><p>①经判定买家举证有效的，交易支持退货退款，卖方有责提供活体物流上门取件服务，并由卖方承担因退货产生的运费及运输风险，买方应当保障退货时宠物处于无人为伤害（人为伤害包括烫伤、烧伤、打伤宠物等）状态。买卖双方另有约定的，从其约定。<\/p><p>②以下情形不视为卖方责任：<\/p><p>a.若因宠物颜色、毛发等整体轮廓存在因拍摄角度和光线影响导致的差别或其他轻微差别的；<\/p><p>b.因运输过程活体状态不稳定尺寸、体重差距±5%范围内的；<\/p><p>c.买方恶意更改宠物状态，人为变更毛发等外形（如剃毛等）的。<\/p><p>除此处列举情形外，闲鱼可根据双方举证材料针对具体情形进行判责。<\/p><p>③买方逾期举证的，闲鱼不予采信。买卖双方对举证时间、方式另有约定的，从其约定。<\/p><p>2.宠物死亡、伤残<\/p><p>买方主张收到的宠物存在死亡、伤残情形的。<\/p><p>（1）举证要求<\/p><p>①举证内容<\/p><p>买方可提供宠物死亡或伤残的图片、完整的拆包视频、闲鱼社区内聊天记录，或正规宠物医院（具备合法有效的宠物医院营业执照）出具的正规死亡证明、检验报告等信息证明宠物死亡/伤残属实。<\/p><p>②举证时效<\/p><p>买方需在收到宠物后24小时内，订单确认收货前，提供凭证并联系卖方协商。<\/p><p>（2）处理标准<\/p><p>①宠物存在死亡情形，经判定买家举证有效的，交易支持退款买方。<\/p><p>②宠物存在伤残情形，经判定买家举证有效的，交易支持退货退款，卖方有责提供活体物流上门取件服务，并由卖方承担因退货产生的运费及运输风险（退货运输可能导致的活体伤病或死亡等一切风险）；若宠物已不适宜退货的，交易支持退款买家；若买方选择治疗并产生诊疗费用的，诊疗费用以买卖双方协商为准。交易双方另有约定的，从其约定。<\/p><p>③以下情形不视为卖方责任：因买方人为原因（人为原因包括喂食/误食巧克力、牛奶等宠物不耐受食物或有毒有害物质；饲养环境温湿度不满足宠物生存条件；人为烫伤、烧伤、打伤宠物等）死亡或伤残的。除此处列举情形外，闲鱼可根据双方举证材料针对具体情形进行判责。<\/p><p>④买方逾期举证的，闲鱼不予采信。买卖双方对举证时间、方式另有约定的，从其约定。<\/p><p>3.宠物疾病<\/p><p>买家主张收到的宠物存在患有疾病情形的。<\/p><p>（1）举证要求<\/p><p>①举证内容<\/p><p>a.买方可提供宠物患有疾病的初步凭证，包括但不限于实拍图片、视频，动物医院（具备合法有效的宠物医院营业执照）诊疗证明等；<\/p><p>b.卖方可提供包括但不限于《动物检疫合格证明》、发货前疾病试纸检测结果等凭证或合理解释，证明宠物不存在患有疾病情形。<\/p><p>②举证时效<\/p><p>买方需在收到宠物后7天内，订单确认收货前，提供凭证并联系卖方协商。<\/p><p>（2）处理标准<\/p><p>①卖方未提供有效凭证或合理解释的，交易支持退货退款，卖方有责提供活体物流上门取件服务，并由卖方承担因退换货产生的运费及运输风险（退货运输可能导致的活体伤病或死亡等一切风险）；若宠物已不适宜退货的，交易支持退款买家。<\/p><p>②卖方未提供有效凭证或合理解释的，买方选择治疗并产生诊疗费用的，若买方选择退货，诊疗费用以买卖双方协商为准；若买方选择费用补偿，费用补偿以买方诊疗费用清单为准（包括但不限于正规医院诊疗费用机打清单、药品购买费用清单等）且不超过订单金额。交易双方另有约定的，从其约定。<\/p><p>③买方逾期举证的，闲鱼不予采信。买卖双方对举证时间、方式另有约定的，从其约定。<\/p><p><strong>第三章 附则<\/strong><\/p><p><strong>第六条【时效说明】<\/strong><\/p><p>本规范下相关时效均以物流官网所载明的物流送达、签收等时间为准。<\/p><p><strong>第七条 【生效时间】<\/strong><\/p><p>（一）交易双方的行为，发生在本管理规范生效之日以前的，适用当时的规范。发生在本管理规范生效之日以后的，适用本规范。<\/p><p>（二）本规则于2023年11月15日修订，于2023年11月22日生效。<\/p><p>特此通知，敬请知悉，闲鱼是大家的闲鱼，让我们共同守护它！<\/p>","text":"第一章 总则 第一条【概述】 为明确闲鱼社区宠物活体类物品交易纠纷处理标准，降低买卖双方因售后争议产生的纠纷，特依据《闲鱼社区公约》《闲鱼社区交易争议处理规范》制定本规范。本规范有规定的，优先适用本规范，本规范未做单独说明的场景，依据《闲鱼社区交易争议处理规范》、《闲鱼社区七天无理由退货规范》（如适用）、《闲鱼社区“描述不符包邮退”服务规范》（如适用）执行。 第二条【适用范围】 本规范适用于宠物活体类物品的交易纠纷处理，包括猫、狗、鸟、水族、异宠等。 第三条【倡议】 宠物是伴侣动物，闲鱼社区倡议在交易过程中，买卖双方应采取适当的措施保障动物福利，及时诊治患病宠物，妥善安置死亡宠物。 第二章 争议处理规范 第四条 【发货前要求】 （一）卖方服务过程中，若基于服务履行之必要，需要买方配合提供协助的，或对买方的配合行为存在时限要求的，包含但不限于发货规则、定金规则、签收规则、举证规则等，卖方应当在商品详情页予以明示或双方事先约定一致，否则买方有权拒绝并由卖方承担交易不利后果。 （二）卖方需在发货前与买方确认宠物交付标准，包括宠物全面体检和排畸、宠物全貌视频、包装视频、发货时间、运输方式和预计到货时间等，并说明注意事项等需要额外提示的内容。 （三）卖方宣称宠物已接种过疫苗的，卖方需在发货前向买方提供宠物免疫证（接种信息包括但不限于接种疫苗种类、接种时间等）。 （四）卖方宣称宠物是血统宠物的，卖方需在发货前向买方提供所购买宠物的血统证书和编号。血统宠物指的是可办理正规血统证书（包括但不限于宠物协会等行业公认组织颁发的血统证书）的优质的纯种宠物。 以上信息由买方确认无误后，卖方方可发货。若因卖方未联系买方或未与买方达成一致、直接发货而引发的纠纷，判定为卖方责任。 第五条 【具体争议处理规范】 （一）签收问题 买方需及时取件，若发生买方原因改派或买方超过12小时取件导致宠物死亡的，不视为卖方责任。交易双方另有约定的，从其约定。 若买方已确认可发货，且商品已发出，买方无故拒签，双方应当优先协商处理；若双方无法达成一致的，不视为卖方责任，买方承担交易不利后果。 （二）质量问题 1.宠物信息不一致 买方主张收到的实物与发货前确认的信息不一致（包括但不限于性别不符、毛色严重不符、血统信息不符、年龄差距6个月以上等），买方需在确认收货前提供凭证并联系卖方协商。 （1）举证要求 ①举证内容 a.买方可提供宠物实拍图片或视频、完整的拆包视频、交易快照，闲鱼社区内聊天记录等信息证明宠物信息不一致情况属实； b.卖方可提供发货图片或视频，闲鱼社区内聊天记录等信息证明宠物信息一致。 ②举证时效 买方需在收到宠物后48小时内拍照并联系卖家协商。 （2）处理标准 ①经判定买家举证有效的，交易支持退货退款，卖方有责提供活体物流上门取件服务，并由卖方承担因退货产生的运费及运输风险，买方应当保障退货时宠物处于无人为伤害（人为伤害包括烫伤、烧伤、打伤宠物等）状态。买卖双方另有约定的，从其约定。 ②以下情形不视为卖方责任： a.若因宠物颜色、毛发等整体轮廓存在因拍摄角度和光线影响导致的差别或其他轻微差别的； b.因运输过程活体状态不稳定尺寸、体重差距±5%范围内的； c.买方恶意更改宠物状态，人为变更毛发等外形（如剃毛等）的。 除此处列举情形外，闲鱼可根据双方举证材料针对具体情形进行判责。 ③买方逾期举证的，闲鱼不予采信。买卖双方对举证时间、方式另有约定的，从其约定。 2.宠物死亡、伤残 买方主张收到的宠物存在死亡、伤残情形的。 （1）举证要求 ①举证内容 买方可提供宠物死亡或伤残的图片、完整的拆包视频、闲鱼社区内聊天记录，或正规宠物医院（具备合法有效的宠物医院营业执照）出具的正规死亡证明、检验报告等信息证明宠物死亡/伤残属实。 ②举证时效 买方需在收到宠物后24小时内，订单确认收货前，提供凭证并联系卖方协商。 （2）处理标准 ①宠物存在死亡情形，经判定买家举证有效的，交易支持退款买方。 ②宠物存在伤残情形，经判定买家举证有效的，交易支持退货退款，卖方有责提供活体物流上门取件服务，并由卖方承担因退货产生的运费及运输风险（退货运输可能导致的活体伤病或死亡等一切风险）；若宠物已不适宜退货的，交易支持退款买家；若买方选择治疗并产生诊疗费用的，诊疗费用以买卖双方协商为准。交易双方另有约定的，从其约定。 ③以下情形不视为卖方责任：因买方人为原因（人为原因包括喂食/误食巧克力、牛奶等宠物不耐受食物或有毒有害物质；饲养环境温湿度不满足宠物生存条件；人为烫伤、烧伤、打伤宠物等）死亡或伤残的。除此处列举情形外，闲鱼可根据双方举证材料针对具体情形进行判责。 ④买方逾期举证的，闲鱼不予采信。买卖双方对举证时间、方式另有约定的，从其约定。 3.宠物疾病 买家主张收到的宠物存在患有疾病情形的。 （1）举证要求 ①举证内容 a.买方可提供宠物患有疾病的初步凭证，包括但不限于实拍图片、视频，动物医院（具备合法有效的宠物医院营业执照）诊疗证明等； b.卖方可提供包括但不限于《动物检疫合格证明》、发货前疾病试纸检测结果等凭证或合理解释，证明宠物不存在患有疾病情形。 ②举证时效 买方需在收到宠物后7天内，订单确认收货前，提供凭证并联系卖方协商。 （2）处理标准 ①卖方未提供有效凭证或合理解释的，交易支持退货退款，卖方有责提供活体物流上门取件服务，并由卖方承担因退换货产生的运费及运输风险（退货运输可能导致的活体伤病或死亡等一切风险）；若宠物已不适宜退货的，交易支持退款买家。 ②卖方未提供有效凭证或合理解释的，买方选择治疗并产生诊疗费用的，若买方选择退货，诊疗费用以买卖双方协商为准；若买方选择费用补偿，费用补偿以买方诊疗费用清单为准（包括但不限于正规医院诊疗费用机打清单、药品购买费用清单等）且不超过订单金额。交易双方另有约定的，从其约定。 ③买方逾期举证的，闲鱼不予采信。买卖双方对举证时间、方式另有约定的，从其约定。 第三章 附则 第六条【时效说明】 本规范下相关时效均以物流官网所载明的物流送达、签收等时间为准。 第七条 【生效时间】 （一）交易双方的行为，发生在本管理规范生效之日以前的，适用当时的规范。发生在本管理规范生效之日以后的，适用本规范。 （二）本规则于2023年11月15日修订，于2023年11月22日生效。 特此通知，敬请知悉，闲鱼是大家的闲鱼，让我们共同守护它！","toc":[],"meta":{"publish_time":"2024-01-02","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":2645,"sections":0,"subs":0,"version":""},"related":["sec-67","a498827573106053","a499947645891973","a498834062509445"]},{"id":"a498419828663685","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"纠纷处理与防坑维权","title":"到手屠龙刀防坑指南","title_raw":"到手屠龙刀防坑指南","html":"<h3><span style=\"color: rgb(0, 0, 0);\" class=\"ql-size-16px\">一、什么是恶意到手刀？<\/span><\/h3><p><span style=\"color: rgb(0, 0, 0);\">专业具有团伙性质的买家，在部分高价值品类：如奢品包、手机数码品类，拒绝走验货宝，售前下单爽快，收到货后通过放大图片挑刺等方式进行屠龙刀（如大砍一半），甚至存在调包、破坏等恶劣行为。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\"> <\/span><\/p><h3><span style=\"color: rgb(0, 0, 0);\" class=\"ql-size-16px\">二、卖家如何防坑？<\/span><\/h3><p><span style=\"color: rgb(0, 0, 0);\"> 1.售前做好以下几点：<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\"> 尽量走验货宝，官方验货，一经买家确认不可退货有保障，若未走验货宝则注意以下几点：<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\"> <\/span><strong>• 商品描述尽量详细<\/strong>——商品附清晰实拍照片。<\/p><p><strong>• 沟通与买家确认细节和约定<\/strong>——360度整体+磨损瑕疵处照片或实拍给买家，约定非真假问题不退不换。<\/p><p><strong> • 拍摄发货视频留底<\/strong>——快递取走前拍视频给买家，保留证据。<\/p><p>2.售后买家无理刁难如何维权？<\/p><p><strong> • 不妥协拒绝屠龙刀！<\/strong>——售前留底都是证据，拒绝屠龙刀。<\/p><p><strong>• 通过平台维权维护自己权益<\/strong>——买家发起退款后可拒绝退款要求其承担来回运费，如无法协商一致可申请平台维权（可选择如无理砍价拒绝原因或说明被恶意砍价到手刀），上传售前沟通、发出前实拍图/视频、买家到手刀聊天证据，该场景平台将维护卖家的合法权益！<\/p><p><strong>• 退回注意验货<\/strong>——注意不要在未收到货物前退款买家，货物退回后注意验货，确认无调包、无损坏再签收，如存在调包、损坏情形当面拒收拍摄开箱视频留证进行二次维权。<span style=\"color: rgb(0, 0, 0);\"> <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\"><\/span><\/p><h3><br><\/h3><h3><span style=\"color: rgb(0, 0, 0);\" class=\"ql-size-16px\">三、平台对恶意到手刀的态度<\/span><\/h3><p><span style=\"color: rgb(0, 0, 0);\"> 1.杜绝恶意到手刀场景，维权保障卖家合法权益<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\"> 根据《闲鱼社区交易争议处理规范》，若买方无正当理由拒绝签收物品，闲鱼将综合根据买方历史交易订单、交易行为等信息及买卖双方提供的凭证（如有）判断买方是否存在不正当行为（到手刀、损坏调包、恶意威胁等行为），若存在不正当行为，则交易支持打款卖方。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\"> 2.平台将对有恶劣行为的买家进行严肃治理<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\"> 针对维权、举报等途径反馈的买家存在严重不正当行为（到手刀、损坏调包、恶意威胁等行为），平台将依据公约规则进行处置，严重将对其账号进行限买、永久封停等处置！<\/span><\/p>","text":"一、什么是恶意到手刀？ 专业具有团伙性质的买家，在部分高价值品类：如奢品包、手机数码品类，拒绝走验货宝，售前下单爽快，收到货后通过放大图片挑刺等方式进行屠龙刀（如大砍一半），甚至存在调包、破坏等恶劣行为。 二、卖家如何防坑？ 1.售前做好以下几点： 尽量走验货宝，官方验货，一经买家确认不可退货有保障，若未走验货宝则注意以下几点： • 商品描述尽量详细 ——商品附清晰实拍照片。 • 沟通与买家确认细节和约定 ——360度整体+磨损瑕疵处照片或实拍给买家，约定非真假问题不退不换。 • 拍摄发货视频留底 ——快递取走前拍视频给买家，保留证据。 2.售后买家无理刁难如何维权？ • 不妥协拒绝屠龙刀！ ——售前留底都是证据，拒绝屠龙刀。 • 通过平台维权维护自己权益 ——买家发起退款后可拒绝退款要求其承担来回运费，如无法协商一致可申请平台维权（可选择如无理砍价拒绝原因或说明被恶意砍价到手刀），上传售前沟通、发出前实拍图/视频、买家到手刀聊天证据，该场景平台将维护卖家的合法权益！ • 退回注意验货 ——注意不要在未收到货物前退款买家，货物退回后注意验货，确认无调包、无损坏再签收，如存在调包、损坏情形当面拒收拍摄开箱视频留证进行二次维权。 三、平台对恶意到手刀的态度 1.杜绝恶意到手刀场景，维权保障卖家合法权益 根据《闲鱼社区交易争议处理规范》，若买方无正当理由拒绝签收物品，闲鱼将综合根据买方历史交易订单、交易行为等信息及买卖双方提供的凭证（如有）判断买方是否存在不正当行为（到手刀、损坏调包、恶意威胁等行为），若存在不正当行为，则交易支持打款卖方。 2.平台将对有恶劣行为的买家进行严肃治理 针对维权、举报等途径反馈的买家存在严重不正当行为（到手刀、损坏调包、恶意威胁等行为），平台将依据公约规则进行处置，严重将对其账号进行限买、永久封停等处置！","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":777,"sections":0,"subs":0,"version":""},"related":["sec-67","a498827573106053","a499946252522885","a498834062509445"]},{"id":"a498773233685893","kind":"article","module":"交易售后","module_sub":"履约篇 · 把交易做稳","section":"纠纷处理与防坑维权","title":"闲鱼协议专区","title_raw":"闲鱼协议专区","html":"<p class=\"ql-align-center\"><a href=\"https://terms.alicdn.com/legal-agreement/terms/common_platform_service/20230725182003705/20230725182003705.html\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(64, 64, 64);\">闲鱼社区直播服务协议（2023年7月26日）<\/a><\/p><p class=\"ql-align-center\"><\/p><p class=\"ql-align-center\"><a href=\"https://terms.alicdn.com/legal-agreement/terms/common_platform_service/20230509172204596/20230509172204596.html\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(64, 64, 64);\">闲鱼社区软件许可使用协议（2023年6月6日）<\/a><\/p><p class=\"ql-align-center\"><\/p><p class=\"ql-align-center\"><a href=\"https://terms.alicdn.com/legal-agreement/terms/suit_bu1_taobao/suit_bu1_taobao202103021554_43790.html\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(64, 64, 64);\">闲鱼社区隐私政策（2022年12月7日）<\/a><\/p><p class=\"ql-align-center\"><\/p><p class=\"ql-align-center\"><a href=\"https://terms.alicdn.com/legal-agreement/terms/platform_service/20220929192101114/20220929192101114.html\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"color: rgb(64, 64, 64);\ ,"count":1,"items":[{"id":"sec-72","kind":"chapter","module":"经营提效","module_sub":"管理篇 · 把效率做高","section":"数据看板与考核指标","title":"第十四章 数据运营与考核指标","title_raw":"第十四章 数据运营与考核指标","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-73\">14.1 核心数据看板指标<\/h3><p>⚠️ <strong>口径说明：本章的「健康值 / 预警值 / 达标线」为行业经验参考值，不是平台官方口径<\/strong>（闲鱼从未公布官方指标基线）。请结合自己账号的历史数据与类目均值判断，不要把它当硬标准执行。<\/p>\n<table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th>计算方式<\/th>\n<th>健康值<\/th>\n<th>预警值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>曝光量<\/td>\n<td>商品出现在搜索结果/推荐流的次数<\/td>\n<td>≥1000/天<\/td>\n<td>＜500/天 → 优化标题/主图<\/td>\n<\/tr>\n<tr>\n<td>浏览量<\/td>\n<td>点击进入商品详情页的次数<\/td>\n<td>曝光×3%-5%<\/td>\n<td>＜3% → 优化主图/价格<\/td>\n<\/tr>\n<tr>\n<td>想要数<\/td>\n<td>点击&quot;想要&quot;的人数<\/td>\n<td>浏览×10%<\/td>\n<td>＜5% → 优化详情页/价格<\/td>\n<\/tr>\n<tr>\n<td>咨询率<\/td>\n<td>发起聊天人数/浏览量<\/td>\n<td>5%-10%<\/td>\n<td>＜3% → 优化卖点描述<\/td>\n<\/tr>\n<tr>\n<td>转化率<\/td>\n<td>成交订单数/浏览量<\/td>\n<td>3%-5%<\/td>\n<td>＜1% → 全面复盘<\/td>\n<\/tr>\n<tr>\n<td>ROI<\/td>\n<td>成交金额/投放消耗<\/td>\n<td>≥1.2<\/td>\n<td>＜0.8 → 暂停投放<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-74\">14.2 各阶段考核标准<\/h3><table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>核心KPI<\/th>\n<th>达标线<\/th>\n<th>优秀线<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>新号养号期（0-15天）<\/td>\n<td>闲气值、商品发布数、好评数<\/td>\n<td>≥80分、≥50个、≥10条<\/td>\n<td>≥95分、≥80个、≥30条<\/td>\n<\/tr>\n<tr>\n<td>鱼小铺开通后（15-30天）<\/td>\n<td>日曝光量、日咨询量、首单成交<\/td>\n<td>≥1000、≥5、完成首单<\/td>\n<td>≥3000、≥15、≥5单<\/td>\n<\/tr>\n<tr>\n<td>稳定运营期（30-90天）<\/td>\n<td>月销售额、转化率、复购率<\/td>\n<td>≥5000元、≥2%、≥10%<\/td>\n<td>≥20000元、≥5%、≥25%<\/td>\n<\/tr>\n<tr>\n<td>矩阵放大期（90天+）<\/td>\n<td>矩阵总销售额、账号存活率、ROI<\/td>\n<td>≥3万元、≥80%、≥1.2<\/td>\n<td>≥10万元、≥95%、≥2.0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-75\">14.3 常用运营工具<\/h3><table>\n<thead>\n<tr>\n<th>工具<\/th>\n<th>用途<\/th>\n<th>获取方式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>闲鱼数据看板<\/td>\n<td>官方面板，查看曝光/浏览/转化<\/td>\n<td>鱼小铺 → 数据中心<\/td>\n<\/tr>\n<tr>\n<td>闲鱼公约<\/td>\n<td>查看最新平台规则<\/td>\n<td>我的 → 设置 → 闲鱼公约<\/td>\n<\/tr>\n<tr>\n<td>安全中心<\/td>\n<td>查看违规记录和闲气值<\/td>\n<td>我的 → 安全中心<\/td>\n<\/tr>\n<tr>\n<td>第三方数据工具<\/td>\n<td>多账号数据聚合、自动化统计<\/td>\n<td>自行搜索&quot;闲鱼助手&quot;类工具<\/td>\n<\/tr>\n<tr>\n<td>超级擦亮后台<\/td>\n<td>付费推广管理和数据复盘<\/td>\n<td>付费开通（平台内）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 14.1 核心数据看板指标 ⚠️ 口径说明：本章的「健康值 / 预警值 / 达标线」为行业经验参考值，不是平台官方口径 （闲鱼从未公布官方指标基线）。请结合自己账号的历史数据与类目均值判断，不要把它当硬标准执行。 指标 计算方式 健康值 预警值 曝光量 商品出现在搜索结果/推荐流的次数 ≥1000/天 ＜500/天 → 优化标题/主图 浏览量 点击进入商品详情页的次数 曝光×3%-5% ＜3% → 优化主图/价格 想要数 点击\"想要\"的人数 浏览×10% ＜5% → 优化详情页/价格 咨询率 发起聊天人数/浏览量 5%-10% ＜3% → 优化卖点描述 转化率 成交订单数/浏览量 3%-5% ＜1% → 全面复盘 ROI 成交金额/投放消耗 ≥1.2 ＜0.8 → 暂停投放 14.2 各阶段考核标准 阶段 核心KPI 达标线 优秀线 新号养号期（0-15天） 闲气值、商品发布数、好评数 ≥80分、≥50个、≥10条 ≥95分、≥80个、≥30条 鱼小铺开通后（15-30天） 日曝光量、日咨询量、首单成交 ≥1000、≥5、完成首单 ≥3000、≥15、≥5单 稳定运营期（30-90天） 月销售额、转化率、复购率 ≥5000元、≥2%、≥10% ≥20000元、≥5%、≥25% 矩阵放大期（90天+） 矩阵总销售额、账号存活率、ROI ≥3万元、≥80%、≥1.2 ≥10万元、≥95%、≥2.0 14.3 常用运营工具 工具 用途 获取方式 闲鱼数据看板 官方面板，查看曝光/浏览/转化 鱼小铺 → 数据中心 闲鱼公约 查看最新平台规则 我的 → 设置 → 闲鱼公约 安全中心 查看违规记录和闲气值 我的 → 安全中心 第三方数据工具 多账号数据聚合、自动化统计 自行搜索\"闲鱼助手\"类工具 超级擦亮后台 付费推广管理和数据复盘 付费开通（平台内）","toc":[{"id":"sec-73","title":"14.1 核心数据看板指标"},{"id":"sec-74","title":"14.2 各阶段考核标准"},{"id":"sec-75","title":"14.3 常用运营工具"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":3,"imgs":0,"words":872,"sections":3,"subs":0,"version":"V2026.10.12"},"related":["sec-52","sec-86","sec-30","sec-11"]}]},{"module":"经营提效","module_sub":"管理篇 · 把效率做高","section":"执行标准与 SOP 清单","color":"green","count":1,"items":[{"id":"sec-86","kind":"chapter","module":"经营提效","module_sub":"管理篇 · 把效率做高","section":"执行标准与 SOP 清单","title":"附录：执行标准与待办清单","title_raw":"附录：执行标准与待办清单","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-87\">A. 风险点汇总<\/h3><table>\n<thead>\n<tr>\n<th>风险类型<\/th>\n<th>具体风险<\/th>\n<th>应对措施<\/th>\n<th>责任人<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>账号风险<\/td>\n<td>违规封号/限流<\/td>\n<td>一机一卡一号、每日安全巡检<\/td>\n<td>运营主管<\/td>\n<\/tr>\n<tr>\n<td>品类风险<\/td>\n<td>误触禁售品类<\/td>\n<td>上架前品类自查清单对照<\/td>\n<td>选品负责人<\/td>\n<\/tr>\n<tr>\n<td>投诉风险<\/td>\n<td>买家投诉/退款纠纷<\/td>\n<td>证据留存+标准化售后SOP<\/td>\n<td>客服专员<\/td>\n<\/tr>\n<tr>\n<td>投放风险<\/td>\n<td>ROI低于盈亏线<\/td>\n<td>每日数据监控+周复盘淘汰机制<\/td>\n<td>投放专员<\/td>\n<\/tr>\n<tr>\n<td>矩阵风险<\/td>\n<td>关联封号<\/td>\n<td>独立网络+独立设备+独立地址<\/td>\n<td>运营主管<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-88\">B. 待办事项清单<\/h3><p>核心原则：走真实，不吃电商风<\/p>\n<p>闲鱼是真实用户社区，不是纯电商平台。所有增长策略必须建立在真实交易、真实互动、真实内容的基础上。禁止刷单、互赞、虚假发货、批量铺货等电商化操作。<\/p>\n<h4>第一阶段：账号基础搭建<\/h4>\n<ul>\n<li>【新号】完成注册 + 实名认证 + 支付宝绑定<\/li>\n<li>【新号】芝麻信用分提升至650+，闲气值提升至80+<\/li>\n<li>【新号】上传清晰头像、完善真实简介、设置真实收货地址<\/li>\n<li>【认证】需要经营资质时，进入「我的→认证招商→经营资质」提交营业执照<\/li>\n<li>【新号】连续15天真实养号（签到+浏览+真实互动）<\/li>\n<\/ul>\n<h4>第二阶段：店铺与权限<\/h4>\n<ul>\n<li>【鱼小铺】收到邀请后尽早完成开通（ 网传「24 小时内」无官方时限）<\/li>\n<li>【鱼小铺】设置店铺封面、分类、简介<\/li>\n<\/ul>\n<h4>第三阶段：每日必做（重点标红）<\/h4>\n<table>\n<thead>\n<tr>\n<th>时段<\/th>\n<th>任务<\/th>\n<th>原则/目的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>每日 早7-8点<\/td>\n<td>签到领闲鱼币 + 擦亮全部商品<\/td>\n<td>保持账号活跃，刷新曝光<\/td>\n<\/tr>\n<tr>\n<td>每日 上午<\/td>\n<td>真实上新1-3个商品（拍照/实拍视频，严禁搬运网图）<\/td>\n<td>走真实，为平台提供真实商品<\/td>\n<\/tr>\n<tr>\n<td>每日 全天<\/td>\n<td>10分钟内回复买家咨询<\/td>\n<td>响应率影响搜索排名<\/td>\n<\/tr>\n<tr>\n<td>每日 午间<\/td>\n<td>处理发货 + 填写真实物流单号<\/td>\n<td>真实履约，提升闲气值<\/td>\n<\/tr>\n<tr>\n<td>每日 晚间<\/td>\n<td>会玩社区/圈子发布1条真实内容（使用心得/避坑指南/测评）<\/td>\n<td>真实内容提升账号权重，非硬广<\/td>\n<\/tr>\n<tr>\n<td>每日 睡前<\/td>\n<td>鱼塘/圈子互动5-10条（点赞+真实评论+关注）<\/td>\n<td>真实社交互动，增加回访<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>第四阶段：每周必做<\/h4>\n<ul>\n<li>【每周一】检查各账号闲气值，低于80分启动修复流程<\/li>\n<li>【每周二】分析成长数据：等级评价分、粉丝增长、闲鱼币收支<\/li>\n<li>【每周三】清理低曝光商品，优化后重新上架（真实优化：换实拍图/调整标题）<\/li>\n<li>【每周四】加入1-2个精准鱼塘/圈子，拓展真实流量渠道<\/li>\n<li>【每周五】发布1篇高质量长帖（教程/测评/真实经历）<\/li>\n<li>【每周六】参与平台活动，领取限时流量奖励<\/li>\n<li>【每周日】数据复盘：曝光/浏览/转化/ROI/差评风险<\/li>\n<\/ul>\n<h4>第五阶段：成长权重专项<\/h4>\n<ul>\n<li>【等级】L5冲刺：30天计划 — 每日真实出单+好评维护+粉丝单引导<\/li>\n<li>【闲气值】持续保持≥80分：15分钟内响应、24小时发货、零纠纷<\/li>\n<li>【闲鱼币】保持余额≥500币，优先用于真实测款推广<\/li>\n<li>【评价分】重点维护50元以上真实订单的好评率<\/li>\n<li>【会玩社区】每周至少2-3条真实内容，禁止直接发广告<\/li>\n<\/ul>\n<h4>第六阶段：矩阵与风控<\/h4>\n<ul>\n<li>【矩阵】建立账号巡检表、风控日志<\/li>\n<li>【矩阵】准备备用账号（至少2个）<\/li>\n<li>【风控】每日检查安全中心，异常账号立即停操作<\/li>\n<li>【风控】同一WiFi下不超过1个账号登录<\/li>\n<\/ul>\n<h4>禁止事项（红线）<\/h4>\n<ul>\n<li>刷单/刷好评：平台AI可识别，一旦查到直接清零等级<\/li>\n<li>互赞/互关：属于虚假互动，触发风控模型<\/li>\n<li>搬运网图/盗图：主图必须是实拍，网图会降低权重<\/li>\n<li>诱导站外交易：微信/QQ/支付宝等联系方式一律禁止<\/li>\n<li>批量复制标题：同一商品不同账号也要差异化描述<\/li>\n<li>频繁改价/改主图：7天内主图修改不超过2次<\/li>\n<\/ul>\n<h3 id=\"sec-89\">C. 验收指标总表<\/h3><table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>时间<\/th>\n<th>核心指标<\/th>\n<th>验收标准<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>账号搭建<\/td>\n<td>第1周<\/td>\n<td>实名认证、芝麻分、闲气值<\/td>\n<td>认证完成、芝麻≥650、闲气≥80<\/td>\n<\/tr>\n<tr>\n<td>鱼小铺<\/td>\n<td>第2-4周<\/td>\n<td>开通成功、店铺装修完成<\/td>\n<td>鱼小铺已开通、≥50个商品在售<\/td>\n<\/tr>\n<tr>\n<td>首单成交<\/td>\n<td>第3-5周<\/td>\n<td>完成第一笔真实交易<\/td>\n<td>好评率100%<\/td>\n<\/tr>\n<tr>\n<td>稳定出单<\/td>\n<td>第2-3月<\/td>\n<td>月销≥5000元、转化率≥2%<\/td>\n<td>连续4周达标<\/td>\n<\/tr>\n<tr>\n<td>矩阵启动<\/td>\n<td>第3-4月<\/td>\n<td>≥3个活跃账号、月销≥3万元<\/td>\n<td>账号存活率100%、ROI达到盈亏平衡点以上<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-90\">D. 投放执行SOP与数据复盘<\/h3><p>配套工具：闲鱼商业决策系统 V3（云端版·数据持久化）—— 用于超级擦亮投放前的预算测算、漏斗预测、敏感性分析和每日数据复盘。\n🔗 打开投放决策系统 →<\/p>\n<h4>D.1 投放三阶段执行框架<\/h4>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>优化目标<\/th>\n<th>出价策略<\/th>\n<th>预算占比<\/th>\n<th>天数<\/th>\n<th>核心任务<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>测款期<\/td>\n<td>曝光量+浏览量<\/td>\n<td>¥3.7/次，保守起步<\/td>\n<td>20%<\/td>\n<td>约8天<\/td>\n<td>低出价·全时段·多计划测素材，筛选能跑的品<\/td>\n<\/tr>\n<tr>\n<td>放量期<\/td>\n<td>咨询量<\/td>\n<td>¥4.4/次，逐步递增<\/td>\n<td>60%<\/td>\n<td>约30天<\/td>\n<td>高出价·高峰时段·聚焦Top计划，放大优质计划<\/td>\n<\/tr>\n<tr>\n<td>维稳期<\/td>\n<td>下单量<\/td>\n<td>¥3.0-3.7/次，降出价<\/td>\n<td>20%<\/td>\n<td>约13天<\/td>\n<td>降出价·精选时段·清仓转化，稳ROI<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>D.2 计划命名规范<\/h4>\n<p>格式：阶段-编号-素材方向（如「测款-A1-性价比引流」「放量-B1-Top1放大」）<\/p>\n<h4>D.3 每日监控指标与预警阈值<\/h4>\n<table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th>测款期关注<\/th>\n<th>放量期关注<\/th>\n<th>维稳期关注<\/th>\n<th>预警阈值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>花费<\/td>\n<td>日花费是否超预算<\/td>\n<td>日花费递增是否正常<\/td>\n<td>日花费是否持续下降<\/td>\n<td>日花费 &gt; 日预算120%<\/td>\n<\/tr>\n<tr>\n<td>曝光量<\/td>\n<td>各计划曝光对比·筛选Top<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>单计划曝光 &lt; 同梯队50%<\/td>\n<\/tr>\n<tr>\n<td>浏览量<\/td>\n<td>浏览率（浏览/曝光）<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>浏览率 &lt; 8%<\/td>\n<\/tr>\n<tr>\n<td>咨询量<\/td>\n<td>—<\/td>\n<td>咨询量是否随预算上升<\/td>\n<td>咨询转化率<\/td>\n<td>咨询量连续2天下降<\/td>\n<\/tr>\n<tr>\n<td>下单量<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>每日成交单数<\/td>\n<td>下单量连续3天下降<\/td>\n<\/tr>\n<tr>\n<td>ROAS<\/td>\n<td>—<\/td>\n<td>每日记录，低于目标80%预警<\/td>\n<td>是否稳定在目标以上<\/td>\n<td>ROAS &lt; 目标 × 80%<\/td>\n<\/tr>\n<tr>\n<td>CPA<\/td>\n<td>跑满3天CPA &gt; 目标2倍关停<\/td>\n<td>CPA是否随放量上升<\/td>\n<td>—<\/td>\n<td>CPA &gt; 目标 × 2<\/td>\n<\/tr>\n<tr>\n<td>CTR<\/td>\n<td>CTR &lt; 1.5%换图<\/td>\n<td>素材CTR衰减监控<\/td>\n<td>—<\/td>\n<td>CTR &lt; 1.5%<\/td>\n<\/tr>\n<tr>\n<td>退货率<\/td>\n<td>退货率 &gt; 25%关停<\/td>\n<td>退货率 &gt; 20%暂停放量<\/td>\n<td>退货趋势是否收敛<\/td>\n<td>退货率 &gt; 20%<\/td>\n<\/tr>\n<tr>\n<td>库存<\/td>\n<td>—<\/td>\n<td>库存 &lt; 300双转维稳<\/td>\n<td>尾货 &lt; 50挂一口价<\/td>\n<td>库存 &lt; 300 / &lt; 50<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>D.4 投放时段策略<\/h4>\n<table>\n<thead>\n<tr>\n<th>优化目标<\/th>\n<th>适用阶段<\/th>\n<th>投放时段<\/th>\n<th>出价参考<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>曝光量<\/td>\n<td>测款期<\/td>\n<td>全时段 00:00-24:00<\/td>\n<td>¥3.7/次<\/td>\n<\/tr>\n<tr>\n<td>浏览量<\/td>\n<td>测款期/放量期辅助<\/td>\n<td>全时段或午间时段<\/td>\n<td>¥3.7-4.4/次<\/td>\n<\/tr>\n<tr>\n<td>咨询量<\/td>\n<td>放量期/维稳期辅助<\/td>\n<td>高峰时段 12-14, 19-23<\/td>\n<td>¥4.4/次<\/td>\n<\/tr>\n<tr>\n<td>下单量<\/td>\n<td>维稳期<\/td>\n<td>晚间高峰 19-23<\/td>\n<td>¥3.0-3.7/次<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>D.5 素材方向参考<\/h4>\n<table>\n<thead>\n<tr>\n<th>方向<\/th>\n<th>适用阶段<\/th>\n<th>主图要求<\/th>\n<th>文案卖点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>性价比引流<\/td>\n<td>测款+放量<\/td>\n<td>白底图+价格醒目<\/td>\n<td>轻便/透气/防滑/百搭<\/td>\n<\/tr>\n<tr>\n<td>品质种草<\/td>\n<td>测款+放量<\/td>\n<td>材质特写+做工细节<\/td>\n<td>品牌故事+面料解析<\/td>\n<\/tr>\n<tr>\n<td>场景实拍<\/td>\n<td>测款+放量<\/td>\n<td>穿搭/上脚实拍<\/td>\n<td>日常百搭/运动通勤<\/td>\n<\/tr>\n<tr>\n<td>无忧卖专属<\/td>\n<td>全阶段<\/td>\n<td>降价标签+限时<\/td>\n<td>无忧卖价+限量清仓<\/td>\n<\/tr>\n<tr>\n<td>买家秀<\/td>\n<td>放量+维稳<\/td>\n<td>真实好评返图<\/td>\n<td>买家真实评价+推荐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>D.6 每日数据复盘流程（10分钟）<\/h4>\n<ol>\n<li>录入数据（2分钟）：在决策系统中录入当日花费、曝光、点击、咨询、成交、退货数据。<\/li>\n<li>检查预警（2分钟）：对照D.3监控指标，标红异常项（ROAS不达标/退货率超标/CTR过低等）。<\/li>\n<li>决策动作（3分钟）：关停不达标计划 → 递增优质计划预算 → 替换低CTR素材 → 调整出价。<\/li>\n<li>记录笔记（2分钟）：简要记录当日关键决策和原因（为什么关/为什么加/为什么换）。<\/li>\n<li>每周校准（1分钟）：积累7天真实数据后，更新决策系统中的漏斗系数（CPC/CTR/咨询率/成交率），让模型越来越准。\n关键原则：测款期重在「快」——多条计划快速试错淘汰；放量期重在「稳」——聚焦Top计划，严控ROAS和退货率；维稳期重在「收」——降出价、精选时段、集中预算清仓。每个阶段关键指标达标后再进下一阶段，不要跳步。<\/li>\n<\/ol>\n<h3 id=\"sec-91\">E. 固定提醒<\/h3><ol>\n<li>资料归档运营资料库：所有投放数据、复盘笔记、素材素材迭代记录，统一归档到团队共享文档/网盘，便于后续复盘和新人培训。<\/li>\n<li>待办问题创建跟进事项：每日复盘发现的异常（如退货率飙升、某素材CTR骤降），立即在团队协作工具中创建待办事项，指定责任人+截止时间，确保问题不遗漏、有闭环。<\/li>\n<\/ol>\n<h3 id=\"sec-93\">F. 常见买家问题合规应答与售后处理<\/h3><p>本节整理自团队《常见买家问题（二手电商等问题）》资料（2026-04 修订版），并按本手册合规口径（第 12、13、15 章）统一改写：<strong>只收录合规做法与可复制话术<\/strong>；原资料中涉及违规的玩法一律未收录，改写为合规替代方案，并在对应小节以红线标注。<\/p>\n<blockquote>⚠️ <strong>先说结论<\/strong>：应答买家的总原则只有一条——<strong>如实描述 + 提前告知 + 留好证据<\/strong>。凡靠「话术包装」促成成交、事后靠「聊天记录规避责任」的做法，短期可能多出几单，长期一定会以扣分、下架、退款纠纷甚至法律风险收场（见 12.1、13.3、15.8）。<\/blockquote>\n<h4>F.1 新手起步：从低客单价品类练手<\/h4>\n<table>\n<thead>\n<tr><th>做法<\/th><th>为什么<\/th><th>要点<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>先做几十元档的低客单价商品<\/td><td>买家决策快、出单快，售后率显著低于高价品（东西几十块，能用就不折腾；几百上千的东西，一点瑕疵就退）<\/td><td>目的不是赚钱，是<strong>跑熟发布→接待→发货→售后全流程<\/strong>，攒账号数据与信心<\/td><\/tr>\n<tr><td>不建议新手直接上高客单价<\/td><td>流程不熟、话术不稳，容易卖出去就退；高客单价 = 高售后率 = 高纠纷率<\/td><td>先低后高，跑通闭环（见附录 B 六阶段）再逐步升级品类<\/td><\/tr>\n<tr><td>特殊品（自行车、投影仪、相机等）<\/td><td>瑕疵争议多<\/td><td><strong>上架前<\/strong>把成色、瑕疵、配件情况在文案与聊天里说清楚，「该是什么样就是什么样」<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>F.2 高频问题①「这个是正品吗 / 是真的吗」——如实应答<\/h4>\n<p>这是二手交易被问得最多的问题。合规做法不是「回避」，而是<strong>按商品的真实际来源答<\/strong>：<\/p>\n<table>\n<thead>\n<tr><th>你的商品实际是<\/th><th>合规应答模板（可复制）<\/th><th>说明<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>自用闲置（自己买来用过的）<\/td><td>「是我自己用的，成色和功能我都如实写在描述里了，具体真假我不做专业鉴定，介意的话建议谨慎拍，拍前可以多看看图和描述」<\/td><td>不冒充、不打包票；对真假特别在意的买家，不强求成交<\/td><\/tr>\n<tr><td>亲友闲置 / 代转卖<\/td><td>「家里人/朋友闲置转让的，我没用过，成色以实拍图为准，功能正常」<\/td><td>如实说明来源，与文案一致（5.4 文案结构）<\/td><\/tr>\n<tr><td>全新非品牌官方渠道（平替 / 兼容款）<\/td><td>「这款是平替/兼容款，<strong>不是品牌官方产品<\/strong>，功能和外观如图，性价比高」<\/td><td>平替可以卖，<strong>品牌属性必须讲明<\/strong>；标题描述里就写清楚（海外版/平替款/兼容款）<\/td><\/tr>\n<\/tbody>\n<\/table>\n<blockquote>🚫 <strong>红线（原资料相关玩法不收录）<\/strong>：复刻、高仿、1:1 仿品冒充「正品」出售——① 违反《商标法》，情节严重可追究刑事责任；② 属闲鱼禁售品类（15.6），描述触发「精仿/原单/复刻」类暗语也会被 12.3 清单拦截；③ 一经认定按 12.1 处罚（下架、扣闲气值、情节严重清退）。原资料「大部分品类可直接对买家说是正品」的口径<strong>禁止使用<\/strong>；把品牌词写在标题里蹭流量、再用「海外版/同款」暗示非正品的擦边写法同样禁止——要么如实是非品牌平替（不带品牌标、描述写明），要么不做。<\/blockquote>\n<h4>F.3 高频问题②「你在哪里 / 能不能自提」——如实应答<\/h4>\n<p>二手平台买家会同时咨询多个卖家，<strong>回复快、态度好本身就是竞争力<\/strong>，不需要靠编造同城拉近关系：<\/p>\n<ul>\n<li>如实告知发货地（与商品发布页一致，多账号矩阵的发货地规则见第十章）。<\/li>\n<li>真实支持自提就说可以，并约时间地点；不支持就说明「全国包邮、走快递」即可，语气友好：「不好意思这边不支持自提哈，顺丰/极兔包邮，一般 2-3 天到，到货有问题随时找我～」<\/li>\n<\/ul>\n<blockquote>🚫 <strong>红线（原资料相关话术不收录）<\/strong>：编造「你附近的位置」、编造「出差/回老家」等理由假装同城再绕回包邮——属于对买家的虚假陈述，属 12.2 运营禁区中的「虚假信息」一类；一旦买家收货后发现发货地与所述不符，极易引发投诉与平台介入，反而拉高纠纷率。<\/blockquote>\n<h4>F.4 高频问题③「有购买凭证吗」——用证据代替凭证<\/h4>\n<p>闲鱼闲置交易的正常形态就是「没有发票」，买家索要凭证时：<\/p>\n<ul>\n<li><strong>合规做法<\/strong>：如实说明来源（自用闲置/亲友转让，所以没有购物凭证）；同时提供<strong>能提供的真实证据<\/strong>——实拍图、实拍视频、序列号查询截图（数码类）、保修剩余时长截图等，比一张来路不明的「凭证」更有说服力。<\/li>\n<li>手头确实有发票/订单记录的（正品二手），直接提供真实截图即可。<\/li>\n<\/ul>\n<blockquote>🚫 <strong>红线（原资料相关玩法不收录）<\/strong>：去电商平台下单后 P 图伪造购买凭证、向同行索要凭证冒充自己的——属于伪造交易信息欺骗买家，涉嫌欺诈；平台风控对图片二次编辑有识别能力，判罚按 12.1 从严。<\/blockquote>\n<h4>F.5 发货话术与证据留存（对接 13.1）<\/h4>\n<p>发货后主动发一段「告知 + 留证」话术，把成色、验货方式、退换规则<strong>提前说清<\/strong>，是减少纠纷最有效的一步：<\/p>\n<table>\n<thead>\n<tr><th>商品类型<\/th><th>发货话术模板（可复制）<\/th><th>要点<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>全新闲置 / 库存全新<\/td><td>「东西已经发出了哈，是全新的，麻烦收到时<strong>先拍个开箱视频<\/strong>再拆，核对下有没有运输破损；有问题第一时间联系我，运费我来承担；没问题就麻烦确认收货啦～」<\/td><td>开箱视频既保护买家也保护卖家（防掉包、防「空包裹」讹诈）<\/td><\/tr>\n<tr><td>二手数码 / 二手设备<\/td><td>「东西已经发出了哈，成色按描述里写的 X 成新，功能都正常；麻烦收到先拍开箱视频再验机，如有描述不符，来回运费我出；二手商品属个人闲置，请理解并确认～」<\/td><td>成色、瑕疵<strong>以描述为准<\/strong>，不要临场加码承诺<\/td><\/tr>\n<tr><td>文玩钱币等特殊品<\/td><td>「东西已经发出了哈，文玩/钱币属特殊品类，支持平台规则的售后流程，麻烦收到先拍开箱视频，有问题随时联系我」<\/td><td>特殊品类更要提前说清规则，但<strong>不能约定「一经售出不退不换」来排除平台规则<\/strong>（见下方边界）<\/td><\/tr>\n<\/tbody>\n<\/table>\n<blockquote>⚠️ <strong>效力边界<\/strong>：持续、批量卖货已可能构成「经营性行为」（15.2），经营性卖家<strong>不能<\/strong>用聊天记录里的「不退不换」排除买家七天无理由退货等法定/平台权利（15.4）；个人偶发闲置转让的约定空间相对更大，但「提前告知」在任何情形下都是争议处理时的关键证据（13.4 证据留存清单）。<\/blockquote>\n<h4>F.6 退货与售后分级处理（对接 13.2）<\/h4>\n<table>\n<thead>\n<tr><th>情形<\/th><th>责任与处理<\/th><th>运费<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>质量问题<\/strong>：商品完全无法使用（充电器不能充电、球拍断裂、自行车严重变形、缺件）<\/td><td>无条件退换或补发配件；不逃避、当天响应<\/td><td><strong>卖家承担<\/strong>来回运费<\/td><\/tr>\n<tr><td><strong>运输轻微瑕疵<\/strong>：轻微刮擦、掉漆、形变（二手/周转商品正常现象）<\/td><td>以发货前描述与开箱视频为凭，协商部分补偿<\/td><td>提前告知过的，按约定处理<\/td><\/tr>\n<tr><td><strong>非质量原因不想要了<\/strong>（无理由退货）<\/td><td>接受退货，商品需保持发出时状态<\/td><td>发货前已告知「无理由退货来回运费买家承担」的按约定；未告知的协商分担<\/td><\/tr>\n<tr><td><strong>买家好沟通<\/strong>、瑕疵可接受<\/td><td>可协商小额补偿代替退货（少赚但省运费与时间）<\/td><td>双方协商<\/td><\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>协商不成走平台维权/客服介入（13.3 申诉全流程），凭据以聊天记录、商品描述、开箱视频为主（13.4）。<\/li>\n<li>处理售后<strong>忌拉黑、忌语言冲突<\/strong>：聊天中任何过激言论，在平台介入时都会成为对己不利的证据。<\/li>\n<\/ul>\n<h4>F.7 防骗提醒（重点）<\/h4>\n<ul>\n<li><strong>「上门推销货源」基本都是骗局<\/strong>：做到中期会有人私信称「有工厂货源」并要求加微信——真正的工厂货源不会主动找人推销，也不会一单一结算。凡是<strong>让你先转账<\/strong>的，一律当骗子处理（空包裹、拉黑、失联是常见结局）。<\/li>\n<li><strong>交易必须留在平台内<\/strong>：对方引导加微信、走私下转账的，既是诈骗高发场景，也是 12.4 管控的站外引流风险点；确需交换联系方式的，只走官方【发送站外信息】通道（12.4）。<\/li>\n<li>账期异常的「垫资拿货」「百单起结」合作，先按 15.6 禁售清单与合同风险评估，不熟悉的渠道不碰。<\/li>\n<\/ul>\n<h4>F.8 品类聚焦与运营节奏<\/h4>\n<ul>\n<li><strong>测品期允许杂，跑通后必须聚焦<\/strong>：单账号实际只有 2-3 个品类能持续拿到曝光；观察哪个品类的咨询量最高，就把上新集中到该品类的相关商品上（选品方法见第五章，流量逻辑见 7.1）。<\/li>\n<li><strong>副业节奏<\/strong>：1-2 个账号即可，固定两个时段回复消息（如早 9-11 点、晚 6 点后），核心是响应速度与售后不拖。<\/li>\n<li><strong>主业化节奏<\/strong>：再考虑矩阵扩号（设备、一机一卡一号与矩阵规则见第十章）；先单账号把选品、话术、售后跑顺，再复制，不要一上来铺设备。<\/li>\n<\/ul>\n<blockquote>🚫 <strong>红线（原资料相关内容不收录）<\/strong>：刷单、补单、人为干预交易等「提升流量」的玩法，属虚假交易，按 12.1 从严处置（删评价、降权、扣闲气值直至封号），且涉及税务与法律风险；本手册全部流量方法均以真实交易为前提。涉及「轻松月入过万」一类收益宣传，一律不作为决策依据（收益取决于选品、执行与售后，平台与任何机构都不能承诺）。<\/blockquote>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 A. 风险点汇总 风险类型 具体风险 应对措施 责任人 账号风险 违规封号/限流 一机一卡一号、每日安全巡检 运营主管 品类风险 误触禁售品类 上架前品类自查清单对照 选品负责人 投诉风险 买家投诉/退款纠纷 证据留存+标准化售后SOP 客服专员 投放风险 ROI低于盈亏线 每日数据监控+周复盘淘汰机制 投放专员 矩阵风险 关联封号 独立网络+独立设备+独立地址 运营主管 B. 待办事项清单 核心原则：走真实，不吃电商风 闲鱼是真实用户社区，不是纯电商平台。所有增长策略必须建立在真实交易、真实互动、真实内容的基础上。禁止刷单、互赞、虚假发货、批量铺货等电商化操作。 第一阶段：账号基础搭建 【新号】完成注册 + 实名认证 + 支付宝绑定 【新号】芝麻信用分提升至650+，闲气值提升至80+ 【新号】上传清晰头像、完善真实简介、设置真实收货地址 【认证】需要经营资质时，进入「我的→认证招商→经营资质」提交营业执照 【新号】连续15天真实养号（签到+浏览+真实互动） 第二阶段：店铺与权限 【鱼小铺】收到邀请后尽早完成开通（ 网传「24 小时内」无官方时限） 【鱼小铺】设置店铺封面、分类、简介 第三阶段：每日必做（重点标红） 时段 任务 原则/目的 每日 早7-8点 签到领闲鱼币 + 擦亮全部商品 保持账号活跃，刷新曝光 每日 上午 真实上新1-3个商品（拍照/实拍视频，严禁搬运网图） 走真实，为平台提供真实商品 每日 全天 10分钟内回复买家咨询 响应率影响搜索排名 每日 午间 处理发货 + 填写真实物流单号 真实履约，提升闲气值 每日 晚间 会玩社区/圈子发布1条真实内容（使用心得/避坑指南/测评） 真实内容提升账号权重，非硬广 每日 睡前 鱼塘/圈子互动5-10条（点赞+真实评论+关注） 真实社交互动，增加回访 第四阶段：每周必做 【每周一】检查各账号闲气值，低于80分启动修复流程 【每周二】分析成长数据：等级评价分、粉丝增长、闲鱼币收支 【每周三】清理低曝光商品，优化后重新上架（真实优化：换实拍图/调整标题） 【每周四】加入1-2个精准鱼塘/圈子，拓展真实流量渠道 【每周五】发布1篇高质量长帖（教程/测评/真实经历） 【每周六】参与平台活动，领取限时流量奖励 【每周日】数据复盘：曝光/浏览/转化/ROI/差评风险 第五阶段：成长权重专项 【等级】L5冲刺：30天计划 — 每日真实出单+好评维护+粉丝单引导 【闲气值】持续保持≥80分：15分钟内响应、24小时发货、零纠纷 【闲鱼币】保持余额≥500币，优先用于真实测款推广 【评价分】重点维护50元以上真实订单的好评率 【会玩社区】每周至少2-3条真实内容，禁止直接发广告 第六阶段：矩阵与风控 【矩阵】建立账号巡检表、风控日志 【矩阵】准备备用账号（至少2个） 【风控】每日检查安全中心，异常账号立即停操作 【风控】同一WiFi下不超过1个账号登录 禁止事项（红线） 刷单/刷好评：平台AI可识别，一旦查到直接清零等级 互赞/互关：属于虚假互动，触发风控模型 搬运网图/盗图：主图必须是实拍，网图会降低权重 诱导站外交易：微信/QQ/支付宝等联系方式一律禁止 批量复制标题：同一商品不同账号也要差异化描述 频繁改价/改主图：7天内主图修改不超过2次 C. 验收指标总表 阶段 时间 核心指标 验收标准 账号搭建 第1周 实名 据 。凡靠「话术包装」促成成交、事后靠「聊天记录规避责任」的做法，短期可能多出几单，长期一定会以扣分、下架、退款纠纷甚至法律风险收场（见 12.1、13.3、15.8）。 F.1 新手起步：从低客单价品类练手 做法 为什么 要点 先做几十元档的低客单价商品 买家决策快、出单快，售后率显著低于高价品（东西几十块，能用就不折腾；几百上千的东西，一点瑕疵就退） 目的不是赚钱，是 跑熟发布→接待→发货→售后全流程 ，攒账号数据与信心 不建议新手直接上高客单价 流程不熟、话术不稳，容易卖出去就退；高客单价 = 高售后率 = 高纠纷率 先低后高，跑通闭环（见附录 B 六阶段）再逐步升级品类 特殊品（自行车、投影仪、相机等） 瑕疵争议多 上架前 把成色、瑕疵、配件情况在文案与聊天里说清楚，「该是什么样就是什么样」 F.2 高频问题①「这个是正品吗 / 是真的吗」——如实应答 这是二手交易被问得最多的问题。合规做法不是「回避」，而是 按商品的真实际来源答 ： 你的商品实际是 合规应答模板（可复制） 说明 自用闲置（自己买来用过的） 「是我自己用的，成色和功能我都如实写在描述里了，具体真假我不做专业鉴定，介意的话建议谨慎拍，拍前可以多看看图和描述」 不冒充、不打包票；对真假特别在意的买家，不强求成交 亲友闲置 / 代转卖 「家里人/朋友闲置转让的，我没用过，成色以实拍图为准，功能正常」 如实说明来源，与文案一致（5.4 文案结构） 全新非品牌官方渠道（平替 / 兼容款） 「这款是平替/兼容款， 不是品牌官方产品 ，功能和外观如图，性价比高」 平替可以卖， 品牌属性必须讲明 ；标题描述里就写清楚（海外版/平替款/兼容款） 🚫 红线（原资料相关玩法不收录） ：复刻、高仿、1:1 仿品冒充「正品」出售——① 违反《商标法》，情节严重可追究刑事责任；② 属闲鱼禁售品类（15.6），描述触发「精仿/原单/复刻」类暗语也会被 12.3 清单拦截；③ 一经认定按 12.1 处罚（下架、扣闲气值、情节严重清退）。原资料「大部分品类可直接对买家说是正品」的口径 禁止使用 ；把品牌词写在标题里蹭流量、再用「海外版/同款」暗示非正品的擦边写法同样禁止——要么如实是非品牌平替（不带品牌标、描述写明），要么不做。 F.3 高频问题②「你在哪里 / 能不能自提」——如实应答 二手平台买家会同时咨询多个卖家， 回复快、态度好本身就是竞争力 ，不需要靠编造同城拉近关系： 如实告知发货地（与商品发布页一致，多账号矩阵的发货地规则见第十章）。 真实支持自提就说可以，并约时间地点；不支持就说明「全国包邮、走快递」即可，语气友好：「不好意思这边不支持自提哈，顺丰/极兔包邮，一般 2-3 天到，到货有问题随时找我～」 🚫 红线（原资料相关话术不收录） ：编造「你附近的位置」、编造「出差/回老家」等理由假装同城再绕回包邮——属于对买家的虚假陈述，属 12.2 运营禁区中的「虚假信息」一类；一旦买家收货后发现发货地与所述不符，极易引发投诉与平台介入，反而拉高纠纷率。 F.4 高频问题③「有购买凭证吗」——用证据代替凭证 闲鱼闲置交易的正常形态就是「没有发票」，买家索要凭证时： 合规做法 ：如实说明来源（自用闲置/亲友转让，所以没有购物凭证）；同时提供 能提供的真实证据 ——实拍图、实拍视频、序列号查询截图（数码类）、保修剩余时长截图等，比一张来路不明的「凭证」更有说服力。 手头确实有发票/订单记录的（正品二手），直接提供真实截图即可。 🚫 红线（原资料相关玩法不收录） ：去电商平台下单后 P 图伪造购买凭证、向同行索要凭证冒充自己的——属于伪造交易信息欺骗买家，涉嫌欺诈；平台风控对图片二次编辑有识别能力，判罚按 12.1 从严。 F.5 发货话术与证据留存（对接 13.1） 发货后主动发一段「告知 + 留证」话术，把成色、验货方式、退换规则 提前说清 ，是减少纠纷最有效的一步： 商品类型 发货话术模板（可复制） 要点 全新闲置 / 库存全新 「东西已经发出了哈，是全新的，麻烦收到时 先拍个开箱视频 再拆，核对下有没有运输破损；有问题第一时间联系我，运费我来承担；没问题就麻烦确认收货啦～」 开箱视频既保护买家也保护卖家（防掉包、防「空包裹」讹诈） 二手数码 / 二手设备 「东西已经发出了哈，成色按描述里写的 X 成新，功能都正常；麻烦收到先拍开箱视频再验机，如有描述不符，来回运费我出；二手商品属个人闲置，请理解并确认～」 成色、瑕疵 以描述为准 ，不要临场加码承诺 文玩钱币等特殊品 「东西已经发出了哈，文玩/钱币属特殊品类，支持平台规则的售后流程，麻烦收到先拍开箱视频，有问题随时联系我」 特殊品类更要提前说清规则，但 不能约定「一经售出不退不换」来排除平台规则 （见下方边界） ⚠️ 效力边界 ：持续、批量卖货已可能构成「经营性行为」（15.2），经营性卖家 不能 用聊天记录里的「不退不换」排除买家七天无理由退货等法定/平台权利（15.4）；个人偶发闲置转让的约定空间相对更大，但「提前告知」在任何情形下都是争议处理时的关键证据（13.4 证据留存清单）。 F.6 退货与售后分级处理（对接 13.2） 情形 责任与处理 运费 质量问题 ：商品完全无法使用（充电器不能充电、球拍断裂、自行车严重变形、缺件） 无条件退换或补发配件；不逃避、当天响应 卖家承担 来回运费 运输轻微瑕疵 ：轻微刮擦、掉漆、形变（二手/周转商品正常现象） 以发货前描述与开箱视频为凭，协商部分补偿 提前告知过的，按约定处理 非质量原因不想要了 （无理由退货） 接受退货，商品需保持发出时状态 发货前已告知「无理由退货来回运费买家承担」的按约定；未告知的协商分担 买家好沟通 、瑕疵可接受 可协商小额补偿代替退货（少赚但省运费与时间） 双方协商 协商不成走平台维权/客服介入（13.3 申诉全流程），凭据以聊天记录、商品描述、开箱视频为主（13.4）。 处理售后 忌拉黑、忌语言冲突 ：聊天中任何过激言论，在平台介入时都会成为对己不利的证据。 F.7 防骗提醒（重点） 「上门推销货源」基本都是骗局 ：做到中期会有人私信称「有工厂货源」并要求加微信——真正的工厂货源不会主动找人推销，也不会一单一结算。凡是 让你先转账 的，一律当骗子处理（空包裹、拉黑、失联是常见结局）。 交易必须留在平台内 ：对方引导加微信、走私下转账的，既是诈骗高发场景，也是 12.4 管控的站外引流风险点；确需交换联系方式的，只走官方【发送站外信息】通道（12.4）。 账期异常的「垫资拿货」「百单起结」合作，先按 15.6 禁售清单与合同风险评估，不熟悉的渠道不碰。 F.8 品类聚焦与运营节奏 测品期允许杂，跑通后必须聚焦 ：单账号实际只有 2-3 个品类能持续拿到曝光；观察哪个品类的咨询量最高，就把上新集中到该品类的相关商品上（选品方法见第五章，流量逻辑见 7.1）。 副业节奏 ：1-2 个账号即可，固定两个时段回复消息（如早 9-11 点、晚 6 点后），核心是响应速度与售后不拖。 主业化节奏 ：再考虑矩阵扩号（设备、一机一卡一号与矩阵规则见第十章）；先单账号把选品、话术、售后跑顺，再复制，不要一上来铺设备。 🚫 红线（原资料相关内容不收录） ：刷单、补单、人为干预交易等「提升流量」的玩法，属虚假交易，按 12.1 从严处置（删评价、降权、扣闲气值直至封号），且涉及税务与法律风险；本手册全部流量方法均以真实交易为前提。涉及「轻松月入过万」一类收益宣传，一律不作为决策依据（收益取决于选品、执行与售后，平台与任何机构都不能承诺）。","toc":[{"id":"sec-87","title":"A. 风险点汇总"},{"id":"sec-88","title":"B. 待办事项清单"},{"id":"sec-89","title":"C. 验收指标总表"},{"id":"sec-90","title":"D. 投放执行SOP与数据复盘"},{"id":"sec-91","title":"E. 固定提醒"},{"id":"sec-93","title":"F. 常见买家问题合规应答与售后处理"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":11,"imgs":0,"words":6649,"sections":6,"subs":21,"version":"V2026.10.12"},"related":["sec-30","sec-11","sec-2","sec-62"]}]},{"module":"经营提效","module_sub":"管理篇 · 把效率做高","section":"官方规则速查手册","color":"green","count":1,"items":[{"id":"sec-76","kind":"chapter","module":"经营提效","module_sub":"管理篇 · 把效率做高","section":"官方规则速查手册","title":"第十五章 官方规则精要","title_raw":"第十五章 官方规则精要","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><p>本章内容提炼自闲鱼官方规则中心（<a href=\"https://h5.m.goofish.com/wow/moyu/moyu-project/doc/pages/v3Lv4OO6VbJS%EF%BC%89%EF%BC%8C%E6%B6%B5%E7%9B%9629%E9%A1%B9%E7%8E%B0%E8%A1%8C%E8%A7%84%E5%88%99%E3%80%82%E5%BB%BA%E8%AE%AE%E5%AE%9A%E6%9C%9F%E5%AF%B9%E7%85%A7%E5%AE%98%E6%96%B9%E8%A7%84%E5%88%99%E4%B8%AD%E5%BF%83%E6%A3%80%E6%9F%A5%E6%9B%B4%E6%96%B0%E3%80%82%E8%A7%84%E5%88%99%E4%B8%AD%E5%BF%83%E8%B7%AF%E5%BE%84%EF%BC%9A%E9%97%B2%E9%B1%BCAPP\">https://h5.m.goofish.com/wow/moyu/moyu-project/doc/pages/v3Lv4OO6VbJS），涵盖29项现行规则。建议定期对照官方规则中心检查更新。规则中心路径：闲鱼APP<\/a> → 我的 → 设置 → 闲鱼公约。<\/p>\n<h3 id=\"sec-77\">15.1 卖方软件服务费收费规则<\/h3><p>这是所有闲鱼卖家必须了解的核心规则，直接影响利润核算。<\/p>\n<table>\n<thead>\n<tr>\n<th>费用类型<\/th>\n<th>收费门槛<\/th>\n<th>费率<\/th>\n<th>计算基数<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>基础软件服务费<\/td>\n<td>所有成交订单（无门槛）<\/td>\n<td>0.6%（普通卖家单笔封顶 60 元；鱼小铺卖家不封顶）<\/td>\n<td>每笔订单成交额<\/td>\n<\/tr>\n<tr>\n<td>软件服务费-基础门槛<\/td>\n<td>当月累计成交＞10单 且 累计金额＞10,000元<\/td>\n<td>1%（超出门槛部分）<\/td>\n<td>超出门槛的每笔订单成交额<\/td>\n<\/tr>\n<tr>\n<td>软件服务费-品类门槛（手机）<\/td>\n<td>当年手机品类累计成交＞6笔<\/td>\n<td>1%（超出门槛部分）<\/td>\n<td>超出门槛的手机品类每笔订单成交额<\/td>\n<\/tr>\n<tr>\n<td>软件服务费-鱼小铺<\/td>\n<td>开通鱼小铺工具服务的卖方<\/td>\n<td>1%（所有订单）<\/td>\n<td>每笔订单成交额<\/td>\n<\/tr>\n<tr>\n<td>软件服务费-租赁模式<\/td>\n<td>使用「租赁模式」的商家（2026 年 9 月 20 日 0 点起）<\/td>\n<td>3%（每笔订单成交额）<\/td>\n<td>每笔租赁订单成交额<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>关键要点：<\/h4>\n<ul>\n<li>费率上限：普通卖家同一笔订单最多收取 0.6%（基础）+ 1%（软件服务费）= 1.6%，且<strong>基础服务费单笔封顶 60 元<\/strong>；<strong>鱼小铺卖家不享受封顶、费率不设金额上限<\/strong>（鱼小铺销售手机品类综合费率最高约 2.6%）<\/li>\n<li><strong>计费基数（2026年4月18日起）<\/strong>：按确认收货时的订单成交额计算，<strong>含运费、平台红包与平台补贴<\/strong>——此前按「实际成交额」计，新口径会让服务费明显高于以往，定价时必须计入<\/li>\n<li>基础门槛 vs 品类门槛：同一订单同时满足时，仅按品类门槛收取（不重复收）<\/li>\n<li>鱼小铺卖家：不再享受&quot;基础门槛&quot;和&quot;品类门槛&quot;的优惠政策，每笔订单都收取1%+0.6%<\/li>\n<li>退款不退费：成交后发生退款，已划扣的软件服务费不做退还<\/li>\n<li><strong>租赁模式费率上调（2026 年 9 月 20 日 0 点起）<\/strong>：使用「租赁模式」的商家，每笔订单按<strong>成交额的 3%<\/strong> 收取软件服务费（此前按 0.6% 基础费率计），<strong>订单发生退款时已划扣的服务费不予退还<\/strong>；平台已于 2026 年 9 月 4 日发布费率公示。做相机、镜头、乐器、游戏机、摄影器材等租赁类商品的账号，需把 3% 直接计入租金定价与利润核算<\/li>\n<li>扣款方式：由支付服务商从买家支付的订单款项中实时划扣<\/li>\n<li>费率误收个案（2026-10-01 黑猫投诉）：有个人闲置卖家（未开通鱼小铺、年成交仅 1–2 单）反映，一笔 4299 元订单在 0.6% 基础服务费之外被额外按<strong>鱼小铺口径加收 1%<\/strong>（42.99 元），客服无法出示开通凭证。个案提醒：成交后核对账单明细，发现与自身身份不符的扣费及时通过官方渠道申诉留痕；属单一投诉个案，平台是否系统性误判 <strong><\/strong><\/li>\n<li>手机品类统计：从每年1月1日起统计交易成功订单，超出6笔后开始收费<\/li>\n<li>规则生效：2024年9月1日起实施基础软件服务费；2026年4月18日最新修订；2026年9月20日起租赁模式加收 3%\n运营启示：对于月销超1万或手机品类活跃卖家，需将1.6%的服务费纳入定价成本核算。鱼小铺卖家需特别注意——一旦开通，每单都收费，小额多单模式成本更高。<\/li>\n<\/ul>\n<h3 id=\"sec-78\">15.2 经营性行为界定与管理规范（2026年6月1日生效）<\/h3><p>此为新规，标志着闲鱼正式区分&quot;个人卖家&quot;和&quot;经营性卖家&quot;，对团队矩阵运营影响重大。<\/p>\n<h4>经营性卖家认定标准（满足任一即可能被认定）：<\/h4>\n<table>\n<thead>\n<tr>\n<th>认定方式<\/th>\n<th>标准<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>主动申报<\/td>\n<td>已取得营业执照、许可证等经营资质，或公示自我经营声明<\/td>\n<\/tr>\n<tr>\n<td>行为判定<\/td>\n<td>使用&quot;一手货源&quot;“固定货源”“有售后”“七天无理由退货”“多库存”&quot;多规格&quot;等经营性描述，且触及下列量化红线（ 官方表述为「描述层 + 交易层综合判定」，具体是否需全部满足以平台判定为准）：① 在售物品＞30件且品类＜3类② 同一型号频繁售出5次以上③ 年交易≥104笔，每月至少3笔④ 年销售额＞10万元<\/td>\n<\/tr>\n<tr>\n<td>特殊豁免<\/td>\n<td>收藏品/奢侈品、潮玩/潮鞋/数码/乐器、搬家出清、明星网红闲置等场景，不直接认定为经营行为，综合判定<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>被认定为经营性卖家后的义务：<\/h4>\n<ol>\n<li>依法登记：办理市场主体登记（符合豁免情形除外）<\/li>\n<li>信息登记：如实登记身份、经营地址、联系方式、行政许可等（变更后3个工作日内更新）<\/li>\n<li>定期年检（2026 年 10 月起卖家实测出现）：被判定为经营性的卖家，在发布/编辑商品时可能触发「合规任务」弹窗，须完成<strong>经营者信息年检<\/strong>——核对联系信息（手机号验证码 + 省/市/详细经营地址）与身份证主体信息（证件有效期 + 人像面/国徽面照片），提交后约 <strong>3 个工作日<\/strong>审核，通过后恢复发布权限；<strong>逾期未完成核验会限制商品发布与编辑功能<\/strong>。年检只更新联系地址与主体信息，与「亮照」不是同一事项。依据为《电子商务法》《网络交易监督管理办法》对经营者主体信息定期核验的要求；上述流程为卖家实操分享口径，官方规则原文与年检周期 <strong><\/strong><\/li>\n<li>信息公示：个人主页显著位置公示营业执照（或身份信息）、经营地址、联系方式等<\/li>\n<li>商品信息披露：如实披露品牌、型号、现状、维修记录、瑕疵等<\/li>\n<li>经营者义务：履行&quot;七日无理由退货&quot;、质量退换货、售后义务\n矩阵运营注意：经营性认定 + 一机一卡一号原则 = 矩阵账号中高销量账号必须合规经营主体化。建议提前为旗舰号准备营业执照，垂直号控制在认定门槛以下。<\/li>\n<\/ol>\n<h3 id=\"sec-79\">15.3 保证金管理规范<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>适用对象<\/td>\n<td>经营性卖家、开通保障服务的二手卖家、部分品类卖家<\/td>\n<\/tr>\n<tr>\n<td>额度<\/td>\n<td>根据品类和开通服务不同，以页面提示为准。开通七天无理由退货需缴纳500元<\/td>\n<\/tr>\n<tr>\n<td>划扣场景<\/td>\n<td>交易争议、违规情形、第三方投诉 → 用于退款/赔付买家<\/td>\n<\/tr>\n<tr>\n<td>补缴时限<\/td>\n<td>余额不足时，72小时内补足，否则下架商品、限制权限<\/td>\n<\/tr>\n<tr>\n<td>追缴<\/td>\n<td>保证金不足赔付时，平台可垫付后向卖家追缴<\/td>\n<\/tr>\n<tr>\n<td>退回条件<\/td>\n<td>关闭所有保障服务 + 无进行中交易/退款/投诉/欠费<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-80\">15.4 七天无理由退货规范<\/h3><table>\n<thead>\n<tr>\n<th>分类<\/th>\n<th>商品类型<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>不支持<\/td>\n<td>定制类、鲜活易腐类、在线下载/拆封的数字化商品、报纸期刊、服务类、竞拍商品、人体用药<\/td>\n<td>绝对不可退货<\/td>\n<\/tr>\n<tr>\n<td>卖家可选<\/td>\n<td>激活后价值贬损大的商品（VR头盔等）、黄金、拆封后影响安全健康的（食品/保健品/贴身用品/成人用品）、所有品类非全新商品<\/td>\n<td>卖家自愿开通<\/td>\n<\/tr>\n<tr>\n<td>必须支持<\/td>\n<td>除以上外的所有品类全新商品（服装、数码、家纺、母婴、宠物用品、图书、珠宝、家具、家电等）<\/td>\n<td>经营性卖家强制开通<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>关键细节：<\/h4>\n<ul>\n<li>七天计算：签收次日零时起算，满168小时（7天）<\/li>\n<li>运费：包邮商品买家承担退货运费；非包邮商品买家承担所有运费<\/li>\n<li>商品完好标准：保持原有品质功能，配件齐全，无受损受污；包装完整（一般变形/污渍不算）<\/li>\n<li>特殊品类：手机类未激活、食品化妆品密封包装未拆封、鞋类防盗扣未剪<\/li>\n<li>经营性卖家：个人主页展示&quot;商&quot;标识，发布全新商品强制支持七天无理由<\/li>\n<\/ul>\n<h3 id=\"sec-81\">15.5 鱼小铺工具管理规范（2026年3月修订）<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>开通条件<\/td>\n<td>① 完成实名+实人认证 ② 同一真实身份最多5个账号开通 ③ 主体须满16周岁 ④ 闲气值＞80分 ⑤ 至少1件在线商品<\/td>\n<\/tr>\n<tr>\n<td>退出条件<\/td>\n<td>无未完成订单/纠纷 + 关闭所有保障服务 + 无保证金余额及欠费 + 无官方认证标识 + 无进行中活动<\/td>\n<\/tr>\n<tr>\n<td>退出后再加入<\/td>\n<td><strong>主动退出后满 90 天，方可再次申请加入鱼小铺<\/strong><\/td>\n<\/tr>\n<tr>\n<td>退出后果<\/td>\n<td>收回宝贝管理工具（含宝贝数量/库存权益）、粉丝运营工具、运营工作台等所有权益<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>重要限制：同一身份证最多5个账号开鱼小铺。矩阵运营时需规划好哪些账号开通鱼小铺、哪些保持普通状态。<\/p>\n<h3 id=\"sec-82\">15.6 信息发布规范：完整禁售/限售清单<\/h3><p>以下为官方《闲鱼社区信息发布规范》（2025年12月18日修订）列出的13大类禁售/限售信息。<\/p>\n<p>⚠️ <strong>2026 年新增的五类专项治理（务必叠加遵守，清单外同样会被处置）<\/strong>：<br/>\n① <strong>代订与虚拟资源类<\/strong>（2026 年 6 月起）：酒店/机票/门票代订、会员代充、不可查询的虚拟服务、互联网用户账号、游戏账号与 CDK、含「学习资料/网盘资源」等暗语的内容——此类需营业执照等经营资质，个人号从事极易被直接封号；<br/>\n② <strong>公序良俗／恶俗玩梗类<\/strong>（2026 年 7 月起）：低俗玩梗、擦边暗示、玄学转运话术（如「招财、转运、旺运」）等，平台已批量下架并封禁相关账号；<br/>\n③ <strong>暗语规避审核<\/strong>：以谐音、符号、拆字、图片方式规避检测，属「刻意规避」，从重处罚；<br/>\n④ <strong>色情引流类<\/strong>（2026 年 9 月 18 日官方公告，见下）——本类为本年度处置力度最大的一轮治理，<strong>识别即永久封禁，无解封通道<\/strong>；<br/>\n⑤ <strong>学术论文代写类<\/strong>（2026 年 10 月 10 日官方公告，见下）——涉国家学术诚信与教育公平，属违法违规信息。<strong>以上专项治理均为「清单外同样会被处置」的实时提级口径，实际以平台当期公告为准。<\/strong><\/p>\n<h4>④ 色情引流专项治理（2026-09-18 官方公告要点）<\/h4>\n<ul>\n<li><strong>公告时间与量级<\/strong>：2026 年 9 月 18 日闲鱼发布《关于持续严打色情引流的公告》。2026 年 1 月至今累计处置色情引流类风险账号 <strong>98358 个<\/strong>；警企协同成功打击色情团伙 <strong>15 个<\/strong>；该次通报为闲鱼 2026 年第 <strong>32 项<\/strong>专项治理通报（此前已覆盖网络水军、网络欺诈、站外引流等）。<\/li>\n<li><strong>三类重点打击场景<\/strong>：① <strong>暗号引流站外服务<\/strong>——以普通商品名、数字或数字符号相结合的形式伪装为色情暗号，规避审查后通过外部即时通讯平台引导站外；② <strong>伪装色情服务引流站外欺诈<\/strong>——以诱饵商品（公告点名「艺术二维码」等形式）引导至第三方平台，以「提供色情服务」为名诱导刷单实施诈骗；③ <strong>网盘链接隐蔽售黄<\/strong>——商品页面无违规内容，私信发网盘链接、网盘内再嵌联系方式，导向色情网址与资源。<\/li>\n<li><strong>处置口径<\/strong>：识别或查实即<strong>第一时间永久封禁相关账号，并无解封通道<\/strong>，同步下架全部关联违规商品；情节严重者涉及刑事犯罪。<\/li>\n<li><strong>三维度治理机制（可用于反推风控查什么）<\/strong>：① 前置风险监测——持续扩充色情引流类样本库；② 技术识别升级——完善违规拦截词库、优化商品图片低俗内容识别算法；③ 人工巡查——重点针对<strong>借昵称、头像等方式变相引流的隐蔽账号<\/strong>，以及<strong>商品信息表述不明的可疑商品<\/strong>。<\/li>\n<li><strong>举报入口（也可用于自查同类风险）<\/strong>：商品页右上角「举报」→ 选择「色情导流 / 站外诈骗」，附聊天截图可优先加急核查。<\/li>\n<li>⚠️ <strong>对正常经营的直接影响<\/strong>：本次治理同时抬高了图片审核与昵称 / 头像人工巡查强度。运营需自查——头像与昵称不使用暧昧词汇或暗示性配图、商品配图不使用衣着暴露的女性照片作噱头、不使用「同城可约 / 懂的来 / 私聊详谈」类模糊表述；<strong>2026 年 9 月 21 日已有媒体就平台涉黄产业链线索进行报道<\/strong>（平台客服回应「对违规行为零容忍」），意味着此类内容的审核与巡查在短期内会进一步收紧。<\/li>\n<li><strong>2026-09-23 官方调查结果（对上述公告的补充与升级）<\/strong>：闲鱼黑板报发布《关于媒体报道的调查结果》——① 平台已对整个平台多轮自查，<strong>公开展示信息中未查到淫秽信息，更无涉未成年人色情内容<\/strong>；② 确认存在个别卖家<strong>在一对一私聊时避开平台监管、发送其他平台二维码<\/strong>进行引流的情形，平台已处置相关商品与账号，并将涉及的商家、二维码与聊天记录<strong>举报至该站外平台<\/strong>，由其跟进监管；③ 平台<strong>已向公安机关报案<\/strong>，报道及所涉信息移交公安处理；④ 公开倡议各互联网平台联手建立<strong>「反引流联盟」<\/strong>，以技术手段与多平台协同阻断违法引流。<\/li>\n<li>⚠️ <strong>对运营的直接含义<\/strong>：<strong>私聊中发送第三方平台二维码已被明确列为可识别、可处置的引流动作<\/strong>，且平台会跨平台追责——不要抱「站内表述干净、站外交割」的侥幸。需要给联系方式时只走官方【发送站外信息】通道（见 7.4.3 ② 与 12.4）。<\/li>\n<li>📌 若发现有人借用你的商品或圈子内容作色情暗号载体，优先下架并举报，避免被系统关联降权。<\/li>\n<\/ul>\n<h4>⑤ 学术论文代写专项治理（2026-10-10 官方公告要点）<\/h4>\n<ul>\n<li><strong>公告时间与量级<\/strong>：2026 年 10 月 10 日闲鱼黑板报发布《治理公告（第十二期）》。平台对社区内「学术论文代写」等违法违规信息开展重点整治，<strong>2026 年 9 月 1 日至 9 月 30 日共下架处置违规提供学术论文代写服务商品 636 件<\/strong>。<\/li>\n<li><strong>打击范围（含变相形式）<\/strong>：公告明确包括但不限于——① <strong>提供学术论文代写服务<\/strong>；② <strong>售卖学术论文代写工具<\/strong>；以及同类「论文服务」包装下的变相违规行为（如以「论文辅导 / 润色 / 查重降重 / 数据代跑」等名义实质承接代写）。<\/li>\n<li><strong>定性依据<\/strong>：该行为违反国家有关<strong>学术诚信、教育公平及网络信息管理<\/strong>的法律法规，破坏学术秩序与社会诚信。对应 15.6 禁售清单<strong>第七类「非法服务与票证」<\/strong>中「作弊工具 / 服务」的执行细化。<\/li>\n<li><strong>处置手段<\/strong>：下架违规商品 + 处罚相关账号（与色情引流类的「永久封禁、无解封」不同，本类目前公告口径为下架 + 处罚，情节严重者同样会触发账号级处置）。<\/li>\n<li>⚠️ <strong>对运营的直接含义<\/strong>：本类与第十二章合规线强相关——「论文 / 代写 / 代做 / 作业」等词早已列入 <strong>12.3「2026 年新增高危暗语」<\/strong>，本次官方整治表明其已从「关键词监测」升级为「主动整治 + 商品下架」。团队若涉教育、资料、知识服务类商品，须彻底剔除代写与变相代写表述，改为合法的辅导陪练、资料整理、技能培训等可交付服务形态。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>类别<\/th>\n<th>核心禁售内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>一、枪支弹药危险武器<\/td>\n<td>枪支及配件、军火、管制刀具/弩/飞镖、军警标志/服装/器具、行政机关标志/制服<\/td>\n<\/tr>\n<tr>\n<td>二、易燃易爆危险化学品<\/td>\n<td>炸弹、火药、毒品及制毒原料、致瘾性药物、吸毒工具、烟花爆竹、腐蚀性/有毒化学品、放射性物质<\/td>\n<\/tr>\n<tr>\n<td>三、危害国家安全信息<\/td>\n<td>分裂国家、泄露国家机密、宣扬反动/邪教、损害国家名誉等<\/td>\n<\/tr>\n<tr>\n<td>四、色情低俗催情用品<\/td>\n<td>色情音像/视频/游戏/软件/图文、色情网站、色情低俗服务、原味、催情类用品<\/td>\n<\/tr>\n<tr>\n<td>五、人身隐私安全<\/td>\n<td>禁止出售的航空器/车辆及&quot;五大总成&quot;、安全带插口等破坏安全配件、窃听窃照设备、身份证件、个人隐私信息、群发设备/软件<\/td>\n<\/tr>\n<tr>\n<td>六、药品医疗器械保健食品<\/td>\n<td>药品、医疗器械、美容针剂、农药、兽药、病原微生物、保健食品、奶粉、食品添加剂<\/td>\n<\/tr>\n<tr>\n<td>七、非法服务与票证<\/td>\n<td>代办社会公共服务、募捐、假章假证假发票、作弊工具/服务、赌博、翻墙软件、迷信、违反公序良俗商品<\/td>\n<\/tr>\n<tr>\n<td>八、动植物器官及捕杀工具<\/td>\n<td>人口买卖、人体器官（含卵子/精子）、保护动植物、动物捕杀工具、猫狗肉/皮毛、鱼翅、熊胆<\/td>\n<\/tr>\n<tr>\n<td>九、非法所得及非法用途工具<\/td>\n<td>偷盗工具、作弊造假工具（电子秤/指纹膜/虚假定位/游戏外挂）、信号屏蔽设备、手机卡复制器<\/td>\n<\/tr>\n<tr>\n<td>十、电信网络诈骗相关<\/td>\n<td>多卡宝/GoIP/猫池等插卡设备、批量账号/短信验证服务、改号软件/伪基站/VOIP、仿冒APP/小程序制作<\/td>\n<\/tr>\n<tr>\n<td>十一、假冒商品与侵权<\/td>\n<td>假冒注册商标商品、盗版、侵犯商标权/著作权/专利权商品<\/td>\n<\/tr>\n<tr>\n<td>十二、违反行政法规商品<\/td>\n<td>流通中货币及兑换、假币及印刷设备、手机卡/上网卡、文物、烟草/电子烟、禁止进出口商品、外挂/私服相关<\/td>\n<\/tr>\n<tr>\n<td>十三、其他高风险<\/td>\n<td>非法传销、不合格商品、停售出版物、实际不存在商品、品牌空瓶/空酒瓶/空奶粉罐、引导站外、虚假夸大宣传、信息要素不一致<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>需要特殊资质的品类：<\/h4>\n<table>\n<thead>\n<tr>\n<th>品类<\/th>\n<th>资质要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>图书<\/td>\n<td>需扫描ISBN编码发布；经营性卖家需上传出版物经营许可证+营业执照<\/td>\n<\/tr>\n<tr>\n<td>食品<\/td>\n<td>需上传食品经营许可证/预包装食品备案/食品生产许可证/小作坊许可证+营业执照<\/td>\n<\/tr>\n<tr>\n<td>演出门票<\/td>\n<td>需有合法票品销售资质或确认合法票品来源<\/td>\n<\/tr>\n<tr>\n<td>二手车<\/td>\n<td>同一账号发布上限2个链接<\/td>\n<\/tr>\n<tr>\n<td>摩托车整车<\/td>\n<td>同一账号发布上限2个链接<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-83\">15.7 违规扣分与闲气值管控体系<\/h3><p>闲鱼采用&quot;闲气值&quot;体系进行用户信用管理，满分100分，近90天内违规扣分累计。<\/p>\n<h4>闲气值与处罚措施对照：<\/h4>\n<table>\n<thead>\n<tr>\n<th>当前闲气值<\/th>\n<th>对应处理措施<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>81-100分<\/td>\n<td>无任何限制（正常状态）<\/td>\n<\/tr>\n<tr>\n<td>61-80分<\/td>\n<td>下架所有商品、7天内无法发布商品及互动、限制个人主页和帖子展示7天<\/td>\n<\/tr>\n<tr>\n<td>31-60分<\/td>\n<td>下架所有商品、14天内无法发布商品/互动/购买、限制个人主页和帖子展示14天<\/td>\n<\/tr>\n<tr>\n<td>1-30分<\/td>\n<td>删除所有商品、21天内无法发布商品/互动/购买、限制个人主页和帖子展示21天<\/td>\n<\/tr>\n<tr>\n<td>0分<\/td>\n<td>删除所有商品、永久限制发布商品/互动/购买、永久限制个人主页/帖子/评论展示<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>核心违规行为扣分标准（部分摘要）：<\/h4>\n<table>\n<thead>\n<tr>\n<th>违规行为<\/th>\n<th>扣分标准<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>危及交易安全（虚假发货、诱导诈骗等）<\/td>\n<td>视情节扣分（严重 20 分 / 特别严重 100 分），并可通知支付宝管控<\/td>\n<\/tr>\n<tr>\n<td>不当注册（批量注册账号）<\/td>\n<td>每次扣100分<\/td>\n<\/tr>\n<tr>\n<td>不当使用账号（租借/盗取/转让/囤积账号）<\/td>\n<td>每次扣100分<\/td>\n<\/tr>\n<tr>\n<td>出售假冒盗版商品<\/td>\n<td>严重扣20分，特别严重扣100分<\/td>\n<\/tr>\n<tr>\n<td>被权利人投诉售假（同一年内3次及以上）<\/td>\n<td>扣 100 分，且分值不再恢复、永久限制<\/td>\n<\/tr>\n<tr>\n<td>扰乱平台秩序（刷单/刷赞/刷粉/虚假材料）<\/td>\n<td>严重扣40分，特别严重扣100分<\/td>\n<\/tr>\n<tr>\n<td>违背承诺（不履行交易约定/承诺）<\/td>\n<td>每次扣 20 分，特别严重扣 100 分<\/td>\n<\/tr>\n<tr>\n<td>规避准入要求发布商品<\/td>\n<td>严重扣20分，特别严重扣100分<\/td>\n<\/tr>\n<tr>\n<td>引导站外交易（留微信/QQ/外部链接等）<\/td>\n<td>一般扣1分，严重扣20分，特别严重扣100分<\/td>\n<\/tr>\n<tr>\n<td>骚扰他人（恐吓/辱骂/人身攻击）<\/td>\n<td>一般扣1分，严重扣20分，特别严重扣100分<\/td>\n<\/tr>\n<tr>\n<td>发布违禁信息<\/td>\n<td>根据违禁品类分级扣1-100分（详见附表1）<\/td>\n<\/tr>\n<tr>\n<td>描述不当（商品与描述不符）<\/td>\n<td>严重扣20分，特别严重扣100分<\/td>\n<\/tr>\n<tr>\n<td>泄露用户信息<\/td>\n<td>严重扣20分，特别严重扣100分<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>违规关联管控：<\/h4>\n<p>若一个账号因骗取财物、售假等被处以查封/永久限制，闲鱼可对该账号实际控制人名下的其他闲鱼账号一并进行处置（包括下架商品、权限管控、扣分等）。这就是矩阵运营中&quot;连带封号&quot;的官方依据。<\/p>\n<h3 id=\"sec-84\">15.8 交易争议处理规范要点（2026年7月修订）<\/h3><table>\n<thead>\n<tr>\n<th>场景<\/th>\n<th>处理规则<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>争议受理期限<\/td>\n<td>必须在订单确认收货前或超时打款时限内提出，否则不予受理<\/td>\n<\/tr>\n<tr>\n<td>签收后规则<\/td>\n<td>物品签收后，闲鱼不支持无理由退货换货（双方另有约定除外）<\/td>\n<\/tr>\n<tr>\n<td>描述不符（肉眼可识别）<\/td>\n<td>买方提供实物图片/视频举证 → 根据严重程度判定退货退款或仅退款<\/td>\n<\/tr>\n<tr>\n<td>描述不符（肉眼不可识别）<\/td>\n<td>买方需提供质检证据 → 举证有效则退货退款<\/td>\n<\/tr>\n<tr>\n<td>质量问题<\/td>\n<td>退货退款；若致使交易目的不能实现（功能性故障、材质不符等），物品损毁风险由卖方承担<\/td>\n<\/tr>\n<tr>\n<td>表面不一致（破损/少件/空包）<\/td>\n<td>收件人应当场检视并拍照拒签；签收后主张需买方举证<\/td>\n<\/tr>\n<tr>\n<td>定制商品<\/td>\n<td>发货前买方无理由退款需赔偿卖方损失（最高不超过订单金额）；发货后无理由拒签，交易打款卖方<\/td>\n<\/tr>\n<tr>\n<td>生鲜类商品<\/td>\n<td>损坏≤10%退10%、10%-50%退50%、≥50%全额退款<\/td>\n<\/tr>\n<tr>\n<td>虚拟商品<\/td>\n<td>交付数量不足按比例部分退款；无法达到使用目的或交付错误全额退款<\/td>\n<\/tr>\n<tr>\n<td>运费承担<\/td>\n<td>争议责任归买方 → 买方承担退货运费；归卖方 → 卖方承担<\/td>\n<\/tr>\n<tr>\n<td>售假处理<\/td>\n<td>买方基于生活消费所需购买 → 支持退款<\/td>\n<\/tr>\n<tr>\n<td>闲鱼小法庭<\/td>\n<td>部分争议交由闲鱼用户投票表决的判定平台进行判断<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>规则体系全览（29项现行规则）：<\/h4>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>规则名称<\/th>\n<th>最新修订<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>闲鱼社区公约<\/td>\n<td>2024.04.25<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>闲鱼社区信息发布规范<\/td>\n<td>2025.12.18<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>闲鱼社区管理规范（试行）<\/td>\n<td>2024.07.15<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>闲鱼社区交易争议处理规范<\/td>\n<td>2026.07.15<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>闲鱼交易超时说明<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>闲鱼卖方软件服务费收费规则<\/td>\n<td>2026.04.18<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>闲鱼社区保证金管理规范<\/td>\n<td>2025.06.19<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>闲鱼社区七天无理由退货规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>闲鱼社区发货时效承诺服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>闲鱼社区订金交易规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>闲鱼社区租赁交易规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>闲鱼社区租房信息发布规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>闲鱼社区二手房信息发布规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>闲鱼社区宠物活体类纠纷争议处理规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>闲鱼成人用品/情趣用品发布规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>闲鱼鱼小铺工具管理规范<\/td>\n<td>2026.03.05<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>闲鱼社区&quot;无房必赔&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>闲鱼社区&quot;无票必赔&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>闲鱼社区&quot;不满意包退&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>闲鱼社区&quot;不符必赔&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>闲鱼社区&quot;假货包赔&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>闲鱼社区&quot;无法使用包赔&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>闲鱼社区&quot;打坏包赔&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>闲鱼社区&quot;找回包赔&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>闲鱼社区&quot;描述不符全额退&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>闲鱼社区&quot;描述不符包邮退&quot;服务规范<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>闲鱼社区经营性行为界定与管理规范<\/td>\n<td>2026.06.01（新规）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>以上规则均可通过闲鱼APP「我的 → 设置 → 闲鱼公约」查看全文。建议每月1日定期检查规则更新。<\/p>\n<h3 id=\"sec-85\">15.9 互联网平台涉税信息报送规定（2025年新规）<\/h3><blockquote>\n<p>⚠️ <strong>这是影响所有闲鱼卖家的重大新规，请务必仔细阅读。<\/strong><\/p>\n<\/blockquote>\n<p>本节内容整理自官方税务合规问答口径，涉及国务院令第810号及国家税务总局公告2025年第15号。<\/p>\n<h4>15.9.1 政策背景与法规依据<\/h4>\n<table>\n<thead>\n<tr>\n<th>法规文件<\/th>\n<th>发布机构<\/th>\n<th>发布日期<\/th>\n<th>核心要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>《互联网平台企业涉税信息报送规定》<\/td>\n<td>国务院（国务院令第810号）<\/td>\n<td>2025年6月20日<\/td>\n<td>各互联网平台需按规定报送商家身份信息、收入信息<\/td>\n<\/tr>\n<tr>\n<td>《关于互联网平台企业报送涉税信息有关事项的公告》<\/td>\n<td>国家税务总局（公告2025年第15号）<\/td>\n<td>2025年6月26日<\/td>\n<td>明确报送范围、时限和操作细则<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>官方链接：<\/strong><\/p>\n<ul>\n<li>国家税务总局公告原文：<a href=\"https://fgk.chinatax.gov.cn/zcfgk/c100012/c5241477/content.html\">https://fgk.chinatax.gov.cn/zcfgk/c100012/c5241477/content.html<\/a><\/li>\n<li>国务院规定全文：<a href=\"https://www.gov.cn/zhengce/content/202506/content_7029052.htm\">https://www.gov.cn/zhengce/content/202506/content_7029052.htm<\/a><\/li>\n<li>税务在线咨询服务（钉钉税智通）：<a href=\"https://bot.dingtax.cn/bot/newHome/?auth_vendor=wx&amp;access_token=id7ALNEYkUJMQX1JtFSXXGZA\">https://bot.dingtax.cn/bot/newHome/?auth_vendor=wx&amp;access_token=id7ALNEYkUJMQX1JtFSXXGZA<\/a><\/li>\n<li>税务热线：<strong>12366<\/strong>（全国各地税务局统一热线）<\/li>\n<\/ul>\n<h4>15.9.2 核心问题一：闲鱼卖家需要交税吗？<\/h4>\n<p><strong>官方口径：<\/strong> 根据《互联网平台企业涉税信息报送规定》（国务院令第810号）及国家税务总局公告2025年第15号，各互联网平台均需按规定报送商家的身份信息、收入信息等。<\/p>\n<p><strong>常见问题汇总：<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>用户常问<\/th>\n<th>官方回复要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>闲鱼需要交税吗 / 卖东西要交税吗 / 闲鱼卖货收电商税吗<\/td>\n<td>平台需按新规报送涉税信息；具体纳税义务以税法及税务机关判定为准<\/td>\n<\/tr>\n<tr>\n<td>闲鱼销售额多少以上要交税 / 销售额达多少要交税<\/td>\n<td>需按规定报送，纳税门槛请咨询当地税务机关<\/td>\n<\/tr>\n<tr>\n<td>闲鱼收入会报入个人所得税吗 / 新电商税要交个税吗<\/td>\n<td>收入信息会被报送至税务机关，是否缴纳个税由税务机关依法核定<\/td>\n<\/tr>\n<tr>\n<td>平台收入需要交税吗 / 售出产品需要交税吗<\/td>\n<td>同上，平台按规报送，纳税义务按税法执行<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>💡 <strong>关键认知：<\/strong> “报送” ≠ “代扣代缴”。平台只负责把数据报给税务局，<strong>不代表平台直接扣你的税<\/strong>。但数据报送后，税务机关会依据这些信息判断你是否达到纳税门槛。<\/p>\n<\/blockquote>\n<h4>15.9.3 核心问题二：平台会报送哪些数据？什么时候报？<\/h4>\n<p><strong>官方口径：<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>报送事项<\/th>\n<th>时间安排<\/th>\n<th>详细说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>首次报送<\/strong><\/td>\n<td><strong>2025年10月内<\/strong><\/td>\n<td>报送平台内经营者和从业人员的<strong>身份信息<\/strong> + **2025年第三季度（7月-9月）**的收入信息<\/td>\n<\/tr>\n<tr>\n<td><strong>历史豁免<\/strong><\/td>\n<td>2025年7月之前的收入<\/td>\n<td><strong>无需报送<\/strong>（即2025年6月及之前的收入不在本次报送范围）<\/td>\n<\/tr>\n<tr>\n<td><strong>常规报送<\/strong><\/td>\n<td>每季度终了后的次月<\/td>\n<td>即每年 <strong>1月、4月、7月、10月<\/strong> 报送上一季度的收入信息和身份信息<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>常见问题汇总：<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>用户常问<\/th>\n<th>官方回复要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>闲鱼的收入数据会上报税务吗？<\/td>\n<td>是的，按上述时间表报送<\/td>\n<\/tr>\n<tr>\n<td>闲鱼的季度交易数据会上报税务局吗？<\/td>\n<td>是的，每季度报送<\/td>\n<\/tr>\n<tr>\n<td>税务局会让平台上传店铺销售额数据吗？<\/td>\n<td>是的，收入信息属报送范围<\/td>\n<\/tr>\n<tr>\n<td>10月份闲鱼会给税务机关报送交易数据吗？<\/td>\n<td>是的，2025年10月内完成首次报送<\/td>\n<\/tr>\n<tr>\n<td>听说10月电商税，平台也要报送数据吗？<\/td>\n<td>是的，首次报送就在2025年10月<\/td>\n<\/tr>\n<tr>\n<td>闲鱼会报送所有卖家的收入数据吗？<\/td>\n<td>平台内经营者和从业人员均在报送范围<\/td>\n<\/tr>\n<tr>\n<td>个人卖家要报送涉税信息吗？<\/td>\n<td>是的，个人卖家也属于&quot;平台内经营者&quot;范畴<\/td>\n<\/tr>\n<tr>\n<td>我在闲鱼社区的交易情况在哪看？<\/td>\n<td>【闲鱼APP → 我的 → 交易 → 我卖出的】<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>15.9.4 核心问题三：平台报送 = 代扣代缴吗？<\/h4>\n<p><strong>官方口径：《互联网平台企业涉税信息报送规定》要求的是平台向主管税务机关报送商家涉税信息，暂不涉及平台代扣代缴商家应纳税额。<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>问题<\/th>\n<th>回答<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平台报送数据是否涉及到代扣代缴税款？<\/td>\n<td><strong>不涉及<\/strong>。平台仅负责信息报送，不代替税务机关征税<\/td>\n<\/tr>\n<tr>\n<td>怎么进行税务申报？<\/td>\n<td>建议自行查阅政策或咨询当地税务机关12366热线<\/td>\n<\/tr>\n<tr>\n<td>平台会替我交税吗？<\/td>\n<td>不会。纳税义务人仍为卖家本人<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>⚠️ <strong>关键区分：<\/strong> 信息报送 ≠ 代扣代缴。目前闲鱼的角色是&quot;数据传递方&quot;，不是&quot;收税方&quot;。但不排除未来政策调整的可能，需持续关注。<\/p>\n<\/blockquote>\n<h4>15.9.5 卖家实操建议<\/h4>\n<ol>\n<li><strong>自查收入规模<\/strong>：定期在【闲鱼APP → 我的 → 交易 → 我卖出的】中查看累计成交金额，做到心中有数。<\/li>\n<li><strong>关注经营性认定<\/strong>（结合 15.2 节）：一旦被认定为&quot;经营性卖家&quot;，纳税义务更明确，建议提前咨询税务专业人士。<\/li>\n<li><strong>保留交易记录<\/strong>：所有订单、物流、退款记录至少保留3年，以备税务核查。<\/li>\n<li><strong>主动咨询税务机关<\/strong>：如对自身纳税义务有疑问，拨打 <strong>12366<\/strong> 热线或通过钉钉税智通在线咨询，获取权威解答。<\/li>\n<li><strong>区分&quot;个人闲置&quot;与&quot;经营行为&quot;<\/strong>：偶发闲置转让与持续经营售卖在税务处理上可能不同，实际认定以税务机关为准。<\/li>\n<\/ol>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 本章内容提炼自闲鱼官方规则中心（ https://h5.m.goofish.com/wow/moyu/moyu-project/doc/pages/v3Lv4OO6VbJS），涵盖29项现行规则。建议定期对照官方规则中心检查更新。规则中心路径：闲鱼APP → 我的 → 设置 → 闲鱼公约。 15.1 卖方软件服务费收费规则 这是所有闲鱼卖家必须了解的核心规则，直接影响利润核算。 费用类型 收费门槛 费率 计算基数 基础软件服务费 所有成交订单（无门槛） 0.6%（普通卖家单笔封顶 60 元；鱼小铺卖家不封顶） 每笔订单成交额 软件服务费-基础门槛 当月累计成交＞10单 且 累计金额＞10,000元 1%（超出门槛部分） 超出门槛的每笔订单成交额 软件服务费-品类门槛（手机） 当年手机品类累计成交＞6笔 1%（超出门槛部分） 超出门槛的手机品类每笔订单成交额 软件服务费-鱼小铺 开通鱼小铺工具服务的卖方 1%（所有订单） 每笔订单成交额 软件服务费-租赁模式 使用「租赁模式」的商家（2026 年 9 月 20 日 0 点起） 3%（每笔订单成交额） 每笔租赁订单成交额 关键要点： 费率上限：普通卖家同一笔订单最多收取 0.6%（基础）+ 1%（软件服务费）= 1.6%，且 基础服务费单笔封顶 60 元 ； 鱼小铺卖家不享受封顶、费率不设金额上限 （鱼小铺销售手机品类综合费率最高约 2.6%） 计费基数（2026年4月18日起） ：按确认收货时的订单成交额计算， 含运费、平台红包与平台补贴 ——此前按「实际成交额」计，新口径会让服务费明显高于以往，定价时必须计入 基础门槛 vs 品类门槛：同一订单同时满足时，仅按品类门槛收取（不重复收） 鱼小铺卖家：不再享受\"基础门槛\"和\"品类门槛\"的优惠政策，每笔订单都收取1%+0.6% 退款不退费：成交后发生退款，已划扣的软件服务费不做退还 租赁模式费率上调（2026 年 9 月 20 日 0 点起） ：使用「租赁模式」的商家，每笔订单按 成交额的 3% 收取软件服务费（此前按 0.6% 基础费率计）， 订单发生退款时已划扣的服务费不予退还 ；平台已于 2026 年 9 月 4 日发布费率公示。做相机、镜头、乐器、游戏机、摄影器材等租赁类商品的账号，需把 3% 直接计入租金定价与利润核算 扣款方式：由支付服务商从买家支付的订单款项中实时划扣 费率误收个案（2026-10-01 黑猫投诉）：有个人闲置卖家（未开通鱼小铺、年成交仅 1–2 单）反映，一笔 4299 元订单在 0.6% 基础服务费之外被额外按 鱼小铺口径加收 1% （42.99 元），客服无法出示开通凭证。个案提醒：成交后核对账单明细，发现与自身身份不符的扣费及时通过官方渠道申诉留痕；属单一投诉个案，平台是否系统性误判 手机品类统计：从每年1月1日起统计交易成功订单，超出6笔后开始收费 规则生效：2024年9月1日起实施基础软件服务费；2026年4月18日最新修订；2026年9月20日起租赁模式加收 3% 运营启示：对于月销超1万或手机品类活跃卖家，需将1.6%的服务费纳入定价成本核算。鱼小铺卖家需特别注意——一旦开通，每单都收费，小额多单模式成本更高。 15.2 经营性行为界定与管理规范（2026年6月1日生效） 此为新规，标志着闲鱼正式区分\"个人卖家\"和\"经营性卖家\"，对团队矩阵运营影响重大。 经营性卖家认定标准（满足任一即可能被认定）： 认定方式 标准 主动申报 已取得营业执照、许可证等经营资质，或公示自我经营声明 行为判定 使用\"一手货源\"“固定货源”“有售后”“七天无理由退货”“多库存”\"多规格\"等经营性描述，且触及下列量化红线（ 官方表述为「描述层 + 交易层综合判定」，具体是否需全部满足以平台判定为准）：① 在售物品＞30件且品类＜3类② 同一型号频繁售出5次以上③ 年交易≥104笔，每月至少3笔④ 年销售额＞10万元 特殊豁免 收藏品/奢侈品、潮玩/潮鞋/数码/乐器、搬家出清、明星网红闲置等场景，不直接认定为经营行为，综合判定 被认定为经营性卖家后的义务： 依法登记：办理市场主体登记（符合豁免情形除外） 信息登记：如实登记身份、经营地址、联系方式、行政许可等（变更后3个工作日内更新） 定期年检（2026 年 10 月起卖家实测出现）：被判定为经营性的卖家，在发布/编辑商品时可能触发「合规任务」弹窗，须完成 经营者信息年检 ——核对联系信息（手机号验证码 + 省/市/详细经营地址）与身份证主体信息（证件有效期 + 人像面/国徽面照片），提交后约 3 个工作日 审核，通过后恢复发布权限； 逾期未完成核验会限制商品发布与编辑功能 。年检只更新联系地址与主体信息，与「亮照」不是同一事项。依据为《电子商务法》《网络交易监督管理办法》对经营者主体信息定期核验的要求；上述流程为卖家实操分享口径，官方规则原文与年检周期 信息公示：个人主页显著位置公示营业执照（或身份信息）、经营地址、联系方式等 商品信息披露：如实披露品牌、型号、现状、维修记录、瑕疵等 经营者义务：履行\"七日无理由退货\"、质量退换货、售后义务 矩阵运营注意：经营性认定 + 一机一卡一号原则 = 矩阵账号中高销量账号必须合规经营主体化。建议提前为旗舰号准备营业执照，垂直号控制在认定门槛以下。 15.3 保证金管理规范 维度 内容 适用对象 经营性卖家、开通保障服务的二手卖家、部分品类卖家 额度 根据品类和开通服务不同，以页面提示为准。开通七天无理由退货需缴纳500元 划扣场景 交易争议、违规情形、第三方投诉 → 用于退款/赔付买家 补缴时限 余额不足时，72小时内补足，否则下架商品、限制权限 追缴 保证金不足赔付时，平台可垫付后向卖家追缴 退回条件 关闭所有保障服务 + 无进行中交易/退款/投诉/欠费 15.4 七天无理由退货规范 分类 商品类型 说明 不支持 定制类、鲜活易腐类、在线下载/拆封的数字化商品、报纸期刊、服务类、竞拍商品、人体用药 绝对不可退货 卖家可选 激活后价值贬损大的商品（VR头盔等）、黄金、拆封后影响安全健康的（食品/保健品/贴身用品/成人用品）、所有品类非全新商品 卖家自愿开通 必须支持 除以上外的所有品类全新商品（服装、数码、家纺、母婴、宠物用品、图书、珠宝、家具、家电等） 经营性卖家强制开通 关键细节： 七天计算：签收次日零时起算，满168小时（7天） 运费：包邮商品买家承担退货运费；非包邮商品买家承担所有运费 商品完好标准：保持原有品质功能，配件齐全，无受损受污；包装完整（一般变形/污渍不算） 特殊品类：手机类未激活、食品化妆品密封包装未拆封、鞋类防盗扣未剪 经营性卖家：个人主页展示\"商\"标识，发布全新商品强制支持七天无理由 15.5 鱼小铺工具管理规范（2026年3月修订） 维度 要求 开通条件 ① 完成实名+实人认证 ② 同一真实身份最多5个账号开通 ③ 主体须满16周岁 ④ 闲气值＞80分 ⑤ 至少1件在线商品 退出条件 无未完成订单/纠纷 + 关闭所有保障服务 + 无保证金余额及欠费 + 无官方认证标识 + 无进行中活动 退出后再加入 主动退出后满 90 天，方可再次申请加入鱼小铺 退出后果 收回宝贝管理工具（含宝贝数量/库存权益）、粉丝运营工具、运营工作台等所有权益 重要限制：同一身份证最多5个账号开鱼小铺。矩阵运营时需规划好哪些账号开通鱼小铺、哪些保持普通状态。 15.6 信息发布规范：完整禁售/限售清单 以下为官方《闲鱼社区信息发布规范》（2025年12月18日修订）列出的13大类禁售/限售信息。 ⚠️ 2026 年新增的五类专项治理（务必叠加遵守，清单外同样会被处置） ： ① 代订与虚拟资源类 （2026 年 6 月起）：酒店/机票/门票代订、会员代充、不可查询的虚拟服务、互联网用户账号、游戏账号与 CDK、含「学习资料/网盘资源」等暗语的内容——此类需营业执照等经营资质，个人号从事极易被直接封号； ② 公序良俗／恶俗玩梗类 （2026 年 7 月起）：低俗玩梗、擦边暗示、玄学转运话术（如「招财、转运、旺运」）等，平台已批量下架并封禁相关账号； ③ 暗语规避审核 ：以谐音、符号、拆字、图片方式规避检测，属「刻意规避」，从重处罚； ④ 色情引流类 （2026 年 9 月 18 日官方公告，见下）——本类为本年度处置力度最大的一轮治理， 识别即永久封禁，无解封通道 ； ⑤ 学术论文代写类 （2026 年 10 月 10 日官方公告，见下）——涉国家学术诚信与教育公平，属违法违规信息。 以上专项治理均为「清单外同样会被处置」的实时提级口径，实际以平台当期公告为准。 ④ 色情引流专项治理（2026-09-18 官方公告要点） 公告时间与量级 ：2026 年 9 月 18 日闲鱼发布《关于持续严打色情引流的公告》。2026 年 1 月至今累计处置色情引流类风险账号 98358 个 ；警企协同成功打击色情团伙 15 个 ；该次通报为闲鱼 2026 年第 32 项 专项治理通报（此前已覆盖网络水军、网络欺诈、站外引流等）。 三类重点打击场景 ：① 暗号引流站外服务 ——以普通商品名、数字或数字符号相结合的形式伪装为色情暗号，规避审查后通过外部即时通讯平台引导站外；② 伪装色情服务引流站外欺诈 ——以诱饵商品（公告点名「艺术二维码」等形式）引导至第三方平台，以「提供色情服务」为名诱导刷单实施诈骗；③ 网盘链接隐蔽售黄 ——商品页面无违规内容，私信发网盘链接、网盘内再嵌联系方式，导向色情网址与资源。 处置口径 ：识别或查实即 第一时间永久封禁相关账号，并无解封通道 ，同步下架全部关联违规商品；情节严重者涉及刑事犯罪。 三维度治理机制（可用于反推风控查什么） ：① 前置风险监测——持续扩充色情引流类样本库；② 技术识别升级——完善违规拦截词库、优化商品图片低俗内容识别算法；③ 人工巡查——重点针对 借昵称、头像等方式变相引流的隐蔽账号 ，以及 商品信息表述不明的可疑商品 。 举报入口（也可用于自查同类风险） ：商品页右上角「举报」→ 选择「色情导流 / 站外诈骗」，附聊天截图可优先加急核查。 ⚠️ 对正常经营的直接影响 ：本次治理同时抬高了图片审核与昵称 / 头像人工巡查强度。运营需自查——头像与昵称不使用暧昧词汇或暗示性配图、商品配图不使用衣着暴露的女性照片作噱头、不使用「同城可约 / 懂的来 / 私聊详谈」类模糊表述； 2026 年 9 月 21 日已有媒体就平台涉黄产业链线索进行报道 （平台客服回应「对违规行为零容忍」），意味着此类内容的审核与巡查在短期内会进一步收紧。 2026-09-23 官方调查结果（对上述公告的补充与升级） ：闲鱼黑板报发布《关于媒体报道的调查结果》——① 平台已对整个平台多轮自查， 公开展示信息中未查到淫秽信息，更无涉未成年人色情内容 ；② 确认存在个别卖家 在一对一私聊时避开平台监管、发送其他平台二维码 进行引流的情形，平台已处置相关商品与账号，并将涉及的商家、二维码与聊天记录 举报至该站外平台 ，由其跟进监管；③ 平台 已向公安机关报案 ，报道及所涉信息移交公安处理；④ 公开倡议各互联网平台联手建立 「反引流联盟」 ，以技术手段与多平台协同阻断违法引流。 ⚠️ 对运营的直接含义 ： 私聊中发送第三方平台二维码已被明确列为可识别、可处置的引流动作 ，且平台会跨平台追责——不要抱「站内表述干净、站外交割」的侥幸。需要给联系方式时只走官方【发送站外信息】通道（见 7.4.3 ② 与 12.4）。 📌 若发现有人借用你的商品或圈子内容作色情暗号载体，优先下架并举报，避免被系统关联降权。 ⑤ 学术论文代写专项治理（2026-10-10 官方公告要点） 公告时间与量级 ：2026 年 10 月 10 日闲鱼黑板报发布《治理公告（第十二期）》。平台对社区内「学术论文代写」等违法违规信息开展重点整治， 2026 年 9 月 1 日至 9 月 30 日共下架处置违规提供学术论文代写服务商品 636 件 。 打击范围（含变相形式） ：公告明确包括但不限于——① 提供学术论文代写服务 ；② 售卖学术论文代写工具 ；以及同类「论文服务」包装下的变相违规行为（如以「论文辅导 / 润色 / 查重降重 / 数据代跑」等名义实质承接代写）。 定性依据 ：该行为违反国家有关 学术诚信、教育公平及网络信息管理 的法律法规，破坏学术秩序与社会诚信。对应 15.6 禁售清单 第七类「非法服务与票证」 中「作弊工具 / 服务」的执行细化。 处置手段 ：下架违规商品 + 处罚相关账号（与色情引流类的「永久封禁、无解封」不同，本类目前公告口径为下架 + 处罚，情节严重者同样会触发账号级处置）。 ⚠️ 对运营的直接含义 ：本类与第十二章合规线强相关——「论文 / 代写 / 代做 / 作业」等词早已列入 12.3「2026 年新增高危暗语」 ，本次官方整治表明其已从「关键词监测」升级为「主动整治 + 商品下架」。团队若涉教育、资料、知识服务类商品，须彻底剔除代写与变相代写表述，改为合法的辅导陪练、资料整理、技能培训等可交付服务形态。 类别 核心禁售内容 一、枪支弹药危险武器 枪支及配件、军火、管制刀具/弩/飞镖、军警标志/服装/器具、行政机关标志/制服 二、易燃易爆危险化学品 炸弹、火药、毒品及制毒原料、致瘾性药物、吸毒工具、烟花爆竹、腐蚀性/有毒化学品、放射性物质 三、危害国家安全信息 分裂国家、泄露国家机密、宣扬反动/邪教、损害国家名誉等 四、色情低俗催情用品 色情音像/视频/游戏/软件/图文、色情网站、色情低俗服务、原味、 额数据吗？ 是的，收入信息属报送范围 10月份闲鱼会给税务机关报送交易数据吗？ 是的，2025年10月内完成首次报送 听说10月电商税，平台也要报送数据吗？ 是的，首次报送就在2025年10月 闲鱼会报送所有卖家的收入数据吗？ 平台内经营者和从业人员均在报送范围 个人卖家要报送涉税信息吗？ 是的，个人卖家也属于\"平台内经营者\"范畴 我在闲鱼社区的交易情况在哪看？ 【闲鱼APP → 我的 → 交易 → 我卖出的】 15.9.4 核心问题三：平台报送 = 代扣代缴吗？ 官方口径：《互联网平台企业涉税信息报送规定》要求的是平台向主管税务机关报送商家涉税信息，暂不涉及平台代扣代缴商家应纳税额。 问题 回答 平台报送数据是否涉及到代扣代缴税款？ 不涉及 。平台仅负责信息报送，不代替税务机关征税 怎么进行税务申报？ 建议自行查阅政策或咨询当地税务机关12366热线 平台会替我交税吗？ 不会。纳税义务人仍为卖家本人 ⚠️ 关键区分： 信息报送 ≠ 代扣代缴。目前闲鱼的角色是\"数据传递方\"，不是\"收税方\"。但不排除未来政策调整的可能，需持续关注。 15.9.5 卖家实操建议 自查收入规模 ：定期在【闲鱼APP → 我的 → 交易 → 我卖出的】中查看累计成交金额，做到心中有数。 关注经营性认定 （结合 15.2 节）：一旦被认定为\"经营性卖家\"，纳税义务更明确，建议提前咨询税务专业人士。 保留交易记录 ：所有订单、物流、退款记录至少保留3年，以备税务核查。 主动咨询税务机关 ：如对自身纳税义务有疑问，拨打 12366 热线或通过钉钉税智通在线咨询，获取权威解答。 区分\"个人闲置\"与\"经营行为\" ：偶发闲置转让与持续经营售卖在税务处理上可能不同，实际认定以税务机关为准。","toc":[{"id":"sec-77","title":"15.1 卖方软件服务费收费规则"},{"id":"sec-78","title":"15.2 经营性行为界定与管理规范（2026年6月1日生效）"},{"id":"sec-79","title":"15.3 保证金管理规范"},{"id":"sec-80","title":"15.4 七天无理由退货规范"},{"id":"sec-81","title":"15.5 鱼小铺工具管理规范（2026年3月修订）"},{"id":"sec-82","title":"15.6 信息发布规范：完整禁售/限售清单"},{"id":"sec-83","title":"15.7 违规扣分与闲气值管控体系"},{"id":"sec-84","title":"15.8 交易争议处理规范要点（2026年7月修订）"},{"id":"sec-85","title":"15.9 互联网平台涉税信息报送规定（2025年新规）"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":16,"imgs":0,"words":10458,"sections":10,"subs":16,"version":"V2026.10.12"},"related":["sec-2","sec-11","sec-23","sec-62"]}]}],"stats":{"modules":6,"sections":21,"items":70,"articles":55,"chapters":15,"tables":98,"imgs":160,"words":116676}};

const S = { view:'home', module:null, section:null, item:null, q:'' };
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 搜索 ---------- */
function match(it){
  if(!S.q) return true;
  const q = S.q.toLowerCase();
  return it.title.toLowerCase().includes(q) || (it.text||'').toLowerCase().includes(q);
}
function visible(){
  return ORDER.map(id=>ITEMS[id]).filter(it =>
    (!S.module || it.module===S.module) && match(it));
}
function sectionsOf(modName){
  return DATA.sections.filter(s => !modName || s.module===modName);
}

/* ---------- 侧栏 ---------- */
function renderSide(){
  let h = '';
  const mods = S.module ? MODULES.filter(m=>m.name===S.module) : MODULES;
  mods.forEach(m=>{
    const secs = DATA.sections.filter(s=>s.module===m.name);
    const tot = secs.reduce((a,s)=>a+s.items.filter(match).length,0);
    const on = S.module===m.name;
    h += `<div class="mod-h ${on?'on':''}" onclick="goModule('${esc(m.name)}')">
      <span class="dot" style="background:${MODCOLOR[m.color]}"></span>${esc(m.name)}
      <span class="n">${tot}</span></div>`;
    if(on){
      secs.forEach(s=>{
        const its = s.items.filter(match);
        const so = S.section===s.section;
        h += `<div class="sec-h ${so?'on':''}" onclick="goSection('${esc(s.module)}','${esc(s.section)}')">
          <span class="dot"></span>${esc(s.section)}<span class="n">${its.length}${S.q?`/${s.items.length}`:''}</span></div>`;
        h += `<ul class="plist">`;
        its.forEach((it,i)=>{
          h += `<li data-id="${it.id}" class="${S.item===it.id?'on':''}" onclick="openItem('${it.id}')">
            <span class="no">${String(i+1).padStart(2,'0')}</span>
            <span class="tx">${hl(it.title)}</span>
            ${it.kind==='chapter'?'<span class="tag">章</span>':''}</li>`;
        });
        if(!its.length) h += `<li style="color:var(--muted);cursor:default">无匹配条目</li>`;
        h += `</ul>`;
      });
    }else{
      h += `<ul class="plist">`;
      secs.forEach(s=>{
        h += `<li onclick="goSection('${esc(s.module)}','${esc(s.section)}')" style="align-items:center">
          <span class="tx" style="color:var(--muted);font-size:13px">${esc(s.section)}</span>
          <span class="no">${s.items.filter(match).length}</span></li>`;
      });
      h += `</ul>`;
    }
  });
  $('#sideBody').innerHTML = h || `<div class="empty">没有匹配的内容<br>换个关键词试试</div>`;
  const v = visible().length;
  $('#sideFoot').textContent = S.q ? `匹配 ${v} / ${ORDER.length} 条` : `共 ${ORDER.length} 条`;
  $('#sideTitle').textContent = S.module || '全部模块';
  $('#sideHint').textContent = S.q ? `关键词「${S.q}」的检索结果` : '点击板块查看条目';
  scrollSideTo(S.item);
}
function scrollSideTo(id){
  if(!id) return;
  const box = $('#sideBody');
  const el = box.querySelector(`li[data-id="${id}"]`);
  if(el){ box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight/2 + el.offsetHeight/2); return; }
  const it = ITEMS[id]; if(!it) return;
  const hit = [...box.querySelectorAll('.sec-h')].find(x=>x.textContent.includes(it.section));
  if(hit) box.scrollTop = Math.max(0, hit.offsetTop - 40);
}
function hl(t){
  if(!S.q) return esc(t);
  const i = t.toLowerCase().indexOf(S.q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+S.q.length))+'</mark>'+esc(t.slice(i+S.q.length));
}

/* ---------- 主区渲染 ---------- */
function renderMain(){
  const main = $('#main');
  if(S.view==='home') main.innerHTML = renderHome();
  else if(S.view==='module') main.innerHTML = renderModule();
  else if(S.view==='section') main.innerHTML = renderSection();
  else if(S.view==='index') main.innerHTML = renderIndex();
  else main.innerHTML = renderItem();
  if(S.view==='item') bindBody();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* 首页门户 */
