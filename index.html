<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授渔未来 · 闲鱼运营知识库｜开店·选品·流量·合规·售后全流程</title>
<meta name="description" content="授渔未来闲鱼运营知识库：6 大知识模块、21 个类目板块、70 篇内容，系统覆盖开店入驻、商品运营、流量增长、合规风控、交易售后与经营提效。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF5000'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3E授%3C/text%3E%3C/svg%3E">
<style>
:root{
  --brand:#FF5000; --brand-d:#D93F00; --brand-l:#FFF1EA; --brand-2:#FFE600;
  --blue:#1B8FE1; --blue-l:#EAF5FE;
  --ink:#14171C; --ink2:#39404A; --muted:#8B929D; --line:#E7E9EE; --line2:#F0F2F5;
  --bg:#F3F4F7; --card:#fff; --soft:#FAFBFC;
  --shadow:0 1px 2px rgba(16,20,28,.05),0 8px 28px rgba(16,20,28,.06);
  --radius:14px;
  --fs:16px;          /* 正文字号，可调 */
  --fs-lh:1.95;       /* 行高 */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
}
a{color:var(--brand-d);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
mark{background:#FFE9A8;color:inherit;padding:0 2px;border-radius:3px}

/* ========== 顶栏 ========== */
.top{position:sticky;top:0;z-index:60;background:linear-gradient(118deg,#101419 0%,#1D2430 48%,#3A2A1C 100%);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06),0 6px 24px rgba(10,12,16,.2)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--brand) 0%,var(--brand-2) 48%,var(--brand) 100%)}
.top-inner{max-width:1620px;margin:0 auto;padding:0 32px}
.brandrow{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:11px;flex-shrink:0}
.logo-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand) 0%,#FF8A00 100%);font-size:20px;font-weight:800;letter-spacing:-1px;color:#fff;box-shadow:0 4px 14px rgba(255,80,0,.4)}
.logo-txt b{display:block;font-size:17px;font-weight:700;letter-spacing:.5px;line-height:1.25}
.logo-txt span{display:block;font-size:10.5px;color:#9AA2AF;letter-spacing:1.4px;text-transform:uppercase}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;height:38px;border-radius:19px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;padding:0 40px;font-size:14px;outline:none;transition:.2s}
.search input::placeholder{color:#8B929D}
.search input:focus{border-color:var(--brand);background:rgba(255,255,255,.12);box-shadow:0 0 0 3px rgba(255,80,0,.18)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8B929D;font-size:15px;pointer-events:none}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:#7D848F;border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:1px 6px;pointer-events:none}
.stats{display:flex;gap:22px;flex-shrink:0}
.stat{text-align:right}
.stat b{display:block;font-size:17px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:#9AA2AF;letter-spacing:.4px}
.stat b em{font-style:normal;color:var(--brand-2)}
.tabs{display:flex;gap:2px;height:46px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;height:46px;padding:0 20px;font-size:14.5px;color:#A8AFBA;border-radius:9px 9px 0 0;transition:.18s;white-space:nowrap}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
.tabs button.on{color:#fff;background:rgba(255,255,255,.1);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:2.5px;background:var(--brand);border-radius:2px 2px 0 0}
.tabs .cnt{font-size:11px;opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.prog{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand-2),var(--brand));width:0;z-index:2;transition:width .1s linear}

/* ========== 布局 ========== */
.wrap{max-width:1620px;margin:0 auto;padding:22px 32px 60px;display:grid;grid-template-columns:314px minmax(0,1fr);gap:22px;align-items:start}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(20,23,28,.045)}

/* ========== 侧栏 ========== */
.side{position:sticky;top:132px;max-height:calc(100vh - 154px);display:flex;flex-direction:column;overflow:hidden}
.side-h{padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.side-h h3{font-size:11.5px;letter-spacing:1.6px;color:var(--muted);font-weight:700;text-transform:uppercase}
.side-h .hint{font-size:12px;color:var(--muted);margin-top:5px}
.side-scroll{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:#D4D8DE transparent}
.side-scroll::-webkit-scrollbar{width:6px}
.side-scroll::-webkit-scrollbar-thumb{background:#D4D8DE;border-radius:3px}
.side-scroll::-webkit-scrollbar-track{background:transparent}
.mod-h{display:flex;align-items:center;gap:8px;padding:12px 16px 7px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.mod-h .dot{width:7px;height:7px;border-radius:2px;background:var(--brand);flex-shrink:0}
.mod-h .dot.b{background:var(--blue)}
.mod-h .dot.g{background:#12A150}
.mod-h .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500;background:var(--bg);padding:1px 7px;border-radius:9px}
.sec-h{display:flex;align-items:center;gap:7px;padding:6px 16px 5px 22px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:7px;transition:.14s}
.sec-h:hover{background:var(--soft);color:var(--brand-d)}
.sec-h .dot{width:5px;height:5px;border-radius:50%;background:#C9CED6;flex-shrink:0}
.sec-h.on{color:var(--brand-d)}
.sec-h.on .dot{background:var(--brand)}
.sec-h .n{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg);padding:0 7px;border-radius:9px;font-variant-numeric:tabular-nums}
.plist{list-style:none;padding:0 10px 8px 22px}
.plist li{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--ink2);cursor:pointer;transition:.14s;line-height:1.55}
.plist li:hover{background:var(--bg);color:var(--ink)}
.plist li.on{background:linear-gradient(90deg,rgba(255,80,0,.11),rgba(255,80,0,.02));color:var(--brand-d);font-weight:600}
.plist li .tx{flex:1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plist li .no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;flex-shrink:0}
.plist li.on .no{color:var(--brand)}
.plist li .tag{font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--blue-l);color:var(--blue);flex-shrink:0;margin-top:3px}
.side-f{padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.side-f a{color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}
.mobtn{display:none}
.mask{display:none}

/* ========== 主区 ========== */
.main{min-width:0}
.hero{border-radius:var(--radius);padding:28px 32px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,#171C25 0%,#232B39 52%,#4A3220 100%)}
.hero::before{content:"";position:absolute;right:-60px;top:-70px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,0,.17),transparent 70%)}
.hero::after{content:"";position:absolute;right:130px;bottom:-110px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,80,0,.26),transparent 70%)}
.hero h1{font-size:26px;font-weight:750;letter-spacing:.5px;position:relative;z-index:1;line-height:1.4}
.hero h1 em{font-style:normal;color:var(--brand-2)}
.hero p{margin-top:10px;font-size:13.5px;color:#AEB6C2;max-width:780px;position:relative;z-index:1;line-height:1.9}
.hero-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px;position:relative;z-index:1}
.hero-tags span{font-size:11.5px;padding:3.5px 11px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:#D5DAE2}
.mod-hero{margin-bottom:18px;border-radius:var(--radius);padding:22px 26px;color:#fff;position:relative;overflow:hidden}
.mod-hero.m1{background:linear-gradient(115deg,#241812 0%,#3A2418 55%,#5A3418 100%)}
.mod-hero.m2{background:linear-gradient(115deg,#131C26 0%,#1C3040 55%,#1F4756 100%)}
.mod-hero.m3{background:linear-gradient(115deg,#161C28 0%,#262D42 55%,#3B2F52 100%)}
.mod-hero h2{font-size:22px;font-weight:700;position:relative;z-index:1;letter-spacing:.4px}
.mod-hero p{margin-top:8px;font-size:13px;color:rgba(255,255,255,.72);position:relative;z-index:1;max-width:760px;line-height:1.85}
.mod-hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative;z-index:1}
.mod-hero .chips span{font-size:11.5px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13)}

.bar{display:flex;align-items:center;gap:12px;padding:14px 20px;margin-bottom:14px;flex-wrap:wrap}
.bar .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);color:var(--ink2);background:#fff;transition:.16s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand-d);background:#FFF6F2}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}

.tbl-wrap{overflow-x:auto}
table.dir{width:100%;border-collapse:collapse;font-size:13.5px}
table.dir th{text-align:left;padding:11px 14px;background:var(--soft);color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dir td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
table.dir tbody tr:hover td{background:#FFFCFA}
table.dir .cnt{text-align:center;font-variant-numeric:tabular-nums;color:var(--brand-d);font-weight:600}
table.dir a.lnk{color:var(--ink2);display:block;padding:3px 0}
table.dir a.lnk:hover{color:var(--brand-d)}
table.dir .dt{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
table.dir .badge{font-size:10.5px;padding:1.5px 7px;border-radius:5px;white-space:nowrap}
table.dir .badge.ch{background:#EDEAF7;color:#6B4FC7}
table.dir .badge.ar{background:var(--brand-l);color:var(--brand-d)}

/* ========== 阅读页 ========== */
.reader{overflow:hidden}
.rd-head{padding:30px 38px 22px;border-bottom:1px solid var(--line)}
.crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--brand-d)}
.crumb .sep{opacity:.45}
.crumb .cur{color:var(--brand-d);font-weight:600}
.rd-head h1{font-size:25px;font-weight:700;margin:0 0 14px;line-height:1.5;letter-spacing:.2px}
.rd-meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:4px 11px;border-radius:7px;background:var(--bg);color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.chip.hot{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.chip.blue{background:var(--blue-l);color:var(--blue)}
.chip.grn{background:#E8F8EE;color:#0A8A4F}

/* 页内导航 */
.tocbox{padding:16px 38px;border-bottom:1px solid var(--line);background:var(--soft)}
.tocbox .tl{font-size:11.5px;letter-spacing:1.3px;color:var(--muted);font-weight:700;margin-bottom:10px;text-transform:uppercase}
.tocchips{display:flex;flex-wrap:wrap;gap:7px}
.tocchips a{font-size:12.5px;padding:5px 12px;border-radius:7px;background:#fff;border:1px solid var(--line);color:var(--ink2);transition:.15s;line-height:1.5}
.tocchips a:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-l);text-decoration:none}
.tocchips a.cur{border-color:var(--brand);background:var(--brand);color:#fff}

/* 正文 */
.rd-body{padding:30px 38px 36px;font-size:var(--fs);line-height:var(--fs-lh);color:var(--ink2);word-wrap:break-word;max-width:100%}
.rd-body>*:first-child{margin-top:0}
.rd-body p{margin:0 0 15px}
.rd-body strong{color:var(--ink);font-weight:650}
.rd-body h2{font-size:20px;color:var(--ink);margin:34px 0 16px;padding:9px 0 9px 14px;border-left:5px solid var(--brand);background:linear-gradient(90deg,var(--brand-l),transparent);font-weight:700;line-height:1.5;scroll-margin-top:140px}
.rd-body h3{font-size:17.5px;color:var(--ink);margin:30px 0 13px;padding-bottom:7px;border-bottom:1px dashed var(--line);font-weight:700;line-height:1.5;scroll-margin-top:140px}
.rd-body h4{font-size:15.5px;color:var(--ink);margin:22px 0 9px;font-weight:700;line-height:1.6}
.rd-body ul,.rd-body ol{margin:0 0 16px;padding-left:26px}
.rd-body li{margin:7px 0}
.rd-body li::marker{color:var(--brand)}
.rd-body img{max-width:100%;border-radius:10px;margin:8px auto 18px;display:block;border:1px solid var(--line);cursor:zoom-in;background:#FAFAFB;box-shadow:0 2px 10px rgba(16,20,28,.05);transition:.25s}
.rd-body img:hover{box-shadow:0 6px 22px rgba(16,20,28,.13);transform:translateY(-1px)}
.rd-body a{border-bottom:1px solid rgba(217,63,0,.32);font-weight:500}
.rd-body strong.risk{background:#FFEBE3;color:#C2340B;padding:1px 6px;border-radius:4px;font-weight:700}
.rd-body span.tbd{background:#FFF6D9;color:#8A6300;padding:1px 6px;border-radius:4px;font-weight:600;font-size:.92em}

/* 表格 */
.tbl-scroll{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--line);border-radius:11px;background:#fff;-webkit-overflow-scrolling:touch}
.rd-body table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.7}
.rd-body thead th{background:linear-gradient(180deg,#FF6A26,#FF5000);color:#fff;font-weight:600;padding:11px 13px;text-align:left;border-right:1px solid rgba(255,255,255,.16);white-space:nowrap;font-size:13.5px}
.rd-body thead th:last-child{border-right:none}
.rd-body td{padding:10px 13px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);vertical-align:top;color:var(--ink2)}
.rd-body td:last-child{border-right:none}
.rd-body tbody tr:last-child td{border-bottom:none}
.rd-body tbody tr:nth-child(even) td{background:#FAFAFC}
.rd-body tbody tr:hover td{background:#FFF7F2}
.rd-body table strong{color:var(--ink)}

/* 引用 */
.rd-body blockquote{margin:18px 0;padding:14px 18px;border-left:4px solid var(--brand-2);background:#FFFDF4;color:var(--ink2);border-radius:0 10px 10px 0;font-size:.97em}
.rd-body blockquote p{margin:0 0 8px}
.rd-body blockquote p:last-child{margin:0}

/* 详情折叠 */
.rd-body details{margin:16px 0;border:1px solid var(--line);border-radius:11px;background:var(--soft);overflow:hidden}
.rd-body details summary{padding:12px 18px;cursor:pointer;font-weight:650;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px;font-size:14.5px}
.rd-body details summary::-webkit-details-marker{display:none}
.rd-body details summary::before{content:"▸";color:var(--brand);transition:.2s;display:inline-block}
.rd-body details[open] summary::before{transform:rotate(90deg)}
.rd-body details .changelog-body{padding:0 18px 16px;font-size:14px}

/* 关联阅读 */
.relbox{padding:20px 38px;border-top:1px solid var(--line);background:var(--soft)}
.relbox .tl{font-size:11.5px;letter-spacing:1.3px;color:var(--muted);font-weight:700;margin-bottom:12px;text-transform:uppercase}
.relgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.relcard{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;transition:.16s;cursor:pointer}
.relcard:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px);text-decoration:none}
.relcard .m{font-size:10.5px;color:var(--blue);font-weight:600;letter-spacing:.3px}
.relcard .t{font-size:13.5px;color:var(--ink);margin-top:4px;line-height:1.55;font-weight:500}
.relcard:hover .t{color:var(--brand-d)}

/* 导航条 */
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 38px 26px}
.nav2 .nb{padding:14px 17px;border-radius:11px;border:1px solid var(--line);background:#fff;transition:.16s;cursor:pointer;text-align:left;min-width:0}
.nav2 .nb:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.nav2 .nb small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.nav2 .nb span{font-size:13.5px;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav2 .nb.dis{opacity:.42;pointer-events:none}
.rd-foot{padding:16px 38px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--soft)}
.rd-foot .grow{flex:1}
.rd-foot .fsadj{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.rd-foot .fsadj button{padding:6px 11px;font-size:12.5px;color:var(--ink2)}
.rd-foot .fsadj button:hover{background:var(--brand-l);color:var(--brand-d)}
.rd-foot .fsadj span{padding:0 4px;font-size:11px;color:var(--muted);border-left:1px solid var(--line);border-right:1px solid var(--line)}

.blank{padding:96px 30px;text-align:center;color:var(--muted)}
.blank .ic{font-size:46px;opacity:.32}
.blank h3{font-size:17px;color:var(--ink2);margin:16px 0 8px;font-weight:600}
.blank p{font-size:13.5px;max-width:430px;margin:0 auto;line-height:1.9}

.lb{position:fixed;inset:0;background:rgba(10,12,16,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:34px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .x{position:absolute;top:18px;right:24px;color:#fff;font-size:32px;line-height:1;opacity:.75}
.lb .x:hover{opacity:1}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:#14171C;color:#fff;font-size:13.5px;padding:11px 22px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.28s;z-index:300}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer.ft{max-width:1620px;margin:0 auto;padding:26px 32px 42px;color:var(--muted);font-size:12.5px;text-align:center;line-height:2}

@media (max-width:1180px){
  .wrap{grid-template-columns:1fr;padding:18px}
  .stats{display:none}
  .mobtn{
    display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
    padding:9px 16px;border-radius:10px;background:#fff;border:1px solid var(--line);
    font-size:13.5px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow);
  }
  .mobtn:hover{border-color:var(--brand);color:var(--brand-d)}
  .mask{display:none;position:fixed;inset:0;background:rgba(12,14,18,.42);z-index:80}
  .mask.on{display:block}
  .side{
    display:none;position:fixed;left:0;top:0;bottom:0;width:300px;max-width:86vw;z-index:90;
    border-radius:0 16px 16px 0;max-height:none;box-shadow:0 0 40px rgba(0,0,0,.2);

/td>\n<\/tr>\n<tr>\n<td>平台定位演变<\/td>\n<td>C2C → C2C+C2B+B2C<\/td>\n<td>闲鱼奥莱上线，品牌商家加速入驻<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-4\">1.2 闲鱼平台三大核心逻辑<\/h3><p>理解平台底层逻辑，是一切运营动作的出发点。<\/p>\n<table>\n<thead>\n<tr>\n<th>逻辑层<\/th>\n<th>核心原理<\/th>\n<th>运营启示<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>信任经济<\/td>\n<td>闲鱼是&quot;人&quot;的社区，不是&quot;货&quot;的货架。买卖基于信用体系（芝麻分、闲气值、评价）。<\/td>\n<td>先做人设，再卖货；信用分即流量权重。<\/td>\n<\/tr>\n<tr>\n<td>社交分发<\/td>\n<td>商品曝光依赖用户互动（点赞、评论、关注、超赞）。互动越多，推荐流量越大。<\/td>\n<td>把互动率作为核心KPI，比曝光量更重要。<\/td>\n<\/tr>\n<tr>\n<td>兴趣匹配<\/td>\n<td>算法基于用户兴趣标签分发商品，而非纯关键词搜索。<\/td>\n<td>标签精准 &gt; 标题堆砌；社区发帖养标签。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-5\">1.3 闲鱼 vs 传统电商平台差异<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>闲鱼<\/th>\n<th>淘宝/天猫<\/th>\n<th>拼多多<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>开店门槛<\/td>\n<td>零门槛 支付宝认证即可<\/td>\n<td>需营业执照/保证金<\/td>\n<td>需保证金<\/td>\n<\/tr>\n<tr>\n<td>流量成本<\/td>\n<td>低（自然流量为主）<\/td>\n<td>高（直通车/钻展）<\/td>\n<td>中等<\/td>\n<\/tr>\n<tr>\n<td>用户心智<\/td>\n<td>淘二手/捡漏/性价比<\/td>\n<td>品牌正品/新货<\/td>\n<td>低价/拼团<\/td>\n<\/tr>\n<tr>\n<td>内容属性<\/td>\n<td>强社区（会玩/鱼塘）<\/td>\n<td>弱<\/td>\n<td>弱<\/td>\n<\/tr>\n<tr>\n<td>复购逻辑<\/td>\n<td>关注+粉丝关系链<\/td>\n<td>搜索+推荐<\/td>\n<td>推荐+游戏化<\/td>\n<\/tr>\n<tr>\n<td>免费流量<\/td>\n<td>低门槛 托管无忧卖鱼小铺L3以上 闲鱼值得买<\/td>\n<td>亿级流量扶持官方推荐扶持<\/td>\n<td>托管+推荐<\/td>\n<\/tr>\n<tr>\n<td>付费推广<\/td>\n<td>超级擦亮（CPM竞价）线索通（例子线索）黄金首位（首屏曝光）<\/td>\n<td>直通车/引力魔方<\/td>\n<td>多多搜索/全站推广<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 1.1 闲鱼平台核心数据（截至2026年中） 指标 数据 运营意义 注册用户 超 6 亿 用户池大，流量红利仍在 月活跃用户（MAU） 约 2.17 亿 高频使用，适合长期经营 95后 / 00后占比 95后 43% / 00后 22%（合计超六成） 年轻用户主导，内容/社区化运营关键 日均发布商品 超 400 万件 竞争激烈，SEO优化是基础能力 平台定位演变 C2C → C2C+C2B+B2C 闲鱼奥莱上线，品牌商家加速入驻 1.2 闲鱼平台三大核心逻辑 理解平台底层逻辑，是一切运营动作的出发点。 逻辑层 核心原理 运营启示 信任经济 闲鱼是\"人\"的社区，不是\"货\"的货架。买卖基于信用体系（芝麻分、闲气值、评价）。 先做人设，再卖货；信用分即流量权重。 社交分发 商品曝光依赖用户互动（点赞、评论、关注、超赞）。互动越多，推荐流量越大。 把互动率作为核心KPI，比曝光量更重要。 兴趣匹配 算法基于用户兴趣标签分发商品，而非纯关键词搜索。 标签精准 > 标题堆砌；社区发帖养标签。 1.3 闲鱼 vs 传统电商平台差异 维度 闲鱼 淘宝/天猫 拼多多 开店门槛 零门槛 支付宝认证即可 需营业执照/保证金 需保证金 流量成本 低（自然流量为主） 高（直通车/钻展） 中等 用户心智 淘二手/捡漏/性价比 品牌正品/新货 低价/拼团 内容属性 强社区（会玩/鱼塘） 弱 弱 复购逻辑 关注+粉丝关系链 搜索+推荐 推荐+游戏化 免费流量 低门槛 托管无忧卖鱼小铺L3以上 闲鱼值得买 亿级流量扶持官方推荐扶持 托管+推荐 付费推广 超级擦亮（CPM竞价）线索通（例子线索）黄金首位（首屏曝光） 直通车/引力魔方 多多搜索/全站推广","toc":[{"id":"sec-3","title":"1.1 闲鱼平台核心数据（截至2026年中）"},{"id":"sec-4","title":"1.2 闲鱼平台三大核心逻辑"},{"id":"sec-5","title":"1.3 闲鱼 vs 传统电商平台差异"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":3,"imgs":0,"words":809,"sections":3,"subs":0,"version":"V2026.10.12"},"related":["sec-30","a498458897921413","sec-86","sec-23"]},{"id":"sec-6","kind":"chapter","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"平台认知与账号搭建","title":"第二章 账号注册与基础搭建","title_raw":"第二章 账号注册与基础搭建","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-7\">2.1 注册流程（标准操作）<\/h3><ol>\n<li>下载闲鱼APP：通过官方应用商店下载，勿用第三方修改版。<\/li>\n<li>注册/登录：使用手机号注册淘宝账号 → 自动关联支付宝。已有淘宝/支付宝账号可直接登录。<\/li>\n<li>绑定支付宝：进入「我的」→「设置」→「支付设置」→ 绑定已实名认证的支付宝账号。<\/li>\n<li>设置头像和昵称：头像用真实/半真实照片（增加信任感），昵称简洁易记，建议与经营类目相关。<\/li>\n<li>完善个人资料：填写个人简介、所在城市、性别等基础信息。简介中可自然嵌入经营方向。\n一个身份证可实名认证 3个支付宝账号，对应可开 3个闲鱼账号。但需配合3个不同手机号，且遵守&quot;一机一卡一号&quot;原则。<\/li>\n<\/ol>\n<h3 id=\"sec-8\">2.2 实名认证<\/h3><table>\n<thead>\n<tr>\n<th>认证类型<\/th>\n<th>要求<\/th>\n<th>路径<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>基础实名<\/td>\n<td>身份证 + 人脸识别<\/td>\n<td>我的 → 设置 → 账号与安全 → 实名认证<\/td>\n<\/tr>\n<tr>\n<td>支付宝实名<\/td>\n<td>需与闲鱼账号绑定的支付宝已完成实名<\/td>\n<td>支付宝APP → 我的 → 设置 → 账号与安全<\/td>\n<\/tr>\n<tr>\n<td>企业蓝V认证<\/td>\n<td>营业执照 + 法人身份信息<\/td>\n<td>需通过官方渠道提交<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>建议优先完成支付宝高级实名认证（绑定银行卡），可提升账号权重和交易额度。<\/p>\n<h3 id=\"sec-9\">2.3 芝麻信用分与闲气值<\/h3><table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th>满分<\/th>\n<th>合格线<\/th>\n<th>影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>芝麻信用分<\/td>\n<td>950<\/td>\n<td>≥ 650（优秀≥700）<\/td>\n<td>影响商品排名权重、买家信任度、超级擦亮投放资格<\/td>\n<\/tr>\n<tr>\n<td>闲气值<\/td>\n<td>100<\/td>\n<td>≥ 80（鱼小铺门槛）<\/td>\n<td>低于80无法开通鱼小铺；低于60限制发布商品<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>提升芝麻信用分：完善学历/职业信息、按时还花呗/借呗、多使用支付宝线下支付、保持稳定收货地址。<\/p>\n<h3 id=\"sec-10\">2.4 认证招商与经营资质上传<\/h3><p>「认证招商」是闲鱼为经营性卖家提供的资质认证入口。完成经营资质上传后，账号将获得企业/个体工商户标识，解锁更多经营工具和流量权益。对于月流水超5万或经营品牌商品的卖家，建议尽早完成认证。<\/p>\n<h4>2.4.1 认证招商入口位置<\/h4>\n<p>进入路径：闲鱼APP → 我的 → 认证招商（或 设置 → 认证招商）<\/p>\n<p>在「认证招商」页面中，可以看到以下模块：<\/p>\n<ul>\n<li>经营资质 — 上传营业执照，完成企业/个体户认证<\/li>\n<li>品牌资质 — 品牌授权书上传（经营品牌商品时需要）<\/li>\n<li>行业资质 — 特定行业许可（如食品经营许可证等）<\/li>\n<\/ul>\n<h4>2.4.2 经营资质类型与所需材料<\/h4>\n<table>\n<thead>\n<tr>\n<th>资质类型<\/th>\n<th>适用对象<\/th>\n<th>需上传材料<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>个人认证<\/td>\n<td>个人卖家（默认）<\/td>\n<td>身份证 + 支付宝实名即可，无需额外操作<\/td>\n<\/tr>\n<tr>\n<td>个体工商户<\/td>\n<td>有个体营业执照的卖家<\/td>\n<td>营业执照原件照片/彩色扫描件 + 法人身份证正反面<\/td>\n<\/tr>\n<tr>\n<td>企业认证<\/td>\n<td>有公司营业执照的商家<\/td>\n<td>营业执照 + 法人身份证 + 对公银行账户（可选）+ 企业支付宝<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>2.4.3 经营资质上传操作步骤（6步）<\/h4>\n<ol>\n<li>进入认证招商：打开闲鱼APP → 点击右下角「我的」→ 找到「认证招商」入口（或在「设置」中查找）。<\/li>\n<li>选择经营资质：进入「认证招商」页面后，点击「经营资质」选项。<\/li>\n<li>点击立即开通：在经营资质页面，点击「立即去开通」按钮。<\/li>\n<li>选择资质类型：根据实际情况选择「个体工商户」或「企业」，然后点击「下一步」。<\/li>\n<li>阅读并确认承诺函：仔细阅读《确认函》内容，确认无误后点击「下一步」。<\/li>\n<li>填写信息并提交：在「新增认证」页面，逐项填写对应信息（企业名称、统一社会信用代码、法人信息等），上传营业执照照片和身份证照片，点击「提交」等待审核。<\/li>\n<\/ol>\n<h4>2.4.4 审核要点与避坑指南<\/h4>\n<table>\n<thead>\n<tr>\n<th>审核要点<\/th>\n<th>具体要求<\/th>\n<th>常见被拒原因<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>执照有效期<\/td>\n<td>剩余有效期最好大于6个月<\/td>\n<td>执照已过期或临近过期<\/td>\n<\/tr>\n<tr>\n<td>照片质量<\/td>\n<td>清晰完整、无反光、无水印、四角完整<\/td>\n<td>照片模糊、反光严重、边缘裁剪不完整<\/td>\n<\/tr>\n<tr>\n<td>信息一致性<\/td>\n<td>执照法人 = 闲鱼实名认证人 = 支付宝实名认证人<\/td>\n<td>法人信息与账号实名不一致<\/td>\n<\/tr>\n<tr>\n<td>经营范围<\/td>\n<td>执照经营范围需包含销售相关类目<\/td>\n<td>经营范围与在售商品不符<\/td>\n<\/tr>\n<tr>\n<td>填写准确性<\/td>\n<td>填写信息必须与执照完全一致（包括标点符号）<\/td>\n<td>公司名漏字、信用代码错位<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ 审核注意事项：<\/p>\n<p>• 审核周期：通常 3-5个工作日，高峰期可能延长至7天<\/p>\n<p>• 审核通过后，建议第二天再上架商品，更稳妥<\/p>\n<p>• 审核失败可重新提交，注意查看拒绝原因中的具体说明<\/p>\n<p>• 认证免费，无需支付任何费用（警惕&quot;代认证&quot;收费骗局）<\/p>\n<p>• 另注意：被判定为经营性的卖家，自 2026 年 10 月起发布/编辑商品时可能触发「经营者信息年检」合规任务，逾期未完成会限制发布与编辑，流程与口径见 <strong>15.2<\/strong><\/p>\n<h4>2.4.5 认证后的权益变化<\/h4>\n<table>\n<thead>\n<tr>\n<th>权益<\/th>\n<th>未认证（个人）<\/th>\n<th>已认证（企业/个体户）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>账号标识<\/td>\n<td>无特殊标识<\/td>\n<td>显示「企业」或「个体户」标签，买家信任度提升<\/td>\n<\/tr>\n<tr>\n<td>商品上限<\/td>\n<td>普通用户50个，鱼小铺500个<\/td>\n<td>上限更高，适合大批量经营<\/td>\n<\/tr>\n<tr>\n<td>流量扶持<\/td>\n<td>标准流量<\/td>\n<td>搜索排名加权，新品有额外曝光<\/td>\n<\/tr>\n<tr>\n<td>营销工具<\/td>\n<td>基础功能<\/td>\n<td>可申请超级擦亮高级功能、线索收集页等<\/td>\n<\/tr>\n<tr>\n<td>平台活动<\/td>\n<td>部分活动受限<\/td>\n<td>优先参与官方大促、品类专场活动<\/td>\n<\/tr>\n<tr>\n<td>开票能力<\/td>\n<td>不支持<\/td>\n<td>可对接企业支付宝开票功能<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>建议：如果月流水稳定在5万以上，或经营品牌商品需要向买家展示正规资质，强烈建议完成认证招商。认证不仅是合规要求，更是获取平台流量倾斜的「通行证」。<\/p>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 2.1 注册流程（标准操作） 下载闲鱼APP：通过官方应用商店下载，勿用第三方修改版。 注册/登录：使用手机号注册淘宝账号 → 自动关联支付宝。已有淘宝/支付宝账号可直接登录。 绑定支付宝：进入「我的」→「设置」→「支付设置」→ 绑定已实名认证的支付宝账号。 设置头像和昵称：头像用真实/半真实照片（增加信任感），昵称简洁易记，建议与经营类目相关。 完善个人资料：填写个人简介、所在城市、性别等基础信息。简介中可自然嵌入经营方向。 一个身份证可实名认证 3个支付宝账号，对应可开 3个闲鱼账号。但需配合3个不同手机号，且遵守\"一机一卡一号\"原则。 2.2 实名认证 认证类型 要求 路径 基础实名 身份证 + 人脸识别 我的 → 设置 → 账号与安全 → 实名认证 支付宝实名 需与闲鱼账号绑定的支付宝已完成实名 支付宝APP → 我的 → 设置 → 账号与安全 企业蓝V认证 营业执照 + 法人身份信息 需通过官方渠道提交 建议优先完成支付宝高级实名认证（绑定银行卡），可提升账号权重和交易额度。 2.3 芝麻信用分与闲气值 指标 满分 合格线 影响 芝麻信用分 950 ≥ 650（优秀≥700） 影响商品排名权重、买家信任度、超级擦亮投放资格 闲气值 100 ≥ 80（鱼小铺门槛） 低于80无法开通鱼小铺；低于60限制发布商品 提升芝麻信用分：完善学历/职业信息、按时还花呗/借呗、多使用支付宝线下支付、保持稳定收货地址。 2.4 认证招商与经营资质上传 「认证招商」是闲鱼为经营性卖家提供的资质认证入口。完成经营资质上传后，账号将获得企业/个体工商户标识，解锁更多经营工具和流量权益。对于月流水超5万或经营品牌商品的卖家，建议尽早完成认证。 2.4.1 认证招商入口位置 进入路径：闲鱼APP → 我的 → 认证招商（或 设置 → 认证招商） 在「认证招商」页面中，可以看到以下模块： 经营资质 — 上传营业执照，完成企业/个体户认证 品牌资质 — 品牌授权书上传（经营品牌商品时需要） 行业资质 — 特定行业许可（如食品经营许可证等） 2.4.2 经营资质类型与所需材料 资质类型 适用对象 需上传材料 个人认证 个人卖家（默认） 身份证 + 支付宝实名即可，无需额外操作 个体工商户 有个体营业执照的卖家 营业执照原件照片/彩色扫描件 + 法人身份证正反面 企业认证 有公司营业执照的商家 营业执照 + 法人身份证 + 对公银行账户（可选）+ 企业支付宝 2.4.3 经营资质上传操作步骤（6步） 进入认证招商：打开闲鱼APP → 点击右下角「我的」→ 找到「认证招商」入口（或在「设置」中查找）。 选择经营资质：进入「认证招商」页面后，点击「经营资质」选项。 点击立即开通：在经营资质页面，点击「立即去开通」按钮。 选择资质类型：根据实际情况选择「个体工商户」或「企业」，然后点击「下一步」。 阅读并确认承诺函：仔细阅读《确认函》内容，确认无误后点击「下一步」。 填写信息并提交：在「新增认证」页面，逐项填写对应信息（企业名称、统一社会信用代码、法人信息等），上传营业执照照片和身份证照片，点击「提交」等待审核。 2.4.4 审核要点与避坑指南 审核要点 具体要求 常见被拒原因 执照有效期 剩余有效期最好大于6个月 执照已过期或临近过期 照片质量 清晰完整、无反光、无水印、四角完整 照片模糊、反光严重、边缘裁剪不完整 信息一致性 执照法人 = 闲鱼实名认证人 = 支付宝实名认证人 法人信息与账号实名不一致 经营范围 执照经营范围需包含销售相关类目 经营范围与在售商品不符 填写准确性 填写信息必须与执照完全一致（包括标点符号） 公司名漏字、信用代码错位 ⚠️ 审核注意事项： • 审核周期：通常 3-5个工作日，高峰期可能延长至7天 • 审核通过后，建议第二天再上架商品，更稳妥 • 审核失败可重新提交，注意查看拒绝原因中的具体说明 • 认证免费，无需支付任何费用（警惕\"代认证\"收费骗局） • 另注意：被判定为经营性的卖家，自 2026 年 10 月起发布/编辑商品时可能触发「经营者信息年检」合规任务，逾期未完成会限制发布与编辑，流程与口径见 15.2 2.4.5 认证后的权益变化 权益 未认证（个人） 已认证（企业/个体户） 账号标识 无特殊标识 显示「企业」或「个体户」标签，买家信任度提升 商品上限 普通用户50个，鱼小铺500个 上限更高，适合大批量经营 流量扶持 标准流量 搜索排名加权，新品有额外曝光 营销工具 基础功能 可申请超级擦亮高级功能、线索收集页等 平台活动 部分活动受限 优先参与官方大促、品类专场活动 开票能力 不支持 可对接企业支付宝开票功能 建议：如果月流水稳定在5万以上，或经营品牌商品需要向买家展示正规资质，强烈建议完成认证招商。认证不仅是合规要求，更是获取平台流量倾斜的「通行证」。","toc":[{"id":"sec-7","title":"2.1 注册流程（标准操作）"},{"id":"sec-8","title":"2.2 实名认证"},{"id":"sec-9","title":"2.3 芝麻信用分与闲气值"},{"id":"sec-10","title":"2.4 认证招商与经营资质上传"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":5,"imgs":0,"words":2112,"sections":4,"subs":5,"version":"V2026.10.12"},"related":["sec-57","sec-11","sec-86","sec-2"]}]},{"module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"鱼小铺开通与功能","color":"orange","count":8,"items":[{"id":"sec-11","kind":"chapter","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"鱼小铺开通与功能","title":"第三章 鱼小铺开通全流程","title_raw":"第三章 鱼小铺开通全流程","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-12\">3.1 什么是鱼小铺？<\/h3><p>鱼小铺是闲鱼官方推出的专业卖家工具，开通后可获得：<\/p>\n<ul>\n<li>专属店铺页面（自定义封面、分类展示）<\/li>\n<li>商品上限提升至 500个（普通用户仅50个）<\/li>\n<li>数据看板（曝光量、浏览量、转化率等）<\/li>\n<li>付费推广权限（超级擦亮）<\/li>\n<li>优先参与平台活动<\/li>\n<\/ul>\n<h3 id=\"sec-13\">3.2 开通前置条件<\/h3><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>具体要求<\/th>\n<th>检查方式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>账号状态<\/td>\n<td>无违规记录，正常状态<\/td>\n<td>我的 → 安全中心<\/td>\n<\/tr>\n<tr>\n<td>闲气值<\/td>\n<td>≥ 80 分<\/td>\n<td>我的 → 闲气值<\/td>\n<\/tr>\n<tr>\n<td>芝麻信用<\/td>\n<td>建议 ≥ 600 分（付费投放开户的硬门槛即为 600 分）<\/td>\n<td>我的 → 芝麻信用<\/td>\n<\/tr>\n<tr>\n<td>实名认证<\/td>\n<td>已完成支付宝实名认证<\/td>\n<td>设置 → 账号与安全<\/td>\n<\/tr>\n<tr>\n<td>发布商品数<\/td>\n<td>建议累计发布 ≥ 50 个<\/td>\n<td>我的 → 我发布的<\/td>\n<\/tr>\n<tr>\n<td>交易活跃度<\/td>\n<td>近30天有稳定买卖记录<\/td>\n<td>我的 → 交易记录<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-14\">3.3 快速开通实操方法（10-16天）<\/h3><p>⚠️ <strong>先纠正一个常见误区<\/strong>：鱼小铺是<strong>官方邀约制<\/strong>，无法主动申请，也只能通过真实经营触发邀请。以下做法只是<strong>提高被邀约概率<\/strong>的合规动作；用「自买自卖」「虚假交易」去刷条件属于违规行为（2026 年反作弊可识别同设备、同 IP、同地址的关联交易），一旦被判定轻则限流、重则封号，得不偿失。<\/p>\n<h4>第一阶段：基础活跃（第1-3天）<\/h4>\n<ol>\n<li>每日签到领闲鱼币，完成「我的」页面全部日常任务（3-5个即可）。<\/li>\n<li>每日保持 2小时以上在线，浏览推荐页、点赞、关注其他卖家。<\/li>\n<li>在「会玩」社区发布2-3条帖子，内容与你的经营类目相关。<\/li>\n<li>完善个人资料：头像、简介、背景图全部设置到位。<\/li>\n<\/ol>\n<h4>第二阶段：真实经营（第4-10天）<\/h4>\n<ol>\n<li>每天上架10个商品，间隔20分钟发布一个，分散到全天。<\/li>\n<li>按真实需求购买（自用耗材、闲置书籍等），不要在短期内刻意凑单——短时间高频小额互买是风控重点关注的行为<\/li>\n<li>确认收货后按实际情况评价即可，不刻意攒评价<\/li>\n<li>上架真实可交付的商品（虚拟资源类已被 2026 年专项治理重点打击，且「网盘发货」属高危场景，勿碰），用闲鱼币推广 + 加入公益捐赠提升转化<\/li>\n<li>下架曝光差的商品，优化后重新上架。<\/li>\n<\/ol>\n<h4>第三阶段：冲刺触发（第10-16天）<\/h4>\n<ol>\n<li>保持每日上架+买卖节奏不中断。<\/li>\n<li>及时回复买家咨询（回复速度影响鱼小铺服务分与账号权重，但不给闲气值加分）<\/li>\n<li>主动确认收货 + 给买家好评。<\/li>\n<li>保持每日稳定上新即可，不要一次性大量铺货（易被判重复铺货或营销号）。\n同时注意：不要大量上架一模一样（同标题、同图片、同文案）的商品，会被判定为重复铺货违规。图片和文案必须做差异化调整。<\/li>\n<\/ol>\n<h3 id=\"sec-15\">3.4 收到鱼小铺邀请示例<\/h3><p>当系统判定账号符合条件后，会在「我的」页面显示入口：<\/p>\n<p>示例提示：「恭喜你获得鱼小铺开通资格！」 + 「去开通」按钮<\/p>\n<p>入口路径：闲鱼APP → 我的 → 找到「恭喜你获得鱼小铺开通资格」卡片 → 点击「去开通」<\/p>\n<p>注意：邀请入口是系统主动触发，并非所有账号同时开放。如达到条件仍未出现，请继续保持活跃并检查闲气值是否≥80。<\/p>\n<p>图：鱼小铺邀请入口示例（点击可放大）<\/p>\n<h3 id=\"sec-16\">3.5 常见问题<\/h3><table>\n<thead>\n<tr>\n<th>问题<\/th>\n<th>解答<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>多久能开通？<\/td>\n<td>正常2-16天收到邀请，超过30天建议换号重开。<\/td>\n<\/tr>\n<tr>\n<td>有违规记录能开通吗？<\/td>\n<td>1次轻微违规+闲气值≥98仍有概率开通；3次以上违规几乎不可能。<\/td>\n<\/tr>\n<tr>\n<td>新号还是老号好？<\/td>\n<td>新号（无违规历史）往往比老号开通更快。<\/td>\n<\/tr>\n<tr>\n<td>开通后需要维护吗？<\/td>\n<td>需要。连续不活跃可能导致鱼小铺权限被收回。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 3.1 什么是鱼小铺？ 鱼小铺是闲鱼官方推出的专业卖家工具，开通后可获得： 专属店铺页面（自定义封面、分类展示） 商品上限提升至 500个（普通用户仅50个） 数据看板（曝光量、浏览量、转化率等） 付费推广权限（超级擦亮） 优先参与平台活动 3.2 开通前置条件 条件 具体要求 检查方式 账号状态 无违规记录，正常状态 我的 → 安全中心 闲气值 ≥ 80 分 我的 → 闲气值 芝麻信用 建议 ≥ 600 分（付费投放开户的硬门槛即为 600 分） 我的 → 芝麻信用 实名认证 已完成支付宝实名认证 设置 → 账号与安全 发布商品数 建议累计发布 ≥ 50 个 我的 → 我发布的 交易活跃度 近30天有稳定买卖记录 我的 → 交易记录 3.3 快速开通实操方法（10-16天） ⚠️ 先纠正一个常见误区 ：鱼小铺是 官方邀约制 ，无法主动申请，也只能通过真实经营触发邀请。以下做法只是 提高被邀约概率 的合规动作；用「自买自卖」「虚假交易」去刷条件属于违规行为（2026 年反作弊可识别同设备、同 IP、同地址的关联交易），一旦被判定轻则限流、重则封号，得不偿失。 第一阶段：基础活跃（第1-3天） 每日签到领闲鱼币，完成「我的」页面全部日常任务（3-5个即可）。 每日保持 2小时以上在线，浏览推荐页、点赞、关注其他卖家。 在「会玩」社区发布2-3条帖子，内容与你的经营类目相关。 完善个人资料：头像、简介、背景图全部设置到位。 第二阶段：真实经营（第4-10天） 每天上架10个商品，间隔20分钟发布一个，分散到全天。 按真实需求购买（自用耗材、闲置书籍等），不要在短期内刻意凑单——短时间高频小额互买是风控重点关注的行为 确认收货后按实际情况评价即可，不刻意攒评价 上架真实可交付的商品（虚拟资源类已被 2026 年专项治理重点打击，且「网盘发货」属高危场景，勿碰），用闲鱼币推广 + 加入公益捐赠提升转化 下架曝光差的商品，优化后重新上架。 第三阶段：冲刺触发（第10-16天） 保持每日上架+买卖节奏不中断。 及时回复买家咨询（回复速度影响鱼小铺服务分与账号权重，但不给闲气值加分） 主动确认收货 + 给买家好评。 保持每日稳定上新即可，不要一次性大量铺货（易被判重复铺货或营销号）。 同时注意：不要大量上架一模一样（同标题、同图片、同文案）的商品，会被判定为重复铺货违规。图片和文案必须做差异化调整。 3.4 收到鱼小铺邀请示例 当系统判定账号符合条件后，会在「我的」页面显示入口： 示例提示：「恭喜你获得鱼小铺开通资格！」 + 「去开通」按钮 入口路径：闲鱼APP → 我的 → 找到「恭喜你获得鱼小铺开通资格」卡片 → 点击「去开通」 注意：邀请入口是系统主动触发，并非所有账号同时开放。如达到条件仍未出现，请继续保持活跃并检查闲气值是否≥80。 图：鱼小铺邀请入口示例（点击可放大） 3.5 常见问题 问题 解答 多久能开通？ 正常2-16天收到邀请，超过30天建议换号重开。 有违规记录能开通吗？ 1次轻微违规+闲气值≥98仍有概率开通；3次以上违规几乎不可能。 新号还是老号好？ 新号（无违规历史）往往比老号开通更快。 开通后需要维护吗？ 需要。连续不活跃可能导致鱼小铺权限被收回。","toc":[{"id":"sec-12","title":"3.1 什么是鱼小铺？"},{"id":"sec-13","title":"3.2 开通前置条件"},{"id":"sec-14","title":"3.3 快速开通实操方法（10-16天）"},{"id":"sec-15","title":"3.4 收到鱼小铺邀请示例"},{"id":"sec-16","title":"3.5 常见问题"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":2,"imgs":0,"words":1445,"sections":5,"subs":3,"version":"V2026.10.12"},"related":["sec-86","sec-30","sec-62","sec-2"]},{"id":"a498411243476357","kind":"article","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"鱼小铺开通与功能","title":"鱼小铺专属功能说明","title_raw":"鱼小铺专属功能说明","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">一、发布宝贝数量500上限<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">鱼小铺可以发布500个宝贝，极大地提升了宝贝的丰富度。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">二、可发布深库存、多规格宝贝<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">鱼小铺用户在发布宝贝时，可以添加宝贝规格，填写库存数。<\/span><\/p><p><img src=\"assets/img/105649-1352wbrr-182e50.png\"><img src=\"assets/img/105655-2629daps-2c1f61.png\"><img src=\"assets/img/105706-7144efpf-9d3ac1.png\"><img src=\"assets/img/105714-4223ffdl-152c4e.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">三、拥有宝贝分组功能<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">鱼小铺用户可以对在线宝贝进行分组，方便买家快速找到心仪宝贝。如果你的宝贝数超过20个，建议根据商品主题、买家类型、使用场景等分组。<\/span><\/p><p><img src=\"assets/img/105731-3642tayf-1c9ac9.png\"><img src=\"assets/img/105740-4108ehpw-4dd6b3.png\"><img src=\"assets/img/105750-4704lvol-463905.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">四、拥有宝贝专题功能<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">宝贝专题将展示在宝贝列表第一个，分为上新专题和自定义专题，最多可创建2个。<\/span><\/p><p><img src=\"assets/img/105851-8069fqsc-4edb93.png\"><img src=\"assets/img/105900-9047aipe-229f6e.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">鱼小铺用户可以选择分组中任一宝贝，放在第一个展示位置。当买家进入你的闲鱼号主页时，第一眼就能看到。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">五、拥有宝贝置顶功能<\/strong><\/p><p><img src=\"assets/img/105938-3785kxza-7c2d6e.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">六、数据看板<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">开通鱼小铺后，可以在【我的-鱼小铺工作台】看到近两周粉丝、浏览、交易的数据，了解自己在闲鱼的运营情况。<\/span><\/p><p><img src=\"assets/img/105956-3165jfvo-af3ed0.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">七、运营指导<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">开通鱼小铺后，可以在【我的-鱼小铺工作台】获得闲鱼小二的经营建议，同时方便地参与平台活动。<\/span><\/p><p><img src=\"assets/img/110008-3205tamf-fffc1a.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">八、可发布粉丝抽奖活动<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">鱼小铺用户可以设置粉丝抽奖活动。活动会通过闲鱼消息通知粉丝，并有机会在首页猜你喜欢展示。可吸引粉丝、增加宝贝曝光哦！<\/span><\/p><p><img src=\"assets/img/110025-2938qjmm-91e634.png\"><\/p>","text":"一、发布宝贝数量500上限 鱼小铺可以发布500个宝贝，极大地提升了宝贝的丰富度。 二、可发布深库存、多规格宝贝 鱼小铺用户在发布宝贝时，可以添加宝贝规格，填写库存数。 三、拥有宝贝分组功能 鱼小铺用户可以对在线宝贝进行分组，方便买家快速找到心仪宝贝。如果你的宝贝数超过20个，建议根据商品主题、买家类型、使用场景等分组。 四、拥有宝贝专题功能 宝贝专题将展示在宝贝列表第一个，分为上新专题和自定义专题，最多可创建2个。 鱼小铺用户可以选择分组中任一宝贝，放在第一个展示位置。当买家进入你的闲鱼号主页时，第一眼就能看到。 五、拥有宝贝置顶功能 六、数据看板 开通鱼小铺后，可以在【我的-鱼小铺工作台】看到近两周粉丝、浏览、交易的数据，了解自己在闲鱼的运营情况。 七、运营指导 开通鱼小铺后，可以在【我的-鱼小铺工作台】获得闲鱼小二的经营建议，同时方便地参与平台活动。 八、可发布粉丝抽奖活动 鱼小铺用户可以设置粉丝抽奖活动。活动会通过闲鱼消息通知粉丝，并有机会在首页猜你喜欢展示。可吸引粉丝、增加宝贝曝光哦！","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":13,"words":454,"sections":0,"subs":0,"version":""},"related":["sec-11","sec-2","a498417645995397","sec-52"]},{"id":"a498409705018757","kind":"article","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"鱼小铺开通与功能","title":"鱼小铺用户反馈答疑（第4期）","title_raw":"鱼小铺用户反馈答疑（第4期）","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">开通类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1.为什么我开通鱼小铺后，买家看不到我的鱼小铺专属标识？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">目前鱼小铺仍在测试阶段，所以只有部分买家能够看到你的鱼小铺标识哦。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2.为什么开通鱼小铺后我的在售商品、已售出商品都不见了？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">鱼小铺开通后次日，你的在售商品和已售出商品将恢复展示。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">功能类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1.为什么我的粉丝抽奖功入口能是灰色，无法点击进入？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">粉丝抽奖功能开启需要满足50个粉丝，如果你已经满足50个粉丝的要求却仍然无法开启抽奖功能，那么可能是因为你今天刚完成鱼小铺的开通，鱼小铺开通次日，你就可以正常使用粉丝抽奖功能了。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2.为什么我的粉丝好评数超过了「闲鱼榜单」上面同领域的用户但我却没有上榜？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">粉丝好评榜上榜有一定的要求，如：闲鱼号（如头像、简介等）能体现人设表达（具有一定领域专业度或独特人设）、满足上榜的粉丝好评数要求等，详情可至「我的」-「鱼小铺工作台」-「攻略合集」-「粉丝好评榜上线了，快来查看上榜小攻略」查看上榜要求。另外，榜单审核需要2-4个工作日审核时间，还请耐心的等待审核哦～若你成功上榜，也会收到上榜消息通知。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">信息类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1.为什么我的鱼小铺领域和工作台粉丝量排名的领域不一致？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">由于排名情况需要一定的数据累计，PRO号升级为鱼小铺次日，鱼小铺工作台粉丝量排名将会更新为鱼小铺领域。<\/span><\/p>","text":"开通类 1.为什么我开通鱼小铺后，买家看不到我的鱼小铺专属标识？ 目前鱼小铺仍在测试阶段，所以只有部分买家能够看到你的鱼小铺标识哦。 2.为什么开通鱼小铺后我的在售商品、已售出商品都不见了？ 鱼小铺开通后次日，你的在售商品和已售出商品将恢复展示。 功能类 1.为什么我的粉丝抽奖功入口能是灰色，无法点击进入？ 粉丝抽奖功能开启需要满足50个粉丝，如果你已经满足50个粉丝的要求却仍然无法开启抽奖功能，那么可能是因为你今天刚完成鱼小铺的开通，鱼小铺开通次日，你就可以正常使用粉丝抽奖功能了。 2.为什么我的粉丝好评数超过了「闲鱼榜单」上面同领域的用户但我却没有上榜？ 粉丝好评榜上榜有一定的要求，如：闲鱼号（如头像、简介等）能体现人设表达（具有一定领域专业度或独特人设）、满足上榜的粉丝好评数要求等，详情可至「我的」-「鱼小铺工作台」-「攻略合集」-「粉丝好评榜上线了，快来查看上榜小攻略」查看上榜要求。另外，榜单审核需要2-4个工作日审核时间，还请耐心的等待审核哦～若你成功上榜，也会收到上榜消息通知。 信息类 1.为什么我的鱼小铺领域和工作台粉丝量排名的领域不一致？ 由于排名情况需要一定的数据累计，PRO号升级为鱼小铺次日，鱼小铺工作台粉丝量排名将会更新为鱼小铺领域。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":536,"sections":0,"subs":0,"version":""},"related":["sec-11","sec-2","a498409539745157","a498411243476357"]},{"id":"a498409539745157","kind":"article","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"鱼小铺开通与功能","title":"鱼小铺用户反馈答疑（第3期）","title_raw":"鱼小铺用户反馈答疑（第3期）","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">抽奖类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1.发布抽奖后，我在哪里查看中奖订单？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">抽奖订单查看路径：我的-更多-红包奖券-我的抽奖-发布的抽奖。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2.为什么抽奖订单不能在淘宝APP确认收货，也不能在淘宝网页端确认收货？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">闲鱼的抽奖订单必须在闲鱼APP上确认收货。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3.抽奖内容设置错了，可以修改或者取消本次抽奖吗？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">目前抽奖活动是不支持修改和取消的，所以大家发布抽奖的时候一定要仔细一点哦~<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">4.为什么发布抽奖按钮点了没有反应？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">发布抽奖的时候要填写10个字以上的活动简介，请按要求填写完整哦~<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">榜单类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1.我昨天还有排行榜标识，今天怎么没有了？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">因为本次没有上榜哦，一次上榜不代表可以永远霸榜，大家都是在不断进步的，想要再次上榜，快去【我的】—【鱼小铺版工作台】—【查看全部】—【鱼小铺攻略小助手】学习上榜小攻略吧。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2.粉丝好评榜多久更新一次？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">榜单内容定期更新，更新时间以页面展示为准。<\/span><\/p>","text":"抽奖类 1.发布抽奖后，我在哪里查看中奖订单？ 抽奖订单查看路径：我的-更多-红包奖券-我的抽奖-发布的抽奖。 2.为什么抽奖订单不能在淘宝APP确认收货，也不能在淘宝网页端确认收货？ 闲鱼的抽奖订单必须在闲鱼APP上确认收货。 3.抽奖内容设置错了，可以修改或者取消本次抽奖吗？ 目前抽奖活动是不支持修改和取消的，所以大家发布抽奖的时候一定要仔细一点哦~ 4.为什么发布抽奖按钮点了没有反应？ 发布抽奖的时候要填写10个字以上的活动简介，请按要求填写完整哦~ 榜单类 1.我昨天还有排行榜标识，今天怎么没有了？ 因为本次没有上榜哦，一次上榜不代表可以永远霸榜，大家都是在不断进步的，想要再次上榜，快去【我的】—【鱼小铺版工作台】—【查看全部】—【鱼小铺攻略小助手】学习上榜小攻略吧。 2.粉丝好评榜多久更新一次？ 榜单内容定期更新，更新时间以页面展示为准。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":379,"sections":0,"subs":0,"version":""},"related":["sec-11","sec-2","a498411243476357","a499947955983749"]},{"id":"a498409349989701","kind":"article","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"鱼小铺开通与功能","title":"鱼小铺用户反馈答疑（第2期）","title_raw":"鱼小铺用户反馈答疑（第2期）","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">操作类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1.为什么我设置了多规格但没有显示？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">按理不会出现这个问题，点击宝贝详情页右下角【我想要】-【立即购买】进行查看，多规格和深库存会在该页面进行展示。如果该页面没有出现相关信息，则需要联系客服反馈。<\/span><\/p><p><img src=\"assets/img/105214-1363uzms-60290b.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">2.为什么退出鱼小铺后，库存以及多规格的宝贝都是无法修改的？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">退出后深库存以及多规格的宝贝无法编辑，因为这些都是鱼小铺用户才有的专属权益。退出用户只能将这些宝贝进行下架处理，然后发布单库存宝贝。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3.发布宝贝后，详情页提示补充宝贝关键信息但编辑失败（如图），为什么？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">建议重新发布宝贝或者重新编辑宝贝。<\/span><\/p><p><img src=\"assets/img/105231-7688zzrn-cf9c58.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">信息类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1.为什么我的工作台没有数据信息？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">如果是当天加入的，当天是没有数据展示的，数据会从第二天开始展示。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2.我在哪里能够看到我的领域信息？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">在个人资料设置页面可以查看到自己的领域。<\/span><\/p>","text":"操作类 1.为什么我设置了多规格但没有显示？ 按理不会出现这个问题，点击宝贝详情页右下角【我想要】-【立即购买】进行查看，多规格和深库存会在该页面进行展示。如果该页面没有出现相关信息，则需要联系客服反馈。 2.为什么退出鱼小铺后，库存以及多规格的宝贝都是无法修改的？ 退出后深库存以及多规格的宝贝无法编辑，因为这些都是鱼小铺用户才有的专属权益。退出用户只能将这些宝贝进行下架处理，然后发布单库存宝贝。 3.发布宝贝后，详情页提示补充宝贝关键信息但编辑失败（如图），为什么？ 建议重新发布宝贝或者重新编辑宝贝。 信息类 1.为什么我的工作台没有数据信息？ 如果是当天加入的，当天是没有数据展示的，数据会从第二天开始展示。 2.我在哪里能够看到我的领域信息？ 在个人资料设置页面可以查看到自己的领域。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":2,"words":348,"sections":0,"subs":0,"version":""},"related":["sec-11","sec-6","sec-2","a498408474531205"]},{"id":"a498408474531205","kind":"article","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"鱼小铺开通与功能","title":"鱼小铺用户反馈答疑（第一期）","title_raw":"鱼小铺用户反馈答疑（第一期）","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">开通类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 开通使用鱼小铺是否收费？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">鱼小铺的开通是免费的，现有功能也是免费使用的。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 为什么我收到了通知，而和我差不多的朋友却没有？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">如果你的朋友符合准入要求，将会在1-2个月内收到邀请，可以在“闲鱼APP右下角-我的-认证招商”查看。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3. 鱼小铺开通后，会到期失效吗？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">没有。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">4. 鱼小铺是否可以主动退出？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">可以。在鱼小铺工作台下方选择退出鱼小铺即可。千万不要误点，主动退出后需要90天后才能再次申请准入使用鱼小铺。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">操作类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 如何设置多规格宝贝？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">发闲置-去发多规格宝贝即可。需要注意的是，多库存宝贝最多设置1万件，宝贝规格最多设置2个。<\/span><\/p><p><img src=\"assets/img/104000-5506yujr-ba9fb6.png\"><img src=\"assets/img/104007-3930xoum-d3864d.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 如何编辑分组？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">闲鱼号主页-管理-宝贝分组管理-创建新分组-添加分组名称和添加宝贝即可。需要注意的是，宝贝分组最多设置7个分组，其中包含3个系统分组。<\/span><\/p><p><img src=\"assets/img/104026-3195lxev-6f3d20.png\"><img src=\"assets/img/104028-4907bkbl-880dee.png\"><img src=\"assets/img/104040-6070qpwy-d74322.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">曝光类<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\"> 1.加入鱼小铺是否会影响我宝贝的曝光？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">不会！不会！不会！加入鱼小铺不会影响宝贝曝光，但发布优质宝贝（如宝贝本身好、信息描述全）可以获得更好的曝光哦~<\/span><\/p>","text":"开通类 1. 开通使用鱼小铺是否收费？ 鱼小铺的开通是免费的，现有功能也是免费使用的。 2. 为什么我收到了通知，而和我差不多的朋友却没有？ 如果你的朋友符合准入要求，将会在1-2个月内收到邀请，可以在“闲鱼APP右下角-我的-认证招商”查看。 3. 鱼小铺开通后，会到期失效吗？ 没有。 4. 鱼小铺是否可以主动退出？ 可以。在鱼小铺工作台下方选择退出鱼小铺即可。千万不要误点，主动退出后需要90天后才能再次申请准入使用鱼小铺。 操作类 1. 如何设置多规格宝贝？ 发闲置-去发多规格宝贝即可。需要注意的是，多库存宝贝最多设置1万件，宝贝规格最多设置2个。 2. 如何编辑分组？ 闲鱼号主页-管理-宝贝分组管理-创建新分组-添加分组名称和添加宝贝即可。需要注意的是，宝贝分组最多设置7个分组，其中包含3个系统分组。 曝光类 1.加入鱼小铺是否会影响我宝贝的曝光？ 不会！不会！不会！加入鱼小铺不会影响宝贝曝光，但发布优质宝贝（如宝贝本身好、信息描述全）可以获得更好的曝光哦~","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":5,"words":438,"sections":0,"subs":0,"version":""},"related":["sec-11","sec-6","sec-2","a498411243476357"]},{"id":"a498773110658437","kind":"article","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"鱼小铺开通与功能","title":"闲鱼鱼小铺工具管理规范","title_raw":"闲鱼鱼小铺工具管理规范","html":"<p>闲鱼鱼小铺是阿里巴巴集团旗下品牌闲鱼为闲鱼用户提供的更专业的闲置交易和粉丝运营工具。为维护闲鱼鱼小铺工具的正常运营秩序，根据闲鱼社区规则（包括《闲鱼社区公约》、《闲鱼社区管理规范》等）、协议（包括《闲鱼社区用户服务协议》等）的规定，制定本规范。本规范适用于开通闲鱼鱼小铺工具权限的所有用户。<\/p><p><strong>一、开通条件 <\/strong><\/p><p>闲鱼用户须满足以下条件，方可申请开通使用闲鱼鱼小铺工具：<\/p><p>（一）闲鱼账号已在依法需要核验用户真实身份的场景下完成实名及实人认证；<\/p><p>（二）同一真实身份主体支持使用3个名下的闲鱼账号申请开通；<\/p><p>（三）所申请账号真实身份主体须满16周岁；<\/p><p>（四）所申请账号的闲气值须高于80分；<\/p><p>（五）同一闲鱼账号如操作退出过闲鱼鱼小铺工具，自退出之日起90天内不可再次申请。<\/p><p><strong>二、退出条件 <\/strong><\/p><p>闲鱼用户可主动申请退出闲鱼鱼小铺工具权限，但申请时须满足以下条件：<\/p><p>（一）已开通闲鱼账号下无未完成的订单，且无未完成的交易纠纷；<\/p><p>（二）已开通闲鱼账号下无进行中的抽奖活动。<\/p><p>注意事项：退出后因开通闲鱼鱼小铺工具权限而享有的工具权益需收回，包括不仅限于宝贝管理工具（其中宝贝数量、宝贝库存相关权益需请您在提交退出申请前主动操作清理）、粉丝运营工具、运营工作台等相关权益。<\/p><p><strong>三、其他<\/strong><\/p><p>（一）本规范为闲鱼社区规则（包括《闲鱼社区公约》、《闲鱼社区管理规范》等）的下位规范。闲鱼社区规则已有规定的，从其规定；未有规定或本规范有特殊规定的，按照本规范执行。<\/p><p>（二）闲鱼社区、闲鱼论坛、帮助中心、闲鱼鱼小铺工具所在功能页面等发布的和闲鱼鱼小铺工具相关的各类规则、提示文案、公告等内容均为本规范的补充，与本规范不可分割且具有同等法律效力。<\/p><p><strong>四、生效时间<\/strong><\/p><p>本规范于2022年6月30日首次生效，于2022年8月15日最新修订。<\/p>","text":"闲鱼鱼小铺是阿里巴巴集团旗下品牌闲鱼为闲鱼用户提供的更专业的闲置交易和粉丝运营工具。为维护闲鱼鱼小铺工具的正常运营秩序，根据闲鱼社区规则（包括《闲鱼社区公约》、《闲鱼社区管理规范》等）、协议（包括《闲鱼社区用户服务协议》等）的规定，制定本规范。本规范适用于开通闲鱼鱼小铺工具权限的所有用户。 一、开通条件 闲鱼用户须满足以下条件，方可申请开通使用闲鱼鱼小铺工具： （一）闲鱼账号已在依法需要核验用户真实身份的场景下完成实名及实人认证； （二）同一真实身份主体支持使用3个名下的闲鱼账号申请开通； （三）所申请账号真实身份主体须满16周岁； （四）所申请账号的闲气值须高于80分； （五）同一闲鱼账号如操作退出过闲鱼鱼小铺工具，自退出之日起90天内不可再次申请。 二、退出条件 闲鱼用户可主动申请退出闲鱼鱼小铺工具权限，但申请时须满足以下条件： （一）已开通闲鱼账号下无未完成的订单，且无未完成的交易纠纷； （二）已开通闲鱼账号下无进行中的抽奖活动。 注意事项：退出后因开通闲鱼鱼小铺工具权限而享有的工具权益需收回，包括不仅限于宝贝管理工具（其中宝贝数量、宝贝库存相关权益需请您在提交退出申请前主动操作清理）、粉丝运营工具、运营工作台等相关权益。 三、其他 （一）本规范为闲鱼社区规则（包括《闲鱼社区公约》、《闲鱼社区管理规范》等）的下位规范。闲鱼社区规则已有规定的，从其规定；未有规定或本规范有特殊规定的，按照本规范执行。 （二）闲鱼社区、闲鱼论坛、帮助中心、闲鱼鱼小铺工具所在功能页面等发布的和闲鱼鱼小铺工具相关的各类规则、提示文案、公告等内容均为本规范的补充，与本规范不可分割且具有同等法律效力。 四、生效时间 本规范于2022年6月30日首次生效，于2022年8月15日最新修订。","toc":[],"meta":{"publish_time":"2023-12-30","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":743,"sections":0,"subs":0,"version":""},"related":["sec-11","sec-2","a499947955983749","a498832766117253"]},{"id":"a499947955983749","kind":"article","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启 /p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">头像<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">推荐使用本人、宝贝、本人宝贝合影的高清照片，表达账号的真实性<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">昵称<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 建议昵称和头像有一定的相关性，更利于用户的理解和记忆<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 尽量避免出现“旗舰店”等明显的商业命名<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">简介<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 填写宝贝相关内容，突显专业性。如：行业深耕X年<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 做个人介绍，增强人设感。如中国美院毕业，现在自己在做油画相关内容<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">新浪微博认证<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">如果你的微博也发类似的宝贝内容，绑定微博，增强人设<\/span><\/p><p><img src=\"assets/img/112541-5762yzko-d433c0.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">发布的宝贝风格<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 宝贝尽可能都是同领域下，领域单一更能突显领域专业性<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 宝贝首图的照片风格尽可能相似，同风格能让用户更相信是实拍商品<\/span><\/p><p><img src=\"assets/img/112605-3770taks-1fa39b.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">如上图所示例的用户，结合闲鱼号所有信息，90后回乡创业做水果生意的农人阿林，热爱模玩且做模玩的原型师Broli形象跃然纸上。<\/span><\/p>","text":"闲鱼号是建立“人设”的重要运营阵地。个人信息、商品信息在闲鱼号讨巧地表达，能让更多人对你的宝贝产生兴趣，加强对你的信任感，有利于宝贝的卖出。 头像 推荐使用本人、宝贝、本人宝贝合影的高清照片，表达账号的真实性 昵称 1. 建议昵称和头像有一定的相关性，更利于用户的理解和记忆 2. 尽量避免出现“旗舰店”等明显的商业命名 简介 1. 填写宝贝相关内容，突显专业性。如：行业深耕X年 2. 做个人介绍，增强人设感。如中国美院毕业，现在自己在做油画相关内容 新浪微博认证 如果你的微博也发类似的宝贝内容，绑定微博，增强人设 发布的宝贝风格 1. 宝贝尽可能都是同领域下，领域单一更能突显领域专业性 2. 宝贝首图的照片风格尽可能相似，同风格能让用户更相信是实拍商品 如上图所示例的用户，结合闲鱼号所有信息，90后回乡创业做水果生意的农人阿林，热爱模玩且做模玩的原型师Broli形象跃然纸上。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":2,"words":393,"sections":0,"subs":0,"version":""},"related":["sec-2","sec-11","a498411243476357","sec-52"]},{"id":"a498413763863941","kind":"article","module":"开店入驻","module_sub":"起步篇 · 从 0 到 1 开启店铺","section":"账号装修与人设打造","title":"如何让用户一秒内了解你","title_raw":"如何让用户一秒内了解你","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">「举个栗子」<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1)科技数码领域：粉丝会比较在意价格、商品质量、售后服务等等。那就要把这些粉丝最在意的点，在简介里表现出来。   <\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">举例：【数码领域深耕八年，专业手机测评师】<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">关注我，每个月8号定期抽奖送手机配件。本人深耕数码领域八年，专业手机测评师，承诺所有商品都是正品，支持七天内退换。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2)母婴领域：粉丝大多数是宝妈，那她们会对同样有宝宝的宝妈、奶爸有更多的信任感，如果你是这个身份，可以在简介里表明哦！<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">举例：【二胎宝妈，资深母婴卖家，只卖良心货】<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">80后二胎宝妈一枚，资深母婴用品卖家，商品均是低价正品。只想把好的产品分享给大家，请多多关注哟！<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3)奢侈品领域：粉丝会比较在意卖家的专业性，商品是否支持验货，商品的渠道来源这些问题。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">举例：【长期做二手奢侈品的中检鉴定师】<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">本人中检鉴定师，长期做二手奢侈品，上海有工作室。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">4)Vintage领域：粉丝会比较在意卖家身份是否靠谱，还有商品打理保养情况，可以把这些粉丝最在意的东西展示在简介上。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">举例：【资深古着迷，十六年收藏佛系卖】<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">Vintage古着迷，入坑十六年。衣服都是自己这些年来精心购入的，都是精品尖货，还有奢品大牌。衣服都是清洁消毒过的，请放心购买！<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">5)娃圈领域：可以直接在简介表明自己出售的娃类型是：BJD、OB11、Blythe等，精准定位自己，让粉丝一眼就能找到你。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">举例：【BJD娃娘，手作四分娃衣道具佛系出】<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">BJD娃娘，人很好说话，佛系出售四分娃衣、道具，发货前都会有360度视频发出。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">备注：以上例子部分参考了闲鱼用户真实简介～<\/span><\/p>","text":"「举个栗子」 1)科技数码领域：粉丝会比较在意价格、商品质量、售后服务等等。那就要把这些粉丝最在意的点，在简介里表现出来。 举例：【数码领域深耕八年，专业手机测评师】 关注我，每个月8号定期抽奖送手机配件。本人深耕数码领域八年，专业手机测评师，承诺所有商品都是正品，支持七天内退换。 2)母婴领域：粉丝大多数是宝妈，那她们会对同样有宝宝的宝妈、奶爸有更多的信任感，如果你是这个身份，可以在简介里表明哦！ 举例：【二胎宝妈，资深母婴卖家，只卖良心货】 80后二胎宝妈一枚，资深母婴用品卖家，商品均是低价正品。只想把好的产品分享给大家，请多多关注哟！ 3)奢侈品领域：粉丝会比较在意卖家的专业性，商品是否支持验货，商品的渠道来源这些问题。 举例：【长期做二手奢侈品的中检鉴定师】 本人中检鉴定师，长期做二手奢侈品，上海有工作室。 4)Vintage领域：粉丝会比较在意卖家身份是否靠谱，还有商品打理保养情况，可以把这些粉丝最在意的东西展示在简介上。 举例：【资深古着迷，十六年收藏佛系卖】 Vintage古着迷，入坑十六年。衣服都是自己这些年来精心购入的，都是精品尖货，还有奢品大牌。衣服都是清洁消毒过的，请放心购买！ 5)娃圈领域：可以直接在简介表明自己出售的娃类型是：BJD、OB11、Blythe等，精准定位自己，让粉丝一眼就能找到你。 举例：【BJD娃娘，手作四分娃衣道具佛系出】 BJD娃娘，人很好说话，佛系出售四分娃衣、道具，发货前都会有360度视频发出。 备注：以上例子部分参考了闲鱼用户真实简介～","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":654,"sections":0,"subs":0,"version":""},"related":["sec-2","sec-11","a498417787647365","a498458897921413"]}]},{"module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"类目选择与类目打法","color":"orange","count":4,"items":[{"id":"a498422174320005","kind":"article","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"类目选择与类目打法","title":"正确选择商品类目","title_raw":"正确选择商品类目","html":"<p>发布商品时如果选错类目，被发布到与之不匹配的类目中，可能会导致宝贝无法被搜索到、宝贝的曝光度减少，从而影响宝贝的卖出效率。<\/p><p><strong class=\"ql-size-16px\">易选错类目的商品情况<\/strong><\/p><p>·酒店代订类服务商品应选择“酒店代订”分类发布<\/p><p>·演唱会门票商品应选择“演唱会”分类发布<\/p><p>·卡券-会员账号类商品应选择“视频会员充值”分类发布<\/p><p>·卡券-餐饮优惠券类商品应选择“会员卡/优惠券”分类发布<\/p><p>·游戏账号类商品应选择“成品号”分类发布<\/p><p>·租房类服务应选择“住房出租”分类发布<\/p><p>建议大家发布宝贝时选择最匹配的分类，这样能帮助宝贝获得更多曝光，还能避免处罚哦~<\/p><p><img src=\"assets/img/114434-2163cgxi-f5fe9f.png\"><\/p>","text":"发布商品时如果选错类目，被发布到与之不匹配的类目中，可能会导致宝贝无法被搜索到、宝贝的曝光度减少，从而影响宝贝的卖出效率。 易选错类目的商品情况 ·酒店代订类服务商品应选择“酒店代订”分类发布 ·演唱会门票商品应选择“演唱会”分类发布 ·卡券-会员账号类商品应选择“视频会员充值”分类发布 ·卡券-餐饮优惠券类商品应选择“会员卡/优惠券”分类发布 ·游戏账号类商品应选择“成品号”分类发布 ·租房类服务应选择“住房出租”分类发布 建议大家发布宝贝时选择最匹配的分类，这样能帮助宝贝获得更多曝光，还能避免处罚哦~","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":1,"words":255,"sections":0,"subs":0,"version":""},"related":["sec-23","sec-17","a498451325527429","sec-43"]},{"id":"a498420870378885","kind":"article","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"类目选择与类目打法","title":"闲鱼禁售商品范围（一）","title_raw":"闲鱼禁售商品范围（一）","html":"<p><img src=\"assets/img/113926-9926zlqg-c87a28.png\"><img src=\"assets/img/113927-9459etyu-d7e1e5.png\"><img src=\"assets/img/113930-2693narj-debd15.png\"><img src=\"assets/img/113932-5653hbyt-061015.png\"><img src=\"assets/img/113935-5660hjvb-3ba160.png\"><\/p>","text":"","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":5,"words":0,"sections":0,"subs":0,"version":""},"related":["a498421207266693","sec-23","sec-17"]},{"id":"a498421207266693","kind":"article","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"类目选择与类目打法","title":"闲鱼禁售商品范围（二）","title_raw":"闲鱼禁售商品范围（二）","html":"<p><img src=\"assets/img/114054-0212krbm-e4369e.png\"><img src=\"assets/img/114055-9464wxea-9c3f7a.png\"><img src=\"assets/img/114057-6867uavx-e94b42.png\"><\/p>","text":"","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":3,"words":0,"sections":0,"subs":0,"version":""},"related":["a498420870378885","sec-23","sec-17"]},{"id":"sec-23","kind":"chapter","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"类目选择与类目打法","title":"第六章 类目运营实战指南","title_raw":"第六章 类目运营实战指南","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-24\">6.1 数码3C类目<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>运营要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>风险等级<\/td>\n<td>高（翻新机、组装机、序列号问题）<\/td>\n<\/tr>\n<tr>\n<td>选品方向<\/td>\n<td>品牌手机/平板/笔记本、耳机/音响、相机/镜头、游戏机（Switch/PS5）<\/td>\n<\/tr>\n<tr>\n<td>核心技巧<\/td>\n<td>① 必须上传序列号/IMEI ② 注明激活日期和保修剩余时长 ③ 录制开机+功能测试视频<\/td>\n<\/tr>\n<tr>\n<td>标题模板<\/td>\n<td>「[品牌]+[型号]+[存储/配置]+[颜色]+[成色]+[保修情况]+包邮」<\/td>\n<\/tr>\n<tr>\n<td>定价参考<\/td>\n<td>参考京东二手/转转同款价格，通常定价为新品价格的60%-80%<\/td>\n<\/tr>\n<tr>\n<td>售后重点<\/td>\n<td>发货前拍视频留证，包装用泡沫+纸箱，保价寄送，签收后24小时内确认<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>禁止售卖：翻新机组装机（无明确标注）、盗版软件/破解游戏、无法提供序列号的设备。2025年新规：数码产品必须上传序列号。<\/p>\n<h3 id=\"sec-25\">6.2 服饰鞋包类目<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>运营要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>风险等级<\/td>\n<td>中（尺码纠纷、色差、仿品风险）<\/td>\n<\/tr>\n<tr>\n<td>选品方向<\/td>\n<td>品牌服饰、潮流运动鞋、轻奢包袋、古着/ vintage、小众设计师品牌<\/td>\n<\/tr>\n<tr>\n<td>核心技巧<\/td>\n<td>① 平铺+上身实拍图 ② 标注具体尺寸（肩宽/胸围/衣长）③ 瑕疵处特写+文字说明 ④ 提供多角度色差对比<\/td>\n<\/tr>\n<tr>\n<td>标题模板<\/td>\n<td>「[品牌]+[品类]+[风格标签]+[尺码]+[成色]+[适用场景]」<\/td>\n<\/tr>\n<tr>\n<td>定价参考<\/td>\n<td>品牌款：原价3-5折；快时尚：原价2-3折；古着/绝版：可溢价<\/td>\n<\/tr>\n<tr>\n<td>售后重点<\/td>\n<td>明确标注&quot;二手商品非质量问题不退不换&quot;，建议使用验货宝服务<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>禁止售卖：高仿、A货、1:1复刻等任何仿品。违者封店+品牌方索赔。商品描述中严禁出现&quot;高仿&quot;“A货”“原单”&quot;尾货&quot;等词汇。<\/p>\n<h3 id=\"sec-26\">6.3 家居百货类目<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>运营要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>风险等级<\/td>\n<td>低（纠纷少，复购高）<\/td>\n<\/tr>\n<tr>\n<td>选品方向<\/td>\n<td>收纳用品、小家电、厨房用具、装饰摆件、家纺布艺、灯具<\/td>\n<\/tr>\n<tr>\n<td>核心技巧<\/td>\n<td>① 场景化拍摄（使用场景图比白底图转化高40%）② 强调性价比/实用功能 ③ 大件商品注明尺寸和重量<\/td>\n<\/tr>\n<tr>\n<td>标题模板<\/td>\n<td>「[功能]+[材质]+[风格]+[使用场景]+[尺寸]+包邮」<\/td>\n<\/tr>\n<tr>\n<td>定价参考<\/td>\n<td>新品：淘宝同款8-9折；二手：原价3-5折；大件需含运费<\/td>\n<\/tr>\n<tr>\n<td>物流重点<\/td>\n<td>大件走物流（德邦/顺丰大件），易碎品保价+加固包装<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-27\">6.4 美妆个护类目<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>运营要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>风险等级<\/td>\n<td>高（假货风险、保质期、过敏纠纷）<\/td>\n<\/tr>\n<tr>\n<td>选品方向<\/td>\n<td>品牌护肤品/彩妆、香水、美容仪器、个人护理电器<\/td>\n<\/tr>\n<tr>\n<td>核心技巧<\/td>\n<td>① 展示购买凭证/小票 ② 标注保质期/开封日期 ③ 彩妆标注使用次数/余量 ④ 支持验货宝<\/td>\n<\/tr>\n<tr>\n<td>标题模板<\/td>\n<td>「[品牌]+[产品名]+[规格]+[保质期]+[正品]+[购买渠道]」<\/td>\n<\/tr>\n<tr>\n<td>定价参考<\/td>\n<td>全新未拆：专柜价6-8折；已拆封：3-5折；临期品：1-3折<\/td>\n<\/tr>\n<tr>\n<td>售后重点<\/td>\n<td>明确&quot;开封后不退不换&quot;，护肤品需注明适合肤质，避免过敏纠纷<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>严禁售卖：无中文标签的进口化妆品、自制分装护肤品、已过期产品、无购买凭证的名牌化妆品。美妆类需特别注意广告法，不能使用&quot;最好&quot;&quot;第一&quot;等极限词。<\/p>\n<h3 id=\"sec-28\">6.5 宠物用品类目<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>运营要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>风险等级<\/td>\n<td>低（高复购、高客单、纠纷少）<\/td>\n<\/tr>\n<tr>\n<td>选品方向<\/td>\n<td>宠物食品/零食、猫砂/狗尿垫、宠物窝/笼具、牵引绳/玩具、宠物推车/出行装备<\/td>\n<\/tr>\n<tr>\n<td>核心技巧<\/td>\n<td>① 带宠物出镜增加真实感 ② 食品标注生产日期+保质期 ③ 强调适用品种/体重/年龄<\/td>\n<\/tr>\n<tr>\n<td>标题模板<\/td>\n<td>「[品牌]+[品类]+[规格/重量]+[适用宠物]+[功能卖点]+包邮」<\/td>\n<\/tr>\n<tr>\n<td>定价参考<\/td>\n<td>食品类：淘宝价9折左右；用品类：可略高于淘宝（宠物主价格敏感度低）<\/td>\n<\/tr>\n<tr>\n<td>复购策略<\/td>\n<td>引导买家关注店铺，上新时主动推送；老客回购可给优惠<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>宠物用品是闲鱼平台重点推荐的蓝海品类，客单价高（平均150-300元），复购率远超其他类目。适合作为矩阵账号的核心赛道。<\/p>\n<h3 id=\"sec-29\">6.6 虚拟产品/服务类目<\/h3><table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>运营要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>风险等级<\/td>\n<td>极高（盗版风险、白嫖退款、违规封号）<\/td>\n<\/tr>\n<tr>\n<td>选品方向<\/td>\n<td>技能服务（设计/文案/编程）、教育培训（考研/考证辅导）、生活服务（家政/维修）<br/>⚠️ <strong>勿碰<\/strong>：会员代充、代订（酒店/机票/门票）、游戏账号与 CDK、网盘资源——2026 年 6 月起属专项治理对象，个人号从事极易直接封号<\/td>\n<\/tr>\n<tr>\n<td>核心技巧<\/td>\n<td>① 虚拟商品须选择正确的「虚拟商品」类目并如实描述（<strong>平台没有「客服中心备案」这一通道<\/strong>）② 服务类可用官方线索/留资类工具 ③ 联系方式只走官方【发送站外信息】通道<\/td>\n<\/tr>\n<tr>\n<td>标题模板<\/td>\n<td>「[服务类型]+[服务范围]+[交付方式]+[时效承诺]」<\/td>\n<\/tr>\n<tr>\n<td>退款风险<\/td>\n<td>虚拟商品极易被&quot;白嫖&quot;退款，建议小额多次交易、保留交付证据<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>严禁售卖<\/strong>：盗版网课/教程资源、破解软件、游戏账号与代练、网盘资源链接、不可查询的虚拟服务。<br/>\n2026 年新增治理：<strong>代订类（酒店/机票/门票）、会员代充、互联网用户账号<\/strong>均已被列为高危对象，需营业执照等经营资质，个人号触碰极易封号；含「学习资料」「网盘资源」等暗语的表述同样会被识别。虚拟商品请选择正确类目并留存交付证据（平台无「客服中心备案」通道）。<\/p>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 6.1 数码3C类目 维度 运营要点 风险等级 高（翻新机、组装机、序列号问题） 选品方向 品牌手机/平板/笔记本、耳机/音响、相机/镜头、游戏机（Switch/PS5） 核心技巧 ① 必须上传序列号/IMEI ② 注明激活日期和保修剩余时长 ③ 录制开机+功能测试视频 标题模板 「[品牌]+[型号]+[存储/配置]+[颜色]+[成色]+[保修情况]+包邮」 定价参考 参考京东二手/转转同款价格，通常定价为新品价格的60%-80% 售后重点 发货前拍视频留证，包装用泡沫+纸箱，保价寄送，签收后24小时内确认 禁止售卖：翻新机组装机（无明确标注）、盗版软件/破解游戏、无法提供序列号的设备。2025年新规：数码产品必须上传序列号。 6.2 服饰鞋包类目 维度 运营要点 风险等级 中（尺码纠纷、色差、仿品风险） 选品方向 品牌服饰、潮流运动鞋、轻奢包袋、古着/ vintage、小众设计师品牌 核心技巧 ① 平铺+上身实拍图 ② 标注具体尺寸（肩宽/胸围/衣长）③ 瑕疵处特写+文字说明 ④ 提供多角度色差对比 标题模板 「[品牌]+[品类]+[风格标签]+[尺码]+[成色]+[适用场景]」 定价参考 品牌款：原价3-5折；快时尚：原价2-3折；古着/绝版：可溢价 售后重点 明确标注\"二手商品非质量问题不退不换\"，建议使用验货宝服务 禁止售卖：高仿、A货、1:1复刻等任何仿品。违者封店+品牌方索赔。商品描述中严禁出现\"高仿\"“A货”“原单”\"尾货\"等词汇。 6.3 家居百货类目 维度 运营要点 风险等级 低（纠纷少，复购高） 选品方向 收纳用品、小家电、厨房用具、装饰摆件、家纺布艺、灯具 核心技巧 ① 场景化拍摄（使用场景图比白底图转化高40%）② 强调性价比/实用功能 ③ 大件商品注明尺寸和重量 标题模板 「[功能]+[材质]+[风格]+[使用场景]+[尺寸]+包邮」 定价参考 新品：淘宝同款8-9折；二手：原价3-5折；大件需含运费 物流重点 大件走物流（德邦/顺丰大件），易碎品保价+加固包装 6.4 美妆个护类目 维度 运营要点 风险等级 高（假货风险、保质期、过敏纠纷） 选品方向 品牌护肤品/彩妆、香水、美容仪器、个人护理电器 核心技巧 ① 展示购买凭证/小票 ② 标注保质期/开封日期 ③ 彩妆标注使用次数/余量 ④ 支持验货宝 标题模板 「[品牌]+[产品名]+[规格]+[保质期]+[正品]+[购买渠道]」 定价参考 全新未拆：专柜价6-8折；已拆封：3-5折；临期品：1-3折 售后重点 明确\"开封后不退不换\"，护肤品需注明适合肤质，避免过敏纠纷 严禁售卖：无中文标签的进口化妆品、自制分装护肤品、已过期产品、无购买凭证的名牌化妆品。美妆类需特别注意广告法，不能使用\"最好\"\"第一\"等极限词。 6.5 宠物用品类目 维度 运营要点 风险等级 低（高复购、高客单、纠纷少） 选品方向 宠物食品/零食、猫砂/狗尿垫、宠物窝/笼具、牵引绳/玩具、宠物推车/出行装备 核心技巧 ① 带宠物出镜增加真实感 ② 食品标注生产日期+保质期 ③ 强调适用品种/体重/年龄 标题模板 「[品牌]+[品类]+[规格/重量]+[适用宠物]+[功能卖点]+包邮」 定价参考 食品类：淘宝价9折左右；用品类：可略高于淘宝（宠物主价格敏感度低） 复购策略 引导买家关注店铺，上新时主动推送；老客回购可给优惠 宠物用品是闲鱼平台重点推荐的蓝海品类，客单价高（平均150-300元），复购率远超其他类目。适合作为矩阵账号的核心赛道。 6.6 虚拟产品/服务类目 维度 运营要点 风险等级 极高（盗版风险、白嫖退款、违规封号） 选品方向 技能服务（设计/文案/编程）、教育培训（考研/考证辅导）、生活服务（家政/维修） ⚠️ 勿碰 ：会员代充、代订（酒店/机票/门票）、游戏账号与 CDK、网盘资源——2026 年 6 月起属专项治理对象，个人号从事极易直接封号 核心技巧 ① 虚拟商品须选择正确的「虚拟商品」类目并如实描述（ 平台没有「客服中心备案」这一通道 ）② 服务类可用官方线索/留资类工具 ③ 联系方式只走官方【发送站外信息】通道 标题模板 「[服务类型]+[服务范围]+[交付方式]+[时效承诺]」 退款风险 虚拟商品极易被\"白嫖\"退款，建议小额多次交易、保留交付证据 严禁售卖 ：盗版网课/教程资源、破解软件、游戏账号与代练、网盘资源链接、不可查询的虚拟服务。 2026 年新增治理： 代订类（酒店/机票/门票）、会员代充、互联网用户账号 均已被列为高危对象，需营业执照等经营资质，个人号触碰极易封号；含「学习资料」「网盘资源」等暗语的表述同样会被识别。虚拟商品请选择正确类目并留存交付证据（平台无「客服中心备案」通道）。","toc":[{"id":"sec-24","title":"6.1 数码3C类目"},{"id":"sec-25","title":"6.2 服饰鞋包类目"},{"id":"sec-26","title":"6.3 家居百货类目"},{"id":"sec-27","title":"6.4 美妆个护类目"},{"id":"sec-28","title":"6.5 宠物用品类目"},{"id":"sec-29","title":"6.6 虚拟产品/服务类目"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":6,"imgs":0,"words":2059,"sections":7,"subs":0,"version":"V2026.10.12"},"related":["sec-62","sec-2","sec-86","sec-30"]}]},{"module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"标题描述与图片优化","color":"orange","count":3,"items":[{"id":"sec-17","kind":"chapter","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"标题描述与图片优化","title":"第五章 商品发布与SEO优化","title_raw":"第五章 商品发布与SEO优化","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-18\">5.1 标题优化（核心）<\/h3><p>闲鱼搜索算法基于标题关键词匹配。标题 = 流量入口，写好标题等于免费的搜索排名。<\/p>\n<table>\n<thead>\n<tr>\n<th>要素<\/th>\n<th>说明<\/th>\n<th>示例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>品牌词<\/td>\n<td>品牌/系列名称，必含<\/td>\n<td>苹果、华为、Nike<\/td>\n<\/tr>\n<tr>\n<td>产品词<\/td>\n<td>商品品类名称<\/td>\n<td>手机、连衣裙、书桌<\/td>\n<\/tr>\n<tr>\n<td>修饰词<\/td>\n<td>属性/状态描述<\/td>\n<td>全新、九成新、包邮、清仓<\/td>\n<\/tr>\n<tr>\n<td>热搜词<\/td>\n<td>当前平台热搜关键词<\/td>\n<td>学生党、ins风、复古、平替<\/td>\n<\/tr>\n<tr>\n<td>长尾词<\/td>\n<td>精准细分场景词<\/td>\n<td>考研用、租房必备、送礼推荐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n\n<p>标题公式：品牌词 + 产品词 + 修饰词 + 热搜词 + 长尾词（填满30字）<\/p>\n<p>示例：「苹果iPhone 14 Pro 256G 暗紫色 国行九成新 学生党自用 顺丰包邮 可小刀」<\/p>\n<h3 id=\"sec-19\">5.2 主图规范<\/h3><table>\n<thead>\n<tr>\n<th>要求<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>数量<\/td>\n<td>建议上传 6-9 张，越多越好<\/td>\n<\/tr>\n<tr>\n<td>首图<\/td>\n<td>清晰实拍图，白底/干净背景优先。可加3个关键词标签（如&quot;正品&quot;“包邮”“现货”）<\/td>\n<\/tr>\n<tr>\n<td>细节图<\/td>\n<td>多角度拍摄 + 瑕疵特写（二手品必须展示瑕疵，避免纠纷）<\/td>\n<\/tr>\n<tr>\n<td>视频<\/td>\n<td>强烈建议上传15-60秒商品展示视频，权重加成显著<\/td>\n<\/tr>\n<tr>\n<td>标签<\/td>\n<td>主图可添加卖点标签文字（限3个），如&quot;全新未拆&quot;“官方正品”“顺丰包邮”<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-94\">5.3 商品九宫格图片完整 SOP（通用模板 + 分类目差异）<\/h3><p>闲鱼未强制要求拍满 9 张（图片上限以发布页实际提示为准），但<strong>经营卖家（鱼小铺）建议拍满 9 张<\/strong>。九宫格的逻辑：<strong>首图抓点击率 → 中间图讲清成色、细节、瑕疵 → 末尾放配件 / 尺寸 / 场景<\/strong>。不同类目拍摄角度不同，但二手铁则只有一条：<strong>瑕疵必须实拍展示<\/strong>——隐瞒瑕疵属于违规，极易产生纠纷、退款与扣分（见 13.2、15.8）。<\/p>\n<h4>5.3.1 图片硬性规格（全部类目通用）<\/h4>\n<ul>\n<li><strong>分辨率<\/strong>：≥800×800px，优先 1:1 正方形，避免长条图被系统裁切。<\/li>\n<li><strong>必须实物实拍<\/strong>，禁止盗用网图、商家宣传图——盗图会侵权、限流、下架。<\/li>\n<li><strong>禁止<\/strong>：水印、微信 / 手机号、二维码、极限词贴纸（站外信息合规通道见 12.4）；不得过度美颜滤镜导致实物色差严重。<\/li>\n<li><strong>拍摄质量<\/strong>：光线充足、对焦清晰，主体居中，背景简洁无杂物抢主体。<\/li>\n<\/ul>\n<h4>5.3.2 通用九宫格顺序模板（大部分二手商品可直接套用）<\/h4>\n<table>\n<thead>\n<tr><th>序号<\/th><th>图片类型<\/th><th>拍摄角度与内容说明<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>第 1 张<\/td><td><strong>商品全貌主图<\/strong>（点击率核心）<\/td><td>45° 俯拍 / 正面平视；完整展示整体外观，干净背景，主体占画面 60–80%；<strong>不要用局部特写当首图<\/strong><\/td><\/tr>\n<tr><td>第 2 张<\/td><td>多角度全景<\/td><td>侧面 / 背面，展示轮廓、厚度、背面标签、刻印<\/td><\/tr>\n<tr><td>第 3 张<\/td><td>品牌 / Logo / 标识特写<\/td><td>logo、型号、标签、防伪刻印，拍清文字<\/td><\/tr>\n<tr><td>第 4 张<\/td><td>材质细节特写<\/td><td>材质纹理、做工细节；高客单价商品重点拍<\/td><\/tr>\n<tr><td>第 5 张<\/td><td><strong>瑕疵实拍图（强制）<\/strong><\/td><td>磨损、划痕、掉漆、污渍——哪里有问题拍哪里；<strong>无瑕疵则拍内衬 / 内里结构<\/strong><\/td><\/tr>\n<tr><td>第 6 张<\/td><td>全套配件 / 包装<\/td><td>盒子、说明书、赠品全部摆齐展示；无配件则补拍实物另一角度<\/td><\/tr>\n<tr><td>第 7 张<\/td><td>尺寸参照物<\/td><td>尺子、手机、硬币做参照体现实际大小；小件刚需，大件家具必拍<\/td><\/tr>\n<tr><td>第 8 张<\/td><td>凭证 / 成色佐证（可选）<\/td><td>购买订单截图（<strong>隐私打码<\/strong>）、验机报告；没有就拍实物细节<\/td><\/tr>\n<tr><td>第 9 张<\/td><td>场景使用图<\/td><td>生活化场景展示实际使用效果；<strong>场景图只做辅助，不能替代实物实拍<\/strong><\/td><\/tr>\n<\/tbody>\n<\/table>\n<blockquote>⚠️ <strong>场景图不能放第 1 张做主图<\/strong>：闲鱼买家优先要看商品本身，场景图放第 9 张做加分即可。<\/blockquote>\n<h4>5.3.3 分类目差异化调整（拍摄顺序按 ①→⑨ 对应上表）<\/h4>\n<table>\n<thead>\n<tr><th>类目<\/th><th>九张图拍摄要点（按顺序）<\/th><th>类目重点提醒<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>箱包 / 二奢包包<\/strong><\/td><td>① 完整 45° 实拍 → ② 侧面 → ③ Logo 五金刻印特写 → ④ 内里、内衬、序列号 → ⑤ <strong>瑕疵磨损特写（边角、底部必拍）<\/strong> → ⑥ 肩带、配件、防尘袋 → ⑦ 尺子测量（长×宽×高）→ ⑧ 购买凭证截图（隐私打码）→ ⑨ 日常通勤场景（放沙发 / 桌面，勿过度摆拍）<\/td><td>序列号 + 边角底部磨损是二奢纠纷高发点，务必实拍<\/td><\/tr>\n<tr><td><strong>数码电子（手机 / 平板 / 耳机）<\/strong><\/td><td>① 整机正面全貌 → ② 背面、边框 → ③ 接口、按键特写 → ④ <strong>开机屏幕显示实拍<\/strong> → ⑤ 划痕磕碰特写 → ⑥ 全套配件（充电器、盒子）→ ⑦ 序列号 / 型号标签 → ⑧ 验机报告实拍 → ⑨ 桌面使用场景<\/td><td>「开机实拍 + 验机报告」是数码件最能打消顾虑的两张<\/td><\/tr>\n<tr><td><strong>家居百货 / 小配件<\/strong>（破 0 引流款）<\/td><td>① 完整全貌 → ② 多角度 → ③ 材质细节 → ④ 细节做工 → ⑤ 有瑕疵拍瑕疵、无瑕疵拍细节 → ⑥ 配件套装 → ⑦ 尺寸参照物（手机对比）→ ⑧ 标签参数 → ⑨ 居家使用场景<\/td><td>低客单引流款也不能只放 1-2 张图，图少咨询转化反而低<\/td><\/tr>\n<tr><td><strong>K-POP 小卡 / 谷子（小卡、吧唧）<\/strong><\/td><td>① 小卡完整正面全貌 → ② 背面（印刷、钢印）→ ③ 边角细节 → ④ 表面划痕、凹点特写 → ⑤ 卡膜、卡套全套 → ⑥ 多张合集平铺全展示 → ⑦ 尺寸对比参照物 → ⑧ 专辑来源实拍 → ⑨ 收纳摆放场景<\/td><td>小卡交易对品相极敏感，划痕凹点必须拍清，避免到手纠纷<\/td><\/tr>\n<tr><td><strong>服饰鞋类<\/strong><\/td><td>① 平铺 / 上身实拍全貌 → ② 侧面版型 → ③ 领标水洗标 → ④ 面料纹理 → ⑤ 磨损、起球、污渍瑕疵 → ⑥ 扣子拉链配件 → ⑦ 尺码标签 → ⑧ 平铺细节 → ⑨ 穿搭场景<\/td><td>尺码标签 + 水洗标是服饰类信任凭证，缺了易被问「是不是原单」<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>5.3.4 违规与售后红线（不能踩的坑）<\/h4>\n<ul>\n<li>❌ <strong>不拍瑕疵、只拍好看角度<\/strong>：属隐瞒成色，买家收货极易申请退款，平台判卖家责任。<strong>只要有磨损划痕，必须至少一张瑕疵实拍图<\/strong>，不能只写在文字描述里。<\/li>\n<li>❌ <strong>9 张全是场景图、缺实物细节<\/strong>：买家看不清成色，咨询暴增、纠纷变多。<\/li>\n<li>❌ <strong>网图 / 商家宣传图当主图<\/strong>：盗图侵权，链接降权下架。<\/li>\n<li>❌ <strong>图片带微信、QQ、手机号、站外二维码<\/strong>：直接违规处罚（合规通道见 12.4）。<\/li>\n<li>❌ <strong>一张图重复 9 次、全同一角度<\/strong>：信息无效，降低曝光。<\/li>\n<li>❌ <strong>过度美颜、强滤镜致色差大<\/strong>：实物与图片不符，属描述不符。<\/li>\n<\/ul>\n<h4>5.3.5 上架前自检清单<\/h4>\n<ul>\n<li>□ 图片 ≥800px，1:1 优先，全部为本人实物实拍<\/li>\n<li>□ 第 1 张是商品完整全貌，不用细节图 / 场景图做主图<\/li>\n<li>□ 多角度齐全：正面、侧面、背面、logo 细节<\/li>\n<li>□ <strong>有瑕疵必须单独一张瑕疵特写<\/strong><\/li>\n<li>□ 配件、包装全部展示清楚<\/li>\n<li>□ 有尺寸需求的商品带尺子 / 手机参照物<\/li>\n<li>□ 最后一张放场景图（仅做辅助）<\/li>\n<li>□ 无水印、无站外联系方式、无极限词贴纸<\/li>\n<\/ul>\n<blockquote>💡 <strong>凑不齐 9 张怎么办<\/strong>：全新无损小物件可只上 5–6 张，<strong>不要硬凑无效重复图片<\/strong>——信息量比张数更重要。<\/blockquote>\n<h3 id=\"sec-20\">5.4 文案结构<\/h3><table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>内容<\/th>\n<th>字数<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>首段（70字内）<\/td>\n<td>核心卖点+关键词自然嵌入。例：“自用iPhone 14 Pro暗紫色256G，国行版本……”<\/td>\n<td>≤70字<\/td>\n<\/tr>\n<tr>\n<td>中段<\/td>\n<td>详细参数、使用情况、瑕疵说明、配件清单<\/td>\n<td>不限<\/td>\n<\/tr>\n<tr>\n<td>末段<\/td>\n<td>交易须知（是否议价、发货时间、退换政策）+ 引导语<\/td>\n<td>简洁<\/td>\n<\/tr>\n<tr>\n<td>标签区<\/td>\n<td>#话题标签 3-5个（如 #苹果手机 #学生党好物 #闲置出清）<\/td>\n<td>3-5个<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-21\">5.5 发布时间与频率<\/h3><table>\n<thead>\n<tr>\n<th>要素<\/th>\n<th>最佳实践<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>每日发布时间<\/td>\n<td>早 7:00-9:00、午 12:00-14:00、晚 19:00-22:00（三大黄金时段）<\/td>\n<\/tr>\n<tr>\n<td>发布间隔<\/td>\n<td>每个商品间隔 ≥ 20分钟，均匀分布全天<\/td>\n<\/tr>\n<tr>\n<td>每日数量<\/td>\n<td>建议 5-10个/天，持续发布优于一次性大量发布<\/td>\n<\/tr>\n<tr>\n<td>擦亮时机<\/td>\n<td>每日 1 次免费擦亮；官方未规定时段，按自己商品后台的浏览分布选择时段<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-22\">5.6 定价策略<\/h3><table>\n<thead>\n<tr>\n<th>策略<\/th>\n<th>方法<\/th>\n<th>适用场景<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>非整数定价<\/td>\n<td>19.9元、29.8元、198元<\/td>\n<td>通用，降低价格敏感度<\/td>\n<\/tr>\n<tr>\n<td>运费拆分<\/td>\n<td>❌ 已不建议：标价 0.1 元 + 高运费属「虚假低价引流」<\/td>\n<td>2026 年平台严查超低标价引流，会直接限流降权；真实低价请用多规格/阶梯价呈现<\/td>\n<\/tr>\n<tr>\n<td>阶梯定价(3:5:2)<\/td>\n<td>高价30% + 中价50% + 引流款20%<\/td>\n<td>全店商品布局<\/td>\n<\/tr>\n<tr>\n<td>组合促销<\/td>\n<td>买二送一、满减、加价购<\/td>\n<td>提升客单价<\/td>\n<\/tr>\n<tr>\n<td>拍下立减<\/td>\n<td>设置拍下自动减价<\/td>\n<td>提高转化率<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 5.1 标题优化（核心） 闲鱼搜索算法基于标题关键词匹配。标题 = 流量入口，写好标题等于免费的搜索排名。 要素 说明 示例 品牌词 品牌/系列名称，必含 苹果、华为、Nike 产品词 商品品类名称 手机、连衣裙、书桌 修饰词 属性/状态描述 全新、九成新、包邮、清仓 热搜词 当前平台热搜关键词 学生党、ins风、复古、平替 长尾词 精准细分场景词 考研用、租房必备、送礼推荐 标题公式：品牌词 + 产品词 + 修饰词 + 热搜词 + 长尾词（填满30字） 示例：「苹果iPhone 14 Pro 256G 暗紫色 国行九成新 学生党自用 顺丰包邮 可小刀」 5.2 主图规范 要求 说明 数量 建议上传 6-9 张，越多越好 首图 清晰实拍图，白底/干净背景优先。可加3个关键词标签（如\"正品\"“包邮”“现货”） 细节图 多角度拍摄 + 瑕疵特写（二手品必须展示瑕疵，避免纠纷） 视频 强烈建议上传15-60秒商品展示视频，权重加成显著 标签 主图可添加卖点标签文字（限3个），如\"全新未拆\"“官方正品”“顺丰包邮” 5.3 商品九宫格图片完整 SOP（通用模板 + 分类目差异） 闲鱼未强制要求拍满 9 张（图片上限以发布页实际提示为准），但 经营卖家（鱼小铺）建议拍满 9 张 。九宫格的逻辑： 首图抓点击率 → 中间图讲清成色、细节、瑕疵 → 末尾放配件 / 尺寸 / 场景 。不同类目拍摄角度不同，但二手铁则只有一条： 瑕疵必须实拍展示 ——隐瞒瑕疵属于违规，极易产生纠纷、退款与扣分（见 13.2、15.8）。 5.3.1 图片硬性规格（全部类目通用） 分辨率 ：≥800×800px，优先 1:1 正方形，避免长条图被系统裁切。 必须实物实拍 ，禁止盗用网图、商家宣传图——盗图会侵权、限流、下架。 禁止 ：水印、微信 / 手机号、二维码、极限词贴纸（站外信息合规通道见 12.4）；不得过度美颜滤镜导致实物色差严重。 拍摄质量 ：光线充足、对焦清晰，主体居中，背景简洁无杂物抢主体。 5.3.2 通用九宫格顺序模板（大部分二手商品可直接套用） 序号 图片类型 拍摄角度与内容说明 第 1 张 商品全貌主图 （点击率核心） 45° 俯拍 / 正面平视；完整展示整体外观，干净背景，主体占画面 60–80%； 不要用局部特写当首图 第 2 张 多角度全景 侧面 / 背面，展示轮廓、厚度、背面标签、刻印 第 3 张 品牌 / Logo / 标识特写 logo、型号、标签、防伪刻印，拍清文字 第 4 张 材质细节特写 材质纹理、做工细节；高客单价商品重点拍 第 5 张 瑕疵实拍图（强制） 磨损、划痕、掉漆、污渍——哪里有问题拍哪里； 无瑕疵则拍内衬 / 内里结构 第 6 张 全套配件 / 包装 盒子、说明书、赠品全部摆齐展示；无配件则补拍实物另一角度 第 7 张 尺寸参照物 尺子、手机、硬币做参照体现实际大小；小件刚需，大件家具必拍 第 8 张 凭证 / 成色佐证（可选） 购买订单截图（ 隐私打码 ）、验机报告；没有就拍实物细节 第 9 张 场景使用图 生活化场景展示实际使用效果； 场景图只做辅助，不能替代实物实拍 ⚠️ 场景图不能放第 1 张做主图 ：闲鱼买家优先要看商品本身，场景图放第 9 张做加分即可。 5.3.3 分类目差异化调整（拍摄顺序按 ①→⑨ 对应上表） 类目 九张图拍摄要点（按顺序） 类目重点提醒 箱包 / 二奢包包 ① 完整 45° 实拍 → ② 侧面 → ③ Logo 五金刻印特写 → ④ 内里、内衬、序列号 → ⑤ 瑕疵磨损特写（边角、底部必拍） → ⑥ 肩带、配件、防尘袋 → ⑦ 尺子测量（长×宽×高）→ ⑧ 购买凭证截图（隐私打码）→ ⑨ 日常通勤场景（放沙发 / 桌面，勿过度摆拍） 序列号 + 边角底部磨损是二奢纠纷高发点，务必实拍 数码电子（手机 / 平板 / 耳机） ① 整机正面全貌 → ② 背面、边框 → ③ 接口、按键特写 → ④ 开机屏幕显示实拍 → ⑤ 划痕磕碰特写 → ⑥ 全套配件（充电器、盒子）→ ⑦ 序列号 / 型号标签 → ⑧ 验机报告实拍 → ⑨ 桌面使用场景 「开机实拍 + 验机报告」是数码件最能打消顾虑的两张 家居百货 / 小配件 （破 0 引流款） ① 完整全貌 → ② 多角度 → ③ 材质细节 → ④ 细节做工 → ⑤ 有瑕疵拍瑕疵、无瑕疵拍细节 → ⑥ 配件套装 → ⑦ 尺寸参照物（手机对比）→ ⑧ 标签参数 → ⑨ 居家使用场景 低客单引流款也不能只放 1-2 张图，图少咨询转化反而低 K-POP 小卡 / 谷子（小卡、吧唧） ① 小卡完整正面全貌 → ② 背面（印刷、钢印）→ ③ 边角细节 → ④ 表面划痕、凹点特写 → ⑤ 卡膜、卡套全套 → ⑥ 多张合集平铺全展示 → ⑦ 尺寸对比参照物 → ⑧ 专辑来源实拍 → ⑨ 收纳摆放场景 小卡交易对品相极敏感，划痕凹点必须拍清，避免到手纠纷 服饰鞋类 ① 平铺 / 上身实拍全貌 → ② 侧面版型 → ③ 领标水洗标 → ④ 面料纹理 → ⑤ 磨损、起球、污渍瑕疵 → ⑥ 扣子拉链配件 → ⑦ 尺码标签 → ⑧ 平铺细节 → ⑨ 穿搭场景 尺码标签 + 水洗标是服饰类信任凭证，缺了易被问「是不是原单」 5.3.4 违规与售后红线（不能踩的坑） ❌ 不拍瑕疵、只拍好看角度 ：属隐瞒成色，买家收货极易申请退款，平台判卖家责任。 只要有磨损划痕，必须至少一张瑕疵实拍图 ，不能只写在文字描述里。 ❌ 9 张全是场景图、缺实物细节 ：买家看不清成色，咨询暴增、纠纷变多。 ❌ 网图 / 商家宣传图当主图 ：盗图侵权，链接降权下架。 ❌ 图片带微信、QQ、手机号、站外二维码 ：直接违规处罚（合规通道见 12.4）。 ❌ 一张图重复 9 次、全同一角度 ：信息无效，降低曝光。 ❌ 过度美颜、强滤镜致色差大 ：实物与图片不符，属描述不符。 5.3.5 上架前自检清单 □ 图片 ≥800px，1:1 优先，全部为本人实物实拍 □ 第 1 张是商品完整全貌，不用细节图 / 场景图做主图 □ 多角度齐全：正面、侧面、背面、logo 细节 □ 有瑕疵必须单独一张瑕疵特写 □ 配件、包装全部展示清楚 □ 有尺寸需求的商品带尺子 / 手机参照物 □ 最后一张放场景图（仅做辅助） □ 无水印、无站外联系方式、无极限词贴纸 💡 凑不齐 9 张怎么办 ：全新无损小物件可只上 5–6 张， 不要硬凑无效重复图片 ——信息量比张数更重要。 5.4 文案结构 段落 内容 字数 首段（70字内） 核心卖点+关键词自然嵌入。例：“自用iPhone 14 Pro暗紫色256G，国行版本……” ≤70字 中段 详细参数、使用情况、瑕疵说明、配件清单 不限 末段 交易须知（是否议价、发货时间、退换政策）+ 引导语 简洁 标签区 #话题标签 3-5个（如 #苹果手机 #学生党好物 #闲置出清） 3-5个 5.5 发布时间与频率 要素 最佳实践 每日发布时间 早 7:00-9:00、午 12:00-14:00、晚 19:00-22:00（三大黄金时段） 发布间隔 每个商品间隔 ≥ 20分钟，均匀分布全天 每日数量 建议 5-10个/天，持续发布优于一次性大量发布 擦亮时机 每日 1 次免费擦亮；官方未规定时段，按自己商品后台的浏览分布选择时段 5.6 定价策略 策略 方法 适用场景 非整数定价 19.9元、29.8元、198元 通用，降低价格敏感度 运费拆分 ❌ 已不建议：标价 0.1 元 + 高运费属「虚假低价引流」 2026 年平台严查超低标价引流，会直接限流降权；真实低价请用多规格/阶梯价呈现 阶梯定价(3:5:2) 高价30% + 中价50% + 引流款20% 全店商品布局 组合促销 买二送一、满减、加价购 提升客单价 拍下立减 设置拍下自动减价 提高转化率","toc":[{"id":"sec-18","title":"5.1 标题优化（核心）"},{"id":"sec-19","title":"5.2 主图规范"},{"id":"sec-94","title":"5.3 商品九宫格图片完整 SOP（通用模板 + 分类目差异）"},{"id":"sec-20","title":"5.4 文案结构"},{"id":"sec-21","title":"5.5 发布时间与频率"},{"id":"sec-22","title":"5.6 定价策略"}],"meta":{"publish_time":"","source":"小渔数科闲参谋","tables":7,"imgs":0,"words":3349,"sections":6,"subs":5,"version":"V2026.10.12"},"related":["sec-23","sec-62","sec-2","sec-86"]},{"id":"a498416974513541","kind":"article","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"标题描述与图片优化","title":"如何更好地描述宝贝","title_raw":"如何更好地描述宝贝","html":"<p><span style=\"color: rgb(34, 34, 34);\">更好的描述内容能带来更好的成交和关注，本期就来说说如何更好地描述宝贝。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">一、宝贝标题和正文表达完整<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 标题突出宝贝亮点信息<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">通过标题让买家快速知道你在卖什么，你卖的宝贝优势是什么。比如品牌名、商品名、是否全新、是否包邮、折扣率等。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">同时，首页推荐、搜索、猜你喜欢等位置可展示的文字行数如下，建议宝贝亮点信息往前放，尽量可以展示出来，吸引用户点击。<\/span><\/p><p><img src=\"assets/img/112221-2526nzar-b1fd41.png\"><img src=\"assets/img/112223-8139pvpk-cf774a.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 正文描述宝贝优势<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">正文可以传递宝贝渠道来源、商品特征等，通过表达商品优势（低价、稀缺）引导用户购买。<\/span><\/p><p><img src=\"assets/img/112244-8530awyv-88b09b.png\"><img src=\"assets/img/112249-0284hmck-ab61f9.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">3. 正文还可引导关注<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">如果想吸粉，也可以在正文中做用户的引导关注。怎么做呢？如正文中告诉大家宝贝的问题都可以咨询（大家可能会觉得你热心、专业）。如正文中说明每月几号都会做活动，关注我可以获得及时获得最优惠的价格（用优惠去吸引用户）。引导用户关注你，这样发布的宝贝粉丝都会收到消息，可以增加宝贝的曝光和卖出的机会。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">二、宝贝图片使用高清实拍图<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 主图是宝贝正面全景照<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">主图会随着宝贝的曝光而展示出来。尤其为非标品，建议主图为宝贝正面全景照，辅助标题去完善宝贝信息。<\/span><\/p><p><img src=\"assets/img/112317-1190pvci-1fa8ab.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 其他图片补充说明<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">首图后面添加宝贝细节图，可以是衣服的标签、护肤品的规格保质期、二手手机的各个侧面等重点要展示的区域图片。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3. 可以拍视频<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">可以拍视频全方位展示宝贝，也可以在拍视频的同时做一些内容讲解。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">三、宝贝价格真实<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">宝贝价格标注实价，不要写0.01元或者1000万这种一看就不是宝贝价格的数字。如果宝贝价格会随着市场上下浮动，可以标注大致价格，然后宝贝描述中说明价格可能会浮动，以实际咨询为准。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">四、打开消息推送<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">最后别忘了打开闲鱼的消息推送，当出现买家留言、私聊、拍下等行为，可以第一时间进行沟通。打开路径：我的-右上角（设置）-新消息通知-消息推送设置中打开。<\/span><\/p><p><img src=\"assets/img/112342-6700wdkd-cc401f.png\"><\/p>","text":"更好的描述内容能带来更好的成交和关注，本期就来说说如何更好地描述宝贝。 一、宝贝标题和正文表达完整 1. 标题突出宝贝亮点信息 通过标题让买家快速知道你在卖什么，你卖的宝贝优势是什么。比如品牌名、商品名、是否全新、是否包邮、折扣率等。 同时，首页推荐、搜索、猜你喜欢等位置可展示的文字行数如下，建议宝贝亮点信息往前放，尽量可以展示出来，吸引用户点击。 2. 正文描述宝贝优势 正文可以传递宝贝渠道来源、商品特征等，通过表达商品优势（低价、稀缺）引导用户购买。 3. 正文还可引导关注 如果想吸粉，也可以在正文中做用户的引导关注。怎么做呢？如正文中告诉大家宝贝的问题都可以咨询（大家可能会觉得你热心、专业）。如正文中说明每月几号都会做活动，关注我可以获得及时获得最优惠的价格（用优惠去吸引用户）。引导用户关注你，这样发布的宝贝粉丝都会收到消息，可以增加宝贝的曝光和卖出的机会。 二、宝贝图片使用高清实拍图 1. 主图是宝贝正面全景照 主图会随着宝贝的曝光而展示出来。尤其为非标品，建议主图为宝贝正面全景照，辅助标题去完善宝贝信息。 2. 其他图片补充说明 首图后面添加宝贝细节图，可以是衣服的标签、护肤品的规格保质期、二手手机的各个侧面等重点要展示的区域图片。 3. 可以拍视频 可以拍视频全方位展示宝贝，也可以在拍视频的同时做一些内容讲解。 三、宝贝价格真实 宝贝价格标注实价，不要写0.01元或者1000万这种一看就不是宝贝价格的数字。如果宝贝价格会随着市场上下浮动，可以标注大致价格，然后宝贝描述中说明价格可能会浮动，以实际咨询为准。 四、打开消息推送 最后别忘了打开闲鱼的消息推送，当出现买家留言、私聊、拍下等行为，可以第一时间进行沟通。打开路径：我的-右上角（设置）-新消息通知-消息推送设置中打开。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":6,"words":754,"sections":0,"subs":0,"version":""},"related":["sec-23","a498423363646853","a498411243476357","a498417645995397"]},{"id":"a498415052670277","kind":"article","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"标题描述与图片优化","title":"宝贝置顶，曝光加倍","title_raw":"宝贝置顶，曝光加倍","html":"<p><strong class=\"ql-size-16px\">一、什么是宝贝置顶?<\/strong><\/p><p>就是把你众多在售宝贝中的一个，放在第一个宝贝展示位置。当买家进入你的闲鱼号主页时，可以第一眼看到它。<\/p><p><strong class=\"ql-size-16px\">二、如何操作宝贝置顶?<\/strong><\/p><p>在闲鱼号主页选择想置顶的分组，长按想置顶的宝贝，当页面出现“置顶宝贝”提示时，点击即可置顶。当页面出现“宝贝置顶成功~\"的提示时，说明置顶成功。<\/p><p><img src=\"assets/img/111342-4026iopm-ca2040.png\"><\/p><p><strong class=\"ql-size-16px\">三、如何取消宝贝置顶?<\/strong><\/p><p>长按已置顶的宝贝，当页面出现“取消置顶“提示时，点击即可取消置顶。当页面出现“已取消宝贝置顶~”的提示时，说明取消成功。<\/p><p><img src=\"assets/img/111437-9800pxah-ba821c.png\"><\/p><p>值得注意的是，当操作置顶成功或者取消成功后，可能会存在延迟的情况。您可以退出闲鱼号主页再进入，可以看到宝贝置顶或者取消置顶的宝贝已不再第一个展示位置。<\/p>","text":"一、什么是宝贝置顶? 就是把你众多在售宝贝中的一个，放在第一个宝贝展示位置。当买家进入你的闲鱼号主页时，可以第一眼看到它。 二、如何操作宝贝置顶? 在闲鱼号主页选择想置顶的分组，长按想置顶的宝贝，当页面出现“置顶宝贝”提示时，点击即可置顶。当页面出现“宝贝置顶成功~\"的提示时，说明置顶成功。 三、如何取消宝贝置顶? 长按已置顶的宝贝，当页面出现“取消置顶“提示时，点击即可取消置顶。当页面出现“已取消宝贝置顶~”的提示时，说明取消成功。 值得注意的是，当操作置顶成功或者取消成功后，可能会存在延迟的情况。您可以退出闲鱼号主页再进入，可以看到宝贝置顶或者取消置顶的宝贝已不再第一个展示位置。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":2,"words":295,"sections":0,"subs":0,"version":""},"related":["sec-17","sec-23"]}]},{"module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"发布避雷与抽奖规范","color":"orange","count":3,"items":[{"id":"a498420279600517","kind":"article","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"发布避雷与抽奖规范","title":"闲鱼宝贝发布避雷指南","title_raw":"闲鱼宝贝发布避雷指南","html":"<p><img src=\"assets/img/113713-8231sony-420c01.png\"><\/p>","text":"","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":1,"words":0,"sections":0,"subs":0,"version":""},"related":["sec-23","sec-17"]},{"id":"a498417978037637","kind":"article","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"发布避雷与抽奖规范","title":"粉丝抽奖活动规范说明","title_raw":"粉丝抽奖活动规范说明","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">一、活动奖品要求<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 描述清晰<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">详细描述活动奖品属性，尽可能避免因描述不准确导致的双方扯皮；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">单个奖品价值不得大于49999元。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 仅支持实物奖品<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">活动奖品符合《闲鱼社区信息发布规范》；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">因为虚拟物品没有物流信息，易产生欺诈和纠纷，仅支持实物奖品。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3. 不得向中奖用户收取邮费等费用<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">活动发起方不得以任何理由单方面收取额外费用（除买卖双方在聊天沟通中协商一致外）。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">二、活动履约<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 活动不得随意更改或删除；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 需要在中奖用户填写收货地址后7天内发放奖品。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">三、活动违规判定<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">以下行为一律视为违规：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 违法违规：利用活动进行洗钱、套现、诈骗等违法违规的行为；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 违规附加领奖条件：以邮费、税费、优惠使用费等任何方式理由，收取获奖用户费用；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3. 以虚假活动诱导用户信息收集：在活动中利用虚假抽奖等方式收集用户信息，或以抽奖的名义超出合理必要范围收集用户信息；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">4. 违规泄露用户隐私：泄露任何活动参与者个人隐私信息，擅自将活动参与者个人隐私信息公布，或提供给第三方都将被视为泄露用户隐私；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">5. 恶意活动：发布虚假交易、可能损害他方利益、或带有人身及名誉攻击目的的活动；发布涉及用户欺诈，可能造成用户经济利益损失的活动；发布带有不正当竞争目的的活动；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">6. 篡改活动：活动生效后随意更改活动规则，增加附加条件，擅自删除活动等任何修改活动的行为；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">7. 发奖逾期：中奖用户填写收货信息后，活动发起方超过7天未发奖视作发奖逾期；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">8. 虚假发货：活动发起方发货后，须及时填写真实有效的物流信息，物流信息造假视为虚假发货；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">9. 私自替换奖品：活动所发放的奖品与活动生效时描述的奖品不一致，私自替换奖品视为违规。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\"><span class=\"ql-cursor\"><\/span><\/span><\/p><p><stro
