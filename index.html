ng style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">四、活动违规处理<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 限制或回收抽奖工具的使用权益；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 违规情节恶劣、后果严重的，将按闲鱼相关违规规范进行处罚。<\/span><\/p>","text":"一、活动奖品要求 1. 描述清晰 详细描述活动奖品属性，尽可能避免因描述不准确导致的双方扯皮； 单个奖品价值不得大于49999元。 2. 仅支持实物奖品 活动奖品符合《闲鱼社区信息发布规范》； 因为虚拟物品没有物流信息，易产生欺诈和纠纷，仅支持实物奖品。 3. 不得向中奖用户收取邮费等费用 活动发起方不得以任何理由单方面收取额外费用（除买卖双方在聊天沟通中协商一致外）。 二、活动履约 1. 活动不得随意更改或删除； 2. 需要在中奖用户填写收货地址后7天内发放奖品。 三、活动违规判定 以下行为一律视为违规： 1. 违法违规：利用活动进行洗钱、套现、诈骗等违法违规的行为； 2. 违规附加领奖条件：以邮费、税费、优惠使用费等任何方式理由，收取获奖用户费用； 3. 以虚假活动诱导用户信息收集：在活动中利用虚假抽奖等方式收集用户信息，或以抽奖的名义超出合理必要范围收集用户信息； 4. 违规泄露用户隐私：泄露任何活动参与者个人隐私信息，擅自将活动参与者个人隐私信息公布，或提供给第三方都将被视为泄露用户隐私； 5. 恶意活动：发布虚假交易、可能损害他方利益、或带有人身及名誉攻击目的的活动；发布涉及用户欺诈，可能造成用户经济利益损失的活动；发布带有不正当竞争目的的活动； 6. 篡改活动：活动生效后随意更改活动规则，增加附加条件，擅自删除活动等任何修改活动的行为； 7. 发奖逾期：中奖用户填写收货信息后，活动发起方超过7天未发奖视作发奖逾期； 8. 虚假发货：活动发起方发货后，须及时填写真实有效的物流信息，物流信息造假视为虚假发货； 9. 私自替换奖品：活动所发放的奖品与活动生效时描述的奖品不一致，私自替换奖品视为违规。 四、活动违规处理 1. 限制或回收抽奖工具的使用权益； 2. 违规情节恶劣、后果严重的，将按闲鱼相关违规规范进行处罚。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":774,"sections":0,"subs":0,"version":""},"related":["sec-23","a498832766117253","a499946761471365","a498773110658437"]},{"id":"a498417787647365","kind":"article","module":"商品运营","module_sub":"卖货篇 · 把商品做对","section":"发布避雷与抽奖规范","title":"粉丝抽奖注意事项","title_raw":"粉丝抽奖注意事项","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">抽奖工具使用反馈<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">有用户反馈抽奖宝贝为单库存，抽奖结束宝贝却没有下架，导致他人拍下。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">注意：为了让抽奖活动有更大的曝光，所以活动和宝贝是绑定展示的。但交易是分开的，也就是抽奖活动产生中奖者，单库存宝贝也不会自动下架。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 抽奖后宝贝链接第一时间下架。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 抽奖宝贝设置原价。避免低价如0.01元粉丝福利宝贝被他人抢拍。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3. 抽奖宝贝页面增加说明。说明该宝贝为粉丝福利宝贝，用于粉丝抽奖活动使用，非中奖者拍下不发货。<\/span><\/p>","text":"抽奖工具使用反馈 有用户反馈抽奖宝贝为单库存，抽奖结束宝贝却没有下架，导致他人拍下。 注意：为了让抽奖活动有更大的曝光，所以活动和宝贝是绑定展示的。但交易是分开的，也就是抽奖活动产生中奖者，单库存宝贝也不会自动下架。 1. 抽奖后宝贝链接第一时间下架。 2. 抽奖宝贝设置原价。避免低价如0.01元粉丝福利宝贝被他人抢拍。 3. 抽奖宝贝页面增加说明。说明该宝贝为粉丝福利宝贝，用于粉丝抽奖活动使用，非中奖者拍下不发货。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":210,"sections":0,"subs":0,"version":""},"related":["sec-23","sec-62","sec-86","sec-30"]}]},{"module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"流量全景与推荐机制","color":"blue","count":5,"items":[{"id":"a498440392717701","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"流量全景与推荐机制","title":"【卖家攻略之流量专题】一期","title_raw":"【卖家攻略之流量专题】一期","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">1、商品流量曝光构成<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">闲鱼商品的流量曝光主要来自于以下几个场景：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●搜索：在买家输入搜索词之后，经过系统挑选排序的商品展示列表。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●首页推荐：闲鱼首页推荐页面下方的商品展示列表。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●详情页推荐：商品详情页下方的商品展示列表。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●同城推荐：闲鱼首页右侧同城页面（通常是用户当前所在城市）下方的商品列表。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●其他：如营销活动、闲鱼币等。<\/span><\/p><p><img src=\"assets/img/125757-8397hold-3fcd82.png\"><img src=\"assets/img/125812-0932uyai-a48402.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">2、各个场景的流量情况<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">整体来看，各个场景的商品流量占比从高到低：搜索&gt;首页推荐&gt;详情页推荐&gt;同城推荐&gt;其他场景，其中搜索、首页推荐和详情页推荐这3个场景是卖家获取流量的主要来源。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">3、各个流量场景如何选取商品<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">●搜索：根据买家搜索关键词，优先展示商品标题和详情描述中跟关键词相关的商品。因此商品标题和描述中的关键词要足够精准且不堆砌，这样才能被搜索词关联以获得曝光机会。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●首页推荐和详情页推荐：推荐场景会优先推荐买家之前看过的同类相关商品，可以通过鱼小铺工作台查看缺货榜信息，发布平台欠缺或者增长较快的商品。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">●同城推荐：会根据发布商品时填写的真实准确地理位置，进行同城推荐展示。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">4、不同类目商品的流量来源分布<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">不同的品类有不同的场景流量特性，部分品类的流量构成示例：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">1）手机、动漫模玩和卡券等买家需求较为明确的品类：搜索场景是获取流量的主要来源，用户更喜欢通过搜索有目的地挑选商品，因此更精准的描述你的商品关键词会有助于流量增长。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2）女装服饰等非标准化品类：在首页推荐和详情页推荐这2个场景是获取流量的主要来源，用户更偏好逛逛来找到心仪的商品。因此让你的商品积累更多的“浏览”和“收藏”会有助于流量增长。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3）住宅家具等大件品类：相较其他品类，在同城推荐场的流量占比要更多。因此让你的商品定位到更精准的地理位置会有助于交易成功。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">5、商品曝光数据的查看路径<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1）我的→我发布的→今日曝光：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">可以查看自己店铺整体的曝光数据和在卖商品的曝光浏览数据，另外还可以通过“一键擦亮”和“闲鱼币推广”获取更多曝光机会。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2）商品详情页：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">在商品详情页可以看单个商品的浏览数据和想要购买的买家数据。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3）鱼小铺工作台：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">进入鱼小铺工作台核心数据版块，查看商品浏览情况、商品分布、订单情况等数据。<\/span><\/p><p><img src=\"assets/img/125850-4587ampj-374a4e.png\"><\/p>","text":"1、商品流量曝光构成 闲鱼商品的流量曝光主要来自于以下几个场景： ●搜索：在买家输入搜索词之后，经过系统挑选排序的商品展示列表。 ●首页推荐：闲鱼首页推荐页面下方的商品展示列表。 ●详情页推荐：商品详情页下方的商品展示列表。 ●同城推荐：闲鱼首页右侧同城页面（通常是用户当前所在城市）下方的商品列表。 ●其他：如营销活动、闲鱼币等。 2、各个场景的流量情况 整体来看，各个场景的商品流量占比从高到低：搜索>首页推荐>详情页推荐>同城推荐>其他场景，其中搜索、首页推荐和详情页推荐这3个场景是卖家获取流量的主要来源。 3、各个流量场景如何选取商品 ●搜索：根据买家搜索关键词，优先展示商品标题和详情描述中跟关键词相关的商品。因此商品标题和描述中的关键词要足够精准且不堆砌，这样才能被搜索词关联以获得曝光机会。 ●首页推荐和详情页推荐：推荐场景会优先推荐买家之前看过的同类相关商品，可以通过鱼小铺工作台查看缺货榜信息，发布平台欠缺或者增长较快的商品。 ●同城推荐：会根据发布商品时填写的真实准确地理位置，进行同城推荐展示。 4、不同类目商品的流量来源分布 不同的品类有不同的场景流量特性，部分品类的流量构成示例： 1）手机、动漫模玩和卡券等买家需求较为明确的品类：搜索场景是获取流量的主要来源，用户更喜欢通过搜索有目的地挑选商品，因此更精准的描述你的商品关键词会有助于流量增长。 2）女装服饰等非标准化品类：在首页推荐和详情页推荐这2个场景是获取流量的主要来源，用户更偏好逛逛来找到心仪的商品。因此让你的商品积累更多的“浏览”和“收藏”会有助于流量增长。 3）住宅家具等大件品类：相较其他品类，在同城推荐场的流量占比要更多。因此让你的商品定位到更精准的地理位置会有助于交易成功。 5、商品曝光数据的查看路径 1）我的→我发布的→今日曝光： 可以查看自己店铺整体的曝光数据和在卖商品的曝光浏览数据，另外还可以通过“一键擦亮”和“闲鱼币推广”获取更多曝光机会。 2）商品详情页： 在商品详情页可以看单个商品的浏览数据和想要购买的买家数据。 3）鱼小铺工作台： 进入鱼小铺工作台核心数据版块，查看商品浏览情况、商品分布、订单情况等数据。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":3,"words":913,"sections":0,"subs":0,"version":""},"related":["sec-43","sec-30","sec-52","sec-34"]},{"id":"a498458897921413","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"流量全景与推荐机制","title":"【卖家攻略之流量专题】七期","title_raw":"【卖家攻略之流量专题】七期","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">1、平台鼓励的几种类型<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">优质供给：缺货榜、趋势榜、爆卖榜等。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">服务价值：描述不符包邮退、7天无理由退货、验货宝、放心充等。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">流量机制升级：激励与自然流量的联动。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">负向体验治理：虚假价格引流、站外引流、重复铺货、纯信息代挂等。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">2、优质供给<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">平台鼓励：多类优质供给在平台的成长。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">当商品满足优质供给标准，其流量会加速成长：一方面优质供给自然流量就有优势，另一方面平台会给予额外流量加成。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">优质供给的定义：如缺货榜、趋势榜，后续会逐步放开优质供给定义，敬请持续关注鱼小铺工作台。<\/span><\/p><p><img src=\"assets/img/141250-6595wchc-d537e7.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡tips：发布平台定义的优质供给商品，能够获得自然流量和额外流量加成。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">3、服务价值<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">为加深用户与卖家、平台之间的信任感，鼓励卖家商品满足服务标准，共赢消费者体验。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">平台对不同品类，有不同的行业解决方案，用于更好地服务用户的交易体验。符合服务标准的商品在搜索结果页会被打上对应的标签，有助于增加用户对这些商品的信任感，从数据上看这些商品的流量转化效率也较高。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">问：有哪些服务标准呢？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">答：包括但不限于验货宝、放心充、描述不符包邮退、七天无理由退货、包邮、24小时发货……<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">这些服务可以在这些地方找到：<\/span><\/p><p><img src=\"assets/img/141314-7574kimw-a682ea.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡tips：让商品满足更多服务标准，以此获得用户信任和流量效果提升。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">4、流量机制升级<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">平台鼓励：优质商品的流量稳定增长。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品的自然流量受多种因素影响，如市场需求波动、产品更新换代、服装换季等。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">当商品自然流量下降时，可以通过灵活运用流量工具做补充，以达到稳定流量和稳定转化效率的目的。当商品自然流量已处于稳定状态时，也可以通过流量工具继续提升流量，打造爆款，进一步增效。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">现阶段平台提供的流量工具即是「曝光卡」，可以通过完成对应的卖家任务、闲鱼币频道获取流量面额不等的「曝光卡」。「曝光卡」当前只能用于个人选定的商品，将来会陆续实现平台推荐投放商品以提高额外增加流量的转化效率。该功能目前筹备中，将于9月份上线。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡tips：商品自然流量下降时，使用曝光卡可以稳定流量基本盘；商品自然流量稳定或上升时，使用曝光卡可以打造爆款。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">5、负向体验治理<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">平台针对影响用户体验的违规作弊行为做治理，采用降流等手段进行管控，以达到稳定市场秩序、促进良序竞争的目的。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">以下是当前搜索重点治理的几类负向体验：<\/span><\/p><p><img src=\"assets/img/141413-5596hmmt-12ea94.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡tips：避免触碰负向治理红线，是在平台实现长久经营之大计。<\/span><\/p>","text":"1、平台鼓励的几种类型 优质供给：缺货榜、趋势榜、爆卖榜等。 服务价值：描述不符包邮退、7天无理由退货、验货宝、放心充等。 流量机制升级：激励与自然流量的联动。 负向体验治理：虚假价格引流、站外引流、重复铺货、纯信息代挂等。 2、优质供给 平台鼓励：多类优质供给在平台的成长。 当商品满足优质供给标准，其流量会加速成长：一方面优质供给自然流量就有优势，另一方面平台会给予额外流量加成。 优质供给的定义：如缺货榜、趋势榜，后续会逐步放开优质供给定义，敬请持续关注鱼小铺工作台。 💡tips：发布平台定义的优质供给商品，能够获得自然流量和额外流量加成。 3、服务价值 为加深用户与卖家、平台之间的信任感，鼓励卖家商品满足服务标准，共赢消费者体验。 平台对不同品类，有不同的行业解决方案，用于更好地服务用户的交易体验。符合服务标准的商品在搜索结果页会被打上对应的标签，有助于增加用户对这些商品的信任感，从数据上看这些商品的流量转化效率也较高。 问：有哪些服务标准呢？ 答：包括但不限于验货宝、放心充、描述不符包邮退、七天无理由退货、包邮、24小时发货…… 这些服务可以在这些地方找到： 💡tips：让商品满足更多服务标准，以此获得用户信任和流量效果提升。 4、流量机制升级 平台鼓励：优质商品的流量稳定增长。 商品的自然流量受多种因素影响，如市场需求波动、产品更新换代、服装换季等。 当商品自然流量下降时，可以通过灵活运用流量工具做补充，以达到稳定流量和稳定转化效率的目的。当商品自然流量已处于稳定状态时，也可以通过流量工具继续提升流量，打造爆款，进一步增效。 现阶段平台提供的流量工具即是「曝光卡」，可以通过完成对应的卖家任务、闲鱼币频道获取流量面额不等的「曝光卡」。「曝光卡」当前只能用于个人选定的商品，将来会陆续实现平台推荐投放商品以提高额外增加流量的转化效率。该功能目前筹备中，将于9月份上线。 💡tips：商品自然流量下降时，使用曝光卡可以稳定流量基本盘；商品自然流量稳定或上升时，使用曝光卡可以打造爆款。 5、负向体验治理 平台针对影响用户体验的违规作弊行为做治理，采用降流等手段进行管控，以达到稳定市场秩序、促进良序竞争的目的。 以下是当前搜索重点治理的几类负向体验： 💡tips：避免触碰负向治理红线，是在平台实现长久经营之大计。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":3,"words":970,"sections":0,"subs":0,"version":""},"related":["sec-30","sec-2","sec-86","sec-62"]},{"id":"a1067970483994629","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"流量全景与推荐机制","title":"【卖家攻略之流量专题】八期","title_raw":"【卖家攻略之流量专题】八期","html":"<p><strong class=\"ql-size-16px\" style=\"color: rgb(34, 34, 34);\">1、缺货榜/趋势榜排名靠前，曝光更大<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">案例1：搜索词【毛绒玩具】，本搜索词在玩具类目缺货榜第1位。<\/span><\/p><p><img src=\"assets/img/141554-1548efud-ba1f60.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品A：与缺货热搜词的相关性高、商品描述信息完善丰富、卖家等级活跃度高，因此可以在商品展示时排序在前。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品B：与搜索词的相关性低、商品描述信息不完善，因此在此搜索词下排序靠后或者不展示。<\/span><\/p><p><img src=\"assets/img/141616-8537dwev-cc9c38.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品A流量排序分析:<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品标题命中搜索词——“草莓熊”<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品标题属性填写完整<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品描述内容——描述内容较丰富，如“草莓熊”、“趴趴熊”、“女友礼物”等都可能会搜索到该商品，并获得曝光，这些关键词竞争力可能比较小，那么获得曝光的机会就更多<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 159人想要，1459人浏览——数据优秀<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 5分钟前来过——卖家活跃度高<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● L3等级鱼小铺<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 已开启闲鱼币抵扣<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品B流量排序分析:<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品类目——类目与搜索词匹配<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品标题属性填写较为简单<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品描述内容——描述过于简单，只能被毛绒玩具、毛绒公仔等搜索词搜索到，这些词流量比较大，但是排序竞争力也大，获得曝光机会会比较小<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 12人想要，202浏览——数据仍需累积<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 17小时前来过——卖家活跃度一般<\/span><\/p><p><strong class=\"ql-size-16px\" style=\"color: rgb(34, 34, 34);\">2、认证平台服务保障，增强买家信任感<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">示例2：搜索词【雅阁】<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品A：认证了平台真车认证的商品，买家权益有保障，平台也有额外扶持。商品描述完整，细节完善。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品B：未认证保障服务，商品描述内容——描述内容较简一，故而排序在后。<\/span><\/p><p><img src=\"assets/img/141653-2026enfl-45d690.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品A流量排序分析:<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 真车认证服务<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品描述内容丰富——描述内容较丰富，包括“年款、公里、有无事故等说明”，有可能被更多长尾搜索词搜索到<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 累计降价26%——降价商品获得额外流量<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品B流量排序分析:<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 未认证保障服务<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品描述内容——描述内容较简一，不够丰富，可以被搜索量高的搜索词曝光到，但是很难被一些长尾搜索词搜索到<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 累计降价22%——降价商品获得额外流量<\/span><\/p><p><strong class=\"ql-size-16px\" style=\"color: rgb(34, 34, 34);\">3、平台会打击重复铺货等违规行为<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">案例3：搜索词【无极250rr竞技版】<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">从下图可以看出，该卖家有重复铺货问题，即用相同的图片和文字发布了2个商品，平台拒绝此类违规行为，将会予以流量降权。<\/span><\/p><p><img src=\"assets/img/141709-8973savn-6d53cb.png\"><\/p>","text":"1、缺货榜/趋势榜排名靠前，曝光更大 案例1：搜索词【毛绒玩具】，本搜索词在玩具类目缺货榜第1位。 商品A：与缺货热搜词的相关性高、商品描述信息完善丰富、卖家等级活跃度高，因此可以在商品展示时排序在前。 商品B：与搜索词的相关性低、商品描述信息不完善，因此在此搜索词下排序靠后或者不展示。 商品A流量排序分析: ● 商品标题命中搜索词——“草莓熊” ● 商品标题属性填写完整 ● 商品描述内容——描述内容较丰富，如“草莓熊”、“趴趴熊”、“女友礼物”等都可能会搜索到该商品，并获得曝光，这些关键词竞争力可能比较小，那么获得曝光的机会就更多 ● 159人想要，1459人浏览——数据优秀 ● 5分钟前来过——卖家活跃度高 ● L3等级鱼小铺 ● 已开启闲鱼币抵扣 商品B流量排序分析: ● 商品类目——类目与搜索词匹配 ● 商品标题属性填写较为简单 ● 商品描述内容——描述过于简单，只能被毛绒玩具、毛绒公仔等搜索词搜索到，这些词流量比较大，但是排序竞争力也大，获得曝光机会会比较小 ● 12人想要，202浏览——数据仍需累积 ● 17小时前来过——卖家活跃度一般 2、认证平台服务保障，增强买家信任感 示例2：搜索词【雅阁】 商品A：认证了平台真车认证的商品，买家权益有保障，平台也有额外扶持。商品描述完整，细节完善。 商品B：未认证保障服务，商品描述内容——描述内容较简一，故而排序在后。 商品A流量排序分析: ● 真车认证服务 ● 商品描述内容丰富——描述内容较丰富，包括“年款、公里、有无事故等说明”，有可能被更多长尾搜索词搜索到 ● 累计降价26%——降价商品获得额外流量 商品B流量排序分析: ● 未认证保障服务 ● 商品描述内容——描述内容较简一，不够丰富，可以被搜索量高的搜索词曝光到，但是很难被一些长尾搜索词搜索到 ● 累计降价22%——降价商品获得额外流量 3、平台会打击重复铺货等违规行为 案例3：搜索词【无极250rr竞技版】 从下图可以看出，该卖家有重复铺货问题，即用相同的图片和文字发布了2个商品，平台拒绝此类违规行为，将会予以流量降权。","toc":[],"meta":{"publish_time":"2025-05-16","source":"小渔数科闲参谋","tables":0,"imgs":4,"words":882,"sections":0,"subs":0,"version":""},"related":["sec-30","sec-43","sec-34","sec-52"]},{"id":"a498468623795589","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"流量全景与推荐机制","title":"【卖家攻略之流量专题】九期","title_raw":"【卖家攻略之流量专题】九期","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">1、闲鱼推荐概述<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">闲鱼的推荐（猜你喜欢）场景主要有2个：【首页-猜你喜欢】场景和【商品详情页-猜你喜欢】场景。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【首页-猜你喜欢】：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">基于用户的喜好做个性化推荐，以让用户逛起来为目的，为每个用户推荐TA喜欢的和TA没看到过但可能会喜欢的商品。<\/span><\/p><p><img src=\"assets/img/145213-8402xcig-9a2072.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">【商品详情页-猜你喜欢】：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">基于用户当前点击商品推荐同款或相似商品，也可能穿插着关联推荐商品（即：在手机下面推荐手机壳），目的是帮助用户找到TA心仪的商品，做出购买决策。<\/span><\/p><p><img src=\"assets/img/145312-3338uhkn-631ca4.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">2、商品详情页猜你喜欢场景的价值主张<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 为用户推荐同款或相似的优质宝贝（宝贝价格可信、卖家诚信）<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 优质商品排序优先<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 流量机制升级——平台任务激励与自然流量的联动<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">3、为用户推荐同款或相似商品<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">同款宝贝：和主商品（即用户点击进入详情页的商品）是同款商品，品牌、类目、型号、主体商品图一致。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">相似款宝贝：和主商品（即用户点击进入详情页的商品）是相似商品，品牌、类目一致，型号可以不一致。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">关联宝贝：和主商品适用同一人群、或同一场景的关联品类宝贝。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡Tips：做好以下方面更容易被推荐<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品描述、品牌、类目、型号完善<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品主图拍摄清晰，且能突出主体<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 商品价格设置合理<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 卖家诚信经营、多获好评、降低退款率<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">4、任务激励与自然流量的联动<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品的自然流量受多种因素影响，如市场需求波动、产品更新换代、服装换季等。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">当商品自然流量下降时，可以通过灵活运用流量工具做补充，以达到稳定流量和稳定转化效率的目的。当商品自然流量已处于稳定状态时，也可以通过流量工具继续提升流量，打造爆款，进一步增效。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡Tips：参考缺货榜的买家需求情况，参与平台的任务获得激励，都能帮助卖家更好的获取流量。<\/span><\/p>","text":"1、闲鱼推荐概述 闲鱼的推荐（猜你喜欢）场景主要有2个：【首页-猜你喜欢】场景和【商品详情页-猜你喜欢】场景。 【首页-猜你喜欢】： 基于用户的喜好做个性化推荐，以让用户逛起来为目的，为每个用户推荐TA喜欢的和TA没看到过但可能会喜欢的商品。 【商品详情页-猜你喜欢】： 基于用户当前点击商品推荐同款或相似商品，也可能穿插着关联推荐商品（即：在手机下面推荐手机壳），目的是帮助用户找到TA心仪的商品，做出购买决策。 2、商品详情页猜你喜欢场景的价值主张 ● 为用户推荐同款或相似的优质宝贝（宝贝价格可信、卖家诚信） ● 优质商品排序优先 ● 流量机制升级——平台任务激励与自然流量的联动 3、为用户推荐同款或相似商品 同款宝贝：和主商品（即用户点击进入详情页的商品）是同款商品，品牌、类目、型号、主体商品图一致。 相似款宝贝：和主商品（即用户点击进入详情页的商品）是相似商品，品牌、类目一致，型号可以不一致。 关联宝贝：和主商品适用同一人群、或同一场景的关联品类宝贝。 💡Tips：做好以下方面更容易被推荐 ● 商品描述、品牌、类目、型号完善 ● 商品主图拍摄清晰，且能突出主体 ● 商品价格设置合理 ● 卖家诚信经营、多获好评、降低退款率 4、任务激励与自然流量的联动 商品的自然流量受多种因素影响，如市场需求波动、产品更新换代、服装换季等。 当商品自然流量下降时，可以通过灵活运用流量工具做补充，以达到稳定流量和稳定转化效率的目的。当商品自然流量已处于稳定状态时，也可以通过流量工具继续提升流量，打造爆款，进一步增效。 💡Tips：参考缺货榜的买家需求情况，参与平台的任务获得激励，都能帮助卖家更好的获取流量。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":2,"words":707,"sections":0,"subs":0,"version":""},"related":["sec-43","sec-30","sec-34","a498458897921413"]},{"id":"a498469369845125","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"流量全景与推荐机制","title":"【卖家攻略之流量专题】十期","title_raw":"【卖家攻略之流量专题】十期","html":"<p><span style=\"color: rgb(34, 34, 34);\">💡 问题1：为什么我的商品没有流量？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">答：影响流量的因素是多方面的，一般来讲，影响流量的因素主要有以下几类：<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\">· <\/strong><span style=\"color: rgb(34, 34, 34);\">卖家和宝贝本身的变化，如卖家闲鱼号违规、商品改标题改类目改价格等。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\">· <\/strong><span style=\"color: rgb(34, 34, 34);\">市场需求水平，如9月份iPhone发布新机导致其他android手机需求下降。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\">· <\/strong><span style=\"color: rgb(34, 34, 34);\">近期新发供给数量和质量，如春节过后大批卖家卖闲置清库存。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\">· <\/strong><span style=\"color: rgb(34, 34, 34);\">社会重大事件，如电商大促、节假日、恶劣天气等。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡 问题2：感觉开了鱼小铺之后流量更低了，是什么原因？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">答：鱼小铺是平台为卖家提供的经营工具，闲鱼平台不会对开通鱼小铺的卖家及商品流量做降权或者打压。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">卖家体感到的流量变化可以参考《卖家攻略之流量专题》往期内容做具体的原因分析。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡 问题3：如果我的鱼小铺等级更高，是否会引来更多的流量加持呢？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">答：卖家的高L等级对流量是有促进效果的。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">一方面，更高的L等级更容易让买家产生信任，提高转化效率，形成正向循环。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">另一方面，平台的排序规则和价值主张中对鱼小铺L等级发展也是鼓励的，会有对应的加持。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡 问题4：闲鱼号违规处罚结束后，我都一个月了，流量还没起来？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">答：处罚违规结束后，处罚效果当即失效，但因闲鱼搜索推荐的召回排序系统依赖商品的曝光、点击、互动和成交数据积累，因此为了弥补被处罚期间的流量损失，卖家往往需要等待一段时间后数据积累成熟，流量才能够赢来攀升。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">同时可以通过满足优质供给标准、提供闲鱼平台倡导的服务、使用曝光卡等方法来维持流量稳定。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\"><span class=\"ql-cursor\"><\/span><\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡 问题5：我的宝贝流量时高时低，想知道流量变动的原因<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">答：影响流量的因素是多方面的，除了卖家和商品本身的动作会影响，包括市场需求水平（需求是否下降），近期新发供给数量和质量（市场竞争是否充分），社会重大事件（大事件、节假日、恶劣天气）等也会在不同程度上影响<\/span><\/p>","text":"💡 问题1：为什么我的商品没有流量？ 答：影响流量的因素是多方面的，一般来讲，影响流量的因素主要有以下几类： · 卖家和宝贝本身的变化，如卖家闲鱼号违规、商品改标题改类目改价格等。 · 市场需求水平，如9月份iPhone发布新机导致其他android手机需求下降。 · 近期新发供给数量和质量，如春节过后大批卖家卖闲置清库存。 · 社会重大事件，如电商大促、节假日、恶劣天气等。 💡 问题2：感觉开了鱼小铺之后流量更低了，是什么原因？ 答：鱼小铺是平台为卖家提供的经营工具，闲鱼平台不会对开通鱼小铺的卖家及商品流量做降权或者打压。 卖家体感到的流量变化可以参考《卖家攻略之流量专题》往期内容做具体的原因分析。 💡 问题3：如果我的鱼小铺等级更高，是否会引来更多的流量加持呢？ 答：卖家的高L等级对流量是有促进效果的。 一方面，更高的L等级更容易让买家产生信任，提高转化效率，形成正向循环。 另一方面，平台的排序规则和价值主张中对鱼小铺L等级发展也是鼓励的，会有对应的加持。 💡 问题4：闲鱼号违规处罚结束后，我都一个月了，流量还没起来？ 答：处罚违规结束后，处罚效果当即失效，但因闲鱼搜索推荐的召回排序系统依赖商品的曝光、点击、互动和成交数据积累，因此为了弥补被处罚期间的流量损失，卖家往往需要等待一段时间后数据积累成熟，流量才能够赢来攀升。 同时可以通过满足优质供给标准、提供闲鱼平台倡导的服务、使用曝光卡等方法来维持流量稳定。 💡 问题5：我的宝贝流量时高时低，想知道流量变动的原因 答：影响流量的因素是多方面的，除了卖家和商品本身的动作会影响，包括市场需求水平（需求是否下降），近期新发供给数量和质量（市场竞争是否充分），社会重大事件（大事件、节假日、恶劣天气）等也会在不同程度上影响","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":745,"sections":0,"subs":0,"version":""},"related":["sec-43","sec-30","sec-52","sec-34"]}]},{"module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"搜索召回与排序逻辑","color":"blue","count":5,"items":[{"id":"a498448820090181","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"搜索召回与排序逻辑","title":"【卖家攻略之流量专题】二期","title_raw":"【卖家攻略之流量专题】二期","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">1、搜索场景介绍<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">【主动搜索】：用户根据自己的需求自主输入搜索词，同时用户也可以通过历史搜索快速进入。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【底纹词】：基于用户搜索历史以及平台热门搜索词来推荐，展示在搜索框内灰色字体关键词。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【猜你可能在找】：根据用户搜索个性化推荐的搜索词，大家都在搜的热门搜索词，推荐预测的用户可能会感兴趣的关键词列表。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【图文导航】：位于搜索结果页上部，辅助用户精细化搜索词，精准匹配用户的搜索需求。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【闲鱼精选商品上新提醒消息】：点击消息卡片直达搜索结果页，展示用户可能感兴趣的上新商品。<\/span><\/p><p><img src=\"assets/img/133055-6938mbun-f30606.png\"><img src=\"assets/img/133106-9520ypib-377aad.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡小贴士：在【猜你可能在找】区域的搜索词中，标注【正热搜】的搜索词是基于平台用户搜索统计得出的热搜词，更能代表广大用户的需求，如果你有对应商品货源，请发布对应商品并在商品描述中体现关键属性吧～<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">2、搜索结果如何展示<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">【综合搜索】：平台根据商品描述与搜索词的相关性、商品质量、价格、发布时间、卖家信用、服务保障、买家个性化偏好、区域位置等特征综合得出的商品列表，是绝大多数用户的首选搜索场景。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【最近活跃】：近期在平台有过发布商品、宝贝擦亮等操作的卖家的商品会在这里展现，最近活跃卖家的回复率较高。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【离我最近】：根据买家的区域位置推荐距离最近的商品。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【按价格排序】：按照价格升序或降序排序。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【最新发布】：根据发布时间来展示排序，最新发布的商品排在最前面。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【按区域排序】：根据用户选择的区域位置，展示对应位置发布的商品。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">【其他筛选项】：按照个人闲置、品牌、成色、包邮、发布时间、价格、描述不符包邮退等不同筛选项进行排序展示。<\/span><\/p><p><img src=\"assets/img/133149-2987chlm-04124b.png\"><img src=\"assets/img/133206-3189pojo-92858d.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡小贴士：不同类目的商品具有不同的发布属性，因此在发布商品时尽可能完善地填写商品属性值会使得你的商品能够在更多搜索场景里被展现。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">3、如何让商品进入最新发布场景中<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">最新发布场景是除了综合搜索外最大的搜索场景，许多买家会紧盯着最新发布想要蹲到最心仪的商品。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">最新发布场景的商品准入规则和排序规则：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">• 只有最新发布的商品才能够被命中展示；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">• 商品列表按照发布时间由近至远排序，即最新发布的排在前面，较早发布的排在后面；<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">• 默认状态勾选【根据大部分用户的喜爱为您挑选以下商品】，此时会把与搜索词强相关的商品排在前面，与搜索词不相关（如搜露营帐篷，则露营野餐垫会被排在后面）的商品排在后面。取消勾选状态后，则完全按照发布时间由近至远排序。<\/span><\/p><p><img src=\"assets/img/133234-3125fdsq-137008.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡小贴士：长期稳定的发布商品会让你的流量更加稳定，除了在综合搜索场景，也更容易在最新发布场景获得曝光机会。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">4、其他搜索筛选场景介绍<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">搜【验货好物】：筛选展示支持验货宝的商品，目前仅开放部分类目（手机数码、奢品等）的验货服务。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">搜【会玩】：搜索结果页为会玩社区的相关内容和宝贝。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">搜【用户】：用于查找闲鱼用户，目前只支持精准搜索，即搜索词需要完全匹配用户昵称才能够搜得到，不同用户的昵称可以重复。<\/span><\/p><p><img src=\"assets/img/133305-9188gixy-98b210.png\"><\/p>","text":"1、搜索场景介绍 【主动搜索】：用户根据自己的需求自主输入搜索词，同时用户也可以通过历史搜索快速进入。 【底纹词】：基于用户搜索历史以及平台热门搜索词来推荐，展示在搜索框内灰色字体关键词。 【猜你可能在找】：根据用户搜索个性化推荐的搜索词，大家都在搜的热门搜索词，推荐预测的用户可能会感兴趣的关键词列表。 【图文导航】：位于搜索结果页上部，辅助用户精细化搜索词，精准匹配用户的搜索需求。 【闲鱼精选商品上新提醒消息】：点击消息卡片直达搜索结果页，展示用户可能感兴趣的上新商品。 💡小贴士：在【猜你可能在找】区域的搜索词中，标注【正热搜】的搜索词是基于平台用户搜索统计得出的热搜词，更能代表广大用户的需求，如果你有对应商品货源，请发布对应商品并在商品描述中体现关键属性吧～ 2、搜索结果如何展示 【综合搜索】：平台根据商品描述与搜索词的相关性、商品质量、价格、发布时间、卖家信用、服务保障、买家个性化偏好、区域位置等特征综合得出的商品列表，是绝大多数用户的首选搜索场景。 【最近活跃】：近期在平台有过发布商品、宝贝擦亮等操作的卖家的商品会在这里展现，最近活跃卖家的回复率较高。 【离我最近】：根据买家的区域位置推荐距离最近的商品。 【按价格排序】：按照价格升序或降序排序。 【最新发布】：根据发布时间来展示排序，最新发布的商品排在最前面。 【按区域排序】：根据用户选择的区域位置，展示对应位置发布的商品。 【其他筛选项】：按照个人闲置、品牌、成色、包邮、发布时间、价格、描述不符包邮退等不同筛选项进行排序展示。 💡小贴士：不同类目的商品具有不同的发布属性，因此在发布商品时尽可能完善地填写商品属性值会使得你的商品能够在更多搜索场景里被展现。 3、如何让商品进入最新发布场景中 最新发布场景是除了综合搜索外最大的搜索场景，许多买家会紧盯着最新发布想要蹲到最心仪的商品。 最新发布场景的商品准入规则和排序规则： • 只有最新发布的商品才能够被命中展示； • 商品列表按照发布时间由近至远排序，即最新发布的排在前面，较早发布的排在后面； • 默认状态勾选【根据大部分用户的喜爱为您挑选以下商品】，此时会把与搜索词强相关的商品排在前面，与搜索词不相关（如搜露营帐篷，则露营野餐垫会被排在后面）的商品排在后面。取消勾选状态后，则完全按照发布时间由近至远排序。 💡小贴士：长期稳定的发布商品会让你的流量更加稳定，除了在综合搜索场景，也更容易在最新发布场景获得曝光机会。 4、其他搜索筛选场景介绍 搜【验货好物】：筛选展示支持验货宝的商品，目前仅开放部分类目（手机数码、奢品等）的验货服务。 搜【会玩】：搜索结果页为会玩社区的相关内容和宝贝。 搜【用户】：用于查找闲鱼用户，目前只支持精准搜索，即搜索词需要完全匹配用户昵称才能够搜得到，不同用户的昵称可以重复。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":6,"words":1172,"sections":0,"subs":0,"version":""},"related":["sec-43","sec-30","sec-34","sec-52"]},{"id":"a498449741493573","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"搜索召回与排序逻辑","title":"【卖家攻略之流量专题】三期","title_raw":"【卖家攻略之流量专题】三期","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">1、搜索场景流程概述<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">从用户输入搜索词到展现搜索结果，整个系统工作过程可以分为3步：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">第1步：理解“搜索词”，即通过用户输入的搜索词理解【用户想要找什么商品】。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">第2步：商品召回，从海量平台商品中找出匹配用户需求的候选商品，即决定哪些商品可以被展现。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">第3步：商品排序，通过平台系统多维度综合评估，最终呈现给用户的商品列表和排列顺序。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">2、分析【搜索词】<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">含义：系统通过分析搜索词的含义，理解用户需求。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">示例：用户输入搜索词【乐高机械组911】<\/span><\/p><p><img src=\"assets/img/133527-9018oepg-d2404b.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡运营小技巧：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">如何能让自己的商品更好的平台理解？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">• 在商品描述的开头就清晰明确的描述商品是什么、品牌是什么。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">• 正确填写分类、款式、品牌和成色等属性，以便平台系统更好的识别商品。<\/span><\/p><p><img src=\"assets/img/133552-4612iggz-42ae33.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">平台系统对用户搜索词进行初步理解，将进行下一步：商品召回。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">3、商品召回<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">含义：将搜索词理解阶段给的用户需求，与平台海量商品信息做匹配，匹配到满足用户需求的商品集合。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">匹配到的商品满足以下特征：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">• 商品和搜索词（用户需求）必须有相关性：通过文本、类目和属性建立商品和搜索词的相关性。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">• 在海量的商品池中，依据商品发布时间、商品点击率、转化率、我想要数等特征，确定商品集合。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">• 个性化召回：基于用户偏好召回商品，用户体验更佳。<\/span><\/p><p><img src=\"assets/img/133619-8994itxi-fb900b.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡运营小技巧：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">哪些商品描述信息很重要？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">——商品标题、描述头部文本，品牌、型号、类目、同义词、属性、卖点等都是需要重点表述的商品信息。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">以上处理后的信息输入下一步：商品排序。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">4、排序<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">含义：将前一步召回选出的无序商品集合，排列为有顺序的商品列表。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">排序依据示例：<\/span><\/p><p><img src=\"assets/img/133642-2076dbnf-ea07d1.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">平台根据以上各项信息进行商品排序，使得搜索流量的效率更高，用户体验更好。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">💡运营小技巧：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">如何让你的商品排序更靠前？<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">——从商品能力（商品信息详实和价格）、卖家能力（互动、信用、服务、活跃）提高自身能力，并遵循平台规则契合闲鱼平台价值主张（不做低价引流&amp;假劣等负向行为，关注平台发布的热门趋势缺货等信息）。<\/span><\/p>","text":"1、搜索场景流程概述 从用户输入搜索词到展现搜索结果，整个系统工作过程可以分为3步： 第1步：理解“搜索词”，即通过用户输入的搜索词理解【用户想要找什么商品】。 第2步：商品召回，从海量平台商品中找出匹配用户需求的候选商品，即决定哪些商品可以被展现。 第3步：商品排序，通过平台系统多维度综合评估，最终呈现给用户的商品列表和排列顺序。 2、分析【搜索词】 含义：系统通过分析搜索词的含义，理解用户需求。 示例：用户输入搜索词【乐高机械组911】 💡运营小技巧： 如何能让自己的商品更好的平台理解？ • 在商品描述的开头就清晰明确的描述商品是什么、品牌是什么。 • 正确填写分类、款式、品牌和成色等属性，以便平台系统更好的识别商品。 平台系统对用户搜索词进行初步理解，将进行下一步：商品召回。 3、商品召回 含义：将搜索词理解阶段给的用户需求，与平台海量商品信息做匹配，匹配到满足用户需求的商品集合。 匹配到的商品满足以下特征： • 商品和搜索词（用户需求）必须有相关性：通过文本、类目和属性建立商品和搜索词的相关性。 • 在海量的商品池中，依据商品发布时间、商品点击率、转化率、我想要数等特征，确定商品集合。 • 个性化召回：基于用户偏好召回商品，用户体验更佳。 💡运营小技巧： 哪些商品描述信息很重要？ ——商品标题、描述头部文本，品牌、型号、类目、同义词、属性、卖点等都是需要重点表述的商品信息。 以上处理后的信息输入下一步：商品排序。 4、排序 含义：将前一步召回选出的无序商品集合，排列为有顺序的商品列表。 排序依据示例： 平台根据以上各项信息进行商品排序，使得搜索流量的效率更高，用户体验更好。 💡运营小技巧： 如何让你的商品排序更靠前？ ——从商品能力（商品信息详实和价格）、卖家能力（互动、信用、服务、活跃）提高自身能力，并遵循平台规则契合闲鱼平台价值主张（不做低价引流&假劣等负向行为，关注平台发布的热门趋势缺货等信息）。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":4,"words":819,"sections":0,"subs":0,"version":""},"related":["sec-30","sec-52","a498457972299141","sec-2"]},{"id":"a498451325527429","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"搜索召回与排序逻辑","title":"【卖家攻略之流量专题】四期","title_raw":"【卖家攻略之流量专题】四期","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">1.什么是商品召回？<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">买家输入关键词之后，能被关键词搜索到的商品，即表示能被召回。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">2. 商品召回的基本规则是什么？<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">以搜索词【乐高机械组911】为例，来看召回的基本规则：<\/span><\/p><p><img src=\"assets/img/133927-4391cuvr-98b88f.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">商品召回的基本规则：<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">（1）关键词匹配的逻辑：商品描述必须同时包含以下三个词才会被召回“乐高”、“机械组”、“911”。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">（2）类目匹配的逻辑： 如果希望商品能够被“乐高积木”这类搜索词搜索到，商品发布时，类目需要选择为“拼搭积木”，否则商品可能会无法被召回。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">（3）属性匹配的逻辑：完整且准确的填写属性信息，可以提升商品被召回的概率。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">（4）违规发布、作弊发布的打压：商品存在违规发布，如“故意错挂商品类目”；或商品存在作弊行为，如“填写过低的虚假价格”、“堆砌与商品无关的关键词”等，对于这些行为平台都会进行处罚。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">3.商品召回优化的方法与技巧<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">（1）真实、准确、丰富的填写商品信息。<\/span><\/p><p><img src=\"assets/img/133943-5999mjen-a4f3a8.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">（2）请将重要信息填写在商品标题内——即商品描述的第1行。<\/span><\/p><p><img src=\"assets/img/134001-1427obhv-03c142.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">（3）对于商品关键词描述，请正确的进行断句和添加空格等，提升商品分词准确性。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 搜索词会有分词的规则，比如【乐高机械组911】会被分为：乐高 | 机械组 | 911。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 大家发布商品也同样会做分词，如果商品描述写成「乐-高机械组9-11」会导致这个商品分词为：乐 | 高 | 机械组 | 9 | 11。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">● 只有商品中出现 乐高 | 机械组 | 911 三个词，这个商品才会被搜索到。断句不当和添加空格错误等，会导致商品描述和搜索词匹配不上。因此，商品描述时正确断句、换行、加空格，能避免商品分词错误导致无法被召回。<\/span><\/p><p><img src=\"assets/img/134020-0676hijg-5deca0.png\"><img src=\"assets/img/134149-5060vwsn-7517c3.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">（4）正确的选择商品发布的类目与属性信息。<\/span><\/p><p><img src=\"assets/img/134211-1181uhnt-a257b4.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">（5）请不要违规发布和作弊发布商品。<\/span><\/p><p><img src=\"assets/img/134228-1061aeah-50262b.png\"><\/p>","text":"1.什么是商品召回？ 买家输入关键词之后，能被关键词搜索到的商品，即表示能被召回。 2. 商品召回的基本规则是什么？ 以搜索词【乐高机械组911】为例，来看召回的基本规则： 商品召回的基本规则： （1）关键词匹配的逻辑：商品描述必须同时包含以下三个词才会被召回“乐高”、“机械组”、“911”。 （2）类目匹配的逻辑： 如果希望商品能够被“乐高积木”这类搜索词搜索到，商品发布时，类目需要选择为“拼搭积木”，否则商品可能会无法被召回。 （3）属性匹配的逻辑：完整且准确的填写属性信息，可以提升商品被召回的概率。 （4）违规发布、作弊发布的打压：商品存在违规发布，如“故意错挂商品类目”；或商品存在作弊行为，如“填写过低的虚假价格”、“堆砌与商品无关的关键词”等，对于这些行为平台都会进行处罚。 3.商品召回优化的方法与技巧 （1）真实、准确、丰富的填写商品信息。 （2）请将重要信息填写在商品标题内——即商品描述的第1行。 （3）对于商品关键词描述，请正确的进行断句和添加空格等，提升商品分词准确性。 ● 搜索词会有分词的规则，比如【乐高机械组911】会被分为：乐高 | 机械组 | 911。 ● 大家发布商品也同样会做分词，如果商品描述写成「乐-高机械组9-11」会导致这个商品分词为：乐 | 高 | 机械组 | 9 | 11。 ● 只有商品中出现 乐高 | 机械组 | 911 三个词，这个商品才会被搜索到。断句不当和添加空格错误等，会导致商品描述和搜索词匹配不上。因此，商品描述时正确断句、换行、加空格，能避免商品分词错误导致无法被召回。 （4）正确的选择商品发布的类目与属性信息。 （5）请不要违规发布和作弊发布商品。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":7,"words":713,"sections":0,"subs":0,"version":""},"related":["sec-43","sec-30","sec-34","sec-52"]},{"id":"a498454249600389","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"搜索召回与排序逻辑","title":"【卖家攻略之流量专题】五期","title_raw":"【卖家攻略之流量专题】五期","html":"<p><strong class=\"ql-size-16px\">1.排序的基本规则<\/strong><\/p><p>大体上，平台依据两类影响因素做综合评估排序：<\/p><p>(1) 商品或卖家自身的特征，在不同类目下有不同侧重。<\/p><p>(2) 平台价值主张，平台基于用户体验出发，倡导或不提倡的行为。<\/p><p><strong class=\"ql-size-16px\">2.搜索排序的重要影响因素<\/strong><\/p><p>1)商品的流量获取能力和反馈表现<\/p><p>● 全站特征:商品点击量、商品[我想要]次数、商品售出量 (特指深库存商品)。<\/p><p>● 当前搜索词下特征: 商品点击量、商品[我想要]次数、商品售出量、预估点击率=点击量/曝光量、预估转化率=售出量/点击量。<\/p><p>注:以上特征均包含1-30天维度，并有反作整策略保障。<\/p><p>2) 匹配搜索平台价值主张的能力<\/p><p>● 优质供给，流量激励:缺货榜、趋势榜。<\/p><p>● 负向治理，流量干预:低价引流、站外引流、假冒伪劣。<\/p><p><strong class=\"ql-size-16px\">3.排序优化的方法与技巧<\/strong><\/p><p>案例1: 搜索词【乐高机械组911】排第一位的商品<\/p><p><img src=\"assets/img/135016-6050ngmq-da4ea3.png\"><\/p><p>(1) 召回：<\/p><p>● 标题全面清晰无堆砌。<\/p><p>● 类目挂靠准确且命中高相关性。<\/p><p>(2) 排序：<\/p><p>● 3.8w次浏览量和1285人聊天互动，在同类商品中名列前茅。<\/p><p>● 点击率极高，说明用户契合度高。<\/p><p>● L7等级鱼小铺卖家，好评率和回复率均十分优秀。<\/p><p><img src=\"assets/img/135140-8591fbjq-f8c509.png\"><\/p><p>案例2： 搜索词【士相机xe4】排第一位的商品<\/p><p><img src=\"assets/img/135235-5369adjj-970ea6.png\"><\/p><p>(1) 召回:<\/p><p>● 标题全面清晰无堆砌。<\/p><p>● 类目挂靠准确且命中高相关性。<\/p><p>(2) 排序:<\/p><p>● 717次浏览量，点击率高，说明用户契合度高。<\/p><p>● 卖家信用优秀且支持描述不符包邮退，加分。<\/p><p>● L6等级鱼小铺卖家，好评率和回复率均十分优秀。<\/p><p><img src=\"assets/img/135324-3224awql-dd95b3.png\"><\/p><p>案例3：搜索词【爱奇艺周卡】排第一位的商品<\/p><p><img src=\"assets/img/135400-2700wkav-1f871b.png\"><\/p><p>(1) 召回：<\/p><p>● 标题全面清晰无堆砌类目。<\/p><p>● 挂靠准确且命中高相关性。<\/p><p>(2) 排序：<\/p><p>● 4322次浏览量，1789人想要，点击率高说明用户契合度高。<\/p><p>● 卖家信用优秀且支持描述不符全额退、放心充，加分。<\/p><p><img src=\"assets/img/135456-0295rdwy-939a67.png\"><\/p>","text":"1.排序的基本规则 大体上，平台依据两类影响因素做综合评估排序： (1) 商品或卖家自身的特征，在不同类目下有不同侧重。 (2) 平台价值主张，平台基于用户体验出发，倡导或不提倡的行为。 2.搜索排序的重要影响因素 1)商品的流量获取能力和反馈表现 ● 全站特征:商品点击量、商品[我想要]次数、商品售出量 (特指深库存商品)。 ● 当前搜索词下特征: 商品点击量、商品[我想要]次数、商品售出量、预估点击率=点击量/曝光量、预估转化率=售出量/点击量。 注:以上特征均包含1-30天维度，并有反作整策略保障。 2) 匹配搜索平台价值主张的能力 ● 优质供给，流量激励:缺货榜、趋势榜。 ● 负向治理，流量干预:低价引流、站外引流、假冒伪劣。 3.排序优化的方法与技巧 案例1: 搜索词【乐高机械组911】排第一位的商品 (1) 召回： ● 标题全面清晰无堆砌。 ● 类目挂靠准确且命中高相关性。 (2) 排序： ● 3.8w次浏览量和1285人聊天互动，在同类商品中名列前茅。 ● 点击率极高，说明用户契合度高。 ● L7等级鱼小铺卖家，好评率和回复率均十分优秀。 案例2： 搜索词【士相机xe4】排第一位的商品 (1) 召回: ● 标题全面清晰无堆砌。 ● 类目挂靠准确且命中高相关性。 (2) 排序: ● 717次浏览量，点击率高，说明用户契合度高。 ● 卖家信用优秀且支持描述不符包邮退，加分。 ● L6等级鱼小铺卖家，好评率和回复率均十分优秀。 案例3：搜索词【爱奇艺周卡】排第一位的商品 (1) 召回： ● 标题全面清晰无堆砌类目。 ● 挂靠准确且命中高相关性。 (2) 排序： ● 4322次浏览量，1789人想要，点击率高说明用户契合度高。 ● 卖家信用优秀且支持描述不符全额退、放心充，加分。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":6,"words":755,"sections":0,"subs":0,"version":""},"related":["sec-30","sec-43","sec-34","sec-52"]},{"id":"a498457972299141","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"搜索召回与排序逻辑","title":"【卖家攻略之流量专题】六期","title_raw":"【卖家攻略之流量专题】六期","html":"<p><strong class=\"ql-size-16px\">1、搜索词相关性强弱对展示排序的影响<\/strong><\/p><p>案例1:：搜索词【电吉他】<\/p><p>商品A：与搜索词的相关性高、商品描述信息完善、支持描述不符包邮退服务，因此可以在商品展示时排序在前。<\/p><p>商品B：与搜索词的相关性低、商品描述信息不完善，因此在此搜索词下排序靠后或者不展示。若是搜索“民谣吉他”，进行商品描述优化，则有可能会排序靠前<\/p><p><img src=\"assets/img/140430-7186yaae-cbbc90.png\"><\/p><p>商品A排序分析<\/p><p>● 商品描述与搜索词匹配一“电吉他”与搜索词一致<\/p><p>● 商品类目与搜索词需求类目匹配一一类目相关性高<\/p><p>● 商品描述结构化完善一一品牌、尺寸、颜色标注清晰<\/p><p>● 81人想要，1590浏览一-商品累计数据优秀<\/p><p>● 描述不符包邮退一-支持闲鱼认可的特色服务<\/p><p>● 鱼小铺L6等级卖家一-卖家信用高、等级高<\/p><p>商品B排序分析:<\/p><p>● 商品描述与搜索词不匹配一-无法被召回<\/p><p>● 商品类目与搜索词需求类目不匹配一一即使能被召回，相关性打分也会属于“不相关”，排序会被沉底<\/p><p>● 商品描述的结构化不足一一品牌、颜色尺寸没有标注<\/p><p><strong class=\"ql-size-16px\">2、描述信息的完善程度对排序的影响<\/strong><\/p><p>案例1：搜索词【腾龙18一200索尼e口】<\/p><p>商品A： 商品描述信息完善、商品属性与搜索词匹配一致，商品状况瑕疵描述清楚，因此在商品展示时排序在前。<\/p><p>商品B：商品描述信息不完善，与搜索词的相关性低、很难被展示，只有搜索结果很少时，才会有一定几率展示。<\/p><p><img src=\"assets/img/140615-4704mloy-681f5d.png\"><\/p><p>商品A排序分析：<\/p><p>● 商品描述与搜索词匹配一可以被召回<\/p><p>● 商品类目匹配、品牌匹配、型号匹配商品在多个相关性维度上都属于“相关<\/p><p>● 43人想要，1441浏览一-数据积累优秀<\/p><p>● 2175粉丝，有粉丝立减优惠一-卖家受欢迎程度高<\/p><p>商品B排序分析：<\/p><p>● 商品描述与搜索词不匹配一一很难被召回，只有搜索结果很少时，才会有一定几率被召回<\/p><p>● 商品类目不匹配、品牌不匹配、仅型号匹配商品相关性属于“类目不相关、品牌不相关\"<\/p><p>● 商品描述的结构化不足<\/p><p><strong class=\"ql-size-16px\">3、商品描述“非售卖”影响展示<\/strong><\/p><p>案例1： 搜索词【明星小卡】<\/p><p>商品A：商品描述信息完善、商品属性与搜索词匹配一致，商品售出意愿和正品状况状况描述清晰，商品排序靠前。<\/p><p>商品B：商品描述商品只展示/不出售，无法满足买家购买需求，因此商品不会进行优先排序。<\/p><p><img src=\"assets/img/140847-7596kgzm-0b9cf3.png\"><\/p><p>商品A排序分析<\/p><p>● 商品描述与搜索词匹配一可以被召回<\/p><p>● 商品类目匹配一类目相关性属于“相关<\/p><p>● 卖家信用极好一一信用好<\/p><p>商品B排序分析<\/p><p>● 商品只展示/不出售，无法满足买家购买需求，因此商品在搜索场景下，会被记录为“不相关”，排序靠后<\/p>","text":"1、搜索词相关性强弱对展示排序的影响 案例1:：搜索词【电吉他】 商品A：与搜索词的相关性高、商品描述信息完善、支持描述不符包邮退服务，因此可以在商品展示时排序在前。 商品B：与搜索词的相关性低、商品描述信息不完善，因此在此搜索词下排序靠后或者不展示。若是搜索“民谣吉他”，进行商品描述优化，则有可能会排序靠前 商品A排序分析 ● 商品描述与搜索词匹配一“电吉他”与搜索词一致 ● 商品类目与搜索词需求类目匹配一一类目相关性高 ● 商品描述结构化完善一一品牌、尺寸、颜色标注清晰 ● 81人想要，1590浏览一-商品累计数据优秀 ● 描述不符包邮退一-支持闲鱼认可的特色服务 ● 鱼小铺L6等级卖家一-卖家信用高、等级高 商品B排序分析: ● 商品描述与搜索词不匹配一-无法被召回 ● 商品类目与搜索词需求类目不匹配一一即使能被召回，相关性打分也会属于“不相关”，排序会被沉底 ● 商品描述的结构化不足一一品牌、颜色尺寸没有标注 2、描述信息的完善程度对排序的影响 案例1：搜索词【腾龙18一200索尼e口】 商品A： 商品描述信息完善、商品属性与搜索词匹配一致，商品状况瑕疵描述清楚，因此在商品展示时排序在前。 商品B：商品描述信息不完善，与搜索词的相关性低、很难被展示，只有搜索结果很少时，才会有一定几率展示。 商品A排序分析： ● 商品描述与搜索词匹配一可以被召回 ● 商品类目匹配、品牌匹配、型号匹配商品在多个相关性维度上都属于“相关 ● 43人想要，1441浏览一-数据积累优秀 ● 2175粉丝，有粉丝立减优惠一-卖家受欢迎程度高 商品B排序分析： ● 商品描述与搜索词不匹配一一很难被召回，只有搜索结果很少时，才会有一定几率被召回 ● 商品类目不匹配、品牌不匹配、仅型号匹配商品相关性属于“类目不相关、品牌不相关\" ● 商品描述的结构化不足 3、商品描述“非售卖”影响展示 案例1： 搜索词【明星小卡】 商品A：商品描述信息完善、商品属性与搜索词匹配一致，商品售出意愿和正品状况状况描述清晰，商品排序靠前。 商品B：商品描述商品只展示/不出售，无法满足买家购买需求，因此商品不会进行优先排序。 商品A排序分析 ● 商品描述与搜索词匹配一可以被召回 ● 商品类目匹配一类目相关性属于“相关 ● 卖家信用极好一一信用好 商品B排序分析 ● 商品只展示/不出售，无法满足买家购买需求，因此商品在搜索场景下，会被记录为“不相关”，排序靠后","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":3,"words":1022,"sections":0,"subs":0,"version":""},"related":["sec-30","sec-52","a498458897921413","sec-2"]}]},{"module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"涨粉与粉丝运营","color":"blue","count":4,"items":[{"id":"a498439005287749","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"涨粉与粉丝运营","title":"分享闲鱼号，引导关注","title_raw":"分享闲鱼号，引导关注","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">一、进入闲鱼号主页，点击右上角“...”<\/strong><\/p><p><img src=\"assets/img/125215-5616dpsh-be64de.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">二、点击“分享”<\/strong><\/p><p><img src=\"assets/img/125230-4585kluk-f466b1.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">三、点击“生成海报”<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">也可以通过链接、淘口令等形式进行分享~<\/span><\/p><p><img src=\"assets/img/125253-2656ocws-3e8a5e.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">四、生成的海报可以在相册查收<\/strong><\/p><p><img src=\"assets/img/125314-6751wlid-25760f.png\"><\/p>","text":"一、进入闲鱼号主页，点击右上角“...” 二、点击“分享” 三、点击“生成海报” 也可以通过链接、淘口令等形式进行分享~ 四、生成的海报可以在相册查收","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":4,"words":75,"sections":0,"subs":0,"version":""},"related":["sec-52","sec-30"]},{"id":"a498425842038149","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"涨粉与粉丝运营","title":"如何在闲鱼获得更多粉丝","title_raw":"如何在闲鱼获得更多粉丝","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">一、如何获得新粉丝？<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 宝贝本身有竞争力<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">很多卖家本身就靠质量过硬、价格有竞争力的宝贝获得关注，得到回头客。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 描述突出宝贝优势<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">通过文字、图片、视频等描述，全方位展现你的宝贝优势，通过表达商品优势（低价、稀缺）引导用户购买和关注。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">3. 描述中明确引导关注<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">在宝贝描述中说明粉丝利益点，引导用户关注。如正文中告诉大家宝贝的问题都可以咨询（大家可能会觉得你热心、专业）。如正文中说明每月几号都会做活动，关注我可以获得及时获得最优惠的价格（用优惠去吸引用户）。<\/span><\/p><p><img src=\"assets/img/120027-4241fjjx-e61da9.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">4. 定期上新<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">每周或每天固定上新，让用户知道你这里有好多有竞争力的宝贝，获得关注。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">5. 通过闲鱼号打造人设<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">个人信息在闲鱼号讨巧地表达，能让更多人对你和你的宝贝产生兴趣，获得关注。<\/span><\/p><p><img src=\"assets/img/120103-3124hobq-cf7642.png\"><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">二、如何留住老粉丝？<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 定期为粉丝提供福利和活动<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">粉丝能接收到你的动态信息，所以定期提供福利或活动可以让粉丝回访，保持粉丝活跃。<\/span><\/p><p><img src=\"assets/img/120125-9372xfvo-586e6e.png\"><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 与粉丝保持良好的沟通互动<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">更快地回复、更好地售后，都能让粉丝拥有良好的体验。当你做好服务，频繁“刷脸”，当粉丝有需求时，就会更快地想到你了~<\/span><\/p>","text":"一、如何获得新粉丝？ 1. 宝贝本身有竞争力 很多卖家本身就靠质量过硬、价格有竞争力的宝贝获得关注，得到回头客。 2. 描述突出宝贝优势 通过文字、图片、视频等描述，全方位展现你的宝贝优势，通过表达商品优势（低价、稀缺）引导用户购买和关注。 3. 描述中明确引导关注 在宝贝描述中说明粉丝利益点，引导用户关注。如正文中告诉大家宝贝的问题都可以咨询（大家可能会觉得你热心、专业）。如正文中说明每月几号都会做活动，关注我可以获得及时获得最优惠的价格（用优惠去吸引用户）。 4. 定期上新 每周或每天固定上新，让用户知道你这里有好多有竞争力的宝贝，获得关注。 5. 通过闲鱼号打造人设 个人信息在闲鱼号讨巧地表达，能让更多人对你和你的宝贝产生兴趣，获得关注。 二、如何留住老粉丝？ 1. 定期为粉丝提供福利和活动 粉丝能接收到你的动态信息，所以定期提供福利或活动可以让粉丝回访，保持粉丝活跃。 2. 与粉丝保持良好的沟通互动 更快地回复、更好地售后，都能让粉丝拥有良好的体验。当你做好服务，频繁“刷脸”，当粉丝有需求时，就会更快地想到你了~","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":3,"words":467,"sections":0,"subs":0,"version":""},"related":["sec-30","sec-52","a498416974513541","a498423363646853"]},{"id":"a498423363646853","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"涨粉与粉丝运营","title":"定期发布对吸粉的重要性","title_raw":"定期发布对吸粉的重要性","html":"<p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">一、新发的意义<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 新发的宝贝可能会被更快卖出<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">每天都有买家在闲鱼挑宝贝买宝贝，历史好宝贝更可能已经被买走。如果新发宝贝的质量是好的，可以获得更高的曝光和更多买家的自然浏览。同时，新发的宝贝会定向推送给你的粉丝，确保粉丝可以第一时间看到。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">那么看，新发宝贝可以获得更高的曝光，所以可能会被更快卖出。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 吸引用户关注<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">如果你经常发高性价比或稀缺独一无二的宝贝，买家会觉得你手头肯定有很多好货，我关注TA可以在第一时间获得好货上新的消息。所以新发更能吸引用户关注。<\/span><\/p><p><strong style=\"color: rgb(34, 34, 34);\" class=\"ql-size-16px\">二、怎么新发<\/strong><\/p><p><span style=\"color: rgb(34, 34, 34);\">1. 新发≠滥发<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">滥发重复宝贝会让你的粉丝流失。同时，质量好的宝贝才能获得更高的曝光，滥发低质量宝贝是无效行为。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">2. 定期新发形成心智<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">如果你没有那么多宝贝，你可以选择按期发布，比如一周一次，一个月一次。有能力还可以选择某天作为粉丝福利日、会员日等。做久了以后粉丝心智就养成了，粉丝会在那天来你的店里挑选好货。<\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\"><span class=\"ql-cursor\"><\/span><\/span><\/p><p><span style=\"color: rgb(34, 34, 34);\">新发宝贝可以更快卖出，吸引关注；定期新发还能养成心智，获得粉丝更长久的关注。<\/span><\/p>","text":"一、新发的意义 1. 新发的宝贝可能会被更快卖出 每天都有买家在闲鱼挑宝贝买宝贝，历史好宝贝更可能已经被买走。如果新发宝贝的质量是好的，可以获得更高的曝光和更多买家的自然浏览。同时，新发的宝贝会定向推送给你的粉丝，确保粉丝可以第一时间看到。 那么看，新发宝贝可以获得更高的曝光，所以可能会被更快卖出。 2. 吸引用户关注 如果你经常发高性价比或稀缺独一无二的宝贝，买家会觉得你手头肯定有很多好货，我关注TA可以在第一时间获得好货上新的消息。所以新发更能吸引用户关注。 二、怎么新发 1. 新发≠滥发 滥发重复宝贝会让你的粉丝流失。同时，质量好的宝贝才能获得更高的曝光，滥发低质量宝贝是无效行为。 2. 定期新发形成心智 如果你没有那么多宝贝，你可以选择按期发布，比如一周一次，一个月一次。有能力还可以选择某天作为粉丝福利日、会员日等。做久了以后粉丝心智就养成了，粉丝会在那天来你的店里挑选好货。 新发宝贝可以更快卖出，吸引关注；定期新发还能养成心智，获得粉丝更长久的关注。","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":0,"words":436,"sections":0,"subs":0,"version":""},"related":["sec-30","sec-52","a498416974513541","a498411243476357"]},{"id":"a498413086889349","kind":"article","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"涨粉与粉丝运营","title":"“粉丝价”帮你涨粉更快","title_raw":"“粉丝价”帮你涨粉更快","html":"<p><img src=\"assets/img/110750-8723jpjw-b3ec2e.png\"><img src=\"assets/img/110752-0894gzll-875fd6.png\"><img src=\"assets/img/110754-7659ttyo-85d9b5.png\"><img src=\"assets/img/110755-8332ulbk-ed041e.png\"><img src=\"assets/img/110757-5501vvvq-891bbf.png\"><\/p>","text":"","toc":[],"meta":{"publish_time":"2023-12-29","source":"小渔数科闲参谋","tables":0,"imgs":5,"words":0,"sections":0,"subs":0,"version":""},"related":["sec-30","sec-52"]}]},{"module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"付费投放与成长权重","color":"blue","count":1,"items":[{"id":"sec-30","kind":"chapter","module":"流量增长","module_sub":"曝光篇 · 把流量做起来","section":"付费投放与成长权重","title":"第七章 流量获取与付费投放","title_raw":"第七章 流量获取与付费投放","html":"<p class=\"note\"><strong>内容说明：<\/strong>本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。<\/p><h3 id=\"sec-31\">7.1 自然流量获取策略<\/h3><p>2026年重大变化：免费自然流量分配逻辑已被彻底重构。免费擦亮权重断崖式下降（从过去几百次曝光锐减到几十甚至个位数），搜索和推荐流量改为「优质优先」——只有持续成交、好评率高、转化率好的商品才能获得免费流量。平台引入了信用评分体系（现行口径为「鱼力值」，分数高低直接影响商品初始曝光与基础流量），低价/无动态/回复慢/退货率高的账号极难获得免费曝光。免费流量池没变大，分水的人多了，平台又把大部分水引到了付费管道。<\/p>\n\n<table>\n<thead>\n<tr>\n<th>策略<\/th>\n<th>操作<\/th>\n<th>预期效果<\/th>\n<th>2026现状<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>每日擦亮<\/td>\n<td>每日 1 次免费擦亮（官方未指定时段，建议按自己商品后台的浏览分布选择）<\/td>\n<td>曝光+30%-50%<\/td>\n<td>权重断崖下降，仅几十次曝光<\/td>\n<\/tr>\n<tr>\n<td>闲鱼币推广<\/td>\n<td>用闲鱼币兑换推广位（每日签到获取）<\/td>\n<td>适合测款，零成本<\/td>\n<td>效果有限，作为补充<\/td>\n<\/tr>\n<tr>\n<td>会玩社区发帖<\/td>\n<td>发布与商品相关的使用心得/教程帖（玩法见 7.4）<\/td>\n<td>增加账号权重和粉丝<\/td>\n<td>权重上升，内容流量入口<\/td>\n<\/tr>\n<tr>\n<td>鱼塘互动<\/td>\n<td>加入相关鱼塘，发布商品到鱼塘（规则与玩法见 7.4）<\/td>\n<td>精准人群曝光<\/td>\n<td>稳定，垂直流量<\/td>\n<\/tr>\n<tr>\n<td>拍下立减+公益<\/td>\n<td>设置拍下立减 + 加入公益捐赠<\/td>\n<td>转化率+15%-25%<\/td>\n<td>有效，提升转化<\/td>\n<\/tr>\n<tr>\n<td>超赞/收藏/想要<\/td>\n<td>引导买家点&quot;超赞&quot;和&quot;想要&quot;<\/td>\n<td>提升商品推荐权重<\/td>\n<td>权重上升，信用评分的关键指标<\/td>\n<\/tr>\n<tr>\n<td>10分钟回复<\/td>\n<td>买家咨询10分钟内回复<\/td>\n<td>响应率影响排名<\/td>\n<td>已并入搜索排序因子<\/td>\n<\/tr>\n<tr>\n<td>品质交易<\/td>\n<td>48小时发货+低退货率+好评率≥98%<\/td>\n<td>获得隐形&quot;品质标签&quot;<\/td>\n<td>新增，优质推荐池门票<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"sec-32\">7.2 超级擦亮投放指南（大鱼动力）<\/h3><p>闲鱼官方的付费推广产品正式名称为<strong>「超级擦亮」<\/strong>（不少资料写作「超强擦亮」，指的是同一产品），通过闲鱼<strong>官方商业化投放平台「大鱼动力」<\/strong>投放，计费支持按曝光（CPM）与按点击（CPC），可选推广目标为：曝光量、浏览量、关注收藏量、咨询量。2026 年升级后它不再是简单的&quot;花钱擦一下&quot;，而是精准流量匹配系统——系统根据商品标题、属性、历史成交数据，主动把商品推送给近期浏览/搜索/收藏过类似商品的高意向买家。本质是用预算撬动数据资产，投放沉淀的点击、咨询、收藏数据会反向抬升账号整体流量表现。<\/p>\n<p>核心认知：超级擦亮不是&quot;花钱买一天热闹&quot;，而是用一笔小预算撬动一笔数据资产。配合主图、前3秒视频和文案持续优化——流量进来了承接不住，系统会判定你「不值得继续推」，后续成本越来越高。<\/p>\n<h4>7.2.1 投放红线（必须遵守）<\/h4>\n<ul>\n<li>官方公开的硬性限制：<strong>单个投放计划最多可添加 10 个宝贝<\/strong>；投放时段可设置为不连续，官方建议每日投放时长 ≥ 4 小时<\/li>\n<li> 计划数量上限、改价或换主图的频率影响，官方均无明文规定，属经验口径——投放期间建议尽量避免频繁改动主图与价格<\/li>\n<li>虚拟商品：多数类目不可投放或需先满足类目与资质要求，切勿盲目投放<\/li>\n<\/ul>\n<h4>7.2.2 投放时间卡位<\/h4>\n<table>\n<thead>\n<tr>\n<th>商品类型<\/th>\n<th>最佳时段<\/th>\n<th>加成效果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>引流款<\/td>\n<td>0:00-1:00<\/td>\n<td> 官方未公布加成比例<\/td>\n<\/tr>\n<tr>\n<td>利润款<\/td>\n<td>19:00-22:00<\/td>\n<td> 官方未公布加成比例<\/td>\n<\/tr>\n<tr>\n<td>虚拟品<\/td>\n<td>8:00-9:00 / 21:00-23:00<\/td>\n<td> 官方未公布加成比例<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ 上表时段属经验建议，<strong>平台未公布各时段的加成百分比<\/strong>。正确做法：看自己商品后台近 30 天的浏览分布，在流量高峰前 30 分钟起投。<\/p>\n<h4>7.2.3 选品标准<\/h4>\n<table>\n<thead>\n<tr>\n<th>可投<\/th>\n<th>不可投<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>潜力款（曝光≥500 + 咨询≥3）<\/td>\n<td>主图模糊/文案无卖点<\/td>\n<\/tr>\n<tr>\n<td>高转化款（转化率≥3%）<\/td>\n<td>有违规记录的商品<\/td>\n<\/tr>\n<tr>\n<td>引流款（价格≤同类90%）<\/td>\n<td>零销量零评价新品<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>7.2.4 出价策略<\/h4>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>出价<\/th>\n<th>调整规则<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>新手测试<\/td>\n<td>低预算起步<\/td>\n<td>跑2-3天看数据<\/td>\n<\/tr>\n<tr>\n<td>进阶优化<\/td>\n<td>逐步调整出价<\/td>\n<td>ROI达到盈亏平衡点以上 稳住；ROI低于盈亏平衡点 暂停<\/td>\n<\/tr>\n<tr>\n<td>稳定放量<\/td>\n<td>根据ROI微调<\/td>\n<td>保持根据商品情况灵活设置预算/计划<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>7.2.4+ 新版功能：成本保障 &amp; 多商品计划<\/h4>\n<p>说明：官方对该能力的表述为「<strong>计划保效 / 成本保障<\/strong>」——当实际成本超出预期成本时，超出预期成本 <strong>1.2 倍<\/strong>的部分以擦亮红包形式补贴，<strong>并非全额补偿<\/strong>，请按此口径理解。<\/p>\n<table>\n<thead>\n<tr>\n<th>功能<\/th>\n<th>说明<\/th>\n<th>适用场景<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>成本保障<\/td>\n<td>官方表述为「计划保效 / 成本保障」：实际成本超出预期成本 <strong>1.2 倍<\/strong>的部分以擦亮红包形式补贴（<strong>非全额补偿<\/strong>）<\/td>\n<td>预算有限、需要控制成本的卖家<\/td>\n<\/tr>\n<tr>\n<td>多商品计划<\/td>\n<td>一个投放计划可同时投放多个商品，节约测品成本<\/td>\n<td>有多个潜力款需要同时测试的卖家<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>7.2.5 每日投放SOP（25分钟）<\/h4>\n\n<ol>\n<li>准备（10分钟）：检查账号状态 → 优化商品主图/标题 → 报名平台活动。<\/li>\n<li>设置（5分钟）：选1个高转化款+2个潜力款，按时段投放，根据商品情况灵活设置预算。<\/li>\n<li>优化（10分钟）：查看数据看板 → ROI＜1.2暂停 → 曝光低加价0.3元 → 记录数据。<\/li>\n<\/ol>\n<h4>7.2.6 周复盘标准<\/h4>\n<ul>\n<li>砍掉连续3天ROI低于盈亏平衡点的商品<\/li>\n<li>保留ROI达到盈亏平衡点以上的商品持续投放<\/li>\n<li>每周上新2-3个测试品<\/li>\n<li>账户余额保持 ≥ 日预算 × 计划天数（避免模型学习中断）<\/li>\n<\/ul>\n<h3 id=\"sec-33\">7.3 成长权重体系：等级·闲气值·闲鱼币·鱼塘圈子<\/h3><p>闲鱼流量分配不是只看商品本身——账号成长权重是决定商品能获得多少曝光的底层基础。闲鱼现行是<strong>多套评分并行<\/strong>，先分清谁管什么，再决定投多少精力：<br/>① <strong>账号成长等级 X1–X10<\/strong>（按月更新，只发流量券/寄件券等权益，<strong>不直接决定流量<\/strong>）；② <strong>鱼力值<\/strong>（流量门槛，分数低直接没有基础曝光）；③ <strong>闲气值<\/strong>（账号生命线，满分 100 倒扣）；④ <strong>鱼小铺店铺等级 L1–L7<\/strong>（看评价分，解锁店铺权益）；⑤ <strong>鱼小铺服务分<\/strong>（商家侧，考核回复、退货、售后）。这五套共同影响搜索排名、推荐位分配与付费投放效果。<\/p>\n<h4>7.3.1 鱼小铺店铺等级 L1–L7（附：账号成长等级 X1–X10）<\/h4>\n<p>先破除一个高频混淆：<strong>L1–L7 是「鱼小铺店铺等级」<\/strong>，按评价分评定（0 / 1 / 50 / 500 / 1500 / 3000 / 5500 分档），主要用于解锁店铺权益，需先开通鱼小铺才谈得上；<strong>账号层面另有一套「成长等级 X1–X10」<\/strong>，按月更新，主要在「我的」页领流量券、寄件券，<strong>不直接决定流量多少<\/strong>。真正决定商品基础曝光的是「鱼力值」。<\/p>\n<table>\n<thead>\n<tr>\n<th>等级<\/th>\n<th>评价分区间<\/th>\n<th>定位<\/th>\n<th>核心权益<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>L1-L2<\/td>\n<td>0-50分<\/td>\n<td>新手期<\/td>\n<td>基础发布权限，流量较少，每日擦亮1次<\/td>\n<\/tr>\n<tr>\n<td>L3-L4<\/td>\n<td>50-500分<\/td>\n<td>基础卖家<\/td>\n<td> 流量相对稳定，解锁数据看板等店铺权益（鱼小铺需另行满足开通条件，见第三章）<\/td>\n<\/tr>\n<tr>\n<td>L5<\/td>\n<td>1500分<\/td>\n<td>关键分水岭<\/td>\n<td>解锁PC工作台、直播权限、专属活动报名、搜索排名大幅提升<\/td>\n<\/tr>\n<tr>\n<td>L6-L7<\/td>\n<td>3000-5500+分<\/td>\n<td>头部卖家<\/td>\n<td>流量拉满、首页推荐优先、官方合作机会<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>评价分计算规则（2026最新）<\/h4>\n<table>\n<thead>\n<tr>\n<th>行为<\/th>\n<th>加分/扣分<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>买家主动好评<\/td>\n<td>+基础分（金额越大分越高）<\/td>\n<td>50元以上订单加分是小数单的数倍<\/td>\n<\/tr>\n<tr>\n<td>粉丝下单+好评<\/td>\n<td>+加成（远高于普通单）<\/td>\n<td>粉丝订单加分最高，是升级最有效路径<\/td>\n<\/tr>\n<tr>\n<td>买家未评价<\/td>\n<td>+少量默认分<\/td>\n<td>系统默认加分，但远少于主动好评<\/td>\n<\/tr>\n<tr>\n<td>差评<\/td>\n<td>-大量分<\/td>\n<td>1个差评抵消5-10个好评，毁掉数天努力<\/td>\n<\/tr>\n<tr>\n<td>1元以下订单<\/td>\n<td>不计分<\/td>\n<td>低价单不贡献评价分<\/td>\n<\/tr>\n<tr>\n<td>刷单刷好评<\/td>\n<td>直接降权/封号<\/td>\n<td>平台识别后等级清零<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>升级节奏限制：10天最多升1级，即使评价分够了也要等周期。不要着急冲分，稳定输出比短期爆发更重要。<\/p>\n<h4>L5冲刺策略（30天计划）<\/h4>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>时间<\/th>\n<th>核心动作<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>打基础<\/td>\n<td>第1-3天<\/td>\n<td>完成双实名认证+芝麻信用授权+资料完善（头像/简介/背景图）；确保闲气值≥80<\/td>\n<\/tr>\n<tr>\n<td>养活跃<\/td>\n<td>第4-10天<\/td>\n<td>每日上新2-3款、擦亮全部商品、30分钟内回复、会玩社区发帖1-2篇<\/td>\n<\/tr>\n<tr>\n<td>冲评价<\/td>\n<td>第11-25天<\/td>\n<td>引导买家「先关注再下单」获取粉丝单加成；50元以上商品重点维护好评；发货后主动提醒买家确认+评价<\/td>\n<\/tr>\n<tr>\n<td>防差评<\/td>\n<td>全程<\/td>\n<td>描述真实无隐瞒、发货前拍视频留证、买家不满主动协商补偿、不引导站外交易<\/td>\n<\/tr>\n<tr>\n<td>稳周期<\/td>\n<td>第26-30天<\/td>\n<td>检查评价分进度，如接近1500分则保持节奏等待系统升级（10天周期）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>7.3.2 闲鱼币赚取与使用策略<\/h4>\n<p>闲鱼币是平台的虚拟积分，1闲鱼币=1元抵扣，同时可用于免费推广位兑换。闲鱼币不能充值购买，只能通过行为积累。<\/p>\n<h4>闲鱼币获取渠道全解<\/h4>\n<table>\n<thead>\n<tr>\n<th>渠道<\/th>\n<th>方式<\/th>\n<th>预估收益/日<\/th>\n<th>频率<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>每日签到<\/td>\n<td>首页点击签到按钮<\/td>\n<td>10-50币<\/td>\n<td>每日<\/td>\n<\/tr>\n<tr>\n<td>连续签到<\/td>\n<td>连续7天额外奖励<\/td>\n<td>额外30-100币<\/td>\n<td>每周<\/td>\n<\/tr>\n<tr>\n<td>发布商品<\/td>\n<td>每发布一件商品<\/td>\n<td>5-10币/件<\/td>\n<td>每日上限约50币<\/td>\n<\/tr>\n<tr>\n<td>商品卖出返利<\/td>\n<td>交易成功后系统返还<\/td>\n<td>按订单金额比例<\/td>\n<td>每笔交易<\/td>\n<\/tr>\n<tr>\n<td>任务中心<\/td>\n<td>完善资料、上传图片等轻量任务<\/td>\n<td>20-100币<\/td>\n<td>一次性+每日刷新<\/td>\n<\/tr>\n<tr>\n<td>会玩社区互动<\/td>\n<td>发帖、点赞、评论<\/td>\n<td>10-30币<\/td>\n<td>每日<\/td>\n<\/tr>\n<tr>\n<td>平台限时活动<\/td>\n<td>618/双11/年货节等大促<\/td>\n<td>50-300币<\/td>\n<td>活动期间<\/td>\n<\/tr>\n<tr>\n<td>好友转赠<\/td>\n<td>好友间互赠（需实名）<\/td>\n<td>不限<\/td>\n<td>不限<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>闲鱼币使用优先级<\/h4>\n<table>\n<thead>\n<tr>\n<th>优先级<\/th>\n<th>用途<\/th>\n<th>效果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>最优先<\/td>\n<td>闲鱼币推广（兑换推广位）<\/td>\n<td>零成本获取额外曝光，适合测款和引流款<\/td>\n<\/tr>\n<tr>\n<td>次优先<\/td>\n<td>大额商品抵扣<\/td>\n<td>购买高客单价商品时最大化省钱效果<\/td>\n<\/tr>\n<tr>\n<td>可选<\/td>\n<td>限时秒杀/优惠活动<\/td>\n<td>平台促销时使用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>注意：<strong>闲鱼币与现金的兑换比例约为 1000 币 ≈ 1 元<\/strong>；用于推广时走「急速卖」（单次最低约 2000 币、每日限 1 件、约 3 天投完）。 闲鱼币的有效期与清零规则以页面说明为准，建议不要大量囤积。<\/p>\n<h4>7.3.3 闲气值提升全攻略<\/h4>\n<p>闲气值是闲鱼评估用户信用与行为规范的核心指标（满分100分），直接影响商品排序、流量分配和功能权限。闲气值≥80 分是获得正常流量与开通鱼小铺的底线；降到 61–80 分会被下架全部商品并禁止发布互动 7 天，31–60 分 14 天，1–30 分 21 天，0 分永久限制。<\/p>\n<h4>闲气值扣分规则（仅扣分，无加分项）<\/h4>\n<p><strong>官方机制（《闲鱼社区管理规范》）<\/strong>：当前闲气值 = <strong>100 − 近 90 天内因违规被扣分数的总和<\/strong>；扣到 0 分后分值不再变化。<strong>完成实名认证、绑定芝麻信用、每日签到都不会给闲气值加分<\/strong>——它们影响的是账号权重、鱼力值、鱼小铺服务分等其他评分。下表左栏这些「加分」行为，真实作用是<strong>不触发扣分 + 抬升其他评分<\/strong>，请按这个理解使用。<\/p>\n<table>\n<thead>\n<tr>\n<th>行为<\/th>\n<th>影响<\/th>\n<th>幅度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>双实名认证（闲鱼+支付宝）<\/td>\n<td>✅ 加分<\/td>\n<td>非闲气值加分；影响账号权重与鱼力值<\/td>\n<\/tr>\n<tr>\n<td>芝麻信用授权（≥650分）<\/td>\n<td>✅ 加分<\/td>\n<td>非闲气值加分；芝麻分 600 良好 / 650 优秀 / 700 以上极好<\/td>\n<\/tr>\n<tr>\n<td>每日签到+安全中心任务<\/td>\n<td>✅ 加分<\/td>\n<td>非闲气值加分；产出闲鱼币<\/td>\n<\/tr>\n<tr>\n<td>24小时内发货+真实物流<\/td>\n<td>✅ 加分<\/td>\n<td>非闲气值加分；影响鱼小铺服务分<\/td>\n<\/tr>\n<tr>\n<td>15分钟内响应咨询<\/td>\n<td>✅ 加分<\/td>\n<td>非闲气值加分；影响鱼小铺服务分与鱼力值<\/td>\n<\/tr>\n<tr>\n<td>零纠纷、好评率≥98%<\/td>\n<td>✅ 加分<\/td>\n<td>非闲气值加分；影响鱼力值<\/td>\n<\/tr>\n<tr>\n<td>7天内主图修改＞2次<\/td>\n<td>⚠️ 隐性降权<\/td>\n<td>不直接扣分但触发风控<\/td>\n<\/tr>\n<tr>\n<td>引导站外交易（微信/QQ）<br/>细则见 7.4.3 ①<\/td>\n<td>❌ 扣分<\/td>\n<td>官方档位：一般扣 1 分、严重扣 20 分、特别严重扣 100 分<\/td>\n<\/tr>\n<tr>\n<td>刷单、互赞、虚假发货<\/td>\n<td>❌ 扣分<\/td>\n<td>直接扣分+隐性限流<\/td>\n<\/tr>\n<tr>\n<td>售假、违禁品<\/td>\n<td>🚫 严重<\/td>\n<td>售假被权利人投诉同一自然年累计 3 次 → 扣 100 分且分值不再恢复<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>快速修复低闲气值（＜80分）<\/h4>\n<ol>\n<li>完成安全中心全部任务：进入「我的→安全中心→闲气值」，点击「去提升」，逐项完成签到、完善收货地址、修改商品描述等任务，每项+2~5分。<\/li>\n<li>检查并申诉违规记录：在闲气值页点击「查看违规记录」，对近90天内的误判违规提交申诉（需上传聊天截图、发货凭证），48小时内反馈结果。<\/li>\n<li>保持正向交易行为：连续7天24小时内发货、15分钟内响应、零纠纷，系统会自动加权恢复分数。<\/li>\n<li>规避降权红线：暂停所有修改主图/标题操作、禁用站外导流话术（合规留资方式见 7.4.3 ②）、不参与任何刷单行为。<\/li>\n<\/ol>\n<h4>7.3.4 鱼塘/圈子：在成长体系中的位置<\/h4>\n<p>神奇鱼塘（原鱼塘）、闲鱼圈子与「会玩」社区是闲鱼的社区化流量入口。它们对账号成长权重的贡献只有三件事，其余都是方法问题：<\/p>\n<table>\n<thead>\n<tr>\n<th>贡献<\/th>\n<th>体现指标<\/th>\n<th>在成长体系中的位置<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>赚闲鱼币<\/td>\n<td>社区发帖、点赞、评论等任务的币收益<\/td>\n<td>★★★ 闲鱼币来源之一（见 7.3.2）<\/td>\n<\/tr>\n<tr>\n<td>抬账号权重<\/td>\n<td>社区活跃分、帖子互动量、粉丝数<\/td>\n<td>★★★ 间接影响搜索与推荐排名（见 7.3.7）<\/td>\n<\/tr>\n<tr>\n<td>拿垂直精准流量<\/td>\n<td>兴趣标签匹配带来的圈内曝光与咨询<\/td>\n<td>★★★ 转化率高于泛流量<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⏱️ 时间投入基准：每日约 5 分钟（发帖 1 篇 + 互动 5–10 条），每周约 30 分钟（新增 1–2 个圈子 + 1 篇长帖）——具体节奏见下面 7.3.5 与 7.3.6 两张任务表。<\/p>\n<p>🔗 <strong>圈子的准入规则、内容规范、五大玩法与合规红线，详见 7.4「闲鱼圈子（社区）规则与玩法全攻略」。<\/strong><\/p>\n<h4>7.3.5 每日成长任务清单（15-20分钟）<\/h4>\n<table>\n<thead>\n<tr>\n<th>时段<\/th>\n<th>任务<\/th>\n<th>预估耗时<\/th>\n<th>收益<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>早 7:00-8:00<\/td>\n<td>签到领闲鱼币 + 擦亮全部商品 + 检查安全中心<\/td>\n<td>5分钟<\/td>\n<td>闲鱼币+曝光刷新+闲气值<\/td>\n<\/tr>\n<tr>\n<td>早 8:00-9:00<\/td>\n<td>上新1-3个商品 + 同步到鱼塘/圈子<\/td>\n<td>5分钟<\/td>\n<td>活跃度+闲鱼币+垂直曝光<\/td>\n<\/tr>\n<tr>\n<td>午 12:00-13:00<\/td>\n<td>回复未读消息（保持15分钟内响应）+ 查看商品数据<\/td>\n<td>3分钟<\/td>\n<td>响应率+数据感知<\/td>\n<\/tr>\n<tr>\n<td>晚 19:00-20:00<\/td>\n<td>会玩社区发帖1篇 + 点赞评论圈子内容5-10条<\/td>\n<td>5分钟<\/td>\n<td>社区权重+粉丝增长<\/td>\n<\/tr>\n<tr>\n<td>晚 20:00-21:00<\/td>\n<td>处理当日订单（发货+提醒确认收货+好评引导）<\/td>\n<td>2分钟<\/td>\n<td>评价分+闲气值<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>7.3.6 每周成长任务清单（30-40分钟）<\/h4>\n<table>\n<thead>\n<tr>\n<th>频次<\/th>\n<th>任务<\/th>\n<th>目的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>周一<\/td>\n<td>检查各账号闲气值分数，低于80的启动修复流程<\/td>\n<td>预防权重下滑<\/td>\n<\/tr>\n<tr>\n<td>周二<\/td>\n<td>分析上周评价分变化：好评来源、差评原因、粉丝单占比<\/td>\n<td>优化升级策略<\/td>\n<\/tr>\n<tr>\n<td>周三<\/td>\n<td>清理过期/低曝光商品，优化后重新上架（换主图+标题）<\/td>\n<td>商品汰换<\/td>\n<\/tr>\n<tr>\n<td>周四<\/td>\n<td>加入1-2个新鱼塘/圈子，拓展流量渠道<\/td>\n<td>流量拓展<\/td>\n<\/tr>\n<tr>\n<td>周五<\/td>\n<td>发布1篇高质量长帖（教程/测评/攻略类），积累粉丝<\/td>\n<td>社区权重提升<\/td>\n<\/tr>\n<tr>\n<td>周六<\/td>\n<td>参与平台活动（如有），领取限时闲鱼币/流量奖励<\/td>\n<td>活动红利<\/td>\n<\/tr>\n<tr>\n<td>周日<\/td>\n<td>全周数据汇总：等级进度、闲气值变化、闲鱼币收支、粉丝增长<\/td>\n<td>周复盘<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>7.3.7 成长权重体系总览<\/h4>\n<table>\n<thead>\n<tr>\n<th>体系<\/th>\n<th>核心指标<\/th>\n<th>目标值<\/th>\n<th>提升周期<\/th>\n<th>对流量影响<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>卖家等级<\/td>\n<td>评价分（L1-L7）<\/td>\n<td>L5（1500分）<\/td>\n<td>30-90天<\/td>\n<td>★★★★★ 直接影响排名<\/td>\n<\/tr>\n<tr>\n<td>闲气值<\/td>\n<td>安全分（0-100）<\/td>\n<td>≥80分<\/td>\n<td>持续维护<\/td>\n<td>★★★★ 权重门槛<\/td>\n<\/tr>\n<tr>\n<td>闲鱼币<\/td>\n<td>积分余额<\/td>\n<td>保持≥500币<\/td>\n<td>每日积累<\/td>\n<td>★★★ 推广兑换<\/td>\n<\/tr>\n<tr>\n<td>鱼塘/圈子<\/td>\n<td>活跃度+粉丝数<\/td>\n<td>3-5个圈子活跃<\/td>\n<td>持续运营<\/td>\n<td>★★★ 精准流量<\/td>\n<\/tr>\n<tr>\n<td>会玩社区<\/td>\n<td>帖子互动量<\/td>\n<td>每周2-3篇<\/td>\n<td>持续发布<\/td>\n<td>★★★ 账号权重<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ 核心认知：付费投放（超级擦亮）是放大器，成长权重是地基。地基不牢，砸再多广告费也是浪费。L5+闲气值80+活跃鱼塘，三件事做到位，自然流量就已经很可观了。<\/p>\n<h3 id=\"sec-92\">7.4 闲鱼圈子（社区）规则与玩法全攻略（2026版）<\/h3><p>闲鱼圈子（含「会玩」圈子、神奇鱼塘、广场）是闲鱼内基于兴趣与需求的垂直社交场景。它的流量逻辑独立于商品搜索列表：靠<strong>内容种草<\/strong>把人吸进来，靠<strong>兴趣标签<\/strong>把流量导向商品，最后靠<strong>真实互动<\/strong>完成信任转化。一句话总结核心玩法——<strong>内容种草 + 精准引流 + 信任转化<\/strong>；规则核心——<strong>严禁站外引流 + 内容真实合规 + 互动提升权重<\/strong>。<\/p>\n\n<h4>7.4.1 圈子基础规则（2026年最新）<\/h4>\n<p><strong>① 准入与权限<\/strong><\/p>\n<ul>\n<li>加入圈子后需先完成新手任务（如签到、评论）才能发帖；部分高活跃度圈子设有等级门槛，等级不够只能看不能发。<\/li>\n<li>发布商品同步到圈子时，必须选择与商品强相关的圈子（如「数码玩家」「考研自习室」「宠物交流圈」），或选择<strong>人气值 &gt; 5000 的鱼塘<\/strong>。人气值过低的鱼塘没有分发能力，同步过去等于白发。<\/li>\n<\/ul>\n<p><strong>② 内容发布规范<\/strong><\/p>\n<ul>\n<li>禁止发布广告、外链、二维码、联系方式（含微信、QQ、手机号及其谐音变体）。<strong>例外<\/strong>：2026 年起平台开放了官方留联系方式通道，合规做法见 7.4.3 ②，勿用谐音 / 图片藏号等土办法。<\/li>\n<li>二手商品分享需<strong>关联真实宝贝链接<\/strong>，不得发布虚假商品或误导性描述。<\/li>\n<li>禁止政治宣传、封建迷信、淫秽色情、赌博暴力、欺诈虚假、侵犯知识产权、侮辱诽谤等内容。<\/li>\n<li>文案禁用极限词（「最好」「第一」「全网最低」）、高仿词（「精仿」「原单」）、敏感词及站外引流词。<\/li>\n<li><strong>同一商品每周最多在 2 个不同鱼塘同步发布<\/strong>，避免重复内容被判定后降权。<\/li>\n<\/ul>\n<p><strong>③ 违规处置<\/strong><\/p>\n<ul>\n<li>轻则下架 / 删除 / 屏蔽 / 降权；重则限制发布、互动、交易、加入鱼塘，甚至封号。圈子场景最高频的违规（站外引流、禁售品类、色情低俗与擦边）具体处罚口径见 7.4.3 ① ③ ⑤。<\/li>\n<li>情节严重者会被建立违规公示名单并公开披露，涉嫌违法的移送国家机关。<\/li>\n<\/ul>\n\n<h4>7.4.2 圈子五大核心玩法（2026年最新）<\/h4>\n<p><strong>玩法1：商品同步引流法<\/strong><\/p>\n<ul>\n<li><strong>操作<\/strong>：发布商品时勾选「同步到圈子」，或在「会玩」板块的圈子内直接发布动态 / 笔记，正文末尾插入商品链接。<\/li>\n<li><strong>技巧<\/strong>：\n  <ul>\n  <li>同一商品制作 2–3 条不同话术的动态，分别发布至不同鱼塘，每条间隔 ≥ 15 分钟。<\/li>\n  <li>圈子动态配图用商品实拍图，正文通常不写售价，只描述成色或征询意见（如「刚淘到一台 XX，成色惊喜，想听听老哥们怎么看」）。<\/li>\n  <li>发布后 2 小时内回复至少 3 条圈子内其他用户的评论，连续 3 天保持互动可提升账号权重。<\/li>\n  <\/ul>\n<\/li>\n<\/ul>\n<p><strong>玩法2：创意内容霸屏法<\/strong><\/p>\n<ul>\n<li><strong>操作<\/strong>：在「会玩」板块（圈子 + 广场）发布原创创意帖，争取首页推荐，获取百万级曝光。<\/li>\n<li><strong>技巧<\/strong>：\n  <ul>\n  <li>内容方向：使用教程、经验分享、开箱测评、避坑指南等<strong>有价值<\/strong>的内容，而非硬广。<\/li>\n  <li>标题<strong>前 15 字权重最高<\/strong>，需包含品牌词、属性词、场景词、长尾词及城市标签。<\/li>\n  <li>上传 9–12 秒功能演示短视频，系统识别为高价值内容并给予额外推荐权重。<\/li>\n  <li>带上平台热门话题标签（如 #二手好物），蹭话题流量池——这是成本最低的固定蹭曝光动作。<\/li>\n  <\/ul>\n<\/li>\n<\/ul>\n<p><strong>玩法3：垂直圈层深耕法<\/strong><\/p>\n<ul>\n<li><strong>操作<\/strong>：选择一个垂直领域（如宠物用品、数码配件、汉服洛丽塔等），持续在对应圈子内输出内容，建立专业人设。<\/li>\n<li><strong>技巧<\/strong>：\n  <ul>\n  <li>账号标签要纯——系统基于<strong>兴趣标签<\/strong>而非关键词匹配推荐，标签越纯，精准流量转化率越高。<\/li>\n  <li>在圈子内对同类优质笔记做真实评论和点赞，提升账号在该圈层的权重。<\/li>\n  <li>粉丝沉淀：设置「粉丝专享价」引导关注，定期发布粉丝专属内容，提升复购率并享受评价分加成。<\/li>\n  <\/ul>\n<\/li>\n<\/ul>\n<p><strong>玩法4：同城流量截流法<\/strong><\/p>\n<ul>\n<li><strong>操作<\/strong>：关闭定位，手动选择一二线城市发布，利用本地流量权重获取精准买家。<\/li>\n<li><strong>技巧<\/strong>：\n  <ul>\n  <li>适合同城配送 / 自提的商品（如室内绿植、二手品牌家具、宠物用品等）效果最佳。<\/li>\n  <li>结合时间节点（毕业季 4–6 月、年底离城潮、购物节后）蹲点高校或大城市低价扫货。<\/li>\n  <\/ul>\n<\/li>\n<\/ul>\n<p><strong>玩法5：AI 工具辅助法<\/strong><\/p>\n<ul>\n<li><strong>操作<\/strong>：使用闲鱼 AI 相机拍照自动识别物品、估价并生成文案；使用 AI 智能定价，基于近 3 个月成交数据给出建议价。<\/li>\n<li><strong>技巧<\/strong>：\n  <ul>\n  <li>「AI 帮聊」可自动回复常见问题及智能议价，提升回复率与权重。<\/li>\n  <li>「闲鱼空间」可拍摄全景照批量识别物品并估价发布，大幅提升上架效率。<\/li>\n  <\/ul>\n<\/li>\n<\/ul>\n\n<h4>7.4.3 2026年重点合规红线（圈子场景高频踩坑）<\/h4>\n<p><strong>① 站外引流：专项治理零容忍<\/strong><\/p>\n<ul>\n<li>2026 年 4 月 20 日起启动「站外引流信息专项治理」，AI 智能风控支持<strong>文字、图片 OCR、语音转文字、符号乱码、数字拆分、谐音暗语<\/strong>的全形式秒级实时识别。<\/li>\n<li>违规判定覆盖群聊、商品详情、评论区、聊天消息、图片、语音、自动回复等<strong>全场景<\/strong>。<\/li>\n<li><strong>处罚<\/strong>：首次违规禁言 7 天并下架全店商品，二次违规账号永久受限。圈子内容、圈子评论同样在监测范围内。<\/li>\n<li>⚠️ 特别注意：卖家在自动回复或圈子帖里放站外文档链接（如腾讯文档），同样会被判定「引导站外交易」。<\/li>\n<li><strong>2026-09-23 官方口径补充<\/strong>：在一对一私聊中<strong>发送其他平台二维码<\/strong>同属被识别并处置的引流行为——平台会处置相关商品与账号，并将该商家、二维码与聊天记录<strong>举报至第三方平台<\/strong>由其跟进（详见 15.6 ④）。结论：站内表述干净不等于安全，联系方式只走本节 ② 的官方通道。<\/li>\n<\/ul>\n<p><strong>② 官方合规通道：可用，但必须按要求用<\/strong>（2026 年新变化，重要）<\/p>\n<ul>\n<li>闲鱼已上线【发送站外信息】官方功能（部分资料称「线索通」「留资卡」）：在聊天中通过官方通道发送手机号、微信号，用于交易交付、代拍下单、售后服务等场景，<strong>不再等于站外引流违规<\/strong>。<\/li>\n<li><strong>开通入口（三选一）<\/strong>：① 发布宝贝页底部弹窗模块；② 聊天会话中系统自动弹出的开通引导卡片；③ 聊天输入框旁「+」→「发送站外信息」。<\/li>\n<li><strong>使用规则<\/strong>：每类信息最多保存 5 条，同一账号下所有宝贝共用一套信息；买家需点击「确认查看」才能看到内容，卖家会收到「买家已查看」提醒；查看记录会沉淀到「客资管理」，同一买家多条记录自动合并。<\/li>\n<li><strong>限制<\/strong>：有类目与账号条件限制（没看到入口＝未开放到该账号）；内容需通过安全校验；<strong>发送过于频繁会被限流<\/strong>。<\/li>\n<li>✅ 执行口径：需要留联系方式时<strong>只走官方通道<\/strong>，禁止再用谐音、拼音、emoji、图片藏号、语音绕过等土办法——这些正是风控重点打击对象。<\/li>\n<\/ul>\n<p><strong>③ 经营性卖家认定<\/strong><\/p>\n<ul>\n<li>现行依据是 2026 年 6 月 1 日生效的《闲鱼社区经营性行为界定与管理规范》，认定口径见本手册 <strong>15.2 节（五条量化红线 + 经营性话术特征）<\/strong>。<\/li>\n<li>⚠️ 网络流传的「月成交额超 1 万元或月成交超 50 单满足其一即认定」「连续 90 天有成交即认定」「认定后需缴纳 1000–5000 元保证金」等说法，均无官方条款依据 <strong><\/strong>。保证金口径以 15.3 节及商品发布页实际提示为准（开通七天无理由退货为 500 元）。<\/li>\n<\/ul>\n<p><strong>④ 禁售品类与敏感词 / 暗语<\/strong><\/p>\n<ul>\n<li>严禁：高仿 / 复刻 / 原单 / A货 / 水货；药品、保健品、医疗器械；烟草、电子烟；活体动物；虚拟资源（游戏账号、课程资源、网盘链接、激活码等）。<\/li>\n<li>暗语识别已升级：「学习资料」「邮箱盲盒」「游戏CDK」「Steam家教」「虚拟恋人」「树洞」等违规服务或擦边球暗示均会被识别。<\/li>\n<li>「学生自用」「女生自用」「懂的来」等表述易被系统标记为低信任度内容导致流量降权（此为行业经验口径，非官方条文，谨慎参考，建议改用可验证的真实描述）。<\/li>\n<\/ul>\n\n<p><strong>⑤ 色情低俗与擦边引流：本年度力度最大的一轮治理（2026-09-18 起）<\/strong><\/p>\n<ul>\n<li>2026 年 9 月 18 日闲鱼发布《关于持续严打色情引流的公告》，年内累计处置该类风险账号 98358 个、警企联动打掉色情团伙 15 个；<strong>识别即永久封禁、无解封通道<\/strong>。<\/li>\n<li>圈子场景的高危动作：昵称 / 头像 / 个人简介使用暧昧词汇或暗示性配图；圈子帖与评论用「同城可约」「懂的私」「私聊详谈」等模糊话术；用正常商品名、数字或符号组合充当暗号引流。官方已明确将<strong>借昵称、头像变相引流的隐蔽账号<\/strong>列为人工巡查重点。<\/li>\n<li>完整的三类打击场景、治理机制与举报入口见 <strong>15.6 ④ 色情引流专项治理<\/strong>；色情类高危词与伪装式暗号清单见 <strong>12.3<\/strong>。<\/li>\n<\/ul>\n\n<h4>7.4.4 曝光影响要素对照（圈子特有 vs 全店通用）<\/h4>\n<table>\n<thead>\n<tr>\n<th>因素<\/th>\n<th>归属<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>圈子互动质量<\/td>\n<td>圈子特有<\/td>\n<td>帖子互动率（回复速度、评论数、涨粉）是圈层权重的主要来源，日常频次见 7.3.5，具体动作见玩法1<\/td>\n<\/tr>\n<tr>\n<td>内容形态<\/td>\n<td>圈子特有<\/td>\n<td>9–12 秒功能演示短视频 + 真实实拍图被识别为高价值内容，额外加权<\/td>\n<\/tr>\n<tr>\n<td>账号兴趣标签<\/td>\n<td>圈子特有<\/td>\n<td>标签越纯，圈内推荐越精准；「百货商店」式账号标签会被打散<\/td>\n<\/tr>\n<tr>\n<td>「我想要」人数<\/td>\n<td>全店通用<\/td>\n<td>核心排名信号，人数越多排名越靠前（详见 7.1）<\/td>\n<\/tr>\n<tr>\n<td>留言 / 评价<\/td>\n<td>全店通用<\/td>\n<td>好评型、问答型、晒图型留言提高转化与排名（详见 7.3.1）<\/td>\n<\/tr>\n<tr>\n<td>芝麻信用<\/td>\n<td>全店通用<\/td>\n<td>芝麻分 600–650 良好、650–700 优秀、700 以上「极好」；开通鱼小铺与投放开户门槛为 ≥600（详见 7.3）<\/td>\n<\/tr>\n<tr>\n<td>每日擦亮<\/td>\n<td>全店通用<\/td>\n<td>高峰时段 9:30–10:30、15:00–16:00、20:00–22:00（详见 7.1）<\/td>\n<\/tr>\n<tr>\n<td>回复速度<\/td>\n<td>全店通用<\/td>\n<td>30 分钟内秒回以获取系统推流，长时间不回会被降权限流（详见 7.1）<\/td>\n<\/tr>\n<tr>\n<td>账号活跃度<\/td>\n<td>全店通用<\/td>\n<td>每日更新 1–3 款商品，单日超 5 款易被判营销号（详见 7.3.5）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h4>7.4.5 2026年圈子运营建议<\/h4>\n<ul>\n<li><strong>新手起步<\/strong>：前 3 天模拟真实用户行为（浏览、点赞、收藏），完善实名认证与芝麻信用；可先买便宜货、在他人商品下互动养号，再开始内容输出。<\/li>\n<li><strong>垂直深耕<\/strong>：不要做「百货商店」。选一个自己能搞定货源、自己也懂的领域持续深耕，圈子标签纯，推荐才精准。<\/li>\n<li><strong>合规第一<\/strong>：假货、仿款一公分都别碰，一次封号满盘皆输；联系方式只走官方【发送站外信息】通道。<\/li>\n<li><strong>数据运营<\/strong>：借助运营提效包分析商品热度与用户需求，用「哪个圈子带来的曝光 / 咨询 / 成交更多」来优化内容布局，而不是凭感觉发帖。<\/li>\n<li><strong>节奏红线<\/strong>：同步鱼塘数量上限、多条动态间隔、单日上新上限等硬性边界见 7.4.1 内容规范与 7.4.4 表。<\/li>\n<\/ul>\n<p>📌 落地顺序建议：先按 7.3.4 把圈子纳入每日 / 每周权重任务 → 再用本节五大玩法做内容分发 → 最后按 7.4.3 做合规自检（站外引流 / 禁售品类 / 敏感词 / 色情低俗与擦边）。圈子是「慢流量」，靠持续输出积累信任，切忌一天猛发几十条。<\/p>","text":"内容说明： 本节部分数据与口径来自公开报道、平台公告及卖家实操经验，非平台官方公布的全部数据，实际规则以闲鱼官方最新公示为准（闲鱼 APP → 我的 → 设置 → 闲鱼公约）。 7.1 自然流量获取策略 2026年重大变化：免费自然流量分配逻辑已被彻底重构。免费擦亮权重断崖式下降（从过去几百次曝光锐减到几十甚至个位数），搜索和推荐流量改为「优质优先」——只有持续成交、好评率高、转化率好的商品才能获得免费流量。平台引入了信用评分体系（现行口径为「鱼力值」，分数高低直接影响商品初始曝光与基础流量），低价/无动态/回复慢/退货率高的账号极难获得免费曝光。免费流量池没变大，分水的人多了，平台又把大部分水引到了付费管道。 策略 操作 预期效果 2026现状 每日擦亮 每日 1 次免费擦亮（官方未指定时段，建议按自己商品后台的浏览分布选择） 曝光+30%-50% 权重断崖下降，仅几十次曝光 闲鱼币推广 用闲鱼币兑换推广位（每日签到获取） 适合测款，零成本 效果有限，作为补充 会玩社区发帖 发布与商品相关的使用心得/教程帖（玩法见 7.4） 增加账号权重和粉丝 权重上升，内容流量入口 鱼塘互动 加入相关鱼塘，发布商品到鱼塘（规则与玩法见 7.4） 精准人群曝光 稳定，垂直流量 拍下立减+公益 设置拍下立减 + 加入公益捐赠 转化率+15%-25% 有效，提升转化 超赞/收藏/想要 引导买家点\"超赞\"和\"想要\" 提升商品推荐权重 权重上升，信用评分的关键指标 10分钟回复 买家咨询10分钟内回复 响应率影响排名 已并入搜索排序因子 品质交易 48小时发货+低退货率+好评率≥98% 获得隐形\"品质标签\" 新增，优质推荐池门票 7.2 超级擦亮投放指南（大鱼动力） 闲鱼官方的付费推广产品正式名称为 「超级擦亮」 （不少资料写作「超强擦亮」，指的是同一产品），通过闲鱼 官方商业化投放平台「大鱼动力」 投放，计费支持按曝光（CPM）与按点击（CPC），可选推广目标为：曝光量、浏览量、关注收藏量、咨询量。2026 年升级后它不再是简单的\"花钱擦一下\"，而是精准流量匹配系统——系统根据商品标题、属性、历史成交数据，主动把商品推送给近期浏览/搜索/收藏过类似商品的高意向买家。本质是用预算撬动数据资产，投放沉淀的点击、咨询、收藏数据会反向抬升账号整体流量表现。 核心认知：超级擦亮不是\"花钱买一天热闹\"，而是用一笔小预算撬动一笔数据资产。配合主图、前3秒视频和文案持续优化——流量进来了承接不住，系统会判定你「不值得继续推」，后续成本越来越高。 7.2.1 投放红线（必须遵守） 官方公开的硬性限制： 单个投放计划最多可添加 10 个宝贝 ；投放时段可设置为不连续，官方建议每日投放时长 ≥ 4 小时 计划数量上限、改价或换主图的频率影响，官方均无明文规定，属经验口径——投放期间建议尽量避免频繁改动主图与价格 虚拟商品：多数类目不可投放或需先满足类目与资质要求，切勿盲目投放 7.2.2 投放时间卡位 商品类型 最佳时段 加成效果 引流款 0:00-1:00 官方未公布加成比例 利润款 19:00-22:00 官方未公布加成比例 虚拟品 8:00-9:00 / 21:00-23:00 官方未公布加成比例 ⚠️ 上表时段属经验建议， 平台未公布各时段的加成百分比 。正确做法：看自己商品后台近 30 天的浏览分布，在流量高峰前 30 分钟起投。 7.2.3 选品标准 可投 不可投 潜力款（曝光≥500 + 咨询≥3） 主图模糊/文案无卖点 高转化款（转化率≥3%） 有违规记录的商品 引流款（价格≤同类90%） 零销量零评价新品 7.2.4 出价策略 阶段 出价 调整规则 新手测试 低预算起步 跑2-3天看数据 进阶优化 逐步调整出价 ROI达到盈亏平衡点以上 稳住；ROI低于盈亏平衡点 暂停 稳定放量 根据ROI微调 保持根据商品情况灵活设置预算/计划 7.2.4+ 新版功能：成本保障 & 多商品计划 说明：官方对该能力的表述为「 计划保效 / 成本保障 」——当实际成本超出预期成本时，超出预期成本 1.2 倍 的部分以擦亮红包形式补贴， 并非全额补偿 ，请按此口径理解。 功能 说明 适用场景 成本保障 官方表述为「计划保效 / 成本保障」：实际成本超出预期成本 1.2 倍 的部分以擦亮红包形式补贴（ 非全额补偿 ） 预算有限、需要控制成本的卖家 多商品计划 一个投放计划可同时投放多个商品，节约测品成本 有多个潜力款需要同时测试的卖家 7.2.5 每日投放SOP（25分钟） 准备（10分钟）：检查账号状态 → 优化商品主图/标题 → 报名平台活动。 设置（5分钟）：选1个高转化款+2个潜力款，按时段投放，根据商品情况灵活设置预算。 优化（10分钟）：查看数据看板 → ROI＜1.2暂停 → 曝光低加价0.3元 → 记录数据。 7.2.6 周复盘标准 砍掉连续3天ROI低于盈亏平衡点的商品 保留ROI达到盈亏平衡点以上的商品持续投放 每周上新2-3个测试品 账户余额保持 ≥ 日预算 × 计划天数（避免模型学习中断） 7.3 成长权重体系：等级·闲气值·闲鱼币·鱼塘圈子 闲鱼流量分配不是只看商品本身——账号成长权重是决定商品能获得多少曝光的底层基础。闲鱼现行是 多套评分并行 ，先分清谁管什么，再决定投多少精力： ① 账号成长等级 X1–X10 （按月更新，只发流量券/寄件券等权益， 不直接决定流量 ）；② 鱼力值 （流量门槛，分数低直接没有基础曝光）；③ 闲气值 （账号生命线，满分 100 倒扣）；④ 鱼小铺店铺等级 L1–L7 （看评价分，解锁店铺权益）；⑤ 鱼小铺服务分 （商家侧，考核回复、退货、售后）。这五套共同影响搜索排名、推荐位分配与付费投放效果。 7.3.1 鱼小铺店铺等级 L1–L7（附：账号成长等级 X1–X10） 先破除一个高频混淆： L1–L7 是「鱼小铺店铺等级」 ，按评价分评定（0 / 1 / 50 / 500 / 1500 / 3000 / 5500 分档），主要用于解锁店铺权益，需先开通鱼小铺才谈得上； 账号层面另有一套「成长等级 X1–X10」 ，按月更新，主要在「我的」页领流量券、寄件券， 不直接决定流量多少 。真正决定商品基础曝光的是「鱼力值」。 等级 评价分区间 定位 核心权益 L1-L2 0-50分 新手期 基础发布权限，流量较少，每日擦亮1次 L3-L4 50-500分 基础卖家 流量相对稳定，解锁数据看板等店铺权益（鱼小铺需另行满足开通条件，见第三章） L5 1500分 关键分水岭 解锁PC工作台、直播权限、专属活动报名、搜索排名大幅提升 L6-L7 3000-5500+分 头部卖家 流量拉满、首页推荐优先、官方合作机会 评价分计算规则（2026最新） 行为 加分/扣分 说明 买家主动好评 +基础分（金额越大分越高） 50元以上订单加分是小数单的数倍 粉丝下单+好评 +加成（远高于普通单） 粉丝订单加分最高，是升级最有效路径 买家未评价 +少量默认分 系统默认加分，但远少于主动好评 差评 -大量分 1个差评抵消5-10个好评，毁掉数天努力 1元以下订单 不计分 低价单不贡献评价分 刷单刷
