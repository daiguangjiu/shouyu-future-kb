  const n = visible().length;
  let h = `<div class="hero">
    <h1>闲鱼运营<em>知识库</em></h1>
    <p>从开店上架到流量投放，从合规风控到售后维权 —— 6 大知识模块、21 个类目板块、70 篇内容，把做闲鱼生意会遇到的每个问题拆成可执行的步骤。内容来自闲鱼官方公开资料与完整运营手册，持续更新。</p>
    <div class="hero-tags">
      <span>开店入驻</span><span>商品运营</span><span>流量增长</span><span>合规风控</span><span>交易售后</span><span>经营提效</span>
    </div></div>`;

  h += `<div class="modcards">`;
  MODULES.forEach((m,i)=>{
    const secs = DATA.sections.filter(x=>x.module===m.name);
    const words = secs.reduce((a,x)=>a+x.items.reduce((y,it)=>y+(it.meta.words||0),0),0);
    const cnt = secs.reduce((a,x)=>a+x.items.filter(match).length,0);
    h += `<div class="modcard" onclick="goModule('${esc(m.name)}')" style="--mc:${MODCOLOR[m.color]}">
      <div class="mc-no">MODULE ${String(i+1).padStart(2,'0')}</div>
      <h3>${esc(m.name)}</h3>
      <div class="mc-sub">${esc(m.sub)}</div>
      <ul>${secs.map(x=>`<li><span>${esc(x.section)}</span><b>${x.items.filter(match).length}</b></li>`).join('')}</ul>
      <div class="mc-foot"><span>${cnt} 条内容</span><span>${(words/1000).toFixed(1)}k 字</span><span class="go">进入 →</span></div>
    </div>`;
  });
  h += `</div>`;

  if(S.q){
    const its = visible();
    h += `<div class="card" style="margin-top:18px"><div class="bar" style="margin-bottom:0">
      <b style="font-size:16px">「${esc(S.q)}」的检索结果</b><span class="grow"></span>
      <span style="font-size:12.5px;color:var(--muted)">${its.length} 条</span></div>
      <div class="tbl-wrap"><table class="dir">
        <thead><tr><th style="width:46px">#</th><th style="width:120px">模块</th><th style="width:160px">板块</th><th>标题</th><th style="width:104px">日期</th></tr></thead><tbody>`;
    its.forEach((it,i)=>{
      h += `<tr><td style="color:var(--muted)">${String(i+1).padStart(2,'0')}</td>
        <td class="sec-t">${esc(it.module)}</td><td class="sec-t">${esc(it.section)}</td>
        <td><a class="lnk" href="javascript:void(0)" onclick="openItem('${it.id}')">${hl(it.title)}</a></td>
        <td class="dt">${esc(it.meta.publish_time||'—')}</td></tr>`;
    });
    h += `</tbody></table></div></div>`;
  }
  return h;
}

  const secs = DATA.sections.filter(s=>s.module===S.module);
  const color = MODCOLOR[m.color];
  let h = `<div class="mod-hero" style="--mc:${color}">
    <div class="mh-no">MODULE · ${esc(m.name)}</div>
    <h2>${esc(m.sub)}</h2>
    <p>${esc(m.desc||'')}</p>
    <div class="chips">${secs.map(s=>`<span onclick="goSection('${esc(m.name)}','${esc(s.section)}')" style="cursor:pointer">${esc(s.section)} · ${s.items.filter(match).length}</span>`).join('')}</div>
  </div>`;
  secs.forEach(s=>{
    const its = s.items.filter(match);
    h += `<div class="card" style="margin-bottom:16px;overflow:hidden">
      <div class="bar" style="margin-bottom:0;border-bottom:1px solid var(--line);cursor:pointer" onclick="goSection('${esc(m.name)}','${esc(s.section)}')">

        <b style="font-size:16px">${esc(s.section)}</b>

      <div class="tbl-wrap"><table class="dir">

    its.forEach((it,i)=>{
      h += `<tr><td style="color:var(--muted)">${String(i+1).padStart(2,'0')}</td>
        <td><a class="lnk" href="javascript:void(0)" onclick="openItem('${it.id}')">${hl(it.title)}</a>

  const m = MODULES.find(x=>x.name===S.module);
  const color = MODCOLOR[m.color];
  const its = s.items.filter(match);
  let h = `<div class="mod-hero" style="--mc:${color}">
    <div class="mh-no">${esc(m.name)} · ${esc(m.sub)}</div>
    <h2>${esc(s.section)}</h2>
    <p>${esc(SEC_DESC[s.section]||'')}</p>
    <div class="chips"><span>${its.length} 条内容</span>
      <span>${(its.reduce((a,it)=>a+(it.meta.words||0),0)/1000).toFixed(1)}k 字</span>
      <span>${its.reduce((a,it)=>a+(it.meta.tables||0),0)} 张表</span>
      <span>${its.reduce((a,it)=>a+(it.meta.imgs||0),0)} 张图</span></div>
  </div>`;
  h += `<div class="card"><div class="tbl-wrap"><table class="dir">
    <thead><tr><th style="width:46px">#</th><th>标题</th><th style="width:82px">类型</th><th style="width:110px">发布</th><th style="width:74px">字数</th><th style="width:74px">配图</th><th style="width:82px">操作</th></tr></thead><tbody>`;
  its.forEach((it,i)=>{
    h += `<tr><td style="color:var(--muted)">${String(i+1).padStart(2,'0')}</td>
      <td><a class="lnk" href="javascript:void(0)" onclick="openItem('${it.id}')">${hl(it.title)}</a>
      ${it.toc&&it.toc.length?`<div style="font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.7">${it.toc.map(t=>esc(t.title)).join(' · ')}</div>`:''}</td>

/* 阅读页 */
function renderItem(){
  const it = ITEMS[S.item];
  if(!it) return renderHome();
  const sec = DATA.sections.find(x=>x.module===it.module && x.section===it.section);
  const idx = sec.items.findIndex(x=>x.id===it.id);
  const prev = idx>0 ? sec.items[idx-1] : null;
  const next = idx>-1 && idx<sec.items.length-1 ? sec.items[idx+1] : null;
  const m = MODULES.find(x=>x.name===it.module);
  const color = MODCOLOR[m.color];
  const meta = it.meta;

  const chips = [];
  if(it.kind==='chapter'){
    chips.push(`<span class="chip blue">📘 运营手册</span>`);
    if(meta.version) chips.push(`<span class="chip">版本 ${esc(meta.version)}</span>`);
    if(meta.sections) chips.push(`<span class="chip">${meta.sections} 节 / ${meta.subs||0} 小节</span>`);
  }else{
    chips.push(`<span class="chip hot">✍ 闲鱼官方内容</span>`);
    if(meta.publish_time) chips.push(`<span class="chip">🗓 ${esc(meta.publish_time)}</span>`);
  }
  if(meta.tables) chips.push(`<span class="chip">📊 ${meta.tables} 张表</span>`);
  if(meta.imgs) chips.push(`<span class="chip">🖼 ${meta.imgs} 张图</span>`);
  chips.push(`<span class="chip">约 ${Math.max(1,Math.round((meta.words||0)/300))} 分钟</span>`);

  return `<div class="card reader">
    <div class="rd-head" style="--mc:${color}">
      <div class="crumb">
        <a href="javascript:void(0)" onclick="goModule('${esc(it.module)}')">${esc(it.module)}</a><span class="sep">›</span>
        <a href="javascript:void(0)" onclick="goSection('${esc(it.module)}','${esc(it.section)}')">${esc(it.section)}</a><span class="sep">›</span>
        <span class="cur">正文</span>
      </div>
      <h1>${esc(it.title)}</h1>
      <div class="rd-meta">${chips.join('')}</div>
    </div>
    ${it.toc && it.toc.length>1 ? `<div class="tocbox"><div class="tl">本章目录</div><div class="tocchips" id="tocchips">${it.toc.map(t=>`<a href="javascript:void(0)" data-t="${esc(t.id)}" onclick="gotoAnchor('${esc(t.id)}')">${esc(t.title)}</a>`).join('')}</div></div>` : ''}
    <div class="rd-body" id="rdBody">${it.html}</div>
    ${it.related && it.related.length ? renderRelated(it, color) : ''}
    <div class="nav2">
      <button class="nb ${prev?'':'dis'}" ${prev?`onclick="openItem('${prev.id}')"`:''}><small>← 上一篇</small><span>${prev?esc(prev.title):'已经是第一篇'}</span></button>
      <button class="nb ${next?'':'dis'}" ${next?`onclick="openItem('${next.id}')"`:''}><small style="text-align:right">下一篇 →</small><span style="text-align:right">${next?esc(next.title):'已经是最后一篇'}</span></button>
    </div>
    <div class="rd-foot">
      <button class="btn pri" onclick="copyItem('${it.id}')">⧉ 复制全文</button>
      <button class="btn" onclick="copyHtml('${it.id}')">⧉ 复制富文本</button>
      <button class="btn" onclick="window.print()">🖨 打印 / 存 PDF</button>
      <span class="grow"></span>
      <span style="font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:7px">字号
        <span class="fsadj"><button onclick="setFs(-1)">A−</button><span id="fsVal">标准</span><button onclick="setFs(1)">A＋</button></span></span>
    </div>
  </div>`;
}

function renderRelated(it, color){
  const cards = it.related.map(id=>{
    const o = ITEMS[id]; if(!o) return '';
    return `<a class="relcard" href="javascript:void(0)" onclick="openItem('${o.id}')">
      <div class="m" style="color:${MODCOLOR[(MODULES.find(x=>x.name===o.module)||{}).color]||'#8B929D'}">${esc(o.module)} · ${esc(o.section)}</div>
      <div class="t">${esc(o.title)}</div>
      <div class="m" style="margin-top:6px;color:var(--muted)">${o.kind==='chapter'?'📘 手册章节':'✍ 官方内容'}</div></a>`;
  }).join('');
  return `<div class="relbox"><div class="tl">关联阅读</div><div class="relgrid">${cards}</div></div>`;
}

/* ---------- 交互 ---------- */
function goModule(name){
  S.module = name; S.section = null; S.item = null; S.view = 'module';
  syncTabs(); renderSide(); renderMain(); closeDrawer();
}
function goSection(mod, sec){
  S.module = mod; S.section = sec; S.item = null; S.view = 'section';
  syncTabs(); renderSide(); renderMain(); closeDrawer();
}
function openItem(id){
  S.item = id; S.view = 'item';
  const it = ITEMS[id];
  if(it){ S.module = it.module; S.section = it.section; }
  syncTabs(); renderSide(); renderMain(); closeDrawer();
}
function goHome(){ S.module=null; S.section=null; S.item=null; S.view='home'; syncTabs(); renderSide(); renderMain(); }
function goIndex(){ S.item=null; S.view='index'; syncTabs(); renderSide(); renderMain(); closeDrawer(); }
function syncTabs(){
  document.querySelectorAll('#tabs button').forEach(b=>{
    const t=b.dataset.tab;
    b.classList.toggle('on', t==='home' ? S.view==='home' : t==='index' ? S.view==='index' : t===S.module);
  });
}

function bindBody(){
  const body = $('#rdBody');
  body.querySelectorAll('img').forEach(img=>{
    img.loading='lazy';
    img.onclick = ()=>{ $('#lbImg').src = img.src; $('#lb').classList.add('on'); };
  });
  body.querySelectorAll('table').forEach(t=>{
    if(t.parentElement.classList.contains('tbl-scroll')) return;
    const w = document.createElement('div'); w.className='tbl-scroll';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  body.querySelectorAll('strong').forEach(el=>{
    const t = el.textContent;
    if(/禁止|严禁|务必|切勿|红线|违禁|不可|不得/.test(t) && t.length<40) el.classList.add('risk');
  });
  body.querySelectorAll('p').forEach(el=>{
    if(el.classList.contains('note')) return;
    if(/^\s*(注意|提示|说明|温馨提示)[:：]/.test(el.textContent)) el.classList.add('notice');
  });
  const chips = document.querySelectorAll('#tocchips a');
  if(chips.length){
    const targets = [...chips].map(c=>document.getElementById(c.dataset.t)).filter(Boolean);
    const io = new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting) chips.forEach(c=>c.classList.toggle('cur', c.dataset.t===e.target.id)); });
    },{rootMargin:'-150px 0px -70% 0px'});
    targets.forEach(t=>io.observe(t));
    chips[0].classList.add('cur');
  }
}
function gotoAnchor(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function closeLb(){ $('#lb').classList.remove('on'); $('#lbImg').src=''; }
$('#lb').addEventListener('click', e=>{ if(e.target.id==='lb') closeLb(); });

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'),1900);
}
async function copyItem(id){
  const it = ITEMS[id];
  const txt = `${it.title}\n【${it.module} · ${it.section}】${it.meta.publish_time?'　发布：'+it.meta.publish_time:''}\n来源：授渔未来 · 闲鱼运营知识库\n\n${(it.text||'').replace(/\s{2,}/g,'\n')}`;
  await copy(txt,'全文已复制到剪贴板');
}
async function copyHtml(id){ await copy(ITEMS[id].html,'富文本内容已复制'); }
async function copy(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg);}catch(_){toast('复制失败，请手动选择正文');}
    document.body.removeChild(ta);
  }
}
let FS = 16;
function setFs(d){
  FS = Math.min(19, Math.max(14, FS + d));
  document.documentElement.style.setProperty('--fs', FS+'px');
  $('#fsVal').textContent = FS===16?'标准':(FS<16?'小':'大');
}

/* 进度条 */
window.addEventListener('scroll', ()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  $('#prog').style.width = (h>0 ? (window.scrollY/h*100) : 0) + '%';
}, {passive:true});

/* 顶栏导航 */
function buildTabs(){
  const counts = {};
  ORDER.forEach(id=>{ const m=ITEMS[id].module; counts[m]=(counts[m]||0)+1; });
  $('#tabs').innerHTML = `<button data-tab="home" class="on">首页</button>` +
    MODULES.map(m=>`<button data-tab="${esc(m.name)}">${esc(m.name)}<span class="cnt">${counts[m.name]||0}</span></button>`).join('') +
    `<button data-tab="index">全站目录</button>`;
  $('#tabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    const t = b.dataset.tab;
    if(t==='home') goHome();
    else if(t==='index') goIndex();
    else goModule(t);
  });
}

/* 搜索 */
$('#q').addEventListener('input', e=>{
  S.q = e.target.value.trim();
  renderSide();
  if(S.view==='home') renderMain();
  else if(S.view!=='item') renderMain();
});
$('#q').addEventListener('keydown', e=>{
  if(e.key==='Enter' && S.q){ S.view='home'; S.module=null; S.section=null; S.item=null; syncTabs(); renderSide(); renderMain(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape') closeLb();
});

/* 移动端抽屉 */
function toggleSide(force){
  const s = $('#side'), m = $('#mask');
  const open = force!==undefined ? force : !s.classList.contains('open');
  s.classList.toggle('open', open);
  m.classList.toggle('on', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
function closeDrawer(){ if(window.innerWidth<=1180) toggleSide(false); }
$('#mobtn').addEventListener('click', ()=>toggleSide());
$('#mask').addEventListener('click', ()=>toggleSide(false));
window.addEventListener('resize', ()=>{ if(window.innerWidth>1180) toggleSide(false); });

buildTabs();
renderSide();
renderMain();

</script>
